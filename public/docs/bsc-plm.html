comment is being drafted. &amp;quot;Send back&amp;quot; works only when there is a major comment&lt;/td&gt;&lt;td&gt;The factory, the date the pattern file went out, and each round (PP or shipment, dates, reviewer, comments, decision) are recorded. Design gets a reminder when a sample has been waiting on them for 5 days, and a warning after 10&lt;/td&gt;&lt;td&gt;7 to 14 days per round (BSC&amp;#39;s own duration is to be confirmed with BSC)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B5.3&lt;/td&gt;&lt;td&gt;(MTM · optional) Approval to every department&lt;/td&gt;&lt;td&gt;Production for now. The Invisit notes say design emails the approval to every department, stores included. Who owns this is to be confirmed with BSC&lt;/td&gt;&lt;td&gt;Write what to tell everyone and click &amp;quot;Post approval&amp;quot;&lt;/td&gt;&lt;td&gt;The message. It defaults to &amp;quot;&amp;lt;name&amp;gt; cleared the shipment sample.&amp;quot;&lt;/td&gt;&lt;td&gt;Optional. Offered once the shipment round is approved, or once sampling was skipped with a reason; design can leave it out, and the fabric still moves on to the vendor and PO&lt;/td&gt;&lt;td&gt;The approval date and sender are recorded. A post goes on the fabric&amp;#39;s thread with the message and the construction, addressed to planning, production, warehouse and stores. It doubles as the training record for the fabric. Those teams see it on their Today list&lt;/td&gt;&lt;td&gt;1 min&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B5.4&lt;/td&gt;&lt;td&gt;Sourcing puts one vendor against the ask&lt;/td&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;Open the requirement, add the vendor and click &amp;quot;Save vendor&amp;quot;, then &amp;quot;Send to design&amp;quot;. For RTW this is done from the fabric sourcing list, which also suggests mills based on the fabrics they already supply. Where design sent a shortlist, sourcing finalises the cloth internally first (quotes, mills, minimums), picks the one fabric, records why, and adds the vendor for that fabric&lt;/td&gt;&lt;td&gt;MTM, in three groups. Who: mill (the list shows how many days each mill holds cloth), article number and cloth name. Terms: price per metre, minimum order, lead time in days and hold-until date (defaults to today plus the mill&amp;#39;s usual hold period). First buy (price × minimum order) is worked out. Cloth: composition, panna in inches, swatch book and a note for design. RTW: mill, composition, price per metre (e.g. Rs 320), minimum order (e.g. 200 m), lead time, width in cm (e.g. 57), hold-until date and a note. Fabric cost is worked out&lt;/td&gt;&lt;td&gt;MTM needs mill, price and cloth name. RTW needs mill and price. Only one live vendor is allowed per ask: saving a second marks the first as &amp;quot;replaced by sourcing&amp;quot;. Nothing stops sourcing adding a vendor before the sample is approved, even though sourcing is meant to go to the mills only after the shipment sample (whether to enforce this is to be confirmed with BSC)&lt;/td&gt;&lt;td&gt;The vendor and terms are saved on the requirement, along with the date sent to design. RTW also records a committed delivery (today + lead time + 3 days) and moves to &amp;quot;design to push PO&amp;quot;. Design gets a reminder: &amp;quot;N mill(s) quoted — choose the cloth&amp;quot; or &amp;quot;design to push PO&amp;quot;. It becomes urgent when 5 days or less are left on the hold (3 for RTW) or the hold has lapsed. Sourcing gets a reminder if an RTW style has no vendor after 3 days&lt;/td&gt;&lt;td&gt;3 to 10 days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B5.5&lt;/td&gt;&lt;td&gt;Design answers&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Open the vendor card, type why, check the metres, then click &amp;quot;Push PO&amp;quot;, &amp;quot;Reject&amp;quot; or &amp;quot;More time&amp;quot;&lt;/td&gt;&lt;td&gt;Why (this stays on the record and goes back to sourcing with a rejection). Metres: MTM defaults to the minimum order. RTW suggests the larger of consumption × quantity or the minimum order, and warns if the figure is under the minimum&lt;/td&gt;&lt;td&gt;A lapsed hold does not block &amp;quot;Push PO&amp;quot;. The button is shown less prominently and the card says &amp;quot;hold lapsed — the price is not promised&amp;quot;, but the click still goes through. &amp;quot;Reject&amp;quot; needs no reason. &amp;quot;More time&amp;quot; is hidden once an extension has already been asked&lt;/td&gt;&lt;td&gt;Push PO (MTM): the vendor is marked chosen, with who, when and why. If the fabric is new, it is added to the fabric master. It gets a fabric code (NO + two letters of the mill + six letters of the name + a number), goes in the non-core bucket with a reorder threshold of 3 m (international) or 7 m (domestic), and starts on hold. A fabric PO number (FPO-71nn) is issued, due on today + lead time, with a remark naming the requirement, the chooser, the price and the article. Incoming metres go up, and any open extension is closed. Push PO (RTW): the vendor, metres and price are set on the costing, the style moves to &amp;quot;Allocated&amp;quot;, and a fabric PO is issued. The metres are blocked, the fabric is added to the master and the milestone is recorded. Reject: the vendor is marked rejected with who, when and why. If no live vendor is left, the requirement goes back to &amp;quot;sourcing to add vendors&amp;quot;. More time: the extension request is recorded and the requirement shows &amp;quot;extension asked&amp;quot;. Who is told: after Push PO, the fabric appears on the swatch desk (MTM), on sourcing&amp;#39;s list as &amp;quot;PO raised · get the cloth in&amp;quot;, and on the warehouse&amp;#39;s list of fabric rolls expected against POs. After Reject or More time, sourcing gets an urgent &amp;quot;extension asked&amp;quot; reminder&lt;/td&gt;&lt;td&gt;Same day the terms arrive&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B5.5R&lt;/td&gt;&lt;td&gt;(RTW) Other BOM items into inventory&lt;/td&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;After the fabric PO, go down the BOM&amp;#39;s trim and packaging lines and check each against stock at the unit. Raise a bulk order where this order&amp;#39;s need exceeds what is on the shelf, and click &amp;quot;Materials covered&amp;quot; when every line is&lt;/td&gt;&lt;td&gt;Per line: on hand, needed for this order (quantity per piece × order quantity), and where short the bulk order and its expected date&lt;/td&gt;&lt;td&gt;Allocation can go ahead, but the materials step in B8 stays red until every BOM line is either on the shelf or on a dated order. A line still short seven days before cutting is an urgent item on sourcing&amp;#39;s Today&lt;/td&gt;&lt;td&gt;Each line&amp;#39;s cover is recorded against the order. The warehouse&amp;#39;s list of fabric and trims expected gains the bulk orders&lt;/td&gt;&lt;td&gt;Within 3 days of the fabric PO&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B5.6&lt;/td&gt;&lt;td&gt;Sourcing extends, sends back or drops&lt;/td&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;Enter a new hold date and click &amp;quot;Extend&amp;quot;. Then click &amp;quot;Send back to design&amp;quot;, or &amp;quot;Drop vendor&amp;quot; (MTM) or &amp;quot;Mill won&amp;#39;t hold — withdraw vendor&amp;quot;&lt;/td&gt;&lt;td&gt;New hold-until date (defaults to 14 days out)&lt;/td&gt;&lt;td&gt;&amp;quot;Send back&amp;quot; works only when every live hold is in the future&lt;/td&gt;&lt;td&gt;The hold date is updated, the extension is closed, and the requirement goes back to &amp;quot;design to push PO&amp;quot;. Dropping a vendor marks it withdrawn (&amp;quot;the mill would not hold&amp;quot;) and sends the requirement back to &amp;quot;sourcing to add vendors&amp;quot;. Design is told&lt;/td&gt;&lt;td&gt;1 to 3 days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B5.8&lt;/td&gt;&lt;td&gt;Stage 3 and beyond&lt;/td&gt;&lt;td&gt;System&lt;/td&gt;&lt;td&gt;Nothing to click. The stage is worked out from the record&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;MTM reaches stage 3 once the fabric PO is raised, stage 4 once the bulk is received or the fabric goes live, and Live when it is live in stores and online. RTW reaches stage 3 once the factory PO and the fabric PO are both raised. It reaches stage 4 once the cloth is at the factory or a sample is logged, and Live when the launch goes out. The downstream teams take over (B7, B8)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Rules. Each ask has only one vendor at a time. A second vendor means the first was replaced, rejected or withdrawn, and the earlier one stays on the record with its reason. The design and sourcing status is always worked out from what has happened, never typed in. A lapsed hold shows red on the list and on the card, but only warns on &amp;quot;Push PO&amp;quot;. Making it a hard stop is to be confirmed with BSC. Every edit to an RTW requirement goes into its activity log. MTM fabric asks have no activity log, so the decision lives on the vendor itself: who chose it, why, or why it was rejected. Design still creates the fabric datasheet in Enigma, because Enigma stays the master (22 Sep). The tool records who configured it in Enigma and when, and which designs are in Enigma. The fabric PO number the tool issues (FPO-71nn) is its own. The Enigma PO is still raised in Enigma until the link with Enigma is agreed (Section 15). An older route is still available on an MTM ask: design clicks &amp;quot;Choose&amp;quot; on a vendor, then records &amp;quot;Vendor has blocked it&amp;quot; (metres, how the mill confirmed it by email, WhatsApp or call, and an expiry of today + the mill&amp;#39;s hold period, 60 days by default), then clicks &amp;quot;Raise the fabric PO&amp;quot; after approval. The block is marked converted when the PO is raised.&lt;/p&gt;
&lt;p&gt;Cases. The record is the same in every case; only the steps shown change. The MTM path has six steps: Request, Sampling, Vendors, Purchase order, Fabric in, Go live. Steps that do not apply are hidden. There is no &amp;quot;sampling needed / not needed&amp;quot; question yet, and no link to the fabric being repeated. Later: add both, so a repeat or new shade can skip sampling with a reason and a parent fabric.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;How it is raised&lt;/th&gt;&lt;th&gt;Steps that apply&lt;/th&gt;&lt;th&gt;Steps skipped, and why&lt;/th&gt;&lt;th&gt;What the record shows&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;MTM · new fabric from a new mill article&lt;/td&gt;&lt;td&gt;&amp;quot;+ New requirement&amp;quot;, then &amp;quot;An MTM fabric&amp;quot;, kind &amp;quot;New fabric or shade&amp;quot;&lt;/td&gt;&lt;td&gt;B5.1, B5.2 sampling (optional), B5.3 approval (optional), B5.4 vendor, B5.5 PO&lt;/td&gt;&lt;td&gt;B5.2 and B5.3 when design skips them, with a reason on the record&lt;/td&gt;&lt;td&gt;Four to six steps. Vendors reads &amp;quot;sourcing to add vendors&amp;quot; until an offer arrives&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM · new shade of a fabric already in the book&lt;/td&gt;&lt;td&gt;Same form. Sampling is optional here&lt;/td&gt;&lt;td&gt;B5.1 to B5.5&lt;/td&gt;&lt;td&gt;Usually B5.2 and B5.3, skipped with a reason and the parent fabric named&lt;/td&gt;&lt;td&gt;As above&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM · sourcing found it on its own&lt;/td&gt;&lt;td&gt;Design still raises the ask. Sourcing can add a vendor on any ask before the PO&lt;/td&gt;&lt;td&gt;B5.1 (design), B5.4, B5.5&lt;/td&gt;&lt;td&gt;B5.2 and B5.3 are optional and skipped with a reason. Go live then lists the open gates (&amp;quot;your call, the record keeps what was skipped&amp;quot;)&lt;/td&gt;&lt;td&gt;Vendors reads &amp;quot;design to push PO&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM · construction variant on an inventory fabric (collar, cuff, placket)&lt;/td&gt;&lt;td&gt;Kind &amp;quot;Construction variant on an existing fabric&amp;quot;, with the base fabric, collar, placket and cuff&lt;/td&gt;&lt;td&gt;B5.1, B5.2 sampling (optional), B5.3 approval (optional), Enigma set-up, go live&lt;/td&gt;&lt;td&gt;Vendors (&amp;quot;made on an inventory fabric, nothing to buy&amp;quot;), PO (&amp;quot;not needed&amp;quot;), Fabric in (&amp;quot;not needed&amp;quot;)&lt;/td&gt;&lt;td&gt;Four live steps. The block, PO and swatch gates read &amp;quot;not needed&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM · an option settled from a several-options request (B6)&lt;/td&gt;&lt;td&gt;Created when design pushes the PO on that option&lt;/td&gt;&lt;td&gt;Starts at &amp;quot;PO raised&amp;quot;, with approval already given by the request, then B7&lt;/td&gt;&lt;td&gt;Sampling and approval, because a request&amp;#39;s cloth is approved by the request itself&lt;/td&gt;&lt;td&gt;Brief reads &amp;quot;REQ-001 · option 4 — &amp;lt;note&amp;gt;. &amp;lt;request brief&amp;gt;&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM · re-source an existing fabric from another mill&lt;/td&gt;&lt;td&gt;A new ask. The vendor form cannot say which fabric it replaces&lt;/td&gt;&lt;td&gt;B5.1, (B5.2 to B5.3, optional), B5.4, B5.5&lt;/td&gt;&lt;td&gt;Later: link the old fabric as replaced&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM · bespoke fabric&lt;/td&gt;&lt;td&gt;Never a requirement&lt;/td&gt;&lt;td&gt;Flow B12.4, per customer order, using the parcel&amp;#39;s code&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;Not on the design requirements list&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM · core replenishment&lt;/td&gt;&lt;td&gt;Never a requirement&lt;/td&gt;&lt;td&gt;Flow B11 (Enigma auto-PO, or a manual international PO from the fabric master)&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;Not on the design requirements list&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW · BSC buys the cloth&lt;/td&gt;&lt;td&gt;&amp;quot;+ New requirement&amp;quot;, then &amp;quot;An RTW style&amp;quot;&lt;/td&gt;&lt;td&gt;B5.1, B5.2R prototype, B5.3R BOM and tech pack, &amp;quot;Send it to sourcing&amp;quot; with one fabric or a shortlist, B5.4 vendor for the chosen fabric, B5.5 PO, B5.5R other BOM items into stock, then B8: Nitin proposes a factory and design raises the factory PO, alongside the fabric PO&lt;/td&gt;&lt;td&gt;MTM sampling and approval (B5.2, B5.3); the garment samples on the chosen cloth are in B8&lt;/td&gt;&lt;td&gt;Request, Vendors, Purchase order, Fabric in, Sampling, Go live&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW · vendor sources its own cloth&lt;/td&gt;&lt;td&gt;Who buys the cloth: &amp;quot;Vendor sources&amp;quot;&lt;/td&gt;&lt;td&gt;B5.1, B5.2R prototype, B5.3R BOM and tech pack, then B8&lt;/td&gt;&lt;td&gt;Vendors (&amp;quot;factory sources its own cloth&amp;quot;), PO (&amp;quot;not needed&amp;quot;), Fabric in (&amp;quot;not needed&amp;quot;)&lt;/td&gt;&lt;td&gt;Not on sourcing&amp;#39;s list. A note there counts them&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW · repeat of an existing style&lt;/td&gt;&lt;td&gt;Raised as a new RTW style. There is no repeat link&lt;/td&gt;&lt;td&gt;B5.1, B5.4, B5.5, B5.5R, B8&lt;/td&gt;&lt;td&gt;Prototype and tech pack, because the style already exists. Later: a repeat link&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Time target. From raising to PO: 10 working days for a fabric the mill already knows, 25 for a new one. For MTM this runs from the date raised to the fabric PO date. For RTW it runs from the style handover to the fabric PO date. Later: show this figure on the list.&lt;/p&gt;
&lt;p&gt;Sources: BSC design discovery call (22 Sep 2026); Invisit meeting notes §6.&lt;/p&gt;&lt;h4&gt;Then, downstream: the swatch desk, designs on the fabric, go live&lt;/h4&gt;&lt;p&gt;Raising the fabric PO puts the fabric on the swatch desk, which replaces the MTM swatches tracker sheet. As the cloth moves, the warehouse records six dates: bulk received, to swatches, cut, sticker, dispatched and photos. Sourcing adds the designs. Design tells the stores and switches the fabric on whenever it decides, because go live is a button, not a gate. Online is a separate track, about two weeks behind.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Two warehouse people on the desk.&lt;/strong&gt; Each step on the swatch desk is marked by the person who did it, and the record keeps who it was. Bulk received, handover and dispatch are Shravani&amp;#39;s. Cut, sticker and photos are Yusuf&amp;#39;s: the design codes and the sticker file reach him on the record the moment design adds the designs, so he never waits for a file to be made by hand. Stores told is design&amp;#39;s.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-mermaid&quot;&gt;flowchart LR
  A[PO raised] --&amp;gt; B[Bulk received&amp;lt;br/&amp;gt;warehouse marks the date]
  B --&amp;gt; C[To swatches] --&amp;gt; D[Cut 25 x 25] --&amp;gt; E[Sticker printed&amp;lt;br/&amp;gt;from the record, one label per design]
  E --&amp;gt; F[Dispatched&amp;lt;br/&amp;gt;one parcel per store, 34 stores] --&amp;gt; G[Photos]
  G --&amp;gt; H[Stores told&amp;lt;br/&amp;gt;design]
  A -.-&amp;gt; I[Designs on the fabric&amp;lt;br/&amp;gt;sourcing, in parallel]
  I --&amp;gt; J[Set up in Enigma&amp;lt;br/&amp;gt;flags, name and price]
  H --&amp;gt; K[Go live in stores&amp;lt;br/&amp;gt;any time]
  K --&amp;gt; L[Online about 2 weeks later&amp;lt;br/&amp;gt;photos, video, post, live]
  A -.-&amp;gt; M[Fabric rolls received&amp;lt;br/&amp;gt;warehouse, separate list]&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B7.1&lt;/td&gt;&lt;td&gt;Bulk received&lt;/td&gt;&lt;td&gt;Warehouse (production can also mark it)&lt;/td&gt;&lt;td&gt;On the swatch desk row, click &amp;quot;Mark bulk received&amp;quot;. Separately, book the metres in the warehouse&amp;#39;s list of fabric rolls expected against POs, using &amp;quot;Received · GRN N m&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing on the desk (the date is today). On the GRN: metres received&lt;/td&gt;&lt;td&gt;Only new fabrics with a PO, or already on the desk, have a row&lt;/td&gt;&lt;td&gt;The received date is recorded. The GRN gets a number (GRN-26-nnnn) against the PO number. Fabric stock goes up by the metres and incoming goes down. The fabric&amp;#39;s &amp;quot;Fabric in&amp;quot; step turns green once a GRN dated after the PO names this fabric. Design sees the row&amp;#39;s next step. The warehouse gets a reminder if the bulk has been in for 2 days without being handed over&lt;/td&gt;&lt;td&gt;Day of arrival&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.2&lt;/td&gt;&lt;td&gt;Handed to swatches&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Click &amp;quot;Mark to swatches&amp;quot;. Tick &amp;quot;Priority-1&amp;quot; on the row if it is urgent&lt;/td&gt;&lt;td&gt;Priority, optional&lt;/td&gt;&lt;td&gt;Steps go in order: only the next step not yet done has a button&lt;/td&gt;&lt;td&gt;The handover date and priority are recorded. The warehouse gets a &amp;quot;priority swatch not cut&amp;quot; reminder while a priority fabric is not yet cut&lt;/td&gt;&lt;td&gt;+1 day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.3&lt;/td&gt;&lt;td&gt;Cut&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Click &amp;quot;Mark cut&amp;quot; (25 × 25 swatches cut and prepared)&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;Only after B7.2&lt;/td&gt;&lt;td&gt;The cut date is recorded&lt;/td&gt;&lt;td&gt;+2 days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.4&lt;/td&gt;&lt;td&gt;Sticker printed&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Click &amp;quot;Print &amp;amp; mark&amp;quot; and print the stickers&lt;/td&gt;&lt;td&gt;Layout: a label sheet of 3 × 7 (21 labels per A4, copies per design defaulting to the number of stores, up to 60), or one page per design. Each label has five lines: fabric code, design name (final name if set) with the mill article (or product code), swatch book in capitals, MRP, and &amp;quot;Incl. of all taxes&amp;quot;&lt;/td&gt;&lt;td&gt;With no designs yet, the label carries the fabric only. &amp;quot;No swatch book&amp;quot; or a blank MRP shows in amber&lt;/td&gt;&lt;td&gt;The sticker date is recorded, but only when the warehouse prints&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.5&lt;/td&gt;&lt;td&gt;Dispatched&lt;/td&gt;&lt;td&gt;Warehouse or shipping&lt;/td&gt;&lt;td&gt;Click &amp;quot;Mark dispatched&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing. There is no tracking number&lt;/td&gt;&lt;td&gt;Only after B7.4&lt;/td&gt;&lt;td&gt;The dispatch date is recorded. One parcel is created for each of the 34 stores, New York included. Stores cannot be picked per fabric. The parcel shows on each store&amp;#39;s list of swatches, books and fit samples&lt;/td&gt;&lt;td&gt;+1 day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.6&lt;/td&gt;&lt;td&gt;Photos&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Click &amp;quot;Mark photos&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;The photos date is recorded. Design&amp;#39;s reminder mentions &amp;quot;photos shared&amp;quot;&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.7&lt;/td&gt;&lt;td&gt;Store confirms receipt&lt;/td&gt;&lt;td&gt;Store&lt;/td&gt;&lt;td&gt;On the store&amp;#39;s list of swatches, books and fit samples, click &amp;quot;Confirm it arrived&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;The parcel must exist. It turns overdue after 7 days&lt;/td&gt;&lt;td&gt;The date received is recorded. The desk row shows &amp;quot;N of 34 stores received&amp;quot;. The fabric&amp;#39;s swatch gate turns green once stores are told or 80% have confirmed&lt;/td&gt;&lt;td&gt;On arrival&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.8&lt;/td&gt;&lt;td&gt;Designs on the fabric&lt;/td&gt;&lt;td&gt;Sourcing (design and warehouse can also edit)&lt;/td&gt;&lt;td&gt;From the fabric record or the desk row, open &amp;quot;Designs on this fabric&amp;quot; and click &amp;quot;+ Add a design&amp;quot;, then &amp;quot;Add design&amp;quot;. Each design can be edited, or removed until it goes live&lt;/td&gt;&lt;td&gt;The shirt: design name, style (Boardroom, French Cuff, Business Casual, Band Collar, Half Sleeve, Popover, Kurta) and category (Formal or Casual). The money: MRP and cost, with margin worked out. What the customer reads: product page description and buzzwords&lt;/td&gt;&lt;td&gt;Design name must be filled&lt;/td&gt;&lt;td&gt;The design gets a product code (BOM-SHI-FM-nnnn for formal, BOM-SHI-CS-nnnn for casual), with who added it and when. Each design shows whether it is in Enigma and whether it is live. The sticker sheet gets one label per design. The store&amp;#39;s order form offers &amp;quot;Design on this fabric&amp;quot;&lt;/td&gt;&lt;td&gt;In parallel with B7.1 to B7.5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.9&lt;/td&gt;&lt;td&gt;Set up in Enigma&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Set up the fabric in Enigma, then record it with &amp;quot;Configured in Enigma&amp;quot;. Set the Enigma flags that drive the flow and click &amp;quot;Save&amp;quot;. Mark each design as in Enigma&lt;/td&gt;&lt;td&gt;Template, base metres, buffer metres, and the options the customer can pick. Flags: large check or pattern (over about 2 in, matched in cutting) and composition family for the website filter (cotton, linen blend, bamboo blend, cotton-lyocell, stretch cotton, wool blend, Giza / 2-ply)&lt;/td&gt;&lt;td&gt;Template and base metres must be filled. Only allowed after the approval has been posted&lt;/td&gt;&lt;td&gt;Who set it up, when, and the flags are recorded, along with which designs are in Enigma&lt;/td&gt;&lt;td&gt;Before go live&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.10&lt;/td&gt;&lt;td&gt;Name and price&lt;/td&gt;&lt;td&gt;Design (using marketing&amp;#39;s name)&lt;/td&gt;&lt;td&gt;Fill in the name and price and click &amp;quot;Set&amp;quot;&lt;/td&gt;&lt;td&gt;Final product name, MRP&lt;/td&gt;&lt;td&gt;Only after the Enigma set-up is recorded. Name and a numeric MRP must be filled. MRP is not checked against cost. Later: warn when MRP is not above cost&lt;/td&gt;&lt;td&gt;The name, MRP and date are recorded, and the first design takes the new name. The website, the sticker and Enigma all read this one line&lt;/td&gt;&lt;td&gt;Before go live&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.11&lt;/td&gt;&lt;td&gt;Stores told&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Click &amp;quot;Mark stores told&amp;quot; on the desk, or &amp;quot;Stores told to display it&amp;quot; on the fabric record&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;Only after B7.5&lt;/td&gt;&lt;td&gt;The date stores were told is recorded. Until then, design has a &amp;quot;swatches out, stores not told&amp;quot; reminder&lt;/td&gt;&lt;td&gt;Day the swatches arrive&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.12&lt;/td&gt;&lt;td&gt;Go live in stores&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Write the story, pick the channels and click &amp;quot;Save the story&amp;quot;. Then click &amp;quot;Go live in stores&amp;quot;, or &amp;quot;Go live&amp;quot; on the desk row&lt;/td&gt;&lt;td&gt;What the store and the website say. Channels: stores, website, swatch books, social&lt;/td&gt;&lt;td&gt;Nothing is blocked (&amp;quot;never gated; your call, the record keeps what was skipped&amp;quot;). The button shows how many gates are still open&lt;/td&gt;&lt;td&gt;The live date is recorded, the fabric comes off hold, and the story is saved. Stores and marketing see it, and the desk row moves to &amp;quot;Live in stores&amp;quot;&lt;/td&gt;&lt;td&gt;Design&amp;#39;s call&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.13&lt;/td&gt;&lt;td&gt;Online&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Under &amp;quot;Live online&amp;quot;, click &amp;quot;Mark done&amp;quot; for each of swatch photography, video, post-production and product page ready. Then click &amp;quot;Go live online&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;Only after B7.12. &amp;quot;Go live online&amp;quot; works only once photography, video and post-production are all done&lt;/td&gt;&lt;td&gt;The online dates are recorded. The requirement reaches Live only when it is live in stores and online&lt;/td&gt;&lt;td&gt;About 14 days after B7.12&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Rules. The desk has a row for every new fabric with a PO or swatch work started. It can be filtered: all, to cut and sticker, to dispatch, to tell stores, live in stores. Priority rows come first, then the rows that have waited longest since the bulk arrived. The warehouse marks its six dates in order. Design owns &amp;quot;Stores told&amp;quot; and &amp;quot;Go live&amp;quot;. Stickers are only made in the tool: the empty sticker link column on the old tracker becomes the sticker date. A fabric shows on the fabric master&amp;#39;s swatch books from the PO onwards, marked active, coming, on hold or paused, and &amp;quot;sells as&amp;quot; its designs. The store&amp;#39;s order form lists the fabric first, then the design on it. &amp;quot;The fabric only, no design chosen&amp;quot; is allowed. The design&amp;#39;s product code goes on the order. Enigma stays the master for the fabric&amp;#39;s details. The tool only records that they were set up, by whom and when.&lt;/p&gt;
&lt;p&gt;Cases.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;What differs&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A fabric with no designs yet&lt;/td&gt;&lt;td&gt;It sells as the fabric. The sticker carries the fabric lines only, and the desk row says &amp;quot;no designs yet&amp;quot; in amber&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A second lot of a fabric already in the books&lt;/td&gt;&lt;td&gt;Only the fabric GRN is booked in the warehouse. No new swatch desk row is created. A new edition would need a new ask&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Priority-1&lt;/td&gt;&lt;td&gt;Sorts to the top. The warehouse reminder fires as soon as it is marked priority and not cut, with no waiting days. A normal row reminds after 2 days in without handover&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Store-only fabric (never online)&lt;/td&gt;&lt;td&gt;There is no separate option. The online track simply stays unmarked after stores. Whether to mark a fabric store-only is to be confirmed with BSC&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;International cloth&lt;/td&gt;&lt;td&gt;Same steps. The PO&amp;#39;s due date is the offer&amp;#39;s lead time. The warehouse&amp;#39;s list of fabric POs shows the mill&amp;#39;s date as &amp;quot;not confirmed&amp;quot; until sourcing records the mill&amp;#39;s confirmation&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A store never confirms&lt;/td&gt;&lt;td&gt;The store&amp;#39;s own list turns &amp;quot;overdue&amp;quot; after 7 days. The desk keeps showing &amp;quot;N of 34 received&amp;quot;. No second parcel is sent automatically&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric paused before stores are told&lt;/td&gt;&lt;td&gt;Design pauses it with a note, which hides it from stores and the order form. The desk row is not closed automatically. Later: close the desk row when the fabric is paused&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cloth from a several-options request&lt;/td&gt;&lt;td&gt;Arrives on the desk already approved by the request, with the brief &amp;quot;REQ-nnn · option N …&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Time target. From arrival to stores told: 12 working days domestic, 30 international. This runs from the bulk received date to the stores told date. The desk shows both dates, but not yet the gap. Later: show the gap on the desk.&lt;/p&gt;
&lt;p&gt;Sources: BSC design discovery call (22 Sep 2026); Granola notes &amp;quot;BSC - Design/Planning&amp;quot; (22 Sep 2026); MTM swatches tracker sheet; BSC store list.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;2-option-requests-and-swatch-books&quot;&gt;&lt;summary&gt;2. Option requests and swatch books&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 2.&lt;/p&gt;&lt;p&gt;When a swatch book is thin, design raises one request for several options. Each option (1 to 20) is settled on its own. Every option that is settled becomes its own MTM fabric and its own row on the swatch desk. As the team puts it, &amp;quot;seven of ten going live is a normal outcome, not a failure.&amp;quot;&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-mermaid&quot;&gt;flowchart LR
  A[Book short of the plan of 30&amp;lt;br/&amp;gt;link fills in the request] --&amp;gt; B[Request: category,&amp;lt;br/&amp;gt;count, brief, a word per option, bill of materials]
  B --&amp;gt; C[Sourcing fills an option&amp;lt;br/&amp;gt;one vendor, terms, hold-until, send to design]
  C --&amp;gt; D{Design, per option}
  D --&amp;gt;|Push PO| E[Option PO raised&amp;lt;br/&amp;gt;new fabric, fabric PO, swatch desk row]
  D --&amp;gt;|Reject| C
  D --&amp;gt;|More time| F[Extension] --&amp;gt; C
  D --&amp;gt;|Close with a reason| G[Closed, not counted]
  E --&amp;gt; H[Every open option has a PO&amp;lt;br/&amp;gt;request at stage 3]&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B6.1&lt;/td&gt;&lt;td&gt;The gap is seen&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Look at the &amp;quot;Active options per book · plan 30&amp;quot; strip on the fabric asks list, or the swatch book tiles on the fabric master. Click &amp;quot;raise a request for N options&amp;quot; to start a request with the details already filled in&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;Per book, the system counts active fabrics: those in the book that are not bespoke, on hold or paused. It also counts &amp;quot;coming&amp;quot; fabrics, which have a PO in that book. It shows how many the book is short of the plan of 30. The plan is one number for every book. Setting a plan per range is to be confirmed with BSC&lt;/td&gt;&lt;td&gt;The request opens with the count, category &amp;quot;MTM shirts&amp;quot; and a brief (&amp;quot;Assortment gap — &amp;lt;book&amp;gt; N short; …&amp;quot;) already filled in&lt;/td&gt;&lt;td&gt;Always visible&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B6.2&lt;/td&gt;&lt;td&gt;Raise the request&lt;/td&gt;&lt;td&gt;Design (or planning)&lt;/td&gt;&lt;td&gt;Click &amp;quot;+ New requirement&amp;quot;, then &amp;quot;Several fabric options at once&amp;quot;. Fill in the form and click &amp;quot;Raise the request → sourcing&amp;quot;&lt;/td&gt;&lt;td&gt;Category (the seven garment categories plus MTM shirts, default RTW CMT shirts). How many options (1 to 20, default 8). Live by (Oct 26 to Feb 27). Target price per piece (default Rs 600). Why (&amp;quot;the sentence from the meeting&amp;quot;). A word per option, such as &amp;quot;a brushed check&amp;quot; or &amp;quot;plain twill, dark&amp;quot;. Bill of materials, one line per item: item, spec, quantity per piece&lt;/td&gt;&lt;td&gt;Why must be filled. The count is kept between 1 and 20&lt;/td&gt;&lt;td&gt;A request number (REQ-nnn) is issued, with who raised it and when. Each option starts as open, and the bill of materials starts with shell fabric at 1.6 m plus trims. Sourcing gets a reminder after 3 days: &amp;quot;REQ-nnn · &amp;lt;category&amp;gt; — sourcing to add vendors on N options&amp;quot;&lt;/td&gt;&lt;td&gt;5 min&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B6.3&lt;/td&gt;&lt;td&gt;Sourcing fills an option&lt;/td&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;Open the request and go to the options. Pick an option marked &amp;quot;your move&amp;quot; and click &amp;quot;Put a vendor against option N&amp;quot;. Click &amp;quot;Save vendor&amp;quot;, then &amp;quot;Send option N to design&amp;quot;. Click &amp;quot;Edit&amp;quot; to change it later&lt;/td&gt;&lt;td&gt;The same vendor form as B5.4: mill, article, cloth name, price per metre, minimum order, lead time, hold-until date, composition, panna, swatch book and a note. First buy is worked out&lt;/td&gt;&lt;td&gt;Mill, price and name must be filled. Only one live vendor is allowed per option, so a second one replaces the first (&amp;quot;replaced by sourcing&amp;quot;). A warning shows when price per metre × fabric per piece is more than 60% of the target cost. The trims in the bill of materials show stock from the trims master (&amp;quot;covers ~N pcs&amp;quot;, &amp;quot;below threshold&amp;quot;)&lt;/td&gt;&lt;td&gt;The option moves to design, with the date it was sent. Design gets a reminder: &amp;quot;REQ-nnn · option N · &amp;lt;note&amp;gt; — design to push PO&amp;quot;. It becomes urgent when 5 days or less are left on the hold&lt;/td&gt;&lt;td&gt;Per option&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B6.4&lt;/td&gt;&lt;td&gt;Design settles the option&lt;/td&gt;&lt;td&gt;Design or planning&lt;/td&gt;&lt;td&gt;Open the option (a link from the reminder lands straight on it), type why, check the metres, then click &amp;quot;Push PO · Rs &amp;lt;metres × price&amp;gt;&amp;quot;, &amp;quot;Reject&amp;quot; or &amp;quot;More time&amp;quot;&lt;/td&gt;&lt;td&gt;Why. Metres (defaults to the minimum order)&lt;/td&gt;&lt;td&gt;Same as B5.5: a lapsed hold only warns, and &amp;quot;Reject&amp;quot; needs no reason. &amp;quot;Push PO&amp;quot; is refused only if the option is closed or already has a PO&lt;/td&gt;&lt;td&gt;Push PO: the vendor is marked chosen, with who, when and why. The fabric is added to the master (as in B5.5) and a fabric PO number (FPO-71nn) is issued, with a remark naming the request, option, category, chooser, price and article. The option shows &amp;quot;PO raised&amp;quot;. An MTM fabric record is created for the option, already approved, due on the live-by month, with no designs yet. The option and its swatch desk row are one record. Reject: the vendor is marked rejected. If every vendor on the option is rejected, it goes back to open. More time: the option shows &amp;quot;extension asked&amp;quot; and the request is recorded. Who is told: sourcing&amp;#39;s list, the swatch desk and the warehouse&amp;#39;s list of fabric POs&lt;/td&gt;&lt;td&gt;Same day the offer arrives&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B6.5&lt;/td&gt;&lt;td&gt;Close an option without a PO&lt;/td&gt;&lt;td&gt;Design or sourcing&lt;/td&gt;&lt;td&gt;Click &amp;quot;Not going ahead with option N?&amp;quot;, give a reason and click &amp;quot;Close option N&amp;quot;. Design can reopen it&lt;/td&gt;&lt;td&gt;Reason&lt;/td&gt;&lt;td&gt;An option that already has a PO cannot be closed&lt;/td&gt;&lt;td&gt;The option is marked closed, with who, when and why. Any open extension is closed. The request row shows &amp;quot;N closed&amp;quot;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B6.6&lt;/td&gt;&lt;td&gt;The request completes&lt;/td&gt;&lt;td&gt;System&lt;/td&gt;&lt;td&gt;Nothing to click&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Every option that is not closed has a PO&lt;/td&gt;&lt;td&gt;The request moves to stage 3, &amp;quot;Finalised and ordered&amp;quot;. Each option&amp;#39;s fabric then runs through B7 on its own&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Rules. An option has one vendor at a time. Earlier vendors stay underneath as rejected or withdrawn history. The request row shows one dot per option in the colour of the team holding it: green once the PO is raised, grey when closed. It also shows the counts in the same shared phrases (&amp;quot;2 PO raised · 2 design to push PO · 4 sourcing to add vendors · 1 extension asked&amp;quot;). Closed options do not count against the request. When design asks for more time, sourcing clicks &amp;quot;Extend&amp;quot; for each vendor, then &amp;quot;Hold extended — back to design&amp;quot;. That button is blocked while any live hold has lapsed. Sourcing can also click &amp;quot;Mill won&amp;#39;t hold — withdraw vendor&amp;quot;, which sends the option back to open. Planning sees the same screens as design.&lt;/p&gt;
&lt;p&gt;Cases.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;What differs&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Fill a book (&amp;quot;ten winter shirts&amp;quot;)&lt;/td&gt;&lt;td&gt;Set the category, count and live-by date, and write a word per option. Sourcing fills the options in any order and picks the swatch book on the vendor form&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Replace named fabrics (&amp;quot;the blue madras is going, find two like it&amp;quot;)&lt;/td&gt;&lt;td&gt;The option note can name the fabric. Nothing links the option to the old fabric, and the old fabric is not paused automatically. Later: link the old fabric and pause it when the new one goes live&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Design rejects an option twice&lt;/td&gt;&lt;td&gt;Each rejection sends the option back to open. There is no &amp;quot;close after two&amp;quot; prompt. Closing is always done with &amp;quot;Not going ahead…&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sourcing cannot find one&lt;/td&gt;&lt;td&gt;Sourcing closes the option with a reason (&amp;quot;no mill has this weight under the target&amp;quot;). The request completes with fewer fabrics and the row says &amp;quot;N closed&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Design wants one option fast&lt;/td&gt;&lt;td&gt;Options cannot be tagged urgent. Design&amp;#39;s reminders are ordered by how many hold days are left, fewest first&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Holds lapse while design decides&lt;/td&gt;&lt;td&gt;Each option has its own extension. The request row counts &amp;quot;N extension asked&amp;quot;. Design&amp;#39;s reminder becomes urgent at 5 days or less, and after that says &amp;quot;the hold lapsed N days ago&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Trims for the request&lt;/td&gt;&lt;td&gt;The trims in the bill of materials show stock, threshold and incoming from the trims master. A trim not on the master is flagged &amp;quot;add it there&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Time target. From raising the request to settling every option: 15 working days. This runs from the date raised to the date of the last option&amp;#39;s fabric PO. Later: show this figure on the request.&lt;/p&gt;
&lt;p&gt;Sources: C1a MTM call (27 Aug 2026) for the range-mix rule; BSC swatch book list.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;3-rtw-style-the-four-section-record&quot;&gt;&lt;summary&gt;3. RTW style, the four-section record&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 3. One record per style: request from design, factory finalisation, fabric finalisation, milestones and final steps (call with Nitin, 3 Oct 2026).&lt;/p&gt;&lt;p&gt;An RTW style runs on one record with four sections, the same four the production team&amp;#39;s sheet has. Design writes section 1, the request. Nitin, who runs RTW production, runs section 2, factory finalisation, and agrees it with design. Sourcing runs section 3, fabric finalisation, at the same time. Nitin and the factory merchandiser keep section 4, the time-and-action milestones and final steps, up to date. Each section shows the sheet&amp;#39;s own columns and nothing else. Files and the conversation sit at the foot of the record.&lt;/p&gt;
&lt;p&gt;The record is on the RTW production tracker from the day design sends the request. Until design raises the factory purchase order it reads &amp;quot;no PO yet&amp;quot;, and those rows sort first. Planning no longer allocates a factory on a capacity board: Nitin agrees a factory on the phone and proposes it. BSC buys the cloth for every bulk style.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-mermaid&quot;&gt;flowchart TD
  A[Design · request: style, quantity, size ratio, target price and in-house date, proto on a stand-in fabric] --&amp;gt; B[Production · Nitin proposes a factory, cost and in-house date]
  A --&amp;gt; F[Sourcing · one vendor against the cloth: price, MOQ, lead time, mill&amp;#39;s article, hold]
  B --&amp;gt; C{Design accepts?}
  C --&amp;gt;|no · with a comment| B
  C --&amp;gt;|yes| D[Design raises the factory PO · job card, trim card, BOM and tech pack travel with it]
  F --&amp;gt; G{Design pushes the fabric PO?}
  G --&amp;gt;|more time · sourcing extends the hold| F
  G --&amp;gt;|yes| H[Enigma fabric code minted · the tracker&amp;#39;s fabric details fill in]
  D --&amp;gt; I[Sourcing sends the cloth to the factory]
  H --&amp;gt; I
  I --&amp;gt; J[Factory merchandiser counts usable and damaged cloth, confirms trims]
  J --&amp;gt;|short| K[Modified ratio or cut short · design decides]
  J --&amp;gt;|in full| L[Milestones · samples · QC · dispatch, B12b]
  K --&amp;gt; L
  L --&amp;gt; M[Warehouse receives the lots · go live · stock sold to customers by the warehouse]&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B8.1&lt;/td&gt;&lt;td&gt;Request from design&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Starts a new RTW style, has a proto made on a stand-in fabric (B5.2R, optional for a repeat), and sends the request.&lt;/td&gt;&lt;td&gt;Style, category, fit, order quantity, size ratio across 28–50 or XS–4XL, target price, target in-house date, the cloth wanted, trims, and the job card, trim card, BOM and tech pack&lt;/td&gt;&lt;td&gt;The size ratio adds up to the order quantity. The proto is approved or skipped with a reason.&lt;/td&gt;&lt;td&gt;The style appears on the tracker as &amp;quot;no PO yet&amp;quot;. Production and sourcing are both told. Documents not attached yet are listed as owed; they do not block the request.&lt;/td&gt;&lt;td&gt;Day 0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.2&lt;/td&gt;&lt;td&gt;Factory proposal&lt;/td&gt;&lt;td&gt;Production (Nitin)&lt;/td&gt;&lt;td&gt;Agrees a factory on the phone, then proposes it on the record. The factory&amp;#39;s past delivery record is shown beside each factory.&lt;/td&gt;&lt;td&gt;Factory, quoted cost per piece, estimated in-house date, note&lt;/td&gt;&lt;td&gt;A proposal needs a factory and a cost.&lt;/td&gt;&lt;td&gt;Design is told the proposal is waiting.&lt;/td&gt;&lt;td&gt;+2 days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.3&lt;/td&gt;&lt;td&gt;Factory decision&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Accepts the proposal or rejects it with a comment.&lt;/td&gt;&lt;td&gt;Accept or reject, comment&lt;/td&gt;&lt;td&gt;A rejection needs a comment.&lt;/td&gt;&lt;td&gt;Rejected: back to Nitin with the comment, and he proposes again. Every proposal and decision stays on the record. Accepted: design can raise the factory PO.&lt;/td&gt;&lt;td&gt;+1 day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.4&lt;/td&gt;&lt;td&gt;Factory PO&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Raises the factory PO. The job card, trim card, BOM and tech pack travel with it.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;The proposal must be accepted.&lt;/td&gt;&lt;td&gt;The PO number and PO date are set. The milestones are drawn from the category&amp;#39;s template, counted from the PO date (B12b.1). Owed documents are flagged on the PO. The factory merchandiser sees the PO on their portal.&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.5&lt;/td&gt;&lt;td&gt;A vendor against the cloth&lt;/td&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;Runs the same loop as MTM (B6): from the day the request lands, puts one vendor against the cloth.&lt;/td&gt;&lt;td&gt;Mill, mill&amp;#39;s article, price per metre, MOQ, lead time, hold-until date&lt;/td&gt;&lt;td&gt;One live vendor per cloth.&lt;/td&gt;&lt;td&gt;Design is told the vendor is ready.&lt;/td&gt;&lt;td&gt;+3 days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.6&lt;/td&gt;&lt;td&gt;Fabric PO&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Pushes the fabric PO, asks for more time, or rejects the vendor.&lt;/td&gt;&lt;td&gt;Metres, reason&lt;/td&gt;&lt;td&gt;The hold has not lapsed; if it has, sourcing extends it first.&lt;/td&gt;&lt;td&gt;The fabric PO is raised and the Enigma fabric code is minted. The tracker&amp;#39;s fabric details fill in by themselves: vendor, vendor fabric code, Enigma code, cost per metre and metres blocked.&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.7&lt;/td&gt;&lt;td&gt;Trims and packaging&lt;/td&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;Gets the other BOM items into stock (B5.5R).&lt;/td&gt;&lt;td&gt;Received quantities&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Trims are marked ready on the PO when every trim line is in.&lt;/td&gt;&lt;td&gt;Before cutting&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.8&lt;/td&gt;&lt;td&gt;Cloth to the factory&lt;/td&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;Sends the cloth once both POs exist.&lt;/td&gt;&lt;td&gt;Date, metres sent&lt;/td&gt;&lt;td&gt;The factory PO must exist.&lt;/td&gt;&lt;td&gt;The factory merchandiser sees the cloth on its way.&lt;/td&gt;&lt;td&gt;Within the mill&amp;#39;s lead time&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.9&lt;/td&gt;&lt;td&gt;Receipt at the factory&lt;/td&gt;&lt;td&gt;Factory merchandiser&lt;/td&gt;&lt;td&gt;Confirms on their portal what arrived.&lt;/td&gt;&lt;td&gt;Metres usable, metres damaged, trims received, note&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;In full: the fabric milestone&amp;#39;s actual date is set. Short: B8.10.&lt;/td&gt;&lt;td&gt;On arrival&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.10&lt;/td&gt;&lt;td&gt;Short cloth&lt;/td&gt;&lt;td&gt;Factory merchandiser or production, then design&lt;/td&gt;&lt;td&gt;Asks for a modified ratio or a cut short.&lt;/td&gt;&lt;td&gt;Reason, proposed size breakup&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Design gives the new ratio. It is sent to the factory and the order quantity updates.&lt;/td&gt;&lt;td&gt;+1 day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.11&lt;/td&gt;&lt;td&gt;Milestones and final steps&lt;/td&gt;&lt;td&gt;Nitin, factory merchandiser&lt;/td&gt;&lt;td&gt;Samples, milestones, QC, dispatch, as B12b.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Per template&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B8.12&lt;/td&gt;&lt;td&gt;Receipt, design code, go live&lt;/td&gt;&lt;td&gt;Warehouse, design, planning&lt;/td&gt;&lt;td&gt;The warehouse receives each lot (B12.3). Once the garments are in, design mints the design code (the product code the style sells under). Planning puts the style into a drop.&lt;/td&gt;&lt;td&gt;Counts&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;The design code is a gate on the launch: nothing can be made live without it. The style goes live. RTW customer orders are stock sales that the warehouse fills from stock.&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;Rules.&lt;/strong&gt; Section 2 and section 3 run side by side; neither waits for the other until the cloth is sent. The cloth can be sent only when both POs exist. The fabric details on the tracker are never typed by hand; they come from the fabric PO. Design owns the request, the factory decision and both POs. Nitin owns the proposal. Sourcing owns the vendor and the cloth. The factory merchandiser owns the receipt and the milestones.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Cases.&lt;/strong&gt;&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;What changes&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Repeat style&lt;/td&gt;&lt;td&gt;The proto is skipped with a reason; the earlier factory can be proposed again.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Design late with the tech pack&lt;/td&gt;&lt;td&gt;The PO goes out with the tech pack flagged as owed; the factory merchandiser sees it missing.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Factory rejected twice&lt;/td&gt;&lt;td&gt;Each proposal and comment stays on the record; Nitin proposes a third.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Mill&amp;#39;s hold lapses&lt;/td&gt;&lt;td&gt;Design asks for more time; sourcing extends the hold or withdraws the vendor and puts another.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cloth short at the factory&lt;/td&gt;&lt;td&gt;The merchandiser asks for a modified ratio or a cut short; design decides.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;Time targets.&lt;/strong&gt; Request to factory PO within 3 days. Request to fabric PO within 4 days. Cloth at the factory before the template&amp;#39;s fabric date.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Sources:&lt;/strong&gt; call with Nitin, RTW production, 3 Oct 2026; Production Tracker Final V2.xlsx (Production Tracker and Instructions &amp;amp; Legend tabs); design discovery session, 22 Sep 2026.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;4-swatches-to-stores&quot;&gt;&lt;summary&gt;4. Swatches to stores&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 4. The MTM_Swatches tab and the hand-made sticker become the Swatch desk.&lt;/p&gt;&lt;p&gt;Raising the fabric PO puts the fabric on the swatch desk, which replaces the MTM swatches tracker sheet. As the cloth moves, the warehouse records six dates: bulk received, to swatches, cut, sticker, dispatched and photos. Sourcing adds the designs. Design tells the stores and switches the fabric on whenever it decides, because go live is a button, not a gate. Online is a separate track, about two weeks behind.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Two warehouse people on the desk.&lt;/strong&gt; Each step on the swatch desk is marked by the person who did it, and the record keeps who it was. Bulk received, handover and dispatch are Shravani&amp;#39;s. Cut, sticker and photos are Yusuf&amp;#39;s: the design codes and the sticker file reach him on the record the moment design adds the designs, so he never waits for a file to be made by hand. Stores told is design&amp;#39;s.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-mermaid&quot;&gt;flowchart LR
  A[PO raised] --&amp;gt; B[Bulk received&amp;lt;br/&amp;gt;warehouse marks the date]
  B --&amp;gt; C[To swatches] --&amp;gt; D[Cut 25 x 25] --&amp;gt; E[Sticker printed&amp;lt;br/&amp;gt;from the record, one label per design]
  E --&amp;gt; F[Dispatched&amp;lt;br/&amp;gt;one parcel per store, 34 stores] --&amp;gt; G[Photos]
  G --&amp;gt; H[Stores told&amp;lt;br/&amp;gt;design]
  A -.-&amp;gt; I[Designs on the fabric&amp;lt;br/&amp;gt;sourcing, in parallel]
  I --&amp;gt; J[Set up in Enigma&amp;lt;br/&amp;gt;flags, name and price]
  H --&amp;gt; K[Go live in stores&amp;lt;br/&amp;gt;any time]
  K --&amp;gt; L[Online about 2 weeks later&amp;lt;br/&amp;gt;photos, video, post, live]
  A -.-&amp;gt; M[Fabric rolls received&amp;lt;br/&amp;gt;warehouse, separate list]&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B7.1&lt;/td&gt;&lt;td&gt;Bulk received&lt;/td&gt;&lt;td&gt;Warehouse (production can also mark it)&lt;/td&gt;&lt;td&gt;On the swatch desk row, click &amp;quot;Mark bulk received&amp;quot;. Separately, book the metres in the warehouse&amp;#39;s list of fabric rolls expected against POs, using &amp;quot;Received · GRN N m&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing on the desk (the date is today). On the GRN: metres received&lt;/td&gt;&lt;td&gt;Only new fabrics with a PO, or already on the desk, have a row&lt;/td&gt;&lt;td&gt;The received date is recorded. The GRN gets a number (GRN-26-nnnn) against the PO number. Fabric stock goes up by the metres and incoming goes down. The fabric&amp;#39;s &amp;quot;Fabric in&amp;quot; step turns green once a GRN dated after the PO names this fabric. Design sees the row&amp;#39;s next step. The warehouse gets a reminder if the bulk has been in for 2 days without being handed over&lt;/td&gt;&lt;td&gt;Day of arrival&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.2&lt;/td&gt;&lt;td&gt;Handed to swatches&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Click &amp;quot;Mark to swatches&amp;quot;. Tick &amp;quot;Priority-1&amp;quot; on the row if it is urgent&lt;/td&gt;&lt;td&gt;Priority, optional&lt;/td&gt;&lt;td&gt;Steps go in order: only the next step not yet done has a button&lt;/td&gt;&lt;td&gt;The handover date and priority are recorded. The warehouse gets a &amp;quot;priority swatch not cut&amp;quot; reminder while a priority fabric is not yet cut&lt;/td&gt;&lt;td&gt;+1 day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.3&lt;/td&gt;&lt;td&gt;Cut&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Click &amp;quot;Mark cut&amp;quot; (25 × 25 swatches cut and prepared)&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;Only after B7.2&lt;/td&gt;&lt;td&gt;The cut date is recorded&lt;/td&gt;&lt;td&gt;+2 days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.4&lt;/td&gt;&lt;td&gt;Sticker printed&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Click &amp;quot;Print &amp;amp; mark&amp;quot; and print the stickers&lt;/td&gt;&lt;td&gt;Layout: a label sheet of 3 × 7 (21 labels per A4, copies per design defaulting to the number of stores, up to 60), or one page per design. Each label has five lines: fabric code, design name (final name if set) with the mill article (or product code), swatch book in capitals, MRP, and &amp;quot;Incl. of all taxes&amp;quot;&lt;/td&gt;&lt;td&gt;With no designs yet, the label carries the fabric only. &amp;quot;No swatch book&amp;quot; or a blank MRP shows in amber&lt;/td&gt;&lt;td&gt;The sticker date is recorded, but only when the warehouse prints&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.5&lt;/td&gt;&lt;td&gt;Dispatched&lt;/td&gt;&lt;td&gt;Warehouse or shipping&lt;/td&gt;&lt;td&gt;Click &amp;quot;Mark dispatched&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing. There is no tracking number&lt;/td&gt;&lt;td&gt;Only after B7.4&lt;/td&gt;&lt;td&gt;The dispatch date is recorded. One parcel is created for each of the 34 stores, New York included. Stores cannot be picked per fabric. The parcel shows on each store&amp;#39;s list of swatches, books and fit samples&lt;/td&gt;&lt;td&gt;+1 day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.6&lt;/td&gt;&lt;td&gt;Photos&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Click &amp;quot;Mark photos&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;The photos date is recorded. Design&amp;#39;s reminder mentions &amp;quot;photos shared&amp;quot;&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.7&lt;/td&gt;&lt;td&gt;Store confirms receipt&lt;/td&gt;&lt;td&gt;Store&lt;/td&gt;&lt;td&gt;On the store&amp;#39;s list of swatches, books and fit samples, click &amp;quot;Confirm it arrived&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;The parcel must exist. It turns overdue after 7 days&lt;/td&gt;&lt;td&gt;The date received is recorded. The desk row shows &amp;quot;N of 34 stores received&amp;quot;. The fabric&amp;#39;s swatch gate turns green once stores are told or 80% have confirmed&lt;/td&gt;&lt;td&gt;On arrival&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.8&lt;/td&gt;&lt;td&gt;Designs on the fabric&lt;/td&gt;&lt;td&gt;Sourcing (design and warehouse can also edit)&lt;/td&gt;&lt;td&gt;From the fabric record or the desk row, open &amp;quot;Designs on this fabric&amp;quot; and click &amp;quot;+ Add a design&amp;quot;, then &amp;quot;Add design&amp;quot;. Each design can be edited, or removed until it goes live&lt;/td&gt;&lt;td&gt;The shirt: design name, style (Boardroom, French Cuff, Business Casual, Band Collar, Half Sleeve, Popover, Kurta) and category (Formal or Casual). The money: MRP and cost, with margin worked out. What the customer reads: product page description and buzzwords&lt;/td&gt;&lt;td&gt;Design name must be filled&lt;/td&gt;&lt;td&gt;The design gets a product code (BOM-SHI-FM-nnnn for formal, BOM-SHI-CS-nnnn for casual), with who added it and when. Each design shows whether it is in Enigma and whether it is live. The sticker sheet gets one label per design. The store&amp;#39;s order form offers &amp;quot;Design on this fabric&amp;quot;&lt;/td&gt;&lt;td&gt;In parallel with B7.1 to B7.5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.9&lt;/td&gt;&lt;td&gt;Set up in Enigma&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Set up the fabric in Enigma, then record it with &amp;quot;Configured in Enigma&amp;quot;. Set the Enigma flags that drive the flow and click &amp;quot;Save&amp;quot;. Mark each design as in Enigma&lt;/td&gt;&lt;td&gt;Template, base metres, buffer metres, and the options the customer can pick. Flags: large check or pattern (over about 2 in, matched in cutting) and composition family for the website filter (cotton, linen blend, bamboo blend, cotton-lyocell, stretch cotton, wool blend, Giza / 2-ply)&lt;/td&gt;&lt;td&gt;Template and base metres must be filled. Only allowed after the approval has been posted&lt;/td&gt;&lt;td&gt;Who set it up, when, and the flags are recorded, along with which designs are in Enigma&lt;/td&gt;&lt;td&gt;Before go live&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.10&lt;/td&gt;&lt;td&gt;Name and price&lt;/td&gt;&lt;td&gt;Design (using marketing&amp;#39;s name)&lt;/td&gt;&lt;td&gt;Fill in the name and price and click &amp;quot;Set&amp;quot;&lt;/td&gt;&lt;td&gt;Final product name, MRP&lt;/td&gt;&lt;td&gt;Only after the Enigma set-up is recorded. Name and a numeric MRP must be filled. MRP is not checked against cost. Later: warn when MRP is not above cost&lt;/td&gt;&lt;td&gt;The name, MRP and date are recorded, and the first design takes the new name. The website, the sticker and Enigma all read this one line&lt;/td&gt;&lt;td&gt;Before go live&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.11&lt;/td&gt;&lt;td&gt;Stores told&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Click &amp;quot;Mark stores told&amp;quot; on the desk, or &amp;quot;Stores told to display it&amp;quot; on the fabric record&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;Only after B7.5&lt;/td&gt;&lt;td&gt;The date stores were told is recorded. Until then, design has a &amp;quot;swatches out, stores not told&amp;quot; reminder&lt;/td&gt;&lt;td&gt;Day the swatches arrive&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.12&lt;/td&gt;&lt;td&gt;Go live in stores&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Write the story, pick the channels and click &amp;quot;Save the story&amp;quot;. Then click &amp;quot;Go live in stores&amp;quot;, or &amp;quot;Go live&amp;quot; on the desk row&lt;/td&gt;&lt;td&gt;What the store and the website say. Channels: stores, website, swatch books, social&lt;/td&gt;&lt;td&gt;Nothing is blocked (&amp;quot;never gated; your call, the record keeps what was skipped&amp;quot;). The button shows how many gates are still open&lt;/td&gt;&lt;td&gt;The live date is recorded, the fabric comes off hold, and the story is saved. Stores and marketing see it, and the desk row moves to &amp;quot;Live in stores&amp;quot;&lt;/td&gt;&lt;td&gt;Design&amp;#39;s call&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B7.13&lt;/td&gt;&lt;td&gt;Online&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Under &amp;quot;Live online&amp;quot;, click &amp;quot;Mark done&amp;quot; for each of swatch photography, video, post-production and product page ready. Then click &amp;quot;Go live online&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;Only after B7.12. &amp;quot;Go live online&amp;quot; works only once photography, video and post-production are all done&lt;/td&gt;&lt;td&gt;The online dates are recorded. The requirement reaches Live only when it is live in stores and online&lt;/td&gt;&lt;td&gt;About 14 days after B7.12&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Rules. The desk has a row for every new fabric with a PO or swatch work started. It can be filtered: all, to cut and sticker, to dispatch, to tell stores, live in stores. Priority rows come first, then the rows that have waited longest since the bulk arrived. The warehouse marks its six dates in order. Design owns &amp;quot;Stores told&amp;quot; and &amp;quot;Go live&amp;quot;. Stickers are only made in the tool: the empty sticker link column on the old tracker becomes the sticker date. A fabric shows on the fabric master&amp;#39;s swatch books from the PO onwards, marked active, coming, on hold or paused, and &amp;quot;sells as&amp;quot; its designs. The store&amp;#39;s order form lists the fabric first, then the design on it. &amp;quot;The fabric only, no design chosen&amp;quot; is allowed. The design&amp;#39;s product code goes on the order. Enigma stays the master for the fabric&amp;#39;s details. The tool only records that they were set up, by whom and when.&lt;/p&gt;
&lt;p&gt;Cases.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;What differs&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A fabric with no designs yet&lt;/td&gt;&lt;td&gt;It sells as the fabric. The sticker carries the fabric lines only, and the desk row says &amp;quot;no designs yet&amp;quot; in amber&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A second lot of a fabric already in the books&lt;/td&gt;&lt;td&gt;Only the fabric GRN is booked in the warehouse. No new swatch desk row is created. A new edition would need a new ask&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Priority-1&lt;/td&gt;&lt;td&gt;Sorts to the top. The warehouse reminder fires as soon as it is marked priority and not cut, with no waiting days. A normal row reminds after 2 days in without handover&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Store-only fabric (never online)&lt;/td&gt;&lt;td&gt;There is no separate option. The online track simply stays unmarked after stores. Whether to mark a fabric store-only is to be confirmed with BSC&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;International cloth&lt;/td&gt;&lt;td&gt;Same steps. The PO&amp;#39;s due date is the offer&amp;#39;s lead time. The warehouse&amp;#39;s list of fabric POs shows the mill&amp;#39;s date as &amp;quot;not confirmed&amp;quot; until sourcing records the mill&amp;#39;s confirmation&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A store never confirms&lt;/td&gt;&lt;td&gt;The store&amp;#39;s own list turns &amp;quot;overdue&amp;quot; after 7 days. The desk keeps showing &amp;quot;N of 34 received&amp;quot;. No second parcel is sent automatically&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric paused before stores are told&lt;/td&gt;&lt;td&gt;Design pauses it with a note, which hides it from stores and the order form. The desk row is not closed automatically. Later: close the desk row when the fabric is paused&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cloth from a several-options request&lt;/td&gt;&lt;td&gt;Arrives on the desk already approved by the request, with the brief &amp;quot;REQ-nnn · option N …&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Time target. From arrival to stores told: 12 working days domestic, 30 international. This runs from the bulk received date to the stores told date. The desk shows both dates, but not yet the gap. Later: show the gap on the desk.&lt;/p&gt;
&lt;p&gt;Sources: BSC design discovery call (22 Sep 2026); Granola notes &amp;quot;BSC - Design/Planning&amp;quot; (22 Sep 2026); MTM swatches tracker sheet; BSC store list.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;5-store-day-returns-and-alterations&quot;&gt;&lt;summary&gt;5. Store day, returns and alterations&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 5.&lt;/p&gt;&lt;p&gt;The store sells one piece at a time and resolves problems one piece at a time. A customer&amp;#39;s visit is one bill that can hold several pieces. A complaint is a case on one piece that has already been delivered. The store manager&amp;#39;s first question is always &amp;quot;can I fix it here?&amp;quot;. The store&amp;#39;s page has five groups:&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Added from the store manager call, 13 Oct 2026.&lt;/strong&gt; The bill carries, per piece, the fit profile used (a customer can hold several: &amp;quot;Formal · structured&amp;quot;, &amp;quot;Casual · relaxed&amp;quot;), who measured, a comment for the factory and a comment for shipping; both comments travel on the order sheet so nobody retypes them. A new customer is marked &amp;quot;trial shirt first&amp;quot; and the promise becomes about 25 days; &amp;quot;urgent&amp;quot; makes it 7–8 days with the ₹600 express charge on the bill. The store&amp;#39;s bell tells it when a fabric has been closed for selling in the last fortnight, so the swatch comes off the book. A credit note is good for a year; a full refund to the bank waits for HO approval before finance moves it; a case opened within 30 days of delivery reads &amp;quot;free alteration, credit note on return&amp;quot;, after that it reads chargeable. A fabric cannot go live in stores until its composition and a description are on the record, and a name or price change after the sticker was printed flags the sticker for reprint on the swatch desk. Production can move an open piece&amp;#39;s ship-by date with a reason, one piece from its sheet or every open piece at a factory that is shut, and the store sees the old date, the new one and why, with a bell item to tell the customer. One bill carries pieces of different sizes, inseams and fits. Every store sees every store&amp;#39;s shelf for a style: who sells it off the rack and how many per size, who only shows it, and whose window is empty, with an ask to the store that has it from the cell. Every store gets one display piece per launched style; it is not shelf stock, but the store may sell it, which puts its window at minus one until the next order brings one, and the owed display pieces sit at the top of the shelf view with an order button. When a piece is taken back, a numbered credit note is generated on the customer&amp;#39;s account the moment the case is raised, good for a year; a refund to the bank stays the exception that needs approval. Still to build: stickers and barcodes printed from the system, the daily closing report read off the bills, and measurements that update every open order when a profile changes.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;customers&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;orders (made to measure and ready to wear)&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;what I can sell: the fabrics live today, plus swatches, books and fit samples&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;stock in and out: parcels received from the unit, stock asks, launches, pull-backs and damaged pieces&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;returns and alterations&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Anyone who is not from that store, and is not the owner, can see the page but cannot act on it. A strip tells them the store acts on it.&lt;/p&gt;
&lt;p&gt;B10-i. Punch a bill&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B10.1&lt;/td&gt;&lt;td&gt;Customer, then pieces&lt;/td&gt;&lt;td&gt;Store associate&lt;/td&gt;&lt;td&gt;Opens &amp;quot;Punch MTM / RTW order&amp;quot;. Enters the customer, then adds pieces one by one with &amp;quot;+ Piece&amp;quot;. Each piece lands in &amp;quot;On the bill so far&amp;quot;, where it can be edited or removed. Ends with &amp;quot;Punch bill&amp;quot;. If the customer holds store credit, a note reads &amp;quot;holds ₹x store credit&amp;quot; and offers &amp;quot;Apply to this bill&amp;quot; or &amp;quot;use all of it&amp;quot;.&lt;/td&gt;&lt;td&gt;Customer name as it appears on the bill. For each piece, choose made to measure or off the shelf.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Made to measure: fabric, design on this fabric (optional; shows the product code and MRP), fit (Tailored, Classic, Slim or the customer&amp;#39;s saved fit), quantity, and the order sheet (22 construction options, 20 measurements, 4 pattern flags). The sheet is pre-filled from the customer&amp;#39;s last order when the bill is started from the customer&amp;#39;s profile.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Off the shelf: style, size (shows how many are here and which other store has it), and inseam in inches for bottoms, otherwise quantity.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Promised date and remarks sit behind &amp;quot;more&amp;quot;.&lt;/td&gt;&lt;td&gt;The customer name is filled in. Each made-to-measure piece has a fabric. Only live fabrics can be picked: not paused, not on hold, available at the mill, and with saleable metres or bespoke. A hint shows how many metres are saleable across all stores. Each off-the-shelf piece has a style and a size, and only styles with stock can be picked. If the size is not in this store, a warning names the store that has it, or says the hub will send it. Credit applied can never be more than the customer holds.&lt;/td&gt;&lt;td&gt;One bill number is issued (BILL-xxxxx), plus one order number per piece (BSC-731xx).&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Promised dates, unless the associate sets one: 14 days for made to measure, today for off the shelf, 3 days for bottoms that need hemming.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Made to measure: the fabric needed (Enigma&amp;#39;s base metres plus 0.10 m, or 1.85 m for linen) is held back at once for every store. A bespoke fabric gets its bespoke code.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Off the shelf: the size leaves the shelf count.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Credit used is written against the customer.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Planning sees made-to-measure pieces in its plan queue. The hub sees off-the-shelf pieces this store does not have. The customer&amp;#39;s profile shows the bill.&lt;/td&gt;&lt;td&gt;During the visit&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;The store&amp;#39;s order list shows, for each piece:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;order and bill number (with &amp;quot;n pcs&amp;quot; when the bill has more than one piece)&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;customer, fabric or style, fit or size, and inseam for off-the-shelf bottoms&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;quantity and the day punched&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;the promised date, shown in red with the days late&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;the stage&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Each order has one button. &amp;quot;Hand over from shelf&amp;quot; appears when the size is on this store&amp;#39;s shelf. &amp;quot;Handed to customer&amp;quot; appears once the hub has sent it.&lt;/p&gt;
&lt;p&gt;Stages for made to measure: punched, awaiting plan, planned, in production, in the factory, out of the factory, ready to ship, dispatched, delivered. For off the shelf: punched, hemming, dispatched, delivered — a stock sale handled by the warehouse, never a factory.&lt;/p&gt;
&lt;p&gt;Opening an order shows:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;the bill&amp;#39;s other pieces&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;the history of the order sheet and a panel for changing it&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;files and a conversation&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;The store can change the order sheet in three stages:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Freely&lt;/strong&gt;, until production allocates a factory.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Remarks only&lt;/strong&gt;, after allocation. The store sees: &amp;quot;Production has allocated a factory, so the sheet is closed to the store.&amp;quot;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;No changes&lt;/strong&gt;, once the piece is made. The store sees: &amp;quot;A change now is an alteration or a remake.&amp;quot;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Every accepted change is recorded with what changed, from what, to what, who changed it and when.&lt;/p&gt;
&lt;p&gt;B10-ii. A customer comes back&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-mermaid&quot;&gt;flowchart TD
  A[Case on the piece&amp;lt;br/&amp;gt;order or bill no, or name] --&amp;gt; B{Can we fix it here?}
  B --&amp;gt;|yes| C[Alter in store&amp;lt;br/&amp;gt;own tailor or hemming]
  B --&amp;gt;|another size on the shelf| D[Swap from the shelf&amp;lt;br/&amp;gt;case closes, stock moves]
  B --&amp;gt;|no| E{Send it out}
  E --&amp;gt; F[Hemming unit&amp;lt;br/&amp;gt;through the warehouse, 7 hand-offs]
  E --&amp;gt; G[Back to the factory&amp;lt;br/&amp;gt;made to measure: alter or remake]
  C --&amp;gt; H{Customer happy?}
  F --&amp;gt; H
  G --&amp;gt; H
  H --&amp;gt;|yes| I[Closed]
  H --&amp;gt;|no| J[Refit or remake]
  J --&amp;gt; H
  H --&amp;gt;|still no| K[Store credit closes it&amp;lt;br/&amp;gt;or refund goes to finance]&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B10.2&lt;/td&gt;&lt;td&gt;Raise the case&lt;/td&gt;&lt;td&gt;Store manager&lt;/td&gt;&lt;td&gt;Presses &amp;quot;Return or alter&amp;quot; on the delivered piece, or &amp;quot;+ Raise a return&amp;quot; in returns. Types the customer&amp;#39;s name, the order number (for example BSC-74078) or the bill number into one search box. A name lists every piece delivered to that customer (&amp;quot;n delivered on m bills&amp;quot;). A number narrows it to one piece. The chosen piece shows its type, bill, factory and which version of the order sheet it was made to, and whether the customer holds store credit.&lt;/td&gt;&lt;td&gt;Reason: fit, fabric defect, stitching, wrong size sent, changed mind, or colour or shade. What the customer wants: refund, remake or exchange. Remarks.&lt;/td&gt;&lt;td&gt;Only pieces delivered from this store can be found.&lt;/td&gt;&lt;td&gt;A case number is issued (RET-41xx) with a 10-day promise. The case shows on the order (&amp;quot;Cases on this piece&amp;quot;), in the store&amp;#39;s returns list and on the customer&amp;#39;s profile.&lt;/td&gt;&lt;td&gt;During the visit&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B10.3&lt;/td&gt;&lt;td&gt;Decide, right now&lt;/td&gt;&lt;td&gt;Store manager&lt;/td&gt;&lt;td&gt;Opens &amp;quot;What to do · the ladder&amp;quot;. The six rungs show as a row of dots: alteration, swap from the shelf, refit, remake, store credit, refund. Below them is a card for each option not yet tried:&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&lt;strong&gt;Fix it here:&lt;/strong&gt; &amp;quot;Alter it in the store&amp;quot;.&amp;lt;br&amp;gt;&lt;strong&gt;Swap from the shelf&lt;/strong&gt; (of
