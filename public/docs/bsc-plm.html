&lt;details id=&quot;data-model&quot;&gt;&lt;summary&gt;Data model&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Twenty-six collections on one &lt;code&gt;Db&lt;/code&gt; object (&lt;code&gt;src/domain/types.ts&lt;/code&gt;), persisted as one document (zustand &lt;code&gt;persist&lt;/code&gt;, key &lt;code&gt;bsc-plm-v1&lt;/code&gt;, version 96). Every field below is listed with its TypeScript type, whether it is optional (&lt;code&gt;?&lt;/code&gt; = optional key; &lt;code&gt;| null&lt;/code&gt; = nullable), and where it is born: &lt;strong&gt;E&lt;/strong&gt; read from Enigma today or clearly Enigma&amp;#39;s, &lt;strong&gt;S&lt;/strong&gt; seeded from a sheet at go-live, &lt;strong&gt;T&lt;/strong&gt; typed by a person in the tool, &lt;strong&gt;C&lt;/strong&gt; computed by the tool. Dates are ISO strings; money is rupees as &lt;code&gt;number&lt;/code&gt;; metres are &lt;code&gt;number&lt;/code&gt; with two decimals (&lt;code&gt;round2&lt;/code&gt;). Only &lt;code&gt;ProductionOrder&lt;/code&gt; carries an &lt;code&gt;activity[]&lt;/code&gt; log; other records carry their history in typed sub-objects (revisions, scans, attempts, nameHistory) or on the thread. Prototype identifiers are minted from &lt;code&gt;Date.now().toString(36)&lt;/code&gt;; the human numbers are sequential (&lt;code&gt;REQ-nnn&lt;/code&gt;, &lt;code&gt;FPO-71nn&lt;/code&gt;, &lt;code&gt;PO #155nn&lt;/code&gt;, &lt;code&gt;BSC-731nn&lt;/code&gt;, &lt;code&gt;RET-41nn&lt;/code&gt;, &lt;code&gt;GRN-26-nnnn&lt;/code&gt;, &lt;code&gt;#413nn&lt;/code&gt;).&lt;/p&gt;
&lt;p&gt;&lt;code&gt;Db&lt;/code&gt; collections: people, vendors, orders, escalations, options, fabrics, ranges, blocks, stores, swatchDispatches, transfers, returns, threads, customerOrders, stockRequests, launches, plans, extraFabric, factoryOutputs, swatchBooks, fabricPos, trims, concepts, attachments, grns, fitSamples, optionRequests?, writeOffs, creditLedger?.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Person&lt;/strong&gt; — &lt;code&gt;id: string&lt;/code&gt; · &lt;code&gt;name: string&lt;/code&gt; · &lt;code&gt;role: RoleId&lt;/code&gt; · &lt;code&gt;title: string&lt;/code&gt; (all S/T; one login per team).&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Vendor&lt;/strong&gt; (factories, mills, hemming unit, trims) — &lt;code&gt;id: string&lt;/code&gt; · &lt;code&gt;name: string&lt;/code&gt; E · &lt;code&gt;kind: VendorKind&lt;/code&gt; T · &lt;code&gt;location: string&lt;/code&gt; S (tracker &amp;quot;Factory location&amp;quot;) · &lt;code&gt;region: string&lt;/code&gt; S · &lt;code&gt;leadDays: number&lt;/code&gt; C/T (measured from past POs; editable) · &lt;code&gt;onTimeRate: number&lt;/code&gt; 0..1 C · &lt;code&gt;moq: number&lt;/code&gt; T · &lt;code&gt;blockWindowDays: number&lt;/code&gt; T (mills only) · &lt;code&gt;mtm?: boolean&lt;/code&gt; T · &lt;code&gt;tailors?: number&lt;/code&gt; T · &lt;code&gt;distanceKm?: number&lt;/code&gt; T · &lt;code&gt;dailyOut?: number[]&lt;/code&gt; (last 7 days) T/E (the WhatsApp shipping report) · &lt;code&gt;dailyTarget?: number&lt;/code&gt; T · &lt;code&gt;corporate?: boolean&lt;/code&gt; T (only one vendor at a time) · &lt;code&gt;urgentReserve?: boolean&lt;/code&gt; T (only one at a time). Derived: &lt;code&gt;vendorStatsOf&lt;/code&gt; (measured lead, OTIF %, avg slip, quotes won, grade Reliable/Watch/Poor/Too new), &lt;code&gt;factoryLoadOf&lt;/code&gt; (wip, inTransit, ready, outToday, avgOut, perDay, nominal, aging, overdue, headroom, load).&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;ProductionOrder&lt;/strong&gt; (an RTW or FOB style: requirement → bulk PO) — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;poNo: string | null&lt;/code&gt; C (minted on allocation). Design writes: &lt;code&gt;category: GarmentCategory&lt;/code&gt; T · &lt;code&gt;subCategory: string&lt;/code&gt; T · &lt;code&gt;styleName: string&lt;/code&gt; T (sheet &amp;quot;Style / Color&amp;quot;) · &lt;code&gt;shipheroName: string | null&lt;/code&gt; S · &lt;code&gt;program: string | null&lt;/code&gt; S · &lt;code&gt;launchMonth: string | null&lt;/code&gt; T · &lt;code&gt;fit: string | null&lt;/code&gt; T · &lt;code&gt;orderQty: number&lt;/code&gt; T · &lt;code&gt;sizeBreakup: { size: string; qty: number }[]&lt;/code&gt; C then T · &lt;code&gt;targetInhouse: string&lt;/code&gt; T · &lt;code&gt;targetCost: number&lt;/code&gt; T · &lt;code&gt;styleHandover: string&lt;/code&gt; T · &lt;code&gt;fabricNominated: boolean&lt;/code&gt; T · &lt;code&gt;sourcingMode?: SourcingMode&lt;/code&gt; T (default &lt;code&gt;fabricNominated ? &amp;#39;bsc-buys&amp;#39; : &amp;#39;vendor-sources&amp;#39;&lt;/code&gt;) · &lt;code&gt;fobNomination?: FobNomination | null&lt;/code&gt; = &lt;code&gt;{ supplierVendorId: string; emailedOn: string | null; by: string | null; note: string }&lt;/code&gt; T · &lt;code&gt;fabricBrief: FabricBrief | null&lt;/code&gt; = &lt;code&gt;{ look: string; composition: string | null; colour: string | null; weightGsm: number | null; referenceFabricId: string | null; notes: string }&lt;/code&gt; T · &lt;code&gt;bom: BomLine[]&lt;/code&gt; C (&lt;code&gt;defaultBom&lt;/code&gt;) then T. Sourcing writes: &lt;code&gt;costing: Costing&lt;/code&gt; = &lt;code&gt;{ cpm: number | null; consumption: number | null; actualConsumption: number | null; cmp: number | null; trimsPackaging: number; transportation: number; hemming: number; shipping: number; factoryOverheads: number; multiple: number }&lt;/code&gt; S defaults then T (&lt;code&gt;cpm&lt;/code&gt; is locked to the accepted quote) · &lt;code&gt;sourcing: SourcingState&lt;/code&gt; = &lt;code&gt;{ stage: SourcingStage; submittedOn: string | null; extension: { askedOn; by; note; resolvedOn: string | null } | null; fabricPo: { no: string; on: string; metres: number } | null }&lt;/code&gt; C · &lt;code&gt;fabricQuotes: FabricQuote[]&lt;/code&gt; T (one live, see below) · &lt;code&gt;fabricVendorId: string | null&lt;/code&gt; C · &lt;code&gt;vendorFabricCode: string | null&lt;/code&gt; T · &lt;code&gt;enigmaCode: string | null&lt;/code&gt; E · &lt;code&gt;fabricBlocked: number | null&lt;/code&gt; C (= metres on the PO) · &lt;code&gt;fabricMetres: number | null&lt;/code&gt; C (&lt;code&gt;ceil(consumption × qty)&lt;/code&gt; floored at MOQ, or typed) · &lt;code&gt;vendorId: string | null&lt;/code&gt; (the factory) T · &lt;code&gt;poDate: string | null&lt;/code&gt; C · &lt;code&gt;finalFob: number | null&lt;/code&gt; T · &lt;code&gt;costingClosure: { plan: string | null; revised: string | null; actual: string | null }&lt;/code&gt; C/T. Production unit writes: &lt;code&gt;sampleVendorId: string | null&lt;/code&gt; T · &lt;code&gt;samples: SampleRound[]&lt;/code&gt; · &lt;code&gt;materials: MaterialLine[]&lt;/code&gt; C (&lt;code&gt;defaultMaterials&lt;/code&gt;) then T · &lt;code&gt;qcAudits: QcAudit[]&lt;/code&gt; T. Production / merchandiser: &lt;code&gt;merchant: string | null&lt;/code&gt; C (rotated) then T · &lt;code&gt;jobCardNo: string | null&lt;/code&gt; T · &lt;code&gt;fabricReady: boolean&lt;/code&gt; C · &lt;code&gt;trimsReady: boolean&lt;/code&gt; C · &lt;code&gt;milestones: Milestone[]&lt;/code&gt; C (&lt;code&gt;buildMilestones&lt;/code&gt;) then T. Warehouse: &lt;code&gt;cutQty: number | null&lt;/code&gt; T · &lt;code&gt;deliveredQty: number | null&lt;/code&gt; C (sum of lots) · &lt;code&gt;rejectedQty: number | null&lt;/code&gt; C · &lt;code&gt;receipts: { at; qty: number; rejected: number; by; note: string; balanceExpectedOn: string | null }[]&lt;/code&gt; T · &lt;code&gt;split: { at; by; reason: string; lots: { qty: number; dispatchOn: string; dispatched: boolean }[] } | null&lt;/code&gt; T. &lt;code&gt;status: OrderStatus&lt;/code&gt; C · &lt;code&gt;remarks: string&lt;/code&gt; T · &lt;code&gt;activity: { at; who; what }[]&lt;/code&gt; C. Sub-records: &lt;strong&gt;FabricQuote&lt;/strong&gt; &lt;code&gt;{ id; vendorId: string; cpm: number; moq: number; widthCm: number; leadDays: number; committedDelivery: string; blockValidUntil: string | null; extendedOn: string | null; extensionAskedOn?: string | null; composition: string | null; note: string | null; selected: boolean }&lt;/code&gt; T. &lt;strong&gt;Milestone&lt;/strong&gt; &lt;code&gt;{ key: string; label: string; owner: RoleId; stage: &amp;#39;pre-production&amp;#39; | &amp;#39;production&amp;#39;; plan: string; revised: string | null; actual: string | null; delayReason: string | null }&lt;/code&gt; C then T. &lt;strong&gt;SampleRound&lt;/strong&gt; &lt;code&gt;{ round: number; submittedOn: string; reviewedOn: string | null; reviewedBy: string | null; comments: { area: SampleArea; text: string; major: boolean }[]; decision: &amp;#39;pending&amp;#39; | &amp;#39;resubmit&amp;#39; | &amp;#39;approved&amp;#39; }&lt;/code&gt; T. &lt;strong&gt;MaterialLine&lt;/strong&gt; &lt;code&gt;{ bomIndex: number; requiredQty: number; receivedOn: string | null; checked: &amp;#39;pending&amp;#39; | &amp;#39;ok&amp;#39; | &amp;#39;fail&amp;#39;; issuedOn: string | null }&lt;/code&gt; C/T. &lt;strong&gt;QcAudit&lt;/strong&gt; &lt;code&gt;{ at; by; checked: number; passed: number; issues: string; released: boolean }&lt;/code&gt; T. &lt;strong&gt;BomLine&lt;/strong&gt; &lt;code&gt;{ kind: &amp;#39;fabric&amp;#39; | &amp;#39;trim&amp;#39; | &amp;#39;packaging&amp;#39;; item: string; spec: string | null; qtyPerPc: number | null; unit: string }&lt;/code&gt; S/T. Derived (never stored): &lt;code&gt;riskOf&lt;/code&gt;, &lt;code&gt;receiptOf&lt;/code&gt;, &lt;code&gt;splitOf&lt;/code&gt;, &lt;code&gt;stageOf&lt;/code&gt;, &lt;code&gt;leadTimesOf&lt;/code&gt;, &lt;code&gt;cutFromFabric&lt;/code&gt;, &lt;code&gt;otifOf&lt;/code&gt;, &lt;code&gt;costingOf&lt;/code&gt;, &lt;code&gt;sampleStatusOf&lt;/code&gt;, &lt;code&gt;materialsOf&lt;/code&gt;, &lt;code&gt;qcStatusOf&lt;/code&gt;, &lt;code&gt;sourcingStateOf&lt;/code&gt;, &lt;code&gt;sourcingModeOf&lt;/code&gt;, &lt;code&gt;designFlowOf&lt;/code&gt;, &lt;code&gt;recommendFabric&lt;/code&gt;, &lt;code&gt;fabricNeededBy&lt;/code&gt;, &lt;code&gt;factoryOptions&lt;/code&gt;, &lt;code&gt;trimShortfall&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Escalation&lt;/strong&gt; — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;orderId: string&lt;/code&gt; · &lt;code&gt;raisedAt: string&lt;/code&gt; · &lt;code&gt;status: EscalationStatus&lt;/code&gt; · &lt;code&gt;recoveryAction: string | null&lt;/code&gt; · &lt;code&gt;resolutionNotes: string | null&lt;/code&gt; · &lt;code&gt;closedAt: string | null&lt;/code&gt; (S; &lt;code&gt;updateEscalation&lt;/code&gt; exists in the store but no screen edits it — to build).&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;OptionRequest&lt;/strong&gt; — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;reqNo: string&lt;/code&gt; C (&lt;code&gt;REQ-nnn&lt;/code&gt;) · &lt;code&gt;category: GarmentCategory | &amp;#39;MTM shirts&amp;#39;&lt;/code&gt; T · &lt;code&gt;brief: string&lt;/code&gt; T · &lt;code&gt;raisedBy: string&lt;/code&gt; C · &lt;code&gt;raisedOn: string&lt;/code&gt; C · &lt;code&gt;liveBy: string | null&lt;/code&gt; T · &lt;code&gt;targetCost: number | null&lt;/code&gt; T · &lt;code&gt;optionCount: number&lt;/code&gt; T · &lt;code&gt;options: RequestOption[]&lt;/code&gt; · &lt;code&gt;bom: BomLine[]&lt;/code&gt; T. &lt;strong&gt;RequestOption&lt;/strong&gt; &lt;code&gt;{ id; index: number; note: string T; status: RequestOptionStatus C; offers: ConceptFabricOption[] T; sentOn: string | null C; extension: { askedOn; by; note; resolvedOn: string | null } | null; closed: { by; on; reason: string } | null; fabricId: string | null C; fabricPoId: string | null C }&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Concept&lt;/strong&gt; — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;name: string&lt;/code&gt; T · &lt;code&gt;kind: ConceptKind&lt;/code&gt; T · &lt;code&gt;brief: string&lt;/code&gt; T · &lt;code&gt;raisedBy&lt;/code&gt; C · &lt;code&gt;raisedOn&lt;/code&gt; C · &lt;code&gt;spec: string | null&lt;/code&gt; T · &lt;code&gt;book?: string | null&lt;/code&gt; T · &lt;code&gt;targetMonth?: string | null&lt;/code&gt; T · &lt;code&gt;baseFabricId: string | null&lt;/code&gt; T · &lt;code&gt;fabricOptions?: ConceptFabricOption[]&lt;/code&gt; T · &lt;code&gt;optionsSentOn?: string | null&lt;/code&gt; C · &lt;code&gt;optionsExtension?: { askedOn; by; note; resolvedOn: string | null } | null&lt;/code&gt; · &lt;code&gt;fabricId: string | null&lt;/code&gt; C · &lt;code&gt;blockId: string | null&lt;/code&gt; C · &lt;code&gt;fabricPo: { on: string; metres: number } | null&lt;/code&gt; C · &lt;code&gt;factoryId: string | null&lt;/code&gt; T · &lt;code&gt;patSentOn: string | null&lt;/code&gt; C · &lt;code&gt;rounds: ConceptRound[]&lt;/code&gt; (= SampleRound &amp;amp; &lt;code&gt;{ gate: &amp;#39;pp&amp;#39; | &amp;#39;shipment&amp;#39; }&lt;/code&gt;) T · &lt;code&gt;approvalSentOn: string | null&lt;/code&gt; C · &lt;code&gt;approvalBy: string | null&lt;/code&gt; C · &lt;code&gt;enigma: { template: string | null; consumptionBase: number | null; consumptionBuffer: number | null; options: string[]; configuredOn: string | null; by: string | null; largeCheck?: boolean; compositionFamily?: string | null }&lt;/code&gt; T (recorded, Enigma does the configuring) · &lt;code&gt;naming: { oldName: string | null; newName: string | null; mrp: number | null; setOn: string | null }&lt;/code&gt; T · &lt;code&gt;marketing?: { blurb: string; channels: string[]; setOn: string | null } | null&lt;/code&gt; T · &lt;code&gt;liveOn: string | null&lt;/code&gt; C · &lt;code&gt;designs?: ConceptDesign[]&lt;/code&gt; · &lt;code&gt;swatch?: SwatchDesk | null&lt;/code&gt; · &lt;code&gt;online?: { photosOn; videoOn; postOn; liveOn: string | null } | null&lt;/code&gt; C. &lt;strong&gt;ConceptFabricOption&lt;/strong&gt; &lt;code&gt;{ id; fabricId: string | null; name: string; vendorId: string; vendorCode: string; composition: string; widthIn: number; book: string; cpm: number; moq: number; leadDays: number; holdUntil: string | null; note: string; selected: boolean; chosenBy?: string | null; chosenOn?: string | null; rationale?: string; rejected?: { by; on; reason } | null; extensionAsked?: { by; on } | null }&lt;/code&gt; T/C. &lt;strong&gt;ConceptDesign&lt;/strong&gt; &lt;code&gt;{ id; code: string C (BOM-SHI-FM/CS-nnnn); name: string T; finalName?: string | null T; style?: string | null T; category: &amp;#39;Formal&amp;#39; | &amp;#39;Casual&amp;#39; T; mrp: number | null T; cost?: number | null T; description?: string | null T; buzzwords?: string | null T; enigmaOn?: string | null C; liveOn?: string | null C; setOn: string C; by: string C }&lt;/code&gt;. &lt;strong&gt;SwatchDesk&lt;/strong&gt; &lt;code&gt;{ inwardOn; handoverOn; priority: boolean; cutOn; dispatchedOn; photosOn; stickerOn; storesToldOn }&lt;/code&gt; — dates &lt;code&gt;string | null&lt;/code&gt;, C on button press (S from the tracker&amp;#39;s &amp;quot;Fabric Bulk Received date&amp;quot;, &amp;quot;Fabric Team handover date for swatches&amp;quot;, &amp;quot;Sticker Link&amp;quot;). Derived: &lt;code&gt;conceptOf&lt;/code&gt; (thirteen gates, stage, waitingOn, stuckDays, offers, firstBuy, holdDays), &lt;code&gt;conceptRounds&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Fabric&lt;/strong&gt; (MTM master) — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;code: string&lt;/code&gt; E (Enigma mints it; the tool mints a stand-in for a new cloth) · &lt;code&gt;name: string&lt;/code&gt; S/T · &lt;code&gt;bucket: FabricBucket&lt;/code&gt; E · &lt;code&gt;family: string&lt;/code&gt; S (Weave / Pattern) · &lt;code&gt;vendorId: string&lt;/code&gt; E · &lt;code&gt;international: boolean&lt;/code&gt; S (Mill Country) · &lt;code&gt;stockMetres: number&lt;/code&gt; E (physical) · &lt;code&gt;reservedMetres: number&lt;/code&gt; E (accounting) · &lt;code&gt;thresholdMetres: number&lt;/code&gt; E · &lt;code&gt;incomingMetres: number&lt;/code&gt; C (open POs) · &lt;code&gt;millAvailable: boolean | null&lt;/code&gt; T/S (mill sheet) · &lt;code&gt;millStockMetres: number | null&lt;/code&gt; T/S · &lt;code&gt;millReportedAt: string | null&lt;/code&gt; C · &lt;code&gt;onHold: boolean&lt;/code&gt; E (&lt;code&gt;isOnHold&lt;/code&gt;) / T · &lt;code&gt;paused: { at; by; note } | null&lt;/code&gt; T · &lt;code&gt;supply?: { status: &amp;#39;ok&amp;#39; | &amp;#39;delayed&amp;#39; | &amp;#39;out&amp;#39;; reviewedOn; by; note; backOn: string | null } | null&lt;/code&gt; T · &lt;code&gt;promotedOn?: string | null&lt;/code&gt; C · &lt;code&gt;coreBlock?: { agreedOn; until: string; metresPerMonth: number; via: &amp;#39;email&amp;#39; | &amp;#39;whatsapp&amp;#39; | &amp;#39;call&amp;#39;; by; note } | null&lt;/code&gt; T · &lt;code&gt;weeklySalesShirts: number[]&lt;/code&gt; (12) E (ledger) · &lt;code&gt;vendorCode?: string | null&lt;/code&gt; S · &lt;code&gt;composition?: string | null&lt;/code&gt; S · &lt;code&gt;widthIn?: number | null&lt;/code&gt; S (Panna) · &lt;code&gt;cpm?: number | null&lt;/code&gt; S (Fabric Price) · &lt;code&gt;mrp?: number | null&lt;/code&gt; S · &lt;code&gt;swatchBook?: string | null&lt;/code&gt; S · &lt;code&gt;nameHistory?: { name; until; by; note }[]&lt;/code&gt; C (on rename). Derived: &lt;code&gt;coverageOf&lt;/code&gt; (saleable, incoming, atp, ros, baseMpw, leadDemand, moq, coverDays, rop, suggestedPo, belowRop, lowForStore), &lt;code&gt;liveStatusOf&lt;/code&gt;, &lt;code&gt;formerNames&lt;/code&gt;, &lt;code&gt;fabricNameOn&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;FabricPo&lt;/strong&gt; — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;poNo: string&lt;/code&gt; C/E (&lt;code&gt;FPO-71nn&lt;/code&gt;) · &lt;code&gt;fabricId&lt;/code&gt; · &lt;code&gt;vendorId&lt;/code&gt; · &lt;code&gt;metres: number&lt;/code&gt; T/C · &lt;code&gt;raisedOn&lt;/code&gt; C · &lt;code&gt;source: &amp;#39;auto&amp;#39; | &amp;#39;manual&amp;#39;&lt;/code&gt; C (auto when the fabric is domestic) · &lt;code&gt;expectedOn: string&lt;/code&gt; C (raisedOn + lead) then T · &lt;code&gt;vendorConfirmedOn: string | null&lt;/code&gt; C · &lt;code&gt;vendorConfirmedBy: string | null&lt;/code&gt; C · &lt;code&gt;remark: string&lt;/code&gt; T · &lt;code&gt;receivedOn: string | null&lt;/code&gt; C. Derived &lt;code&gt;fabricPoStatus&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Block&lt;/strong&gt; — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;fabricName: string&lt;/code&gt; C · &lt;code&gt;vendorId&lt;/code&gt; · &lt;code&gt;metres: number&lt;/code&gt; T · &lt;code&gt;agreedOn: string&lt;/code&gt; C · &lt;code&gt;expiresOn: string&lt;/code&gt; C (agreedOn + vendor &lt;code&gt;blockWindowDays&lt;/code&gt;, default 60) · &lt;code&gt;via: &amp;#39;email&amp;#39; | &amp;#39;whatsapp&amp;#39; | &amp;#39;call&amp;#39;&lt;/code&gt; T · &lt;code&gt;status: &amp;#39;held&amp;#39; | &amp;#39;converted&amp;#39; | &amp;#39;released&amp;#39; | &amp;#39;expired&amp;#39;&lt;/code&gt; C/T.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;TrimItem&lt;/strong&gt; — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;name: string&lt;/code&gt; S (matches the BOM item) · &lt;code&gt;kind: &amp;#39;trim&amp;#39; | &amp;#39;packaging&amp;#39;&lt;/code&gt; S · &lt;code&gt;unit: string&lt;/code&gt; · &lt;code&gt;stock: number&lt;/code&gt; T · &lt;code&gt;threshold: number&lt;/code&gt; S · &lt;code&gt;costPer: number&lt;/code&gt; S · &lt;code&gt;vendorId: string | null&lt;/code&gt; · &lt;code&gt;incoming: number&lt;/code&gt; C · &lt;code&gt;lastOrderedOn: string | null&lt;/code&gt; C. Derived &lt;code&gt;trimCoverageOf&lt;/code&gt;. &lt;strong&gt;Range&lt;/strong&gt; &lt;code&gt;{ family: string; targetOptions: number }&lt;/code&gt; S (placed).&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;RtwOption&lt;/strong&gt; — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;styleName: string&lt;/code&gt; S · &lt;code&gt;subCat1: string&lt;/code&gt; S · &lt;code&gt;subCat2: string&lt;/code&gt; S · &lt;code&gt;core: boolean&lt;/code&gt; S/T · &lt;code&gt;sizes: string[]&lt;/code&gt; S · &lt;code&gt;stockBySize: Record&amp;lt;string, number&amp;gt;&lt;/code&gt; E · &lt;code&gt;weeklySales: number[]&lt;/code&gt; (12) E · &lt;code&gt;inStockWeeks: boolean[]&lt;/code&gt; (12) C · &lt;code&gt;launchedAt: string&lt;/code&gt; S · &lt;code&gt;incomingQty: number&lt;/code&gt; C · &lt;code&gt;mrp: number&lt;/code&gt; S · &lt;code&gt;inactive: { on; by; reason } | null&lt;/code&gt; T · &lt;code&gt;sku: string | null&lt;/code&gt; S · &lt;code&gt;vendorId: string | null&lt;/code&gt; S (PRODUCT VENDOR) · &lt;code&gt;fabricCode: string | null&lt;/code&gt; S. Derived: &lt;code&gt;rosOf&lt;/code&gt;, &lt;code&gt;velocityOf&lt;/code&gt;, &lt;code&gt;healthOf&lt;/code&gt;, &lt;code&gt;reorderOf&lt;/code&gt;, &lt;code&gt;sellThroughOf&lt;/code&gt;, &lt;code&gt;storeStockOf&lt;/code&gt; (a deterministic hash split until ShipHero/Enigma per-warehouse stock is read), &lt;code&gt;replenishmentOf&lt;/code&gt;, &lt;code&gt;floorPiecesOf&lt;/code&gt;, &lt;code&gt;demandFromStores&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Launch&lt;/strong&gt; — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;optionId&lt;/code&gt; · &lt;code&gt;styleName&lt;/code&gt; · &lt;code&gt;dropMonth: string&lt;/code&gt; T · &lt;code&gt;orderId: string | null&lt;/code&gt; T · &lt;code&gt;expectedAtHo: string&lt;/code&gt; T · &lt;code&gt;receivedAtHo: string | null&lt;/code&gt; T · &lt;code&gt;pieces: LaunchPiece[]&lt;/code&gt; C (&lt;code&gt;defaultLaunchPieces&lt;/code&gt;) then T · &lt;code&gt;marketingName: string | null&lt;/code&gt; T · &lt;code&gt;marketingBriefOn: string | null&lt;/code&gt; T · &lt;code&gt;launchOn: string | null&lt;/code&gt; T · &lt;code&gt;launchedOn: string | null&lt;/code&gt; T · &lt;code&gt;hero: boolean&lt;/code&gt; T · &lt;code&gt;keyPointers: string&lt;/code&gt; T. &lt;strong&gt;LaunchPiece&lt;/strong&gt; &lt;code&gt;{ storeId; kind: &amp;#39;display&amp;#39; | &amp;#39;fit&amp;#39;; size: string; qty: number; dispatchedOn: string | null; receivedOn: string | null }&lt;/code&gt;. Derived &lt;code&gt;launchOf&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Store&lt;/strong&gt; — &lt;code&gt;{ id; name; region; holdsRtwStock: boolean }&lt;/code&gt; S (34 rows). &lt;strong&gt;SwatchDispatch&lt;/strong&gt; &lt;code&gt;{ id; fabricId; storeId; dispatchedOn; confirmedOn: string | null }&lt;/code&gt; C/T. &lt;strong&gt;SwatchBook&lt;/strong&gt; &lt;code&gt;{ id; storeId; kind: SwatchBookKind; edition: string; copies: number; from: &amp;#39;unit&amp;#39; | vendorId; dispatchedOn; receivedOn: string | null; trackingNo: string | null }&lt;/code&gt; T. &lt;strong&gt;FitSample&lt;/strong&gt; &lt;code&gt;{ id; storeId; fit: string; size: string; dispatchedOn; receivedOn: string | null; state: FitSampleState }&lt;/code&gt; T.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;StockTransfer&lt;/strong&gt; — &lt;code&gt;{ id; stoNo: string; toStoreId; styleName; qty: number; shippedOn: string; arrivedOn: string | null; closedOn: string | null; series: string; stoType: StoType; hemmingType: string | null; expectedShipping: string | null; remarks: string }&lt;/code&gt; S (STO tracker) / E; close is T. &lt;strong&gt;StockRequest&lt;/strong&gt; &lt;code&gt;{ id; styleName; optionId; size; qty; fromStoreId; toStoreId; requestedOn; status: StockRequestStatus; note }&lt;/code&gt; T.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;CustomerOrder&lt;/strong&gt; (one piece on a bill) — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;orderNo: string&lt;/code&gt; E (&lt;code&gt;BSC-…&lt;/code&gt;) · &lt;code&gt;storeId&lt;/code&gt; C · &lt;code&gt;kind: OrderKind&lt;/code&gt; T · &lt;code&gt;billNo?: string | null&lt;/code&gt; C · &lt;code&gt;designId?: string | null&lt;/code&gt; T · &lt;code&gt;customer: string&lt;/code&gt; T · &lt;code&gt;styleName: string&lt;/code&gt; C (fabric or option name) · &lt;code&gt;fabricId: string | null&lt;/code&gt; T · &lt;code&gt;optionId: string | null&lt;/code&gt; T · &lt;code&gt;fit: string | null&lt;/code&gt; T · &lt;code&gt;size: string | null&lt;/code&gt; T · &lt;code&gt;hemLength: number | null&lt;/code&gt; T · &lt;code&gt;qty: number&lt;/code&gt; T · &lt;code&gt;punchedOn&lt;/code&gt; C · &lt;code&gt;promisedOn: string&lt;/code&gt; T/E (ship by) · &lt;code&gt;stage: CustomerOrderStage&lt;/code&gt; C (scans) · &lt;code&gt;remarks: string&lt;/code&gt; T · &lt;code&gt;tag: OrderTag&lt;/code&gt; T · &lt;code&gt;planId: string | null&lt;/code&gt; C · &lt;code&gt;factoryId: string | null&lt;/code&gt; C · &lt;code&gt;consumptionM: number | null&lt;/code&gt; E/C (&lt;code&gt;consumptionFor(base, buffer)&lt;/code&gt;) · &lt;code&gt;scans: { stage; at; by }[]&lt;/code&gt; C · &lt;code&gt;spec: OrderSpec | null&lt;/code&gt; E/T · &lt;code&gt;measurements: OrderMeasurements | null&lt;/code&gt; E/T · &lt;code&gt;pattern: PatternFlags | null&lt;/code&gt; E/T · &lt;code&gt;revisions: { rev: number; at; by; role: RoleId; note: string; changes: { field; from; to }[]; reprint: boolean }[]&lt;/code&gt; C · &lt;code&gt;changeSeenOn: string | null&lt;/code&gt; C · &lt;code&gt;changeToldFactoryOn: string | null&lt;/code&gt; C · &lt;code&gt;changeFactorySeenOn: string | null&lt;/code&gt; C · &lt;code&gt;receiving?: { shortOn: string | null; rejected: { on; reason; by }[] } | null&lt;/code&gt; C · &lt;code&gt;bespoke: { code: string; requestedOn: string | null; inwardOn: string | null } | null&lt;/code&gt; C (code minted &lt;code&gt;mintBespokeCode&lt;/code&gt;). Derived: &lt;code&gt;sheetEditMode&lt;/code&gt;, &lt;code&gt;changePendingOf&lt;/code&gt;, &lt;code&gt;factoryUnread&lt;/code&gt;, &lt;code&gt;needsReprint&lt;/code&gt;, &lt;code&gt;reallocationRisk&lt;/code&gt;, &lt;code&gt;fulfilFromOf&lt;/code&gt;, &lt;code&gt;ppQueue&lt;/code&gt;, &lt;code&gt;proposeAllocation&lt;/code&gt;, &lt;code&gt;agingOf&lt;/code&gt;, &lt;code&gt;agingReport&lt;/code&gt;, &lt;code&gt;prepQueue&lt;/code&gt;, &lt;code&gt;inwardOf&lt;/code&gt;, &lt;code&gt;bespokeQueue&lt;/code&gt;, &lt;code&gt;customerOf&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;ProductionPlan&lt;/strong&gt; — &lt;code&gt;{ id; planNo: string C (#413nn); factoryId; category: string; createdOn; closedOn: string | null; orderIds: string[]; forcedOver?: number | null; forcedBy?: string | null }&lt;/code&gt; C. &lt;strong&gt;ExtraFabricRequest&lt;/strong&gt; &lt;code&gt;{ id; orderId; fabricId C; factoryId C; planId?: string | null C; metres: number T; reason: ExtraFabricReason T; panel: ExtraFabricPanel T; raisedBy C; raisedOn C; status: &amp;#39;requested&amp;#39; | &amp;#39;approved&amp;#39; | &amp;#39;declined&amp;#39; | &amp;#39;sent&amp;#39; C; decidedOn: string | null C; note: string T }&lt;/code&gt;. &lt;strong&gt;FactoryOutput&lt;/strong&gt; &lt;code&gt;{ id; factoryId; date: string; pieces: number; note: string; by; at }&lt;/code&gt; T.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;ReturnCase&lt;/strong&gt; — &lt;code&gt;id&lt;/code&gt; · &lt;code&gt;caseNo: string&lt;/code&gt; C (&lt;code&gt;RET-41nn&lt;/code&gt;) · &lt;code&gt;storeId&lt;/code&gt; C · &lt;code&gt;styleName&lt;/code&gt; T · &lt;code&gt;kind: &amp;#39;MTM&amp;#39; | &amp;#39;RTW&amp;#39;&lt;/code&gt; C · &lt;code&gt;orderId: string | null&lt;/code&gt; T · &lt;code&gt;openedOn&lt;/code&gt; C · &lt;code&gt;stage: &amp;#39;raised&amp;#39; | &amp;#39;at-factory&amp;#39; | &amp;#39;back-at-store&amp;#39; | &amp;#39;refunded&amp;#39; | &amp;#39;closed&amp;#39;&lt;/code&gt; C · &lt;code&gt;slaDays: number&lt;/code&gt; C (10) · &lt;code&gt;reason: ReturnReason&lt;/code&gt; T · &lt;code&gt;wants: ReturnWant&lt;/code&gt; T · &lt;code&gt;remarks: string&lt;/code&gt; T · &lt;code&gt;attempts: ReturnAttempt[]&lt;/code&gt; = &lt;code&gt;{ step: ResolutionStep; startedOn; by; outcome: &amp;#39;pending&amp;#39; | &amp;#39;accepted&amp;#39; | &amp;#39;not enough&amp;#39;; note: string; decidedOn: string | null; where?: &amp;#39;store&amp;#39; | &amp;#39;factory&amp;#39; | &amp;#39;hemming-unit&amp;#39; }[]&lt;/code&gt; T · &lt;code&gt;factoryLeg: { factoryId: string | null; sentOn; receivedAtFactoryOn; backAtStoreOn } | null&lt;/code&gt; C · &lt;code&gt;refund: { kind: &amp;#39;store-credit&amp;#39; | &amp;#39;refund&amp;#39;; amount: number; requestedOn; movedOn: string | null; by: string | null } | null&lt;/code&gt; C (amount = fabric or option MRP, fallback 2,990) · &lt;code&gt;hemLeg?: { destination: &amp;#39;store&amp;#39; | &amp;#39;customer&amp;#39;; handedOn; inwardAtWarehouseOn; atUnitOn; hemmedOn; backAtWarehouseOn; dispatchedOn; deliveredOn } | null&lt;/code&gt; C · &lt;code&gt;closedOn: string | null&lt;/code&gt; C. Derived &lt;code&gt;returnStatusOf&lt;/code&gt; (label, waitingOn, nextStep, overdue). &lt;strong&gt;CreditEntry&lt;/strong&gt; &lt;code&gt;{ id; customer: string; at; amount: number (+ given, − spent); note; by; storeId; caseId: string | null; orderId: string | null }&lt;/code&gt; C/T; balance = &lt;code&gt;creditBalanceOf&lt;/code&gt;. &lt;strong&gt;StockWriteOff&lt;/strong&gt; &lt;code&gt;{ id; storeId; optionId; styleName; size; qty: number; reason: WriteOffReason; disposition: &amp;#39;sent back to unit&amp;#39; | &amp;#39;destroyed&amp;#39;; at; by; backAtUnitOn: string | null }&lt;/code&gt; T.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Grn&lt;/strong&gt; — &lt;code&gt;{ id; grnNo: string C (GRN-26-nnnn); kind: GrnKind; ref: string C (PO no., parcel code, &amp;quot;round · Mahendra&amp;quot;); refLabel: string C; vendorId: string | null; storeId?: string | null; receivedOn C; by C; qty: number; unit: &amp;#39;m&amp;#39; | &amp;#39;pc&amp;#39;; rejected: number; invoiceNo: string | null T; poNo: string | null C; financeSeenOn: string | null C; remarks: string }&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Thread&lt;/strong&gt; &lt;code&gt;{ id; kind: ThreadKind; subjectId: string; comments: Comment[] }&lt;/code&gt;; &lt;strong&gt;Comment&lt;/strong&gt; &lt;code&gt;{ id; at; who; role: RoleId; text: string; step: string | null; mentions: string[] (person ids and/or role ids, parsed from @); resolved?: { by; at }[] }&lt;/code&gt; T/C. &lt;strong&gt;Attachment&lt;/strong&gt; &lt;code&gt;{ id; kind: AttachmentKind; subjectId; label: string; step: string | null; name: string; size: number; mime: string; by; at; stored: boolean }&lt;/code&gt; T (bytes in IndexedDB in the prototype).&lt;/p&gt;
&lt;p&gt;Keys and identity. Fabric code and order number are Enigma&amp;#39;s; product code (&lt;code&gt;BOM-SHI-…&lt;/code&gt;) is BSC&amp;#39;s and is what Shopify sells; bill number, case number, GRN number, request number and plan number are the tool&amp;#39;s. The tool must never invent a fabric code for Enigma — the stand-in &lt;code&gt;NOxx…-16nn&lt;/code&gt; marks a cloth Enigma has not yet minted. Computed fields are never stored: requirement stage, sourcing state word, concept stage and gates, design steps, health verb, fabric live status, ROP, milestone risk, OTIF, launch stage, return status label, sheet edit mode, credit balance, headroom.&lt;/p&gt;
&lt;p&gt;Enumerations to mirror from Enigma (not the tool&amp;#39;s own): inventoryType (CORE, NON_CORE, BESPOKE, BESPOKE_NON_CORE, SKU, FOB, ACCESSORIES, EXTERNAL_MANUFACTURER, FREE), productType (CUSTOM_DESIGN, READY_TO_WEAR, SEMI_STITCHED, HEMMING, READY_DESIGN), PO status (DRAFT, Open, Cancelled, Close), the 59 order states, the 22 stock-adjustment reasons.&lt;/p&gt;
&lt;p&gt;To confirm: product-code format; whether size sets come from Enigma&amp;#39;s Sizing module or &lt;code&gt;SIZE_SETS&lt;/code&gt;; whether &lt;code&gt;consumptionM&lt;/code&gt; is read from the ledger row or the order sheet; the pause-reason list (free text today); whether &lt;code&gt;Vendor.leadDays&lt;/code&gt; is promised or measured.&lt;/p&gt;
&lt;p&gt;Sources: &lt;code&gt;src/domain/types.ts&lt;/code&gt; (every interface, field by field); &lt;code&gt;src/store.ts&lt;/code&gt; (which action writes each field; minted numbers; &lt;code&gt;persist&lt;/code&gt; version); &lt;code&gt;src/domain/engines.ts&lt;/code&gt; (the derived functions named); &lt;code&gt;src/domain/reference.ts&lt;/code&gt; (&lt;code&gt;STORES&lt;/code&gt;, &lt;code&gt;TRIM_MASTER&lt;/code&gt;, &lt;code&gt;SIZE_SETS&lt;/code&gt;); &lt;code&gt;docs/Enigma Answers — Read From Live System (26 Aug 2026).md&lt;/code&gt; (Enigma enumerations and which fields are Enigma&amp;#39;s).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;state-machines&quot;&gt;&lt;summary&gt;State machines&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Each record&amp;#39;s stage is derived from these transitions; the actions in &lt;code&gt;store.ts&lt;/code&gt; are the only ways to move, and the guards in B13 decide whether a move is written. A transition not listed is not offered.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Sourcing on an RTW/FOB style&lt;/strong&gt; (&lt;code&gt;ProductionOrder.status&lt;/code&gt; × &lt;code&gt;sourcing.stage&lt;/code&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;Requirement&lt;/code&gt; → &lt;code&gt;Quoting&lt;/code&gt; (&lt;code&gt;vendors&lt;/code&gt;): &lt;code&gt;handToSourcing&lt;/code&gt; (design/planning) or the first &lt;code&gt;addFabricQuote&lt;/code&gt;.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;vendors&lt;/code&gt; → &lt;code&gt;design-choice&lt;/code&gt;: &lt;code&gt;submitToDesign&lt;/code&gt; (needs ≥ 1 quote). A second &lt;code&gt;addFabricQuote&lt;/code&gt; replaces the unchosen quote (&amp;quot;Vendor replaced · … withdrawn by sourcing&amp;quot;).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;design-choice&lt;/code&gt; → &lt;code&gt;extension&lt;/code&gt;: &lt;code&gt;askExtension&lt;/code&gt; (design or planning; the team that clicked is logged).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;extension&lt;/code&gt; → &lt;code&gt;design-choice&lt;/code&gt;: &lt;code&gt;extendQuote&lt;/code&gt; then &lt;code&gt;sendBackToDesign&lt;/code&gt; (marks the extension resolved).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;design-choice&lt;/code&gt; | &lt;code&gt;extension&lt;/code&gt; → &lt;code&gt;vendors&lt;/code&gt;: &lt;code&gt;rejectFabricQuote&lt;/code&gt; or &lt;code&gt;removeFabricQuote&lt;/code&gt; on the last quote (stage, submittedOn and extension reset).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;design-choice&lt;/code&gt; → &lt;code&gt;chosen&lt;/code&gt; and status &lt;code&gt;Allocated&lt;/code&gt;: &lt;code&gt;chooseFabricVendor&lt;/code&gt; (sets fabricVendorId, fabricMetres, costing.cpm).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;chosen&lt;/code&gt; → &lt;code&gt;design-choice&lt;/code&gt; and status &lt;code&gt;Quoting&lt;/code&gt;: &lt;code&gt;unchooseFabricVendor&lt;/code&gt; (only while no fabric PO).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;chosen&lt;/code&gt; → &lt;code&gt;po-raised&lt;/code&gt;: &lt;code&gt;raiseOrderFabricPo&lt;/code&gt;; or &lt;code&gt;design-choice&lt;/code&gt; → &lt;code&gt;po-raised&lt;/code&gt; and &lt;code&gt;Allocated&lt;/code&gt; in one click: &lt;code&gt;acceptQuoteAndRaisePo&lt;/code&gt; (&lt;code&gt;Push PO&lt;/code&gt;). Both mint the fabric row on the master, a &lt;code&gt;FabricPo&lt;/code&gt;, and land the &amp;quot;Fabric PO&amp;quot; milestone.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;Allocated&lt;/code&gt; → &lt;code&gt;Open&lt;/code&gt;: &lt;code&gt;allocateFactory&lt;/code&gt; (planning; refused while a nominated fabric has no PO) — mints &lt;code&gt;poNo&lt;/code&gt;, &lt;code&gt;poDate&lt;/code&gt;, merchant, TNA, materials.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;Open&lt;/code&gt; → &lt;code&gt;Closed&lt;/code&gt;: &lt;code&gt;receiveLot&lt;/code&gt; when the balance reaches zero or &lt;code&gt;closeShort&lt;/code&gt;; legacy &lt;code&gt;receive&lt;/code&gt;.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;Cancelled&lt;/code&gt;: no action sets it (seed only).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;FOB: &lt;code&gt;setSourcingMode&lt;/code&gt; flips &lt;code&gt;fabricNominated&lt;/code&gt;; &lt;code&gt;markFobEmailed&lt;/code&gt; stamps the nomination. The &amp;quot;Vendors&amp;quot; step is done when the nomination is emailed; no PO step.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;Sourcing on a concept&lt;/strong&gt; (&lt;code&gt;Concept.fabricOptions&lt;/code&gt;, &lt;code&gt;optionsSentOn&lt;/code&gt;, &lt;code&gt;fabricId&lt;/code&gt;, &lt;code&gt;blockId&lt;/code&gt;, &lt;code&gt;fabricPo&lt;/code&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;add vendor (&lt;code&gt;conceptAddFabricOption&lt;/code&gt;, replaces the live one; refused after a PO) → &lt;code&gt;conceptSendOptionsToDesign&lt;/code&gt; sets &lt;code&gt;optionsSentOn&lt;/code&gt;.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;design: &lt;code&gt;conceptAcceptAndRaisePo&lt;/code&gt; (Push PO — selects, mints the fabric on the master if needed, raises the FabricPo, sets &lt;code&gt;fabricPo&lt;/code&gt;); &lt;code&gt;conceptRejectFabricOption&lt;/code&gt; (last live one clears &lt;code&gt;optionsSentOn&lt;/code&gt; → back to sourcing); &lt;code&gt;conceptAskOptionExtension&lt;/code&gt; → sourcing &lt;code&gt;conceptExtendOption&lt;/code&gt; → &lt;code&gt;conceptSendOptionsBack&lt;/code&gt;; sourcing &lt;code&gt;conceptRemoveFabricOption&lt;/code&gt; (withdraw).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;older path still in the store, no button: &lt;code&gt;conceptChooseFabric&lt;/code&gt;, &lt;code&gt;conceptChooseFabricOption&lt;/code&gt; (choose without PO) → &lt;code&gt;conceptBlockFabric&lt;/code&gt; (&lt;code&gt;Vendor has blocked it&lt;/code&gt;, creates a &lt;code&gt;Block&lt;/code&gt; held for the vendor&amp;#39;s window) → &lt;code&gt;conceptRaiseFabricPo&lt;/code&gt; (converts the block); &lt;code&gt;conceptUnchooseFabric&lt;/code&gt; only while no block and no PO.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;concept lifecycle: &lt;code&gt;conceptSendPat&lt;/code&gt; → &lt;code&gt;conceptSubmitSample(&amp;#39;pp&amp;#39;)&lt;/code&gt; → &lt;code&gt;conceptReviewSample&lt;/code&gt; (resubmit = another round; approved) → &lt;code&gt;conceptSubmitSample(&amp;#39;shipment&amp;#39;)&lt;/code&gt; → review → &lt;code&gt;conceptSendApproval&lt;/code&gt; (posts the @planning @production @warehouse @store comment) → &lt;code&gt;priceFabric&lt;/code&gt; → Enigma (&lt;code&gt;conceptConfigureEnigma&lt;/code&gt;, &lt;code&gt;conceptSetEnigmaFlags&lt;/code&gt;) → designs (&lt;code&gt;conceptAddDesign&lt;/code&gt; / update / flags / remove) → &lt;code&gt;conceptSetName&lt;/code&gt; → &lt;code&gt;conceptSetMarketing&lt;/code&gt; → &lt;code&gt;conceptGoLive&lt;/code&gt; (sets &lt;code&gt;liveOn&lt;/code&gt;, clears the fabric&amp;#39;s &lt;code&gt;onHold&lt;/code&gt;) → online steps. &lt;code&gt;conceptGoLive&lt;/code&gt; is not gated on the swatch desk; &amp;quot;Live&amp;quot; on the Requirements list additionally needs &lt;code&gt;online.liveOn&lt;/code&gt;.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;Option slot&lt;/strong&gt; (&lt;code&gt;RequestOption.status&lt;/code&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;open&lt;/code&gt; → (sourcing &lt;code&gt;addRequestOffer&lt;/code&gt;, replaces the live vendor) → &lt;code&gt;with-design&lt;/code&gt; via &lt;code&gt;sendOptionToDesign&lt;/code&gt;.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;with-design&lt;/code&gt; → &lt;code&gt;po-raised&lt;/code&gt;: &lt;code&gt;acceptOfferAndRaisePo&lt;/code&gt; (mints the fabric on the master with &lt;code&gt;onHold: true&lt;/code&gt;, the FabricPo, and a &lt;code&gt;new-fabric&lt;/code&gt; Concept with &lt;code&gt;approvalSentOn&lt;/code&gt; set so the swatch desk picks it up).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;with-design&lt;/code&gt; → &lt;code&gt;extension&lt;/code&gt;: &lt;code&gt;askOptionExtension&lt;/code&gt;; &lt;code&gt;extension&lt;/code&gt; → &lt;code&gt;with-design&lt;/code&gt;: &lt;code&gt;extendRequestOffer&lt;/code&gt; + &lt;code&gt;sendOptionBack&lt;/code&gt;.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;with-design&lt;/code&gt; | &lt;code&gt;extension&lt;/code&gt; → &lt;code&gt;open&lt;/code&gt;: &lt;code&gt;rejectRequestOffer&lt;/code&gt; on the last live offer, or &lt;code&gt;removeRequestOffer&lt;/code&gt; (sourcing withdraws).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;any except &lt;code&gt;po-raised&lt;/code&gt; → &lt;code&gt;closed&lt;/code&gt;: &lt;code&gt;closeOption&lt;/code&gt; (reason); &lt;code&gt;closed&lt;/code&gt; → &lt;code&gt;with-design&lt;/code&gt; or &lt;code&gt;open&lt;/code&gt;: &lt;code&gt;reopenOption&lt;/code&gt;.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Request stage on the list: 3 once every live slot has its PO; 2 while any slot is open / with design / extension / done; 1 otherwise.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;Requirement stage (computed on the Requirements list).&lt;/strong&gt; RTW style: 1 while &lt;code&gt;status = Requirement&lt;/code&gt;; 2 until the fabric PO exists (or, for FOB / vendor-sources, until the nomination / no PO needed); 3 once &lt;code&gt;poDone&lt;/code&gt;; 4 once production has begun (fabric ready, a material received, a factory allocated, or a sample); 5 (Live) once its launch is launched. MTM concept: 1 until an offer, &lt;code&gt;optionsSentOn&lt;/code&gt; or approval; 2 until the fabric PO; 3 after the PO; 4 once the swatch desk has an inward date or &lt;code&gt;liveOn&lt;/code&gt;; 5 once live in stores and online.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Vendor block.&lt;/strong&gt; &lt;code&gt;held&lt;/code&gt; → &lt;code&gt;converted&lt;/code&gt; (&lt;code&gt;convertBlock&lt;/code&gt;, or automatically by &lt;code&gt;conceptRaiseFabricPo&lt;/code&gt;) · &lt;code&gt;held&lt;/code&gt; → &lt;code&gt;released&lt;/code&gt; (&lt;code&gt;releaseBlock&lt;/code&gt;). &lt;code&gt;expired&lt;/code&gt; is in the type but nothing sets it: the countdown simply reads &amp;quot;lapsed nd ago&amp;quot; (not in the model yet — to build: a nightly job). A lapsed hold does not block Push PO in the model; the alert says &amp;quot;the mill&amp;#39;s hold lapsed nd ago — ask sourcing to extend&amp;quot; (blocking is to build).&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Fabric (MTM master).&lt;/strong&gt; Live status = Paused if &lt;code&gt;paused&lt;/code&gt; · On Hold if &lt;code&gt;onHold&lt;/code&gt; · BESPOKE: Sold Out if &lt;code&gt;millAvailable === false&lt;/code&gt; else Active · Sold Out if saleable ≤ 0 · Low Stock if saleable &amp;lt; 15 m · Active. Moves: &lt;code&gt;pauseFabric&lt;/code&gt; / &lt;code&gt;resumeFabric&lt;/code&gt; (design); &lt;code&gt;setFabricHold&lt;/code&gt; (sourcing, and automatically by &lt;code&gt;reportMillStock&lt;/code&gt;, &lt;code&gt;saveMillStock&lt;/code&gt;, &lt;code&gt;importMillSheet&lt;/code&gt; when the mill says out, and cleared by &lt;code&gt;conceptGoLive&lt;/code&gt;); &lt;code&gt;setFabricBucket&lt;/code&gt; NON_CORE → CORE (threshold raised to 40 if under 20, &lt;code&gt;promotedOn&lt;/code&gt;, core block cleared) or CORE → NON_CORE; BESPOKE never changes bucket (the screen hides the control); &lt;code&gt;agreeCoreBlock&lt;/code&gt; / &lt;code&gt;endCoreBlock&lt;/code&gt;; &lt;code&gt;renameFabric&lt;/code&gt; appends to &lt;code&gt;nameHistory&lt;/code&gt;; &lt;code&gt;reviewCoreStock&lt;/code&gt; writes &lt;code&gt;supply&lt;/code&gt;; &lt;code&gt;raiseFabricPo&lt;/code&gt; adds &lt;code&gt;incomingMetres&lt;/code&gt;; &lt;code&gt;receiveFabricPo&lt;/code&gt; / &lt;code&gt;receiveFabricGrn&lt;/code&gt; move metres from incoming to stock and raise a GRN.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Fabric PO.&lt;/strong&gt; raised → (&lt;code&gt;confirmFabricPo&lt;/code&gt; sets vendorConfirmedOn / expectedOn / remark; &lt;code&gt;remarkFabricPo&lt;/code&gt;) → &lt;code&gt;receiveFabricPo&lt;/code&gt; (received, GRN). Status word computed: awaiting confirmation → unconfirmed · chase after 2 days → confirmed → confirmed · overdue → received.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Customer order (one piece)&lt;/strong&gt; (&lt;code&gt;CustomerOrder.stage&lt;/code&gt;, moved only by &lt;code&gt;scanOrders&lt;/code&gt;, &lt;code&gt;submitPlan&lt;/code&gt;, &lt;code&gt;unplanOrders&lt;/code&gt;, &lt;code&gt;receiveRound&lt;/code&gt;, &lt;code&gt;inwardBespoke&lt;/code&gt;, &lt;code&gt;fulfilOrder&lt;/code&gt;, &lt;code&gt;storeInward&lt;/code&gt;, &lt;code&gt;cancelOrder&lt;/code&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;MTM: &lt;code&gt;punched&lt;/code&gt; (reserves metres) → &lt;code&gt;pp&lt;/code&gt; (the 2-hour freeze is computed, not a stored stage; &lt;code&gt;inwardBespoke&lt;/code&gt; also moves punched → pp) → &lt;code&gt;planned&lt;/code&gt; (&lt;code&gt;submitPlan&lt;/code&gt;; &lt;code&gt;unplanOrders&lt;/code&gt; goes back to &lt;code&gt;pp&lt;/code&gt; and frees the factory) → &lt;code&gt;in-transit&lt;/code&gt; (scan &amp;quot;Out of production unit&amp;quot;: metres deducted from stock and reservation) → &lt;code&gt;in-factory&lt;/code&gt; (scan) → &lt;code&gt;out-factory&lt;/code&gt; (scan; factory or production) → &lt;code&gt;rts&lt;/code&gt; (vehicle round / RTS scan, raises the &lt;code&gt;mtm-round&lt;/code&gt; GRN) → &lt;code&gt;dispatched&lt;/code&gt; (scan) → &lt;code&gt;delivered&lt;/code&gt; (store counts it in, or &lt;code&gt;fulfilOrder&lt;/code&gt;). &lt;code&gt;receiveRound&lt;/code&gt; sends a rejected piece back to &lt;code&gt;in-factory&lt;/code&gt; with the reason on &lt;code&gt;receiving&lt;/code&gt;; a short piece stays &lt;code&gt;out-factory&lt;/code&gt; with &lt;code&gt;shortOn&lt;/code&gt;. &lt;code&gt;cancelOrder&lt;/code&gt; from any stage → &lt;code&gt;cancelled&lt;/code&gt; (reservation released only before the cloth was cut).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;RTW: &lt;code&gt;punched&lt;/code&gt; → &lt;code&gt;dispatched&lt;/code&gt; (&lt;code&gt;fulfilOrder&lt;/code&gt; from the hub) → &lt;code&gt;delivered&lt;/code&gt;; or shelf hand-over via &lt;code&gt;fulfilOrder&lt;/code&gt;. The store&amp;#39;s &lt;code&gt;advanceOrder&lt;/code&gt; (punched → ready → delivered, ready → hemming when an inseam is set) exists in the store but no button calls it (not in the model yet — to build the hemming bench&amp;#39;s own scan).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Sheet edits (&lt;code&gt;sheetEditMode&lt;/code&gt;): unit — &lt;code&gt;free&lt;/code&gt; in punched / pp / planned, &lt;code&gt;amend&lt;/code&gt; (revision flagged &lt;code&gt;reprint&lt;/code&gt;, cleared by &lt;code&gt;reissueSheet&lt;/code&gt;) in in-transit / in-factory, &lt;code&gt;closed&lt;/code&gt; after; store — &lt;code&gt;free&lt;/code&gt; in punched / pp while no factory is allocated, &lt;code&gt;remarks&lt;/code&gt; in punched / pp / planned / in-transit / in-factory, &lt;code&gt;closed&lt;/code&gt; after. Bespoke: &lt;code&gt;callBespokeFabric&lt;/code&gt; sets &lt;code&gt;requestedOn&lt;/code&gt;; &lt;code&gt;inwardBespoke&lt;/code&gt; sets &lt;code&gt;inwardOn&lt;/code&gt;; the piece is not in the PP queue until inwarded.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;Production plan.&lt;/strong&gt; created by &lt;code&gt;submitPlan&lt;/code&gt; (forced over capacity is recorded) → &lt;code&gt;closePlan&lt;/code&gt; sets &lt;code&gt;closedOn&lt;/code&gt;. &lt;strong&gt;Extra fabric.&lt;/strong&gt; &lt;code&gt;requested&lt;/code&gt; → &lt;code&gt;approved&lt;/code&gt; (metres deducted from the fabric) | &lt;code&gt;declined&lt;/code&gt; → &lt;code&gt;sent&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Return case&lt;/strong&gt; (&lt;code&gt;stage&lt;/code&gt; plus the last attempt&amp;#39;s outcome).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;raised&lt;/code&gt; (&lt;code&gt;raiseReturn&lt;/code&gt;, &lt;code&gt;slaDays&lt;/code&gt; 10) → &lt;code&gt;startResolution(step, where)&lt;/code&gt;: alteration at store (nothing travels) · alteration at factory or remake (MTM: &lt;code&gt;factoryLeg&lt;/code&gt; opened) · alteration at hemming-unit (&lt;code&gt;hemLeg&lt;/code&gt; opened, destination store) · refit · exchange (RTW: accepted and &lt;code&gt;closed&lt;/code&gt; on the spot; stock moves) · store-credit (accepted, &lt;code&gt;refunded&lt;/code&gt;, closed, ledger entry) · refund (&lt;code&gt;refund&lt;/code&gt; requested, stage &lt;code&gt;back-at-store&lt;/code&gt;, waits on finance).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;factory leg: &lt;code&gt;sendReturnToFactory&lt;/code&gt; (&lt;code&gt;at-factory&lt;/code&gt;) → &lt;code&gt;factoryReceivedReturn&lt;/code&gt; → &lt;code&gt;returnDoneAtFactory&lt;/code&gt; (&lt;code&gt;back-at-store&lt;/code&gt;) → store counts it in (&lt;code&gt;storeInward(&amp;#39;return&amp;#39;)&lt;/code&gt; sets &lt;code&gt;backAtStoreOn&lt;/code&gt;).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;hemming leg: &lt;code&gt;sendReturnToHemming&lt;/code&gt; (&lt;code&gt;at-factory&lt;/code&gt;) → &lt;code&gt;hemLegStep&lt;/code&gt; inwardAtWarehouse → atUnit → hemmed → backAtWarehouse → dispatched (&lt;code&gt;back-at-store&lt;/code&gt;) → delivered.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;decideResolution&lt;/code&gt;: accepted → &lt;code&gt;closed&lt;/code&gt;; not enough → the next rung opens. &lt;code&gt;moveRefund&lt;/code&gt; (finance; no button): &lt;code&gt;refunded&lt;/code&gt;, closed. &lt;code&gt;advanceReturn&lt;/code&gt; (raised → at-factory → back-at-store → refunded → closed) exists with no button.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;Launch gates&lt;/strong&gt; (&lt;code&gt;launchOf&lt;/code&gt;). In production (no &lt;code&gt;receivedAtHo&lt;/code&gt;) → At HO → Allocating (&lt;code&gt;allocateLaunch&lt;/code&gt;) → Dispatching (&lt;code&gt;dispatchLaunch&lt;/code&gt;) → Ready when all six gates hold (received at HO, allocated, all dispatched, all received, marketing brief, launch date) → Launched (&lt;code&gt;updateLaunch({launchedOn})&lt;/code&gt;). Nothing in the model blocks &lt;code&gt;launchedOn&lt;/code&gt; on the gates (blocking on name and dispatch is to build).&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;RTW option.&lt;/strong&gt; active ⇄ inactive (&lt;code&gt;decideOption(&amp;#39;make-inactive&amp;#39; | &amp;#39;liquidate&amp;#39;)&lt;/code&gt; with reason; &lt;code&gt;&amp;#39;reintroduce&amp;#39;&lt;/code&gt; clears it and optionally adds &lt;code&gt;incomingQty&lt;/code&gt;); &lt;code&gt;&amp;#39;promote-to-core&amp;#39;&lt;/code&gt; sets &lt;code&gt;core&lt;/code&gt;; &lt;code&gt;&amp;#39;reorder&amp;#39;&lt;/code&gt; adds &lt;code&gt;incomingQty&lt;/code&gt; (default 150). The verb is recomputed on every read, not nightly.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Swatch desk.&lt;/strong&gt; Each of the seven dates is set once by its button, in any order (the screen offers the next unset one); &lt;code&gt;dispatched&lt;/code&gt; also creates one &lt;code&gt;SwatchDispatch&lt;/code&gt; per store, which the store confirms. &lt;strong&gt;Swatch books / fit samples.&lt;/strong&gt; dispatched → received (store or &lt;code&gt;storeInward&lt;/code&gt;); fit sample state ok / worn / missing by the store.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Vehicle round&lt;/strong&gt; (&lt;code&gt;receiveRound&lt;/code&gt;). per piece: received → RTS scan + one &lt;code&gt;mtm-round&lt;/code&gt; GRN per factory; short → &lt;code&gt;receiving.shortOn&lt;/code&gt;; rejected → back to &lt;code&gt;in-factory&lt;/code&gt; with the reason appended to remarks.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Stock request.&lt;/strong&gt; requested → accepted | declined | shipped → received (the asking store&amp;#39;s &lt;code&gt;storeInward(&amp;#39;request&amp;#39;)&lt;/code&gt; also sets received).&lt;/p&gt;
&lt;p&gt;Sources: &lt;code&gt;src/store.ts&lt;/code&gt; (every action listed and the fields it sets); &lt;code&gt;src/domain/engines.ts&lt;/code&gt; (&lt;code&gt;sourcingStateOf&lt;/code&gt;, &lt;code&gt;conceptOf&lt;/code&gt;, &lt;code&gt;launchOf&lt;/code&gt;, &lt;code&gt;liveStatusOf&lt;/code&gt;, &lt;code&gt;fabricPoStatus&lt;/code&gt;, &lt;code&gt;sheetEditMode&lt;/code&gt;, &lt;code&gt;returnStatusOf&lt;/code&gt;, &lt;code&gt;ppQueue&lt;/code&gt;); &lt;code&gt;src/screens/DesignHome.tsx&lt;/code&gt; (stage computation); &lt;code&gt;src/domain/reference.ts&lt;/code&gt; (&lt;code&gt;SHEET_FREE_EDIT&lt;/code&gt;, &lt;code&gt;SHEET_STORE_EDIT&lt;/code&gt;, &lt;code&gt;SHEET_AMEND&lt;/code&gt;, &lt;code&gt;ORDER_STAGE_NEXT&lt;/code&gt;).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;business-rules-and-validations&quot;&gt;&lt;summary&gt;Business rules and validations&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Every guard the store enforces, action by action, with the toast the user sees. Two kinds of refusal exist in the model: a silent &lt;code&gt;return&lt;/code&gt; inside &lt;code&gt;touch()&lt;/code&gt; (nothing is written, no message — the screen usually hides the button instead), and an explicit warning toast (&lt;code&gt;tone: &amp;#39;warn&amp;#39;&lt;/code&gt;) with no write. Toasts marked (undo) carry an Undo button for 7 seconds. Rules the earlier text described that the code does not enforce are marked &amp;quot;(not in the model yet — to build)&amp;quot;.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Action&lt;/th&gt;&lt;th&gt;Rule / guard in the code&lt;/th&gt;&lt;th&gt;Text the user sees&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Create requirement (RTW/FOB)&lt;/td&gt;&lt;td&gt;Form-level only; status &lt;code&gt;Requirement&lt;/code&gt;, BOM and costing defaulted from the category, &lt;code&gt;costingClosure.plan&lt;/code&gt; = today + 10 d&lt;/td&gt;&lt;td&gt;&amp;quot;Requirement created. It is now sourcing&amp;#39;s turn.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Update requirement&lt;/td&gt;&lt;td&gt;Only while &lt;code&gt;status === &amp;#39;Requirement&amp;#39;&lt;/code&gt; (screen gate)&lt;/td&gt;&lt;td&gt;&amp;quot;Saved.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Hand to sourcing&lt;/td&gt;&lt;td&gt;Sets &lt;code&gt;Quoting&lt;/code&gt;, resets &lt;code&gt;sourcing&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;Handed to sourcing. They will come back with vendors.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;BOM saved&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;BOM saved.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Add vendor to a style (&lt;code&gt;addFabricQuote&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;One live vendor: the unchosen quote is dropped and logged &amp;quot;Vendor replaced · {mill} withdrawn by sourcing&amp;quot;; status Requirement → Quoting&lt;/td&gt;&lt;td&gt;&amp;quot;Vendor added with its terms.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Remove vendor&lt;/td&gt;&lt;td&gt;Refused if the quote is &lt;code&gt;selected&lt;/code&gt;; last one resets stage to &lt;code&gt;vendors&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;Vendor removed.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Send to design&lt;/td&gt;&lt;td&gt;Refused with no quotes&lt;/td&gt;&lt;td&gt;&amp;quot;Sent to design. It is their turn to choose.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ask extension (style)&lt;/td&gt;&lt;td&gt;Records who asked (design Refused if &lt;code&gt;selected&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;Vendor updated.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Costing saved&lt;/td&gt;&lt;td&gt;&lt;code&gt;cpm&lt;/code&gt; is held at the accepted quote (&amp;quot;· rate held at the quoted ₹n/m&amp;quot; in the log); consumption re-derives metres only while no PO is out&lt;/td&gt;&lt;td&gt;&amp;quot;Costing saved.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Allocate factory&lt;/td&gt;&lt;td&gt;Refused if &lt;code&gt;fabricNominated&lt;/code&gt; and &lt;code&gt;sourcing.stage !== &amp;#39;po-raised&amp;#39;&lt;/code&gt;; PO no. minted from the count of orders with a PO; merchant rotated; TNA built from the category template. Capacity is shown (&lt;code&gt;factoryOptions&lt;/code&gt;: fits / MOQ / at-risk), not enforced (to build)&lt;/td&gt;&lt;td&gt;&amp;quot;Factory allocated on capacity. PO raised and the TNA generated from the category template.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sourcing mode&lt;/td&gt;&lt;td&gt;&lt;code&gt;fabricNominated = (mode === &amp;#39;bsc-buys&amp;#39;)&lt;/code&gt;; nomination kept when switching to FOB; no lock after the email (to build)&lt;/td&gt;&lt;td&gt;&amp;quot;Saved.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Nomination emailed&lt;/td&gt;&lt;td&gt;Refused without a nomination&lt;/td&gt;&lt;td&gt;&amp;quot;Nomination emailed — the vendor buys from that supplier; it is on the record.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sample submitted (RTW)&lt;/td&gt;&lt;td&gt;Lands &amp;quot;PPS Submission&amp;quot;&lt;/td&gt;&lt;td&gt;&amp;quot;Sample logged — it is on the production unit&amp;#39;s desk.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sample reviewed&lt;/td&gt;&lt;td&gt;approved lands &amp;quot;PPS Approval&amp;quot;; no check on open major comments (to build)&lt;/td&gt;&lt;td&gt;&amp;quot;PP go-ahead given. Bulk can be planned.&amp;quot; / &amp;quot;Sent back with the green slip. The factory owes .&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Raise core PO&lt;/td&gt;&lt;td&gt;source auto (domestic) / manual (international); no below-ROP check (to build)&lt;/td&gt;&lt;td&gt;&amp;quot;PO for n m raised — now counting as incoming cover until the GRN lands.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Promote / demote&lt;/td&gt;&lt;td&gt;Core: threshold floor 40 if under 20, core block cleared&lt;/td&gt;&lt;td&gt;&amp;quot;Promoted to core — Enigma&amp;#39;s auto-PO now applies. Sourcing still has to agree a supply block with the mill.&amp;quot; / &amp;quot;Moved back to non-core — sells out once, the slot is refilled with a new fabric.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Core block agree / end&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;Supply block agreed with the mill until {Mon yy} — the auto-PO has something to draw on.&amp;quot; / &amp;quot;Supply block ended — the mill is free to drop the article.&amp;quot; (warn)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Confirm / remark / receive fabric PO&lt;/td&gt;&lt;td&gt;Receive refused if already received; GRN &lt;code&gt;fabric&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;Mill confirmed — the incoming metres are real cover now.&amp;quot; / &amp;quot;New date and remark saved.&amp;quot; / &amp;quot;Remark saved.&amp;quot; / &amp;quot;GRN done — the metres moved from incoming to the shelf.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Convert / release block&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;Block converted to a PO.&amp;quot; / &amp;quot;Block released — the mill is told it is free.&amp;quot; (warn)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRN invoice / finance pick-up&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;Invoice matched to the GRN — PO, receipt and invoice now agree on the record.&amp;quot; / &amp;quot;Invoice cleared.&amp;quot; / &amp;quot;Picked up by finance — GST filing and stock reconciliation can run off it.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Punch order / bill&lt;/td&gt;&lt;td&gt;MTM reserves &lt;code&gt;consumptionM × qty&lt;/code&gt; on the fabric; RTW deducts the size; bespoke fabric mints a parcel code and &lt;code&gt;requestedOn&lt;/code&gt;; no live / paused / stock checks (to build)&lt;/td&gt;&lt;td&gt;&amp;quot;Punched. n m reserved — every store&amp;#39;s saleable number just moved.&amp;quot; / &amp;quot;Punched. Stock for that size is off the shelf count.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Order sheet edit&lt;/td&gt;&lt;td&gt;Mode &lt;code&gt;closed&lt;/code&gt; → silent refusal; store in &lt;code&gt;remarks&lt;/code&gt; mode → only remarks kept; no change → nothing written; reservation follows a fabric / qty change while the cloth is still on the shelf; &lt;code&gt;amend&lt;/code&gt; mode flags &lt;code&gt;reprint&lt;/code&gt;; urgent tag sets ship-by = punched + 2 d&lt;/td&gt;&lt;td&gt;&amp;quot;Order sheet updated — the change is on the record with your name and the time.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Tag&lt;/td&gt;&lt;td&gt;Urgent sets ship-by = punched + 2 d&lt;/td&gt;&lt;td&gt;&amp;quot;Tag set.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Mark seen / told / factory read&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;Marked read — n changes taken into the plan.&amp;quot; / &amp;quot;Logged — the factory has been told. It is on the record, not only on the call.&amp;quot; / &amp;quot;Marked read — the change is with the floor.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Pull back to PP&lt;/td&gt;&lt;td&gt;Only from &lt;code&gt;planned&lt;/code&gt;; a revision &amp;quot;Plan: planned → back in PP&amp;quot;&lt;/td&gt;&lt;td&gt;&amp;quot;Pulled back to PP. The factory&amp;#39;s headroom is free again and the store can edit the sheet.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Re-issue sheet&lt;/td&gt;&lt;td&gt;Clears every &lt;code&gt;reprint&lt;/code&gt; flag&lt;/td&gt;&lt;td&gt;&amp;quot;Amended sheet re-issued — the factory is working to the new revision.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Submit plan&lt;/td&gt;&lt;td&gt;&lt;code&gt;orderIds.length &amp;gt; headroom&lt;/code&gt; and not forced → refused; forced records &lt;code&gt;forcedOver&lt;/code&gt; and &lt;code&gt;forcedBy&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Refusal: &amp;quot;n pieces is past {factory}&amp;#39;s capacity — room for m today. Send m, or force the rest through on the record.&amp;quot; (warn) · &amp;quot;Plan submitted to {factory} — n order sheets to print and cut.&amp;quot; · &amp;quot;Forced: n sent to {factory} — k past today&amp;#39;s capacity, and it is on the plan with your name.&amp;quot; (warn)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Scan&lt;/td&gt;&lt;td&gt;in-transit deducts the sheet&amp;#39;s metres from stock and reservation; rts raises one &lt;code&gt;mtm-round&lt;/code&gt; GRN per factory&lt;/td&gt;&lt;td&gt;&amp;quot;Scanned out. n pieces in transit — fabric deducted from inventory.&amp;quot; / &amp;quot;Scanned in at the factory.&amp;quot; / &amp;quot;Marked ready.&amp;quot; / &amp;quot;Back at the production unit.&amp;quot; / &amp;quot;Dispatched — the shipping table just moved.&amp;quot; / &amp;quot;Saved.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Receive the round&lt;/td&gt;&lt;td&gt;Every listed piece needs a fate on the screen; rejected needs a reason&lt;/td&gt;&lt;td&gt;&amp;quot;{factory}: n received · k not on the vehicle · j turned back.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Close plan&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;Plan closed.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Factory master&lt;/td&gt;&lt;td&gt;Only one &lt;code&gt;corporate&lt;/code&gt; and one &lt;code&gt;urgentReserve&lt;/code&gt; factory at a time&lt;/td&gt;&lt;td&gt;&amp;quot;Factory master saved — the allocation rules use it from the next draft.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Freeze window&lt;/td&gt;&lt;td&gt;Clamped 0–24 h&lt;/td&gt;&lt;td&gt;&amp;quot;Freeze window set to n h — orders punched since then are held back from the plan.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Extra fabric ask&lt;/td&gt;&lt;td&gt;Refused unless the piece has a fabric and a factory&lt;/td&gt;&lt;td&gt;&amp;quot;Asked. It is on the production unit&amp;#39;s queue here — no email, no phone call.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Extra fabric decide&lt;/td&gt;&lt;td&gt;Approval deducts metres once (only from &lt;code&gt;requested&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;&amp;quot;Approved — inventory deducted, fabric team gets the cut list.&amp;quot; / &amp;quot;Declined.&amp;quot; (warn) / &amp;quot;Marked sent to the factory.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Factory output&lt;/td&gt;&lt;td&gt;One row per factory per day, overwritten&lt;/td&gt;&lt;td&gt;&amp;quot;Output logged — n pieces for {date}. The production unit sees it against the scans.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Mill stock (bespoke)&lt;/td&gt;&lt;td&gt;Out puts the fabric on hold; available takes it off&lt;/td&gt;&lt;td&gt;&amp;quot;Mill stock updated — n m — orderable.&amp;quot; / &amp;quot;Reported sold out at the mill — switched off on Shopify and in stores.&amp;quot; (warn)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Mill sheet paste&lt;/td&gt;&lt;td&gt;Line must contain the code or name&lt;/td&gt;&lt;td&gt;&amp;quot;n fabrics updated from the mill&amp;#39;s sheet.&amp;quot; / &amp;quot;Nothing matched — the sheet needs the fabric code or name on each line.&amp;quot; (warn) · save: &amp;quot;n fabrics changed · {mill} reported for today.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Inward bespoke parcel&lt;/td&gt;&lt;td&gt;Code must match an open bespoke order not yet inwarded; GRN &lt;code&gt;bespoke-parcel&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;No open bespoke order carries code {CODE}.&amp;quot; (warn) / &amp;quot;{CODE} → {order}. Inwarded — planning can see it now.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Call bespoke fabric&lt;/td&gt;&lt;td&gt;Only orders not yet requested&lt;/td&gt;&lt;td&gt;&amp;quot;Request sent to the mill(s) with n code(s) — the parcels will match themselves.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric GRN (by fabric)&lt;/td&gt;&lt;td&gt;Metres default to incoming&lt;/td&gt;&lt;td&gt;&amp;quot;GRN done — the metres moved from incoming to the shelf. Saleable just went up in every store.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fulfil (hub)&lt;/td&gt;&lt;td&gt;punched → dispatched, else delivered&lt;/td&gt;&lt;td&gt;&amp;quot;Moved.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Swatch book dispatch / receive&lt;/td&gt;&lt;td&gt;Edition AW26&lt;/td&gt;&lt;td&gt;&amp;quot;{kind} book(s) dispatched — the store has a receipt to confirm.&amp;quot; / &amp;quot;Confirmed — head office can see the book is on your floor.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fit sample dispatch / mark&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;{fit} {size} fit sample on its way — the store counts it in on arrival.&amp;quot; / &amp;quot;Marked fine.&amp;quot; / &amp;quot;Marked worn — the unit sees a replacement is due.&amp;quot; (warn) / &amp;quot;Marked missing — the unit sees a replacement is due.&amp;quot; (warn)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Close STO&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;STO closed on receipt.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Store inward&lt;/td&gt;&lt;td&gt;Kind-specific side effects; every count-in raises a &lt;code&gt;store-inward&lt;/code&gt; GRN&lt;/td&gt;&lt;td&gt;&amp;quot;Counted in — the STO is closed and your stock now matches the box.&amp;quot; / &amp;quot;Received at the store — ready for the customer.&amp;quot; / &amp;quot;Counted in.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Confirm swatch&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;Confirmed. Head office can see it landed.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Raise return&lt;/td&gt;&lt;td&gt;Kind from the order; SLA 10 d; no &amp;quot;one open case per piece&amp;quot; check (to build)&lt;/td&gt;&lt;td&gt;&amp;quot;Return raised. First rung is alteration or refit — the ladder is on the record.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Start a rung&lt;/td&gt;&lt;td&gt;Screen: only when no attempt is pending or the last was &amp;quot;not enough&amp;quot;; refused if closed. Store credit = piece MRP (fabric or option, fallback 2,990)&lt;/td&gt;&lt;td&gt;&amp;quot;Swapped from the shelf — case closed, stock moved.&amp;quot; / &amp;quot;Store credit given — on the customer&amp;#39;s account, case closed; nothing waits on finance.&amp;quot; / &amp;quot;Refund requested — finance sees it on Today; the store sees the moment it moves.&amp;quot; / &amp;quot;Alteration by the store&amp;#39;s own tailor — nothing travels; the customer tries it here.&amp;quot; / &amp;quot;{Step} started — the piece goes to the factory.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Decide&lt;/td&gt;&lt;td&gt;Refused unless the last attempt is pending; screen also requires the piece home (no leg in flight)&lt;/td&gt;&lt;td&gt;&amp;quot;Customer happy — case closed on the record.&amp;quot; / &amp;quot;Not enough — the next rung of the ladder is open.&amp;quot; (warn)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Hand to vehicle (factory) / scanned in / done&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;Piece handed to the vehicle — the factory scans it in; no need to ask on Slack whether it reached.&amp;quot; / &amp;quot;Scanned in at the factory. The store can see it arrived.&amp;quot; / &amp;quot;Work done — the piece is on its way back to the store to count in.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Hand to vehicle (hemming) / hops&lt;/td&gt;&lt;td&gt;Each hop&amp;#39;s button shown only to its team (&lt;code&gt;HOPS[].who&lt;/code&gt;); production&amp;#39;s hops also open to the merchandiser&lt;/td&gt;&lt;td&gt;&amp;quot;Handed to the vehicle for the warehouse. The warehouse inwards it, sends it to the hemming unit, and every hop from here is a scan.&amp;quot; / &amp;quot;Inwarded at the warehouse — next stop the hemming unit.&amp;quot; / &amp;quot;Scanned in at the hemming unit.&amp;quot; / &amp;quot;Hemmed — on its way back to the warehouse.&amp;quot; / &amp;quot;Back at the warehouse — to dispatch.&amp;quot; / &amp;quot;Dispatched.&amp;quot; / &amp;quot;Delivered — the store confirms with the customer.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Refund moved&lt;/td&gt;&lt;td&gt;Finance; no button&lt;/td&gt;&lt;td&gt;&amp;quot;Moved — the store sees it, and can tell the customer.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Redeem credit&lt;/td&gt;&lt;td&gt;&lt;code&gt;min(amount, balance)&lt;/code&gt;; refused (silently) at ≤ 0&lt;/td&gt;&lt;td&gt;&amp;quot;₹n of store credit applied.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Write off&lt;/td&gt;&lt;td&gt;qty capped at the store&amp;#39;s stock of that size&lt;/td&gt;&lt;td&gt;&amp;quot;Written off — the system stock dropped the moment you decided, so it cannot be sold twice or counted as cover.&amp;quot; (warn)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cancel order&lt;/td&gt;&lt;td&gt;Reservation released only if the cloth was not yet scanned out&lt;/td&gt;&lt;td&gt;&amp;quot;Cancelled — reservation released.&amp;quot; (warn)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Stock ask / answer&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;Asked. It is on their Today until they answer.&amp;quot; / &amp;quot;Accepted — ship it when packed.&amp;quot; / &amp;quot;Marked shipped.&amp;quot; / &amp;quot;Received. Both counts moved.&amp;quot; / &amp;quot;Declined — they will see it and ask elsewhere.&amp;quot; (warn)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Undo&lt;/td&gt;&lt;td&gt;Last 10 writes; a toast&amp;#39;s Undo only reverts its own change&lt;/td&gt;&lt;td&gt;&amp;quot;Undone — {label}&amp;quot; / &amp;quot;Something else changed since — undo from the record instead.&amp;quot; (warn)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Save view / reset / walkthrough&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&amp;quot;Saved “{name}” — it is in the sidebar now.&amp;quot; / &amp;quot;Workspace reset to seed.&amp;quot; / &amp;quot;Walkthrough mode on — every team&amp;#39;s screens and buttons are open to you. Each one still says whose step it is.&amp;quot; / &amp;quot;Walkthrough mode off — you only see and click what your own role does.&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Computed fields are never editable: requirement stage, sourcing state word, health verb, fabric live status, milestone risk, launch gates, case status label, reorder point, ROS, credit balance, headroom.&lt;/p&gt;
&lt;p&gt;Sources: &lt;code&gt;src/store.ts&lt;/code&gt; (every action&amp;#39;s guard and toast, quoted); &lt;code&gt;src/domain/engines.ts&lt;/code&gt; (&lt;code&gt;sheetEditMode&lt;/code&gt;, &lt;code&gt;factoryLoadOf&lt;/code&gt;); &lt;code&gt;src/screens/Stores.tsx&lt;/code&gt; (&lt;code&gt;canStart&lt;/code&gt;, &lt;code&gt;canDecide&lt;/code&gt;), &lt;code&gt;HemTrip.tsx&lt;/code&gt; (&lt;code&gt;HOPS&lt;/code&gt;), &lt;code&gt;Mtm.tsx&lt;/code&gt; (RoundDrawer), &lt;code&gt;Sourcing.tsx&lt;/code&gt;, &lt;code&gt;Concepts.tsx&lt;/code&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;alert-engine&quot;&gt;&lt;summary&gt;Alert engine&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;One bell per person (&lt;code&gt;MentionBar&lt;/code&gt;, pane &amp;quot;To act on&amp;quot;), showing only their team&amp;#39;s items; every line opens the record at the step. The list is &lt;code&gt;alertsFor(db, myRole, { storeId })&lt;/code&gt;, recomputed on every render from the records — nothing is stored, nothing is emailed, and there is no nightly job: a line disappears the moment the record moves. Lines are sorted by &lt;code&gt;weight&lt;/code&gt; descending (highest cost of ignoring first), not oldest first. The Owner sees every role&amp;#39;s lines. Level is &lt;code&gt;critical&lt;/code&gt; · &lt;code&gt;warn&lt;/code&gt; · &lt;code&gt;info&lt;/code&gt;. The rules, in code order:&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Rule (id pattern)&lt;/th&gt;&lt;th&gt;Fires for&lt;/th&gt;&lt;th&gt;When&lt;/th&gt;&lt;th&gt;Title / detail (exact pattern)&lt;/th&gt;&lt;th&gt;Lands on&lt;/th&gt;&lt;th&gt;Level · weight&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;po-{orderId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;production&lt;/td&gt;&lt;td&gt;An Open PO with risk &lt;code&gt;critical&lt;/code&gt; or &lt;code&gt;delayed&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;{PO no. or &amp;#39;PO&amp;#39;} · {style}&amp;quot; / &amp;quot;{n}d past the target inhouse date · {qty} pcs&amp;quot; or &amp;quot;buffer down to {n}d · {qty} pcs&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/tracker?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;critical if delayed else warn · 1000 − buffer&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;blk-{blockId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;sourcing&lt;/td&gt;&lt;td&gt;A held block with ≤ 21 days left (negative = lapsed)&lt;/td&gt;&lt;td&gt;&amp;quot;{fabric} · block expiring&amp;quot; / &amp;quot;{n}d left · {m} m held&amp;quot;; lapsed: &amp;quot;{fabric} · block expired&amp;quot; / &amp;quot;lapsed {n}d ago · {m} m released back to the mill&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/fabrics?tab=blocks&lt;/code&gt;&lt;/td&gt;&lt;td&gt;critical if ≤ 7 d else warn · 900 − left&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;chk-{fabricId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;sourcing&lt;/td&gt;&lt;td&gt;Core fabric with no supply review, or reviewed ≥ 7 days ago (worst 8)&lt;/td&gt;&lt;td&gt;&amp;quot;{fabric} · mill check due&amp;quot; / &amp;quot;last asked {n}d ago&amp;quot; or &amp;quot;never asked&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/fabrics?tab=core&lt;/code&gt;&lt;/td&gt;&lt;td&gt;info · 300&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;fab-choose-{orderId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;design&lt;/td&gt;&lt;td&gt;Nominated style in Quoting/Allocated whose state is &lt;code&gt;choose&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;{style} · {n} fabric option(s) to choose from&amp;quot; / &amp;quot;sourcing submitted {n}d ago&amp;quot; · &amp;quot;the mill&amp;#39;s hold lapsed {n}d ago — ask sourcing to extend&amp;quot; · &amp;quot;the first hold lapses in {n}d&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/design?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;critical if hold ≤ 3 d else warn · 800 − holdDays (30 if none)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;fab-extend-{orderId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;sourcing&lt;/td&gt;&lt;td&gt;State &lt;code&gt;extend&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;{style} · design asked for an extension&amp;quot; / the extension note or &amp;quot;go back to the mills and extend the hold&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/sourcing?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;critical · 850&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;fab-vendors-{orderId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;sourcing&lt;/td&gt;&lt;td&gt;State &lt;code&gt;vendors&lt;/code&gt; and handed over ≥ 3 days ago&lt;/td&gt;&lt;td&gt;&amp;quot;{style} · options not yet sent to design&amp;quot; or &amp;quot;… · no vendor asked yet&amp;quot; / &amp;quot;handed over {n}d ago · fabric needed by {date}&amp;quot; (target in-house − 35 d)&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/sourcing?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warn · 500 + days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;fab-po-{orderId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;design&lt;/td&gt;&lt;td&gt;State &lt;code&gt;raise-po&lt;/code&gt; (chosen, no PO)&lt;/td&gt;&lt;td&gt;&amp;quot;{style} · design to push PO&amp;quot; / &amp;quot;{metres or —} m from {mill}&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/design?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warn · 700&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;sw-cut-{conceptId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warehouse&lt;/td&gt;&lt;td&gt;New-fabric concept not live, swatch marked priority and not cut&lt;/td&gt;&lt;td&gt;&amp;quot;{concept} · priority swatch not cut&amp;quot; / &amp;quot;with the swatch team since {date}&amp;quot; · &amp;quot;inwarded {date} · not yet handed over&amp;quot; · &amp;quot;marked priority&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/swatches?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warn · 560&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;sw-ho-{conceptId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warehouse&lt;/td&gt;&lt;td&gt;Inwarded ≥ 2 days, not handed to the swatch team (when not priority)&lt;/td&gt;&lt;td&gt;&amp;quot;{concept} · cloth in {n}d, not with the swatch team&amp;quot; / &amp;quot;hand it over so the 25 × 25s can be cut&amp;quot;&lt;/td&gt;&lt;td&gt;same&lt;/td&gt;&lt;td&gt;warn · 520&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;sw-tell-{conceptId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;design&lt;/td&gt;&lt;td&gt;Dispatched, stores not told&lt;/td&gt;&lt;td&gt;&amp;quot;{concept} · swatches out, stores not told&amp;quot; / &amp;quot;dispatched {date}[ · photos shared] — tell the stores and set it live&amp;quot;&lt;/td&gt;&lt;td&gt;same&lt;/td&gt;&lt;td&gt;warn · 600&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;orq-{optionId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;design&lt;/td&gt;&lt;td&gt;Option slot &lt;code&gt;with-design&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;{REQ} · option {n}[ · {note}] — design to push PO&amp;quot; / &amp;quot;{vendor} is on the option&amp;quot; · &amp;quot;the hold lapsed {n}d ago&amp;quot; · &amp;quot;the hold lapses in {n}d&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/design?open={reqId}&amp;amp;slot={optionId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;critical if hold ≤ 5 d else warn · 810 − holdDays&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;orqx-{optionId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;sourcing&lt;/td&gt;&lt;td&gt;Option slot &lt;code&gt;extension&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;{REQ} · option {n} — extension asked&amp;quot; / the note&lt;/td&gt;&lt;td&gt;sa
