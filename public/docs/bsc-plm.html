&lt;h1&gt;BSC — Current Process (As-Is)&lt;/h1&gt;&lt;p class=&quot;by&quot;&gt;14 Oct 2026 · Riddhiman Ghosh · DevX Labs · Field lists are a first cut and will be corrected after further discovery.&lt;/p&gt;&lt;p class=&quot;lead&quot;&gt;How Bombay Shirt Company runs today, step by step: who does what, in which sheet or system, with which fields, and how long it takes. The optimized-process page mirrors these sections one for one.&lt;/p&gt;
&lt;div class=&quot;tools&quot;&gt;&lt;button id=&quot;openAll&quot;&gt;Expand all&lt;/button&gt;&lt;button id=&quot;closeAll&quot;&gt;Collapse all&lt;/button&gt;&lt;input id=&quot;q&quot; placeholder=&quot;Search within this document…&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;group&quot;&gt;Context&lt;/div&gt;
&lt;details id=&quot;purpose-and-how-to-read&quot;&gt;&lt;summary&gt;Purpose and how to read&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;This is the handover to the implementation team for Bombay Shirt Company&amp;#39;s product lifecycle tool. Part A describes the process as BSC runs it today, step by step, so the team can check that what it builds aligns with how work actually happens. Part B specifies the target process: every record, screen, step, rule, alert and integration, in enough detail to build from without a further brief.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Audience.&lt;/strong&gt; The engineers, the product owner and the QA lead building the tool; BSC&amp;#39;s functional owners (design, sourcing, planning, production, warehouse, stores) for sign-off on Part A and on the open questions.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Where it comes from.&lt;/strong&gt; Four discovery sittings, two days on site (27–31 Jul 2026), the sourcing call (6 Aug), the RTW inventory knowledge transfer (12 Aug), the store visit (13–14 Aug), a live read-only session in Enigma (26 Aug), the design discovery call (22 Sep), 22 working files shared by the teams, and the interactive process model reviewed with the sponsor through September. Nothing in Part A is invented; where a fact is unknown the step says so.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;How to read.&lt;/strong&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;Part A flows are numbered tables: step · who · trigger · data source · fields · format · time · hand-off. &lt;em&gt;Format&lt;/em&gt; names the physical thing (a sheet tab, an Enigma screen, an email, a Slack channel, paper). &lt;em&gt;Time&lt;/em&gt; is elapsed time as the team estimates it.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Part B flows are numbered tables: step · actor · screen and control · inputs · validations · writes · tells · target time. Section 13 consolidates the rules; Section 10 gives the state machines the rules protect.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Section 16 maps every current step to its target step so a reviewer can see what changes and what stays.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Field names in Part A are quoted as they appear in the sheet header. Field names in Part B are the target record&amp;#39;s field names.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;On data types, sources and fields.&lt;/strong&gt; The columns, cadences and enumerations in Part A are what we saw in Aug–Sep 2026. The field lists in Part B are the first cut, mapped to those columns and to Enigma&amp;#39;s live schema as read on 26 Aug. Both will be corrected on the Bombay visit and as Enigma API access widens; Section 20 lists what is still open. Build to the record shapes and the state machines; expect field names and enumerations to move.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Out of scope.&lt;/strong&gt; Costing, margin, working capital, ageing and inventory valuation stay in their sheets. Customer marketing (Superfone), store checklists (OPSR) and any garment visualiser are not part of this build.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;glossary-and-status-vocabularies&quot;&gt;&lt;summary&gt;Glossary and status vocabularies&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;The words below are BSC&amp;#39;s own; the tool uses them unchanged in lists, on records and in alerts. Every closed set in the second table is the literal TypeScript union or constant list in &lt;code&gt;src/domain/types.ts&lt;/code&gt; / &lt;code&gt;src/domain/reference.ts&lt;/code&gt;; the build must not paraphrase them.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Term&lt;/th&gt;&lt;th&gt;Meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;MTM&lt;/td&gt;&lt;td&gt;Made to measure: the customer buys first, the shirt is made after (about 14 days; ~2 days for domestic fabric). Stock is fabric in metres, held in three buckets: CORE, NON_CORE, BESPOKE. The fabric is the SKU.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW&lt;/td&gt;&lt;td&gt;Ready to wear: made 3–4 months ahead to a forecast; stock is finished pieces by size. The garment (style-colour, per size) is the SKU.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FOB&lt;/td&gt;&lt;td&gt;A garment bought finished from a vendor who buys the cloth and makes it. In the model this is &lt;code&gt;sourcingMode = &amp;#39;fob-nominated&amp;#39;&lt;/code&gt; (BSC names the supplier by email) or &lt;code&gt;&amp;#39;vendor-sources&amp;#39;&lt;/code&gt; (the vendor chooses its own cloth). &lt;code&gt;&amp;#39;bsc-buys&amp;#39;&lt;/code&gt; is the third mode: BSC buys the cloth and a CMT factory makes it.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Requirement&lt;/td&gt;&lt;td&gt;Anything design asks for. On the Requirements screen a row is one of three kinds: MTM fabric (a &lt;code&gt;Concept&lt;/code&gt;), RTW style (a &lt;code&gt;ProductionOrder&lt;/code&gt;), or Several options (an &lt;code&gt;OptionRequest&lt;/code&gt;).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Concept&lt;/td&gt;&lt;td&gt;The record of one MTM fabric (&lt;code&gt;kind: &amp;#39;new-fabric&amp;#39;&lt;/code&gt;) or construction (&lt;code&gt;kind: &amp;#39;construction&amp;#39;&lt;/code&gt;), from idea to live. Eleven derived gates; six design steps.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Design (on a fabric)&lt;/td&gt;&lt;td&gt;One sellable shirt configuration on a fabric (&lt;code&gt;ConceptDesign&lt;/code&gt;): product code, working name, final name, style, category Formal/Casual, MRP, cost, PDP copy. One fabric has several.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Product code&lt;/td&gt;&lt;td&gt;BSC&amp;#39;s Shopify identifier for a design. The model mints &lt;code&gt;BOM-SHI-FM-nnnn&lt;/code&gt; (Formal) or &lt;code&gt;BOM-SHI-CS-nnnn&lt;/code&gt; (Casual) from a running sequence starting at 4200. Not the fabric code.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric code&lt;/td&gt;&lt;td&gt;Enigma&amp;#39;s identifier for a fabric (e.g. &lt;code&gt;NOMSOXSOLI-1849&lt;/code&gt;), minted when design creates the datasheet. The model mints a stand-in (&lt;code&gt;NO&lt;/code&gt; + 2 letters of the mill + 6 letters of the name + &lt;code&gt;-16nn&lt;/code&gt;) only until Enigma&amp;#39;s code is known.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Enigma code&lt;/td&gt;&lt;td&gt;On an RTW order, &lt;code&gt;enigmaCode&lt;/code&gt; is BSC&amp;#39;s fabric code in Enigma for the bulk cloth (e.g. &lt;code&gt;FORPDOSOPI-81&lt;/code&gt;).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vendor fabric code / article&lt;/td&gt;&lt;td&gt;The mill&amp;#39;s own article number (&lt;code&gt;vendorFabricCode&lt;/code&gt; on an order, &lt;code&gt;vendorCode&lt;/code&gt; on a fabric or offer), e.g. &lt;code&gt;Verdi SOK#24594&lt;/code&gt;. What goes on the PO.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Swatch book&lt;/td&gt;&lt;td&gt;A physical book of 25×25 cm fabric squares in every store; the MTM shopfront. Each MTM fabric belongs to one book: &lt;code&gt;FORMAL SHIRTS - VOL.1&lt;/code&gt;, &lt;code&gt;FORMAL SHIRTS - VOL.2&lt;/code&gt;, &lt;code&gt;CASUAL SHIRTS VOL.1&lt;/code&gt;, &lt;code&gt;LINEN SHIRTS&lt;/code&gt;; bespoke books: &lt;code&gt;Leggiuno Bespoke&lt;/code&gt;. Store books come in three kinds (MTM, RTW, BESPOKE), edition &lt;code&gt;AW26&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Block / hold&lt;/td&gt;&lt;td&gt;A mill agrees by email, WhatsApp or call to hold cloth for a period with no money paid. Two shapes in the model: a &lt;code&gt;Block&lt;/code&gt; record (metres, agreedOn, expiresOn from the vendor&amp;#39;s &lt;code&gt;blockWindowDays&lt;/code&gt;) and a per-offer &lt;code&gt;holdUntil&lt;/code&gt; / &lt;code&gt;blockValidUntil&lt;/code&gt; date on a quote.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Extension&lt;/td&gt;&lt;td&gt;Design (or planning) asks sourcing to get a hold extended before deciding; sourcing extends the date and sends the options back.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Option (request)&lt;/td&gt;&lt;td&gt;One numbered slot on an option request (&amp;quot;Option 1 … Option N&amp;quot;). Sourcing puts ONE live vendor against a slot; design settles each slot on its own.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Offer / quote&lt;/td&gt;&lt;td&gt;A mill&amp;#39;s terms against one ask: ₹/m, MOQ, width, lead days, hold-until, composition, note. &lt;code&gt;FabricQuote&lt;/code&gt; on an RTW order; &lt;code&gt;ConceptFabricOption&lt;/code&gt; on a concept or a request slot.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;PO&lt;/td&gt;&lt;td&gt;Purchase order. Fabric PO to a mill in metres (&lt;code&gt;FabricPo&lt;/code&gt;, numbered &lt;code&gt;FPO-71nn&lt;/code&gt;; on an RTW order also &lt;code&gt;FPO #24nn&lt;/code&gt;); production PO to a factory in pieces (&lt;code&gt;ProductionOrder.poNo&lt;/code&gt;, &lt;code&gt;PO #155nn&lt;/code&gt;). Raising is not receiving.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Auto-PO&lt;/td&gt;&lt;td&gt;Enigma&amp;#39;s threshold top-up: when a core fabric&amp;#39;s on-hand plus incoming falls to the reorder point, a PO for the MOQ (or the multiples needed) goes to the mill. Domestic core: Enigma fires it (&lt;code&gt;source: &amp;#39;auto&amp;#39;&lt;/code&gt;); international: a person raises it (&lt;code&gt;source: &amp;#39;manual&amp;#39;&lt;/code&gt;).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Reorder point (ROP)&lt;/td&gt;&lt;td&gt;&lt;code&gt;max(lead-time demand, vendor MOQ)&lt;/code&gt;, where lead-time demand = last-8-week shirts/week × 2.15 m × lead days ÷ 7. The suggested PO is &lt;code&gt;max(MOQ, ceil(shortfall ÷ MOQ) × MOQ)&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Saleable&lt;/td&gt;&lt;td&gt;&lt;code&gt;stockMetres − reservedMetres − thresholdMetres&lt;/code&gt;; Enigma&amp;#39;s own formula (physical − accounting − threshold), recomputed by the tool. Store rule of thumb: under 15 m is &amp;quot;Low Stock&amp;quot;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRN&lt;/td&gt;&lt;td&gt;Goods received note. Every inward in the model raises one (&lt;code&gt;GRN-26-nnnn&lt;/code&gt;), of one of six kinds: fabric, rtw-po, bespoke-parcel, mtm-round, trims, store-inward.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;STO&lt;/td&gt;&lt;td&gt;Stock transfer order from the hub to one store, sent in waves (&amp;quot;STO Series No.&amp;quot;), with a type and a hemming type.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vehicle round&lt;/td&gt;&lt;td&gt;The daily vehicle that brings finished MTM pieces from the factories to the unit; each piece is received (RTS scan), short (not on the vehicle) or rejected (turned back with a reason).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTS&lt;/td&gt;&lt;td&gt;&amp;quot;Return to source&amp;quot;: the unit&amp;#39;s scan that a finished piece is back at the production unit and can be shipped.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;PP sample&lt;/td&gt;&lt;td&gt;Pre-production sample; &lt;code&gt;decision: &amp;#39;approved&amp;#39;&lt;/code&gt; is the PP go-ahead that lets bulk start. &lt;code&gt;resubmit&lt;/code&gt; means major comments.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Shipment sample&lt;/td&gt;&lt;td&gt;A concept&amp;#39;s second gate after PP: the sample made at scale.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Green slip&lt;/td&gt;&lt;td&gt;The production unit&amp;#39;s comment sheet on a sample round (&lt;code&gt;comments[]&lt;/code&gt; with area and major flag).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Drop&lt;/td&gt;&lt;td&gt;A month&amp;#39;s RTW launch (&lt;code&gt;Launch.dropMonth&lt;/code&gt;, e.g. &lt;code&gt;Oct 26&lt;/code&gt;); one launch record per option with six gates.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Display &amp;amp; fit pieces&lt;/td&gt;&lt;td&gt;Pieces issued to every RTW-holding store at COGS, never sellable: one display piece (shirts size 40, bottoms 32) and a fit set (shirts 38/40/42, bottoms 30/32/34).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fit sample set (MTM)&lt;/td&gt;&lt;td&gt;The three fits (Slim, Standard, Heavy) × four sizes (38, 40, 42, 44) each store holds so the customer can try the fit before the shirt is made.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Bill&lt;/td&gt;&lt;td&gt;One customer visit with one or more pieces (&lt;code&gt;billNo&lt;/code&gt;, &lt;code&gt;BILL-xxxxx&lt;/code&gt;); each piece is its own &lt;code&gt;CustomerOrder&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Order sheet&lt;/td&gt;&lt;td&gt;Enigma&amp;#39;s MTM sheet: 22 option tiles (&lt;code&gt;SheetOptionKey&lt;/code&gt;), 20 measurements (&lt;code&gt;MeasureKey&lt;/code&gt;), 4 pattern flags. Every edit after punching is a numbered revision.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;PP (MTM stage)&lt;/td&gt;&lt;td&gt;&amp;quot;Lying with us&amp;quot;: punched, freeze window over, waiting for a factory plan.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Freeze window&lt;/td&gt;&lt;td&gt;Orders punched in the last 2 hours (&lt;code&gt;PP_FREEZE_HOURS&lt;/code&gt;, adjustable 0–24) are not planned because stores still change them.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Plan&lt;/td&gt;&lt;td&gt;An MTM production plan (&lt;code&gt;#413nn&lt;/code&gt;): one factory, one category, a set of order sheets sent with the fabric. Capacity is a cap; forcing over it is recorded with a name.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Headroom&lt;/td&gt;&lt;td&gt;What a factory can take today: &lt;code&gt;perDay − in transit − max(0, WIP − 2×perDay)&lt;/code&gt;, where perDay is the factory&amp;#39;s &lt;code&gt;dailyTarget&lt;/code&gt; or its 7-day average out.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Aging&lt;/td&gt;&lt;td&gt;An MTM piece in-factory for more than 5 days.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Extra fabric&lt;/td&gt;&lt;td&gt;The daily &amp;quot;EXTRA FABRIC&amp;quot; email as a record: metres, one of five reasons, one of six panels, against one piece of a bundle. Approval deducts the metres.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Case&lt;/td&gt;&lt;td&gt;A return or alteration raised on one delivered piece (&lt;code&gt;RET-41nn&lt;/code&gt;), with a resolution ladder and, for MTM, a factory leg or a hemming-unit leg.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ladder&lt;/td&gt;&lt;td&gt;The order of rungs a store tries: alteration → refit → remake → store-credit → refund; exchange (swap from the shelf, RTW) is a side door.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Hemming unit&lt;/td&gt;&lt;td&gt;The unit that hems bottoms and alters pieces, reached through the warehouse; seven scanned hops there and back.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Store credit&lt;/td&gt;&lt;td&gt;A &lt;code&gt;CreditEntry&lt;/code&gt; (+ given on a case, − spent on a bill); balance is the sum per customer name.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Write-off&lt;/td&gt;&lt;td&gt;A store removes a damaged or unsellable piece from system stock the moment it decides (reason, disposition).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Option (RTW)&lt;/td&gt;&lt;td&gt;One style in one colour; sizes are not options. &lt;code&gt;styleOfOption&lt;/code&gt; strips the colour after &amp;quot; - &amp;quot;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ideal option count&lt;/td&gt;&lt;td&gt;Planning&amp;#39;s per-sub-category target (e.g. Casual Solid 35 = 10 core + 25 non-core). A gap against it is what raises an option request. MTM plans around ~30 active options (&lt;code&gt;MTM_ACTIVE_TARGET&lt;/code&gt;).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ROS / AWS&lt;/td&gt;&lt;td&gt;Rate of sale: the model&amp;#39;s &amp;quot;true ROS&amp;quot; is the mean of the last 4 in-stock weeks; &amp;quot;top-6 ROS&amp;quot; is the mean of the best 6 in-stock weeks since launch; &amp;quot;naive&amp;quot; is the 12-week mean. The sheets call this AWS.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;WOF&lt;/td&gt;&lt;td&gt;Weeks of forward cover = stock ÷ true ROS.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Velocity grade&lt;/td&gt;&lt;td&gt;A ≥10/wk · B ≥5 · C ≥2 · D ≥0.1 · E not selling.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;OTIF&lt;/td&gt;&lt;td&gt;On time (Dispatch actual ≤ target in-house) and in full (delivered within ±3% of cut or order qty).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;TNA&lt;/td&gt;&lt;td&gt;Time and action: the per-PO milestone calendar generated from the category template (22 possible milestones, day offsets from PO date).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Buffer&lt;/td&gt;&lt;td&gt;Days between expected in-house and target in-house; ≤ 7 is critical, ≤ 10 at risk.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Mention&lt;/td&gt;&lt;td&gt;&lt;code&gt;@person&lt;/code&gt; or &lt;code&gt;@role&lt;/code&gt; in a comment; addressed to that side on that record until resolved.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Walkthrough mode&lt;/td&gt;&lt;td&gt;The prototype&amp;#39;s super-admin switch: every screen and button open whoever you are signed in as; each still says whose step it is.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Quiet mode&lt;/td&gt;&lt;td&gt;Guidance off: no explainers, no example strips, full lists.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Status vocabularies (closed sets, verbatim from the code).&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Where&lt;/th&gt;&lt;th&gt;Values, in order&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Role (&lt;code&gt;RoleId&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;owner · design · planning · sourcing · production · warehouse · store · finance · merchandiser — labels: Owner · Design · Planning · Sourcing · Production · Warehouse · Store · Finance · Factory merchandiser&lt;/td&gt;&lt;td&gt;types.ts, &lt;code&gt;ROLE_LABEL&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vendor kind (&lt;code&gt;VendorKind&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;CMT factory · FOB factory · MTM factory · Hemming unit · Domestic mill · International mill · Trims&lt;/td&gt;&lt;td&gt;types.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vendor grade (computed)&lt;/td&gt;&lt;td&gt;Reliable · Watch · Poor · Too new&lt;/td&gt;&lt;td&gt;engines &lt;code&gt;vendorStatsOf&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Garment category (&lt;code&gt;GarmentCategory&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;RTW CMT shirts · RTW FOB shirts · Bottoms / Knitwear / Jackets · Flat Knits (T-shirts) · Flat Knits (Shirts) · Jeans · Kurta&lt;/td&gt;&lt;td&gt;types.ts, &lt;code&gt;GARMENT_CATEGORIES&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Production order status (&lt;code&gt;OrderStatus&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Requirement · Quoting · Allocated · Open · Closed · Cancelled&lt;/td&gt;&lt;td&gt;types.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sourcing stage on an order (&lt;code&gt;SourcingStage&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;vendors · design-choice · extension · chosen · po-raised&lt;/td&gt;&lt;td&gt;types.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sourcing state word (computed &lt;code&gt;sourcingStateOf&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;key → label: vendor-sources → &amp;quot;factory sources it&amp;quot; · handover → &amp;quot;design to hand over&amp;quot; · po-raised → &amp;quot;fabric PO raised&amp;quot; · raise-po → &amp;quot;no fabric PO on record&amp;quot; (Open/Closed without a PO) or &amp;quot;design to push PO&amp;quot; (stage chosen) · extend → &amp;quot;extension asked&amp;quot; · choose → &amp;quot;design to push PO&amp;quot; · vendors → &amp;quot;sourcing to add vendors&amp;quot;&lt;/td&gt;&lt;td&gt;engines.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sourcing mode (&lt;code&gt;SourcingMode&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;bsc-buys · fob-nominated · vendor-sources (labels: &amp;quot;BSC buys it&amp;quot; · &amp;quot;FOB · supplier nominated&amp;quot; · &amp;quot;Vendor sources&amp;quot;)&lt;/td&gt;&lt;td&gt;types.ts, Requirements.tsx&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Option slot (&lt;code&gt;RequestOptionStatus&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;open (&amp;quot;sourcing to add vendors&amp;quot;) · with-design (&amp;quot;design to push PO&amp;quot;) · extension (&amp;quot;extension asked&amp;quot;) · po-raised (&amp;quot;PO raised&amp;quot;) · closed (&amp;quot;closed&amp;quot;)&lt;/td&gt;&lt;td&gt;types.ts, OptionRequests.tsx &lt;code&gt;STATUS&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Requirement stage (computed, Requirements screen)&lt;/td&gt;&lt;td&gt;1 · Requirement · 2 · Sourcing · 3 · Finalised &amp;amp; ordered · 4 · Downstream · Live&lt;/td&gt;&lt;td&gt;DesignHome.tsx &lt;code&gt;STAGE_LABEL&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Design steps (&lt;code&gt;DesignStepKey&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;request · sampling · vendors · po · fabric-in · live — labels Request · Sampling · Vendors · Purchase order · Fabric in · Go live; each step is done · now · later&lt;/td&gt;&lt;td&gt;engines &lt;code&gt;designFlowOf&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Concept stage (computed &lt;code&gt;ConceptStage&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Idea · Sampling · Shipment sample · Approved · Fabric · Blocked · PO raised · Configured · Named · Ready · Live&lt;/td&gt;&lt;td&gt;engines.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Concept kind / gate&lt;/td&gt;&lt;td&gt;new-fabric · construction / pp · shipment&lt;/td&gt;&lt;td&gt;types.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sample round decision&lt;/td&gt;&lt;td&gt;pending · resubmit · approved; round state (computed) not started · with production unit · resubmit · approved&lt;/td&gt;&lt;td&gt;types.ts, engines&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sample area (&lt;code&gt;SampleArea&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Stitching · Fit · Pattern · Construction · Fabric handling · Trims / labels / buttons · Other&lt;/td&gt;&lt;td&gt;types.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Material check&lt;/td&gt;&lt;td&gt;pending · ok · fail&lt;/td&gt;&lt;td&gt;types.ts &lt;code&gt;MaterialLine.checked&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Swatch desk steps&lt;/td&gt;&lt;td&gt;inward (&amp;quot;Bulk received&amp;quot;) · handover (&amp;quot;To swatches&amp;quot;) · cut (&amp;quot;Cut&amp;quot;) · sticker (&amp;quot;Sticker&amp;quot;) · dispatched (&amp;quot;Dispatched&amp;quot;) · photos (&amp;quot;Photos&amp;quot;) · storesTold (&amp;quot;Stores told&amp;quot;)&lt;/td&gt;&lt;td&gt;store &lt;code&gt;conceptSwatch&lt;/code&gt;, Swatches.tsx &lt;code&gt;STEPS&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Online steps&lt;/td&gt;&lt;td&gt;photos · video · post · live&lt;/td&gt;&lt;td&gt;store &lt;code&gt;conceptOnline&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Design category / style&lt;/td&gt;&lt;td&gt;Formal · Casual / Boardroom · French Cuff · Business Casual · Band Collar · Half Sleeve · Popover · Kurta; presets BRD · FRC · BSC (+ placeholders WKD · RST · EVE)&lt;/td&gt;&lt;td&gt;reference.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Composition family (website filter)&lt;/td&gt;&lt;td&gt;Cotton · Linen blend · Bamboo blend · Cotton-lyocell · Stretch cotton · Wool blend · Giza / 2-ply&lt;/td&gt;&lt;td&gt;&lt;code&gt;COMPOSITION_FAMILIES&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Milestones (&lt;code&gt;MILESTONES&lt;/code&gt;, in template order)&lt;/td&gt;&lt;td&gt;Yarn PO · Fabric PO · Yarn ETA · Fabric ETA · Trims ETA · PPS Submission · PPS Approval · Size Set Sub · Size Set Appvl · Knitting Start · Knitting End · Interlock Start · Interlock End · Cutting Start · Cutting End · Stitching Start · Stitching End · Finishing Start · Finishing End · FI · Dispatch · Inhouse ETA; stage pre-production (first nine) or production&lt;/td&gt;&lt;td&gt;reference.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Delay reasons&lt;/td&gt;&lt;td&gt;Fabric not received from mill · Trims short-supplied · PPS approval pending at production unit · Factory capacity taken by another order · Quality rework after inline check · Fabric quality rejected at inspection · Labour shortage at unit · Awaiting size-set approval&lt;/td&gt;&lt;td&gt;&lt;code&gt;DELAY_REASONS&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Order steps (comment &amp;quot;about&amp;quot;)&lt;/td&gt;&lt;td&gt;General · PPS sample · Size set · Fabric &amp;amp; trims · Escalation · Receipt&lt;/td&gt;&lt;td&gt;&lt;code&gt;ORDER_STEPS&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Milestone risk (computed &lt;code&gt;Risk&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;pending · on-track · watch · at-risk · critical · delayed · closed&lt;/td&gt;&lt;td&gt;engines &lt;code&gt;riskOf&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;OTIF (computed)&lt;/td&gt;&lt;td&gt;OTIF · Delayed · IF fail · Pending — filter labels Clean · Late · Short · Not shipped yet&lt;/td&gt;&lt;td&gt;engines &lt;code&gt;otifOf&lt;/code&gt;, Otif.tsx&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Escalation status (&lt;code&gt;EscalationStatus&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Open · Acknowledged · Resolved · Accepted delay&lt;/td&gt;&lt;td&gt;types.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW health verb (&lt;code&gt;RtwAction&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;REINTRODUCE · REVIEW · SIZE FILL · URGENT REPLENISH · LIQUIDATE · EXIT · CLEAR / DISCOUNT · MAINTAIN · MONITOR&lt;/td&gt;&lt;td&gt;types.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW health (computed)&lt;/td&gt;&lt;td&gt;Healthy · Unhealthy · Unknown (fewer than 4 weeks) · Inactive&lt;/td&gt;&lt;td&gt;engines &lt;code&gt;healthOf&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Velocity grade&lt;/td&gt;&lt;td&gt;A · B · C · D · E&lt;/td&gt;&lt;td&gt;&lt;code&gt;VELOCITY&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Option decision&lt;/td&gt;&lt;td&gt;promote-to-core · liquidate · reorder · reintroduce · make-inactive&lt;/td&gt;&lt;td&gt;store &lt;code&gt;decideOption&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric bucket (&lt;code&gt;FabricBucket&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;CORE · NON_CORE · BESPOKE (Enigma also has BESPOKE_NON_CORE, SKU, FOB, ACCESSORIES, EXTERNAL_MANUFACTURER, FREE)&lt;/td&gt;&lt;td&gt;types.ts; Enigma Answers&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric live status (computed &lt;code&gt;FabricLive&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Active · Low Stock · Paused · On Hold · Sold Out&lt;/td&gt;&lt;td&gt;engines &lt;code&gt;liveStatusOf&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric supply review&lt;/td&gt;&lt;td&gt;ok · delayed · out&lt;/td&gt;&lt;td&gt;types.ts &lt;code&gt;Fabric.supply.status&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Block status (&lt;code&gt;Block.status&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;held · converted · released · expired (nothing in the model sets &lt;code&gt;expired&lt;/code&gt; — the countdown goes negative; to build)&lt;/td&gt;&lt;td&gt;types.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Block / core-block channel&lt;/td&gt;&lt;td&gt;email · whatsapp · call&lt;/td&gt;&lt;td&gt;types.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric PO source / status (computed &lt;code&gt;fabricPoStatus&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;auto · manual / received · &amp;quot;unconfirmed · chase&amp;quot; (≥ 2 days unconfirmed) · &amp;quot;awaiting confirmation& &lt;p&gt;Sources: &lt;code&gt;bsc-plm-original/src/domain/types.ts&lt;/code&gt; (every union type and interface); &lt;code&gt;src/domain/reference.ts&lt;/code&gt; (&lt;code&gt;ROLE_LABEL&lt;/code&gt;, &lt;code&gt;GARMENT_CATEGORIES&lt;/code&gt;, &lt;code&gt;MILESTONES&lt;/code&gt;, &lt;code&gt;DELAY_REASONS&lt;/code&gt;, &lt;code&gt;ORDER_STEPS&lt;/code&gt;, &lt;code&gt;VELOCITY&lt;/code&gt;, &lt;code&gt;MTM_STAGES&lt;/code&gt;, &lt;code&gt;SHEET_OPTIONS&lt;/code&gt;, &lt;code&gt;MEASUREMENTS&lt;/code&gt;, &lt;code&gt;PATTERN_FLAGS&lt;/code&gt;, &lt;code&gt;MTM_FITS&lt;/code&gt;, &lt;code&gt;FIT_SAMPLE_*&lt;/code&gt;, &lt;code&gt;STO_TYPES&lt;/code&gt;, &lt;code&gt;HEMMING_TYPES&lt;/code&gt;, &lt;code&gt;EXTRA_FABRIC_*&lt;/code&gt;, &lt;code&gt;PANEL_METRES&lt;/code&gt;, &lt;code&gt;MTM_SWATCH_BOOKS&lt;/code&gt;, &lt;code&gt;BESPOKE_BOOKS&lt;/code&gt;, &lt;code&gt;SHIRT_STYLES&lt;/code&gt;, &lt;code&gt;SHIRT_PRESETS&lt;/code&gt;, &lt;code&gt;COMPOSITION_FAMILIES&lt;/code&gt;, &lt;code&gt;FILE_LABELS&lt;/code&gt;, &lt;code&gt;RISK&lt;/code&gt;, &lt;code&gt;OTIF_TOLERANCE&lt;/code&gt;, &lt;code&gt;STORE_LOW_METRES&lt;/code&gt;, &lt;code&gt;METRES_PER_SHIRT&lt;/code&gt;, &lt;code&gt;PP_FREEZE_HOURS&lt;/code&gt;, &lt;code&gt;AGING_DAYS&lt;/code&gt;, &lt;code&gt;DISPLAY_PLAN&lt;/code&gt;, &lt;code&gt;MTM_ACTIVE_TARGET&lt;/code&gt;); &lt;code&gt;src/domain/engines.ts&lt;/code&gt; (&lt;code&gt;riskOf&lt;/code&gt;, &lt;code&gt;otifOf&lt;/code&gt;, &lt;code&gt;healthOf&lt;/code&gt;, &lt;code&gt;coverageOf&lt;/code&gt;, &lt;code&gt;liveStatusOf&lt;/code&gt;, &lt;code&gt;fabricPoStatus&lt;/code&gt;, &lt;code&gt;conceptOf&lt;/code&gt;, &lt;code&gt;launchOf&lt;/code&gt;, &lt;code&gt;designFlowOf&lt;/code&gt;, &lt;code&gt;sourcingStateOf&lt;/code&gt;, &lt;code&gt;sheetEditMode&lt;/code&gt;, &lt;code&gt;returnStatusOf&lt;/code&gt;, &lt;code&gt;swatchMatrix&lt;/code&gt;, &lt;code&gt;fitSetOf&lt;/code&gt;, &lt;code&gt;factoryLoadOf&lt;/code&gt;, &lt;code&gt;vendorStatsOf&lt;/code&gt;); &lt;code&gt;src/screens/DesignHome.tsx&lt;/code&gt; (&lt;code&gt;STAGE_LABEL&lt;/code&gt;), &lt;code&gt;OptionRequests.tsx&lt;/code&gt; (&lt;code&gt;STATUS&lt;/code&gt;), &lt;code&gt;Swatches.tsx&lt;/code&gt; (&lt;code&gt;STEPS&lt;/code&gt;), &lt;code&gt;Otif.tsx&lt;/code&gt;; &lt;code&gt;docs/Enigma Answers — Read From Live System (26 Aug 2026).md&lt;/code&gt; (verbatim Enigma enums).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;teams-and-systems-today&quot;&gt;&lt;summary&gt;Teams and systems today&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Eight teams touch a product on its way to a customer. Three systems hold transactions; the decisions live in sheets and chat. The model signs in as one of nine roles (Owner, Design, Planning, Sourcing, Production, Warehouse, Store, Finance, Factory merchandiser) with one login per team; colleagues inside a team still appear by name on what they wrote.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Team&lt;/th&gt;&lt;th&gt;People named in discovery&lt;/th&gt;&lt;th&gt;Model login (&lt;code&gt;PEOPLE&lt;/code&gt;)&lt;/th&gt;&lt;th&gt;What they own&lt;/th&gt;&lt;th&gt;Systems they work in every day&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Kunal (head of design); Janak (master-data keeper — the weekly merchandise &amp;quot;bible&amp;quot;, the fabric ordering sheet, one copy of the block sheet; updates it alone, daily or on alternate days)&lt;/td&gt;&lt;td&gt;Kunal · Head of design (&lt;code&gt;design&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;What to make: MTM fabrics and constructions, RTW styles, names, prices, go-live; the fabric datasheet in Enigma; pausing a fabric; renaming; telling the stores&lt;/td&gt;&lt;td&gt;Enigma (Fabric module, Design module), Google Sheets (fabric ordering, swatch books weekly stock, REVISED NAME), email, WhatsApp&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Planning (category / merchandising)&lt;/td&gt;&lt;td&gt;Neha (Chief Product Officer); Charanjeet and Yulette (the &amp;quot;AI file&amp;quot; planning sheet, replenishment, option counts, ROS &amp;amp; health, drops); the priority owner for the requirements sheet is Charanjeet or Sairam&lt;/td&gt;&lt;td&gt;Neha · Chief Product Officer (&lt;code&gt;planning&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;RTW quantities and size ratios, factory allocation, replenishment, drops and launches, promote / reintroduce / liquidate / inactive, pre-production finance (COGS, working capital)&lt;/td&gt;&lt;td&gt;Excel (replenishment, option count, ROS &amp;amp; health, COGS, working capital, margin, ageing), Enigma stock report, email. The model treats planning as sitting with design on requirements and option requests (&lt;code&gt;asRole = &amp;#39;design&amp;#39;&lt;/code&gt;).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;Sreekanth (&amp;quot;Srikant&amp;quot;, sourcing lead)&lt;/td&gt;&lt;td&gt;Sreekanth · Sourcing (&lt;code&gt;sourcing&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Finding and blocking fabric, vendor terms, vendor profiles in Enigma, trims and packaging in bulk; weekly supplier stock review; switching a sold-out mill fabric off; manual international POs; chasing fabric POs&lt;/td&gt;&lt;td&gt;Email and WhatsApp with mills, Google Sheets (block sheet in three copies, fabric ordering), Enigma (Vendors)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Production unit&lt;/td&gt;&lt;td&gt;Parag (production &amp;amp; supply chain — the one session never held); Swati (MTM planner: seven days ahead, FIFO, &amp;quot;Mahendra 300, Harsh 60&amp;quot;); Vishnu (the aging pivot); Vishal (the shipping table)&lt;/td&gt;&lt;td&gt;Parag · Production &amp;amp; supply chain (&lt;code&gt;production&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Samples and PP go-ahead, job cards, the MTM plan and scans, bundles to factories, extra-fabric approval, RTW milestones, split dispatch, QC audits, alterations back from stores, the hemming unit&amp;#39;s two hops&lt;/td&gt;&lt;td&gt;Enigma (order states, scans, production plans like &amp;quot;#41274&amp;quot;), WhatsApp with factories (the shipping report), paper job cards, the daily EXTRA FABRIC email&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Factory merchandisers (BSC&amp;#39;s people at the factories)&lt;/td&gt;&lt;td&gt;Nitin Singh, Abhin M, Bhupendra (the tracker&amp;#39;s Merchant column; the model rotates these three on allocation). Discovery also names Abhin at the factories.&lt;/td&gt;&lt;td&gt;Nitin Singh · Factory merchandiser · Mahendra (&lt;code&gt;merchandiser&lt;/code&gt;, scoped to one MTM factory)&lt;/td&gt;&lt;td&gt;The floor&amp;#39;s day: declared output, pieces on the floor, in/out scans, extra-fabric asks, reading changed sheets&lt;/td&gt;&lt;td&gt;WhatsApp, Enigma scan, the EXTRA FABRIC email&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Warehouse / unit (Shravani&amp;#39;s team)&lt;/td&gt;&lt;td&gt;Shravani; Nitin and Prince (&amp;quot;Dispatch Status (Nitin/Prince)&amp;quot; in Monthly Drops; &amp;quot;Prince / Swatches to send&amp;quot;). Note the name clash: the model&amp;#39;s Nitin Singh is a factory merchandiser — confirm which Nitin is which.&lt;/td&gt;&lt;td&gt;Shravani · Warehouse &amp;amp; production unit (&lt;code&gt;warehouse&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;GRN, vehicle rounds, fabric rolls, RTW bulk lots, STO waves, swatch cutting / sticker / dispatch / photos, swatch books and fit samples to stores, bespoke parcels and mill stock sheets, the hemming-unit hops through the warehouse&lt;/td&gt;&lt;td&gt;Enigma (GRN, STO), ShipHero (finished pieces, bins — 15 of 50 stores mapped), STO &amp;amp; Swatches Tracker sheet, Slack&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td&gt;Vaishnav&amp;#39;s team (inventory module deep-dive scheduled, never done)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Enigma inventory module, thresholds&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Tech&lt;/td&gt;&lt;td&gt;The tech team&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Configures a new option in Enigma: template, consumption rule (base + buffer), order-sheet pick lists; Fit Smart size-to-measurement config&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Store&lt;/td&gt;&lt;td&gt;Store manager, master tailor, sales associates; three area managers (North, West, South/South-East) never interviewed&lt;/td&gt;&lt;td&gt;Aarav Mehta · Store manager (&lt;code&gt;store&lt;/code&gt;, scoped to one of the 34 stores in &lt;code&gt;STORES&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Punching bills and measurements, swatch books and fit sets, returns and alterations, display pieces, stock asks between stores, write-offs&lt;/td&gt;&lt;td&gt;Shopify/POS (billing), Enigma/&amp;quot;Anima&amp;quot; (measurements, order sheet), OPSR (checklists), Slack, the Tuesday Excel&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Marketing&lt;/td&gt;&lt;td&gt;Not met&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Final product names, PDP copy, photos, launch comms 10–15 days before launch&lt;/td&gt;&lt;td&gt;The REVISED NAME tab, Shopify, Slack&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Finance&lt;/td&gt;&lt;td&gt;Not met&lt;/td&gt;&lt;td&gt;— (no &lt;code&gt;finance&lt;/code&gt; person exists in &lt;code&gt;PEOPLE&lt;/code&gt;; the role has no screen of its own — to build)&lt;/td&gt;&lt;td&gt;Refunds, GST filing and three-way match (GRN · PO · invoice)&lt;/td&gt;&lt;td&gt;Fabric &amp;amp; Trims Deduction Tracker, Working Capital sheet&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Owner&lt;/td&gt;&lt;td&gt;Sairam (owner / CEO)&lt;/td&gt;&lt;td&gt;Sairam · Owner / CEO — sees every screen (&lt;code&gt;owner&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Every screen; the tie-breaker on priorities&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Systems.&lt;/p&gt;
&lt;p&gt;Enigma (&lt;code&gt;cms.bombayshirts.com&lt;/code&gt;; Java/Spring Boot behind a gateway; JSON REST at &lt;code&gt;new-admin.bombayshirts.com&lt;/code&gt;; OAuth2 bearer via &lt;code&gt;/oauth/token&lt;/code&gt;; a 115-module RBAC layer of which the discovery account held 36) is the transaction system: 8,585 fabrics, 15,826 POs, 195 vendors, 50 stores, 46 warehouses (45 STORE + 1 FACTORY), 47 fabric attribute templates, 59 order states, 318 unreserved orders, ledger ids past 4.88 million. It mints fabric codes, reserves metres on punch, runs the order through production, alteration and returns (&lt;code&gt;/exchnage/*&lt;/code&gt;), holds RTW variant stock per warehouse (&lt;code&gt;/design/list-variants-with-inventory&lt;/code&gt;), raises auto-POs on 2,311 fabrics (CORE only 111 of 541; NON_CORE 0; 1,762 flagged fabrics have no vendor) in at least two silent batch runs a day (08:00 and 15:00 IST, pseudo-user &amp;quot;Customer&amp;quot;, &lt;code&gt;overseerId &amp;quot;1&amp;quot;&lt;/code&gt;), and keeps a stock ledger (&lt;code&gt;/inventory/deductionReport&lt;/code&gt;) with a running &lt;code&gt;stockBalance&lt;/code&gt;. It has no &lt;code&gt;updatedAfter&lt;/code&gt; filter, no sandbox, no trims module, no sales/invoice module, no dye lot, no GRN number, no per-roll fabric barcode, and its stored saleable drifts from its own formula.&lt;/p&gt;
&lt;p&gt;Shopify and the POS bill the customer, hold customer profiles and sales; &lt;code&gt;remoteId&lt;/code&gt; is stored on both sides; attributes map to metafields; 49 of 50 stores carry a Shopify &lt;code&gt;locationId&lt;/code&gt;. The Enigma→Shopify stock push is a manual button per warehouse (&amp;quot;Sync Inventory For Custom Design / FOB Design&amp;quot;) with Sync Status blank on all 46.&lt;/p&gt;
&lt;p&gt;ShipHero holds finished-piece stock and bin locations; &lt;code&gt;shipheroWarehouseId&lt;/code&gt; on 15 of 50 stores (discovery had said ~28 locations).&lt;/p&gt;
&lt;p&gt;Around them: 22 working files (Data sources inventory), email for approvals and FOB nominations, WhatsApp for blocks, mill stock lists and factory chatter (the daily shipping report), Slack for returns, refunds, swatches and STO follow-ups, OPSR for store checklists, Superfone (replacing MCU) for customer outreach, and Fathom for meeting notes.&lt;/p&gt;
&lt;p&gt;The consequence the teams describe themselves: the same product is typed by hand three to five times (fabric ordering sheet, merchandise master, Enigma, Shopify, marketing sheet); five mills&amp;#39; stock lists are re-typed every morning; approvals live in email threads; and no one can see where a thing is without asking someone — usually Janak.&lt;/p&gt;

ting, threshold, stored saleable) per warehouse; ledger &lt;code&gt;/inventory/deductionReport&lt;/code&gt; (&lt;code&gt;id, purposeId, createdAtIstTime, fabricCode, orderId, orderProductId, quantity, purposeType, transactionType, adjustmentType, origin, poId, createdByUserName, stockAdjustmentDesc, stockAdjustmentReason, stockBalance, warehouseName, binName&lt;/code&gt;); Fabric PO header and lines with fulfillments (= GRN, no number); orders with 116 fields per line, 59 states, &lt;code&gt;qrCodeUrl&lt;/code&gt;, sizing fields; Vendors (&lt;code&gt;id, code, name, vendorType, address…, officePhone, officeEmail, active, categories&lt;/code&gt; — no lead time, MOQ or terms); Stores (&lt;code&gt;storeId, storeCode, displayName, …, locationId, shipheroWarehouseId, allocationRuleId, capacity, isAutoReplenishment&lt;/code&gt;); RTW variants per warehouse&lt;/td&gt;&lt;td&gt;Everything transactional&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Shopify&lt;/td&gt;&lt;td&gt;BSC IT&lt;/td&gt;&lt;td&gt;System, live&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Orders, customers, product metafields mapped from Enigma attributes; &lt;code&gt;remoteId&lt;/code&gt; / &lt;code&gt;remoteOrderNumber&lt;/code&gt;; 49/50 stores with &lt;code&gt;locationId&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Billing and online listing&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ShipHero&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;System, live&lt;/td&gt;&lt;td&gt;15 of 50 stores mapped&lt;/td&gt;&lt;td&gt;Finished-piece stock by bin, per location; &lt;code&gt;READY_FOR_SHIPHERO&lt;/code&gt; order state&lt;/td&gt;&lt;td&gt;RTW pick and STO&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;

&lt;div class=&quot;group&quot;&gt;Current process, flow by flow&lt;/div&gt;
&lt;details id=&quot;1-mtm-fabric-idea-to-live&quot;&gt;&lt;summary&gt;1. MTM fabric, idea to live&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;&lt;strong&gt;Design&amp;#39;s job in one line (design team walkthrough, 7 Oct 2026).&lt;/strong&gt; Design starts with a requirement, helps sourcing close the right fabric, turns that one fabric into one or more sellable designs, supplies the product information, and stays with it until it can be made and launched. Three things are never the same object: the requirement is not the fabric (design states the need, sourcing closes an option); the fabric is not the design (one fabric code carries several designs, each with its own preset, design code, cost, MRP and description, written on the design sheet); and a design that exists is not a design that is live (swatches reach stores, garments are inwarded, and online shoots finish on their own dates). A design carries a temporary name from design until marketing gives the final name and description.&lt;/p&gt;
&lt;p&gt;An MTM fabric is &amp;quot;just fabric&amp;quot;: the vendor lead time is 2 days for a Bombay mill and about 2 months from China (Sairam, 30 Jul 2026), but the path from the design meeting to a store shelf still crosses 20–30 days of design, tech-pack and costing work before a PO can go out (Sreekanth, 6 Aug), a block that lives in three copies of a sheet with no expiry date, an Enigma datasheet, the fabric ordering sheet, the swatch tracker, the weekly &amp;quot;bible&amp;quot; and the REVISED NAME tab — the same fabric typed 3 to 5 times by different people (Discovery Record v1.2 §01). No single record follows it; the end-to-end duration is not measured anywhere (to confirm — the &amp;quot;8 to 14 weeks&amp;quot; in earlier drafts is an estimate, not a number BSC gave).&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-mermaid&quot;&gt;flowchart LR
  A[Design meeting&amp;lt;br/&amp;gt;idea, weekly] --&amp;gt; B[Sourcing&amp;lt;br/&amp;gt;mill options by WhatsApp / email]
  B --&amp;gt; C[Design picks&amp;lt;br/&amp;gt;block by email or WhatsApp]
  C --&amp;gt; D[Production unit&amp;lt;br/&amp;gt;sample on the vendor swatch, PAT file]
  D --&amp;gt; E[Design&amp;lt;br/&amp;gt;datasheet in Enigma, code minted]
  E --&amp;gt; F[Design&amp;lt;br/&amp;gt;fabric PO in Enigma + ordering sheet row]
  F --&amp;gt; G[Warehouse&amp;lt;br/&amp;gt;GRN in Enigma, Shravani]
  G --&amp;gt; H[Inward logged, swatches cut&amp;lt;br/&amp;gt;MTM_Swatches tracker, Yusuf]
  H --&amp;gt; I[Sourcing&amp;lt;br/&amp;gt;designs / product codes on the fabric]
  I --&amp;gt; J[Stores&amp;lt;br/&amp;gt;Tuesday Excel, Slack photos]
  J --&amp;gt; K[Design&amp;lt;br/&amp;gt;isOnHold off · Sync Inventory button]
  K --&amp;gt; L[Online ~2 weeks later&amp;lt;br/&amp;gt;swatch shoot, video, post]&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Trigger&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields typed / read&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Hand-off&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A1.1&lt;/td&gt;&lt;td&gt;The idea is raised: a book below its planned count, a store asking, a trend&lt;/td&gt;&lt;td&gt;Design (Kunal, head; Janak, merchandiser; Yulette, planning — on leave Aug 2026)&lt;/td&gt;&lt;td&gt;Weekly design meeting (&amp;quot;weekly design meeting approval&amp;quot;, Invisit notes); the swatch-book sheet reviewed weekly against ~30 active options per book (22 Sep)&lt;/td&gt;&lt;td&gt;Nowhere; the requirement reaches Sourcing &amp;quot;in terms of quality, colour, quantity, and a type of fabric — solid, checks or stripe&amp;quot; (Sreekanth, 6 Aug), verbally and by email&lt;/td&gt;&lt;td&gt;Family/range, colour, quantity, type; rough wanted-by&lt;/td&gt;&lt;td&gt;Spoken, email, WhatsApp&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Sourcing scouts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.2&lt;/td&gt;&lt;td&gt;Sourcing asks mills for options&lt;/td&gt;&lt;td&gt;Sourcing (Sreekanth Mamidi — &amp;quot;everything starts from me&amp;quot;; &amp;quot;my working is very less system oriented&amp;quot;)&lt;/td&gt;&lt;td&gt;A1.1&lt;/td&gt;&lt;td&gt;Mill catalogues, mill WhatsApp groups, swatch cards couriered&lt;/td&gt;&lt;td&gt;Per option: mill, article no., composition, count, width (panna), price per metre, MOQ, lead time; &amp;quot;I present to them&amp;quot; — about 5 options are blocked per selection (Invisit notes; Question Bank Q44 disputes the ratio)&lt;/td&gt;&lt;td&gt;WhatsApp photos, PDFs, swatch cards &amp;quot;in a sitting&amp;quot;&lt;/td&gt;&lt;td&gt;Ready fabric ~2 months ahead; custom-mill fabric 3–4 months, mill turnaround 75–90 days (Invisit §7)&lt;/td&gt;&lt;td&gt;Design chooses&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.3&lt;/td&gt;&lt;td&gt;Design picks; Sourcing blocks it at the mill&lt;/td&gt;&lt;td&gt;Design picks; Sourcing writes the block&lt;/td&gt;&lt;td&gt;Swatches in hand&lt;/td&gt;&lt;td&gt;An &amp;quot;official mail&amp;quot; or WhatsApp to the supplier: &amp;quot;this has been shortlisted, so and so quantities&amp;quot; (Sreekanth); the block written into the &lt;code&gt;Blocked&lt;/code&gt; tab of &lt;em&gt;Copy of Fabric ordering.xlsx&lt;/em&gt; — column groups per family (Checks · STRIPES · Prints · SOLIDS · Japan · 100% linen), each with &lt;code&gt;desc · fabric Image · Vendor · Qty Reserved · Price · weave, comp. · Vendor code&lt;/code&gt;; one vendor block (Suzhon Lulin / ECHO Fusion) adds &lt;code&gt;CPM · QTY · vendor code · Enigma code&lt;/code&gt;; a &lt;code&gt;Fabric ETA&lt;/code&gt; column; row statuses &lt;code&gt;BLOCKED&lt;/code&gt;, &lt;code&gt;Taken For RTW&lt;/code&gt;, &lt;code&gt;Bulk Received&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Description, vendor, metres reserved, price, article&lt;/td&gt;&lt;td&gt;Sheet in three copies — Sourcing&amp;#39;s Excel, Design&amp;#39;s Excel, Janak&amp;#39;s Google Sheet (&amp;quot;Janak must have it, block fabric&amp;quot;)&lt;/td&gt;&lt;td&gt;Hold &amp;quot;2 to 5 months depending on the vendor&amp;quot;; no money changes hands (&amp;quot;when you buy, then only the meter starts&amp;quot;); the supplier can still sell it&lt;/td&gt;&lt;td&gt;&lt;strong&gt;No hold-until column exists in the sheet&lt;/strong&gt; — the expiry lives in the email and in memory; &amp;quot;suppliers put pressure on me… since we have blocked, now you have to pick up this fabric&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.4&lt;/td&gt;&lt;td&gt;Production unit samples on the vendor swatch or an inventory fabric; PAT file to the factory&lt;/td&gt;&lt;td&gt;Production / supply chain (Parag); factories&lt;/td&gt;&lt;td&gt;A1.3&lt;/td&gt;&lt;td&gt;Physical sample + PAT (pattern) file → factory → PP sample reviewed for construction, fit, wash, hand-feel → shipment-approval sample (Invisit §6)&lt;/td&gt;&lt;td&gt;Round, comments&lt;/td&gt;&lt;td&gt;Email and Drive; &amp;quot;no versioning, no structured review trail&amp;quot;&lt;/td&gt;&lt;td&gt;Not measured; &amp;quot;dates are critical because they directly affect production timelines&amp;quot; (Discovery 4th sitting)&lt;/td&gt;&lt;td&gt;Approval emailed &amp;quot;to all departments including stores&amp;quot;; the trainer updates a knowledge repository separately&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.5&lt;/td&gt;&lt;td&gt;Design creates the fabric datasheet in Enigma&lt;/td&gt;&lt;td&gt;Design (&amp;quot;Design team… make a data sheet of that particular fabric&amp;quot; — Sreekanth; attributes given by Sourcing verbally and by mail)&lt;/td&gt;&lt;td&gt;Sample approved; before any PO&lt;/td&gt;&lt;td&gt;Enigma → Fabric Module → Fabrics. Scalars &lt;code&gt;code, name, category, productType, inventoryType, vendorId, vendorCode, isAutoPo, isOnHold&lt;/code&gt;; attributes from the (category, productType, inventoryType) template — on Shirts / CUSTOM_DESIGN / NON_CORE: Thread Count, Turn around time for fabric (In Hours), Mills, Vendor Code for fabric, Composition family, Mill Country, Weave, Weight Class, Wrinkle Resistance, Cost per Unit, Minimum order quantity, Currency, Pattern, Is_uniform, Weave Description, Is_Cutroll, Mill Description, Fabric Piping, Contrast Fabric, Swatch Book, Panna (In Meters), Wash Care, Fabric Color, Washed Fabric, Stretch, Consumed_In (Kilogram / Meter), Fabric Ply, Construction (Knit / Woven), Big-Checked, Composition (238 values)&lt;/td&gt;&lt;td&gt;~30 attributes; &lt;code&gt;inventoryType&lt;/code&gt; one of CORE · NON_CORE · BESPOKE · BESPOKE_NON_CORE · SKU · FOB · ACCESSORIES · EXTERNAL_MANUFACTURER · FREE; no MRP field, no active flag (&lt;code&gt;isOnHold&lt;/code&gt;, true on 3,042 of 8,585)&lt;/td&gt;&lt;td&gt;Enigma form; 47 attribute templates&lt;/td&gt;&lt;td&gt;to confirm (not timed in discovery)&lt;/td&gt;&lt;td&gt;Enigma mints the fabric code (e.g. &lt;code&gt;NOMSOXSOLI-1849&lt;/code&gt;, &lt;code&gt;CONVHOO000-06&lt;/code&gt; — two grammars live)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.6&lt;/td&gt;&lt;td&gt;Sourcing creates the vendor in Enigma if new&lt;/td&gt;&lt;td&gt;Sourcing (&amp;quot;the vendor creation, I only do it&amp;quot;)&lt;/td&gt;&lt;td&gt;Design finds the supplier missing from the PO drop-down&lt;/td&gt;&lt;td&gt;Enigma → Vendors (195 rows): &lt;code&gt;code, name, vendorType, address, officePhone, officeEmail, active, categories&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Name, mail id, details&lt;/td&gt;&lt;td&gt;Enigma form&lt;/td&gt;&lt;td&gt;&amp;quot;a very small thing&amp;quot;&lt;/td&gt;&lt;td&gt;Design can raise the PO&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.7&lt;/td&gt;&lt;td&gt;Design raises the fabric PO&lt;/td&gt;&lt;td&gt;Design (&amp;quot;design team creates and releases the PO in Enigma&amp;quot; — Sreekanth; leadership&amp;#39;s answer is &amp;quot;the system fires it&amp;quot;; Discovery Record §05 logs three incompatible answers)&lt;/td&gt;&lt;td&gt;A1.5–A1.6; Kunal approves international core buys himself&lt;/td&gt;&lt;td&gt;Enigma → Fabric Module → Fabric PO (status DRAFT · Open · Cancelled · Close; 0 of the last 1,000 used DRAFT); the same fabric typed as a row of the &lt;em&gt;Fabric Ordering sheet&lt;/em&gt; tab — 35 columns: &lt;code&gt;Sr No. · Order Date · Swatch book · Category · Inventory Type · Fabric Code · Vendor · Mill · Vendor Code · Fabric Name · Fabric Price · Quantity · MRP · TAT · Threshold · Currency · Pattern · Weave · Colour · Composition · Composition Family · Interlining colour · Big checked (anything more 2&amp;quot; is yes) · Fabric Ply · Thread Count · Panna · Weight · Consumed in · Stretch · Construction · fabric Wash · Wash Care · Shine · Wrinkle · Total&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Fabric code, vendor, metres, price; sheet values seen: &lt;code&gt;Threshold&lt;/code&gt; 7 / 3 / 2, &lt;code&gt;TAT&lt;/code&gt; 0.0 on all but one row, &lt;code&gt;Fabric Price&lt;/code&gt; blank, &lt;code&gt;Inventory Type&lt;/code&gt; &amp;quot;Non-core&amp;quot; / &amp;quot;MTM&amp;quot; / &amp;quot;Bespoke&amp;quot; while &lt;code&gt;Category&lt;/code&gt; is always &amp;quot;MTM&amp;quot;, vendor spelt both &lt;code&gt;MP Brothers&lt;/code&gt; and &lt;code&gt;M.P. BROTHERS&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Enigma PO + a sheet row&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;td&gt;PO emailed to the mill; &lt;code&gt;estimatedArrivalDate&lt;/code&gt; is null on every PO read, so the expected date lives only in the mill&amp;#39;s reply&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.8&lt;/td&gt;&lt;td&gt;Mill ships; the warehouse does the GRN&lt;/td&gt;&lt;td&gt;Warehouse (Shravani, under Sreekanth: &amp;quot;she enters that inward… she does the GRN&amp;quot;)&lt;/td&gt;&lt;td&gt;Rolls arrive&lt;/td&gt;&lt;td&gt;Enigma GRN = a &lt;code&gt;fulfillment {id, amount, overseerId, purchaseProductId, createdAt, status}&lt;/code&gt; on the PO line — no GRN number, no invoice ref, no dye lot; the invoice matched by hand in the Fabric &amp;amp; Trims Deduction Tracker&lt;/td&gt;&lt;td&gt;Quantity received; the PO closes&lt;/td&gt;&lt;td&gt;Enigma screen; Excel row&lt;/td&gt;&lt;td&gt;Same day as arrival&lt;/td&gt;&lt;td&gt;Stock appears as physical; &lt;code&gt;saleable = physical − accountingStock − threshold&lt;/code&gt; (verified live 26 Aug); nobody is told automatically&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.9&lt;/td&gt;&lt;td&gt;Inward logged and swatches cut&lt;/td&gt;&lt;td&gt;One person logs the inward date; Yusuf cuts 25×25 cm swatches and posts images in the Slack channel (22 Sep); the memory of 22 Sep says warehouse, the 24 Sep note says the factory logs inward — &lt;strong&gt;open question&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Bulk received&lt;/td&gt;&lt;td&gt;&lt;em&gt;STO &amp;amp; Swatches Tracker.xlsx&lt;/em&gt; → &lt;code&gt;MTM_Swatches&lt;/code&gt; tab (119 columns, one data row in the copy we hold): &lt;code&gt;Sr No. · Date · Production Type (MTM, RTW, Kurta &amp;amp; Bot…) · Vendor Name · Fabric Dispatched date · Fabric Bulk Received date · Fabric Team handover date for swatches · Fabric code · Fabric Name · Category · Priority · Sticker Link · Types of Swatches · Status · Remarks · Expected sending Date · Revised Expected Shipping Date · Remark (Reqd / Not Reqd)&lt;/code&gt; then per destination &lt;code&gt;Tracking no. · Dispatch Date · Receiving Date&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Dates, priority (&amp;quot;Priority-1&amp;quot;), status free text&lt;/td&gt;&lt;td&gt;Sheet + Slack&lt;/td&gt;&lt;td&gt;See A5&lt;/td&gt;&lt;td&gt;Sticker made by hand; parcels to 34 destination columns&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.10&lt;/td&gt;&lt;td&gt;Designs (product codes) written against the fabric&lt;/td&gt;&lt;td&gt;Sourcing creates the designs (corrected 23 Sep); the design tools sheet is filled in parallel with swatch prep (22 Sep)&lt;/td&gt;&lt;td&gt;Cloth in&lt;/td&gt;&lt;td&gt;&lt;em&gt;Copy NEW Swatch Books Weekly Stock Update.xlsx&lt;/em&gt; → tab &lt;code&gt;Shirts-Core+NonCore ( MTM) fabr&lt;/code&gt;: &lt;code&gt;Range · Sr. No. · Fabric codes · Product Codes · Fabric Name · Design Name · Design Type · Type · MRP · Comments · Stock · Swatches to Stores · Website&lt;/code&gt; — several rows per fabric code, e.g. &lt;code&gt;NCFSPLO000-13 → BOMSH02CM01310 → Stretch Dobby - White → Stretch Dobby Shirt - White → Formal → Non Core → 2590&lt;/code&gt;; newer codes read &lt;code&gt;BOM-SHI-CU-497&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Product code, design name, design type (Formal/Casual), MRP; design tool attributes: preset/style, buzzwords, composition (22 Sep)&lt;/td&gt;&lt;td&gt;Excel rows&lt;/td&gt;&lt;td&gt;1–2 days (to confirm)&lt;/td&gt;&lt;td&gt;Marketing renames in the &lt;code&gt;REVISED NAME Shirts&lt;/code&gt; tab: &lt;code&gt;Fabric Code · Fabric Name · OLD Product Name · NEW Product Name · Price&lt;/code&gt; (e.g. &amp;quot;Grey Stone Houndstooth Shirt&amp;quot; → &amp;quot;Houndstooth Shirt - Light Grey&amp;quot;, 2990); product name and description reach Marketing 10–15 days before launch&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.11&lt;/td&gt;&lt;td&gt;Stores told and shown&lt;/td&gt;&lt;td&gt;Design / Merchandising&lt;/td&gt;&lt;td&gt;Swatches out&lt;/td&gt;&lt;td&gt;The weekly Excel published on Tuesday, view-only for stores (store visit 13–14 Aug); the &lt;code&gt;Stock · Swatches to Stores · Website&lt;/code&gt; columns carry free text such as &lt;code&gt;Live on 28/05/2026&lt;/code&gt;, &lt;code&gt;Live on POS 9/5/26&lt;/code&gt;, &lt;code&gt;SOLD OUT 28/7/26&lt;/code&gt;, &lt;code&gt;New Fabric / Display Swatch…&lt;/code&gt;, &lt;code&gt;need mrp&lt;/code&gt;, &lt;code&gt;Fabric exptd by 15th Aug&lt;/code&gt;, &lt;code&gt;Bulk Received 29/6/26&lt;/code&gt;, &lt;code&gt;Will go live once existin…&lt;/code&gt;; Slack swatch channel&lt;/td&gt;&lt;td&gt;Stock column; go-live dates typed as text&lt;/td&gt;&lt;td&gt;Excel + Slack&lt;/td&gt;&lt;td&gt;Weekly&lt;/td&gt;&lt;td&gt;Stores treat under 15 m (≈30–34 shirts) as low and mark it in their own notes&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.12&lt;/td&gt;&lt;td&gt;Fabric switched on in stores; online later&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;&amp;quot;Go live is design&amp;#39;s decision at any time, not gated on the steps&amp;quot; (22 Sep)&lt;/td&gt;&lt;td&gt;Enigma &lt;code&gt;isOnHold&lt;/code&gt; → false; inventory status NEW → IN_STOCK; Shopify stock push is the manual per-warehouse button &lt;em&gt;Sync Inventory For Custom Design&lt;/em&gt; (Sync Status blank on all 46 warehouses); the website pulls PDP attributes from Enigma (Shopify headless)&lt;/td&gt;&lt;td&gt;On-hold flag; sync button with no last-run stamp&lt;/td&gt;&lt;td&gt;Enigma + Shopify&lt;/td&gt;&lt;td&gt;Minutes; online follows ~2 weeks later after the swatch shoot, video and post-production (22 Sep) — &amp;quot;most MTM business is offline&amp;quot;&lt;/td&gt;&lt;td&gt;Store go-live and online go-live are separate tracks&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.13&lt;/td&gt;&lt;td&gt;Fabric runs out&lt;/td&gt;&lt;td&gt;Anyone who notices&lt;/td&gt;&lt;td&gt;A store cannot punch; a core mill says its stock is gone (Sourcing&amp;#39;s weekly supplier check)&lt;/td&gt;&lt;td&gt;Enigma inventory; non-core is switched off at the &lt;code&gt;Threshold&lt;/code&gt; (7 m domestic, 3–5 m expensive international) and flagged &amp;quot;unhealthy&amp;quot; at ~10–20 m to start sourcing a replacement (Kunal, 27 Aug); core: &amp;quot;design team marks it inactive&amp;quot; = &lt;code&gt;isOnHold&lt;/code&gt; true, back on when stock returns&lt;/td&gt;&lt;td&gt;isOnHold set after the fact&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;td&gt;Days between stock-out and switch-off, unmeasured&lt;/td&gt;&lt;td&gt;Store finds out from the customer&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Where it breaks. A1.3 has no expiry column in the block sheet and three copies of it, so holds lapse from memory and suppliers chase Sourcing. A1.5–A1.7 mean one fabric is typed into Enigma and the ordering sheet by the same person, with &lt;code&gt;Fabric Price&lt;/code&gt; left blank and &lt;code&gt;TAT&lt;/code&gt; at 0. A1.7&amp;#39;s PO carries no expected date. A1.9&amp;#39;s inward owner is contested (warehouse vs factory) and the tracker copy we hold is empty. A1.10 is typed a third time and renamed a fourth. A1.11 publishes availability a week late, so two stores can sell the last metres of the same fabric. A1.12&amp;#39;s Shopify sync is a button nobody logs pressing. A1.13 is after the fact.&lt;/p&gt;
&lt;p&gt;Sources: Sourcing call transcript &amp;amp; summary (6 Aug 2026); C1a MTM call transcript (27 Aug); Transcript of call (27 Jul); Tranbscript of granola recording (30–31 Jul); Invisit meeting contexts; Discovery Record v1.2 (18 Aug); Enigma Answers — Read From Live System (26 Aug); Discovery 4th sitting; store visit summaries (13–14 Aug); memory bsc-design-discovery-2026-09-22 and Granola notes &amp;quot;BSC - Design/Planning&amp;quot; (22 Sep); data-files Copy of Fabric ordering.xlsx, Copy NEW Swatch Books Weekly Stock Update.xlsx, STO &amp;amp; Swatches Tracker.xlsx.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;2-option-requests-and-swatch-books&quot;&gt;&lt;summary&gt;2. Option requests and swatch books&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;The real origin of most MTM non-core sourcing is a thin range: the swatch-book sheet carries the plan inside its range labels — &lt;code&gt;Houndstooth (6)&lt;/code&gt;, &lt;code&gt;Non-Core Structures (29)&lt;/code&gt;, &lt;code&gt;Core Checks (16)&lt;/code&gt; — and Kunal&amp;#39;s rule is that each range has &amp;quot;an ideal mix of numbers… stripes might be fifteen, checks something else&amp;quot; (27 Aug). Non-core is never replenished; a fabric under the &amp;quot;unhealthy&amp;quot; line (~10 m, set by hand, unchanged for about a year) is the trigger to source a new option before it hits the &lt;code&gt;Threshold&lt;/code&gt; and is switched off. There is no request record; the ask is a sentence in a meeting and a WhatsApp of swatch photos.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Trigger&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Hand-off&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A2.1&lt;/td&gt;&lt;td&gt;Design counts a range and finds it short&lt;/td&gt;&lt;td&gt;Design (Kunal, Janak); Yulette owned the review until her leave&lt;/td&gt;&lt;td&gt;Weekly review of the stock sheet; Monday stock update by Janak, low stock marked yellow (30 Jul)&lt;/td&gt;&lt;td&gt;&lt;code&gt;Shirts-Core+NonCore ( MTM) fabr&lt;/code&gt; tab, grouped by book and side: &lt;code&gt;DOUBLE BOOK - FORMAL SHIRTS - VOL.1&lt;/code&gt; (LEFT: Non-Core Structures (29); RIGHT: Houndstooth (6), Herringbone (4)) · &lt;code&gt;VOL.2&lt;/code&gt; (Core Checks (16), Non Core Checks (18); Bengal Stripes (5), Non Core Stripes (11)) · &lt;code&gt;SINGLE BOOK - PERFORMANCE SHIRTS&lt;/code&gt; (Wrinkle Free Bamboo (18), Luthai Wrinkle Free (16), Checks &amp;amp; Stripes (6)) · &lt;code&gt;CASUAL SHIRTS VOL.1&lt;/code&gt; (Washed Oxfords (7), Denims (4), Flannels (6), Oxford Stripes (6), Knits (5); Japanese (21)) · &lt;code&gt;CASUAL SHIRTS VOL.2&lt;/code&gt; (Non Core Prints (23)) · &lt;code&gt;LINEN SHIRTS&lt;/code&gt; (Linen Lyocell (25), 100% Linen (13), Cotton Linen (9)) · &lt;code&gt;BARUCHE&lt;/code&gt; (14). The &amp;quot;Total Fabrics- mtm&amp;quot; note counts 237 excluding bespoke (Solid Colours 147 × 2 books, Checks 30, Stripes Core 20, Prints 20, International 20) and lists Linen Lyocell (20), 100% Linen (9) — the two sources disagree on several counts and dates&lt;/td&gt;&lt;td&gt;Range label count vs active rows; &lt;code&gt;Stock&lt;/code&gt; in metres; healthy / unhealthy (&amp;lt;10 m) / sold out (≤ threshold)&lt;/td&gt;&lt;td&gt;Excel, physical book; the numbers in the labels are &amp;quot;just on our sheet… not system oriented&amp;quot;&lt;/td&gt;&lt;td&gt;Weekly at best; the healthy line changed &amp;quot;a year ago&amp;quot;&lt;/td&gt;&lt;td&gt;&amp;quot;We need ten winter shirts&amp;quot; said in the meeting; the &amp;quot;Fabric Merchant&amp;quot; sheet with ideal non-core mix promised by Kunal (27 Aug, not received)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A2.2&lt;/td&gt;&lt;td&gt;Sourcing scouts and puts options up&lt;/td&gt;&lt;td&gt;Sourcing (Sreekanth): &amp;quot;every week, once in a month, twice in a month, I keep showing them&amp;quot;&lt;/td&gt;&lt;td&gt;A2.1&lt;/td&gt;&lt;td&gt;Mill WhatsApp groups, swatch cards; options across solids, plain weave, dobby, structures, checks, stripes&lt;/td&gt;&lt;td&gt;Per option: mill, article, composition, width, price, MOQ, lead; roughly five blocked per selection&lt;/td&gt;&lt;td&gt;WhatsApp photos; cards couriered&lt;/td&gt;&lt;td&gt;1–3 weeks (to confirm)&lt;/td&gt;&lt;td&gt;Shown to design in a sitting&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A2.3&lt;/td&gt;&lt;td&gt;Design decides per option: yes, no, or wait&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Swatch cards in hand&lt;/td&gt;&lt;td&gt;Nothing written for a &amp;quot;no&amp;quot; (Question Bank Q46: rejected options vanish); a &amp;quot;yes&amp;quot; becomes an email/WhatsApp block (A1.3)&lt;/td&gt;&lt;td&gt;Which options, why&lt;/td&gt;&lt;td&gt;Email to the mill per chosen option&lt;/td&gt;&lt;td&gt;Same day to weeks; &amp;quot;there is a certain period of time… suppliers put pressure on me&amp;quot;&lt;/td&gt;&lt;td&gt;Sourcing blocks the chosen ones&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A2.4&lt;/td&gt;&lt;td&gt;Extensions&lt;/td&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;A hold about to run out&lt;/td&gt;&lt;td&gt;Mill email / WhatsApp&lt;/td&gt;&lt;td&gt;New hold-until&lt;/td&gt;&lt;td&gt;Message&lt;/td&gt;&lt;td&gt;Ad hoc&lt;/td&gt;&lt;td&gt;Nobody records the new date; the block sheet has &lt;code&gt;Qty Reserved&lt;/code&gt; but no date column&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A2.5&lt;/td&gt;&lt;td&gt;PO per chosen option&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;A2.3 yes&lt;/td&gt;&lt;td&gt;Enigma Fabric PO + a row in the Fabric Ordering sheet&lt;/td&gt;&lt;td&gt;As A1.7&lt;/td&gt;&lt;td&gt;Enigma + sheet&lt;/td&gt;&lt;td&gt;20–30 days after selection for design, tech pack and costing (Sreekanth)&lt;/td&gt;&lt;td&gt;Each option then runs A1.8 onward as its own fabric&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Where it breaks. No record of the ask means no count of how many of the ten are settled or how many were dropped. Options wait for design while holds expire, and the expiry is not written anywhere. The plan per range is in a label, not a number anyone computes, and the two lists of ranges (sheet labels vs the &amp;quot;Total Fabrics&amp;quot; note) do not agree. The unhealthy line (10 m) and threshold (7 m) are typed once and left.&lt;/p&gt;
&lt;p&gt;Sources: C1a MTM call transcript &amp;amp; summary (27 Aug 2026); Sourcing call transcript (6 Aug); Tranbscript of granola recording (30 Jul); Question Bank Q44–Q46, Q64–Q65; Total Fabrics- mtm.md; Copy NEW Swatch Books Weekly Stock Update.xlsx; Copy of Fabric ordering.xlsx (Blocked tab); memory bsc-design-discovery-2026-09-22.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;3-rtw-style-requirement-to-launch&quot;&gt;&lt;summary&gt;3. RTW style, requirement to launch&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;An RTW style takes 90 to 120 days from the planning number to a store shelf (Neha, 30 Jul 2026: &amp;quot;it could be 90 days, it could be 120&amp;quot;); Sreekanth puts raw material to finished product at ~90 days (6 Aug), and the design team said the bulk is &amp;quot;ready in ~45 days&amp;quot; once the factory has cloth and a go-ahead (22 Sep). Planning works three months ahead (in August it was giving sourcing the November number). The style crosses at least six sheets (Option Count Summary, ROS &amp;amp; Health / the Concise workbook, Merchandise Master, block sheet in three copies, the production tracker, Monthly Drops) and two systems (Enigma, Shopify) that nobody links; the only identifiers that survive end to end are the Enigma design code (&lt;code&gt;BOM-SHI-RE-6797-OLIVE-36&lt;/code&gt;) and the Shiphero Style Name.&lt;/p&gt;

weight is sitting in one or two sizes&amp;quot;). Gap = ideal − healthy − in production; buffer &amp;quot;+3&amp;quot; has &amp;quot;no rationale&amp;quot; (Yulette) — it covers vendor rejections and short fabric&lt;/td&gt;&lt;td&gt;Excel; the result is told to design in a meeting and by email&lt;/td&gt;&lt;td&gt;Half a day per sub-category, monthly&lt;/td&gt;&lt;td&gt;&amp;quot;Source 7 options for formal checks&amp;quot;, &amp;quot;we need 5,000 chinos&amp;quot; (Sreekanth: planning tells him &amp;quot;10,000 pieces, start sourcing&amp;quot;)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.2&lt;/td&gt;&lt;td&gt;Design and sourcing pick the fabrics from what vendors have&lt;/td&gt;&lt;td&gt;Design — Kunal Duhar (head of design), Janak (master data); Sourcing — Sreekanth Mamidi&lt;/td&gt;&lt;td&gt;A3.1&lt;/td&gt;&lt;td&gt;Swatches the vendors bring; &amp;quot;we are at the mercy of what quantity is available at the vendor — no fabric is produced for our requirement&amp;quot; (Charanjeet). The Merchandise Master row is opened at this point: S NO · SWATCH IMAGE · Fabric code · Product Code SKU · TEMPORARY PRODUCT NAME · FINAL PRODUCT NAME · Inventory Type · CATEGORY · PRODUCT TYPE (READY_TO_WEAR · SEMI_STITCHED · HEMMING) · FABRIC VENDOR · Occassion · TAT · MILL · VENDOR CODE NUMBER · Mill Country · CPM · MOQ · Washcare · Color · Stretch · Consumed in · Construction · COMPOSITION · COMPOSITION FAMILY · Weave · Weight Class · Weight (OZ) · Pattern · Size Variant · Product Vendor · Wrong Fabric code · Wrong Product Code · MRP · Shoot Status · Trim Card · Width · BUTTON · POCKETING · WASHCARE · WASHCARE INSTRUCTIONS (Jackets add Teckpack, lining, piping, padding)&lt;/td&gt;&lt;td&gt;Fabric article, composition, width, count, price (Sreekanth gives these &amp;quot;verbally and by mail&amp;quot;); the same product is then typed 3–5 times (fabric sheet, merchandise master, Enigma, Shopify, marketing sheet)&lt;/td&gt;&lt;td&gt;Excel row + WhatsApp + email&lt;/td&gt;&lt;td&gt;1–3 days; a &amp;quot;collective decision&amp;quot;&lt;/td&gt;&lt;td&gt;Sourcing blocks the chosen cloth&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.3&lt;/td&gt;&lt;td&gt;Sourcing blocks the cloth at the mill&lt;/td&gt;&lt;td&gt;Sourcing (Sreekanth); the block sheet is Janak&amp;#39;s Google Sheet, kept in three copies&lt;/td&gt;&lt;td&gt;A3.2&lt;/td&gt;&lt;td&gt;Email or WhatsApp to the supplier (&amp;quot;this has been shortlisted, so-and-so quantities, please hold&amp;quot;); no money moves&lt;/td&gt;&lt;td&gt;Article, metres, block period (2–5 months depending on the vendor; the mill can still sell it), reminder date&lt;/td&gt;&lt;td&gt;Messages; the block sheet&lt;/td&gt;&lt;td&gt;Same day; the block must survive the 20–30 days of tech pack, costing and factory booking before a PO can go (&amp;quot;post blocking also takes almost 25 days&amp;quot; — Sreekanth)&lt;/td&gt;&lt;td&gt;Blocks expire from memory; the supplier &amp;quot;puts pressure on me that since we have blocked, now you have to pick up this fabric&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.4&lt;/td&gt;&lt;td&gt;Design creates the fabric datasheet and raises the Fabric PO in Enigma&lt;/td&gt;&lt;td&gt;Design (creates the datasheet — Enigma auto-generates the fabric code — and &amp;quot;creates and releases the PO&amp;quot;); Sourcing must first create the vendor in Enigma&amp;#39;s supplier database or the PO cannot be issued; Kunal approves international buys&lt;/td&gt;&lt;td&gt;A3.3&lt;/td&gt;&lt;td&gt;Enigma Fabric Module (Fabrics · Fabric Inventory · Fabric PO): PO header &lt;code&gt;poType FABRIC&lt;/code&gt;, &lt;code&gt;status DRAFT · Open · Cancelled · Close&lt;/code&gt; (DRAFT unused in the last 1,000), &lt;code&gt;noteForVendor&lt;/code&gt;, &lt;code&gt;estimatedArrivalDate&lt;/code&gt; (null everywhere); vendor master has no lead time, currency, terms or MOQ — MOQ (~200) is a fabric attribute&lt;/td&gt;&lt;td&gt;Metres = consumption × pieces, at least the vendor MOQ; CPM; Consumed_In (Meter or Kilogram)&lt;/td&gt;&lt;td&gt;Enigma + the Merchandise Master row&lt;/td&gt;&lt;td&gt;1 day. Who raises the PO has three different answers across discovery (open question 5 in the Discovery Record)&lt;/td&gt;&lt;td&gt;Sreekanth tells the factory &amp;quot;this month the fabric is coming, plan your production&amp;quot; so it pre-sources pocketing, buttons, labels, zippers&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.5&lt;/td&gt;&lt;td&gt;Planning gives the size ratio and total pieces; production allocates the factory&lt;/td&gt;&lt;td&gt;Planning (Charanjeet: &amp;quot;I give a ratio for these shortlisted fabrics&amp;quot;); Production (Parag Mathkari) contacts the vendor&lt;/td&gt;&lt;td&gt;A3.4&lt;/td&gt;&lt;td&gt;Sales export filtered for the sub-category or fit (relaxed / classic / oversized) over &amp;quot;three months, six months, whatever — no hard and fast rule&amp;quot;; display pieces taken off the top first (336 pcs − 36 display pieces, one per store, ordered in size M &amp;quot;because it hangs well and sells the most&amp;quot;); % per size × remaining, then &amp;quot;slight tweaking … some gut feeling&amp;quot;. Colour-wise ratios only for chinos. The email to production carries SKU, quantity, size ratio, delivery requirement&lt;/td&gt;&lt;td&gt;Per-size pieces (28–50 for bottoms, 36–46/XS–4XL for tops as the ROS report has them); factory name; wanted-by date&lt;/td&gt;&lt;td&gt;Excel; email&lt;/td&gt;&lt;td&gt;1–2 days&lt;/td&gt;&lt;td&gt;No PO number for the garment until the job card; the factory later &amp;quot;complains fabric jada hai, kam hai&amp;quot; and the ratio is changed. Parag wants but does not have: capacity committed per vendor per category, booked vs left per month, a micro TNA per PO&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.6&lt;/td&gt;&lt;td&gt;Style sheet, BOM and job card made by hand&lt;/td&gt;&lt;td&gt;Design (&amp;quot;Kunal&amp;#39;s team will give the tech pack and BOM&amp;quot;); Production issues the job card&lt;/td&gt;&lt;td&gt;A3.5&lt;/td&gt;&lt;td&gt;Word/Excel templates per style; physical trim cards still couriered because &amp;quot;digital documentation is incomplete&amp;quot; (4th sitting); the tracker&amp;#39;s &amp;quot;BOM / job card&amp;quot; column carries the number&lt;/td&gt;&lt;td&gt;Construction details, BOM lines (fabric, interlining, buttons, pocketing, labels, packaging per the Trims Working columns: Compostable inner Bag · Courier Bag · Packaging Box · Paper Bag · Flasher · Denim Bag · Outer Hanger Bag · Outer Hanger · Additional Consumable), size breakup, job card number&lt;/td&gt;&lt;td&gt;Paper + PDF + email&lt;/td&gt;&lt;td&gt;1–2 days per style; &amp;quot;factories rarely look at shared sheets; communication defaults to email&amp;quot;&lt;/td&gt;&lt;td&gt;Sent to the factory with the cloth; a new style may get a personal sample made from separately bought yardage&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.7&lt;/td&gt;&lt;td&gt;Factory makes the samples&lt;/td&gt;&lt;td&gt;Factory merchandiser&lt;/td&gt;&lt;td&gt;A3.6&lt;/td&gt;&lt;td&gt;WhatsApp photos and email; sample types named: trial, fit, PP (pre-production), shipment approval (4th sitting); design&amp;#39;s own words on 22 Sep: photo sample, then PP sample&lt;/td&gt;&lt;td&gt;Round, comments by area (construction, fit, wash, hand-feel), decision&lt;/td&gt;&lt;td&gt;Photos, voice notes, email&lt;/td&gt;&lt;td&gt;7–14 days a round (to confirm — no dated record exists)&lt;/td&gt;&lt;td&gt;&amp;quot;PP sample comments are emailed to factory; no versioning or structured review trail&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.8&lt;/td&gt;&lt;td&gt;RQC approves or sends back&lt;/td&gt;&lt;td&gt;RQC / Production (who &amp;quot;RQC&amp;quot; is — a person, a team, or the production unit&amp;#39;s QC — to confirm; the term is design&amp;#39;s, 22 Sep)&lt;/td&gt;&lt;td&gt;A3.7&lt;/td&gt;&lt;td&gt;Nothing structured; the decision is a message&lt;/td&gt;&lt;td&gt;Approved / resubmit, comments&lt;/td&gt;&lt;td&gt;WhatsApp / email&lt;/td&gt;&lt;td&gt;1–3 days&lt;/td&gt;&lt;td&gt;PP go-ahead by message; dates matter &amp;quot;because they directly affect production timelines&amp;quot; and are not kept&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.9&lt;/td&gt;&lt;td&gt;Materials received centrally, checked, issued&lt;/td&gt;&lt;td&gt;Warehouse (Shravani&amp;#39;s team, under Sreekanth) for cloth; Sourcing for trims and packaging (&amp;quot;either I source or I help the factory source&amp;quot;)&lt;/td&gt;&lt;td&gt;Cloth and trims arrive&lt;/td&gt;&lt;td&gt;Enigma GRN (a PO &amp;quot;fulfillment&amp;quot; row: id, amount, overseerId, purchaseProductId, createdAt, status — no GRN number, no invoice reference, no dye lot); Fabric &amp;amp; Trims Deduction Tracker (Sl. No · Vendor · Date · Invoice No. · PO Reference No. · Fabric / Consumables · Net Amt · GST · Total Value · Status &amp;quot;Deducted&amp;quot; · Remarks &amp;quot;BOM-123 / cheque #&amp;quot;); Enigma manual adjustment reason 8 &amp;quot;Fabric issued for RTW&amp;quot;&lt;/td&gt;&lt;td&gt;Received on, checked ok/fail (not recorded), issued on, invoice&lt;/td&gt;&lt;td&gt;Enigma + Excel&lt;/td&gt;&lt;td&gt;Days&lt;/td&gt;&lt;td&gt;Cloth goes to the factory by vehicle; &amp;quot;fabric reaching the vendor&amp;quot; is not tracked (3rd sitting)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.10&lt;/td&gt;&lt;td&gt;Bulk production tracked&lt;/td&gt;&lt;td&gt;Production (Parag) and the factory merchandisers (Nitin Singh, Abhin M, Bhupendra)&lt;/td&gt;&lt;td&gt;A3.9&lt;/td&gt;&lt;td&gt;Parag&amp;#39;s WIP tracker (Production Tracker Final V2.xlsx — see A11); the Concise workbook copies its &amp;quot;PO Status · Vendor(s) · Total Order Qty · Total Recd Qty · Incoming Qty · Latest Expected/Status&amp;quot; columns from it; Monthly Drops &amp;quot;Production Status&amp;quot;&lt;/td&gt;&lt;td&gt;Milestone dates plan / revised / actual; expected date&lt;/td&gt;&lt;td&gt;Excel, re-dated weekly by phone; statuses
