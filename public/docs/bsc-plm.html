me&lt;/td&gt;&lt;td&gt;critical · 850&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;orqo-{reqId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;sourcing&lt;/td&gt;&lt;td&gt;A request with &lt;code&gt;open&lt;/code&gt; slots, raised ≥ 3 days ago (one line per request)&lt;/td&gt;&lt;td&gt;&amp;quot;{REQ} · {category} — sourcing to add vendors on {n} option(s)&amp;quot; / &amp;quot;option(s) {indexes} · asked {n}d ago[ · live by {liveBy}]&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/design?open={reqId}&amp;amp;slot={firstOpen}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warn · 480 + days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;cfo-{conceptId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;design&lt;/td&gt;&lt;td&gt;Concept with offers sent and no fabric chosen&lt;/td&gt;&lt;td&gt;&amp;quot;{concept} · {n} mill(s) quoted — choose the cloth&amp;quot; / &amp;quot;from ₹{first buy} for the first buy&amp;quot; or &amp;quot;priced&amp;quot;, then &amp;quot; · a hold lapsed {n}d ago&amp;quot; or &amp;quot; · first hold lapses in {n}d&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/design?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;critical if ≤ 5 d else warn · 820 − holdDays&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;cn-{conceptId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;design&lt;/td&gt;&lt;td&gt;A PP or shipment round with the production unit for &amp;gt; 5 days&lt;/td&gt;&lt;td&gt;&amp;quot;{concept} · sample waiting on you&amp;quot; / &amp;quot;{n} days on the desk&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/design?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warn if &amp;gt; 10 d else info · 500 + days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;lnb-{launchId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;planning&lt;/td&gt;&lt;td&gt;Marketing brief due (launch − 10 d) passed, not sent&lt;/td&gt;&lt;td&gt;&amp;quot;{style} · marketing brief late&amp;quot; / &amp;quot;the Shopify listing is blocked until the name is sent&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/launches?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warn · 700&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;lnl-{launchId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;planning&lt;/td&gt;&lt;td&gt;Launch date passed, not launched&lt;/td&gt;&lt;td&gt;&amp;quot;{style} · launch date passed&amp;quot; / &amp;quot;{n}d past the date, not made live&amp;quot;&lt;/td&gt;&lt;td&gt;same&lt;/td&gt;&lt;td&gt;critical · 950&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;opt-{optionId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;planning&lt;/td&gt;&lt;td&gt;Core option with ≥ 1 size at zero (worst 10)&lt;/td&gt;&lt;td&gt;&amp;quot;{style} · core, {n} size(s) out&amp;quot; / &amp;quot;{ros} a week and nothing in those sizes to sell&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/health?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warn if ≥ 2 sizes else info · 600 + 10 × sizes&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;dmd-{optionId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;planning&lt;/td&gt;&lt;td&gt;≥ 2 store asks for one option (top 8)&lt;/td&gt;&lt;td&gt;&amp;quot;{style} · {n} stores have asked for it&amp;quot; / &amp;quot;sizes {list} · [{k} still unanswered — ]the shelf that should hold it does not&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/health?open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warn if unanswered else info · 680 + 5 × asks&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;ret-{caseId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;store (own store)&lt;/td&gt;&lt;td&gt;Open case past its SLA (10 d)&lt;/td&gt;&lt;td&gt;&amp;quot;{case no.} · {style}&amp;quot; / &amp;quot;{n}d open against a {sla}d promise · {status label}&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/stores?tab=returns&amp;amp;open={id}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warn · 650&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;inb&lt;/code&gt;&lt;/td&gt;&lt;td&gt;store&lt;/td&gt;&lt;td&gt;Parcels (sto / mtm / rtw) on the way, not counted in&lt;/td&gt;&lt;td&gt;&amp;quot;{n} parcel(s) to count in&amp;quot; / &amp;quot;arrived from the unit and not yet counted — until they are, the shelf and the system disagree&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/stores?tab=inward&lt;/code&gt;&lt;/td&gt;&lt;td&gt;info · 400&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;req-{requestId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;store (the store that has it)&lt;/td&gt;&lt;td&gt;A stock ask in &lt;code&gt;requested&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;{style} · {size} asked for&amp;quot; / &amp;quot;another store needs it — accept, ship or decline&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/stores?tab=requests&lt;/code&gt;&lt;/td&gt;&lt;td&gt;info · 350&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;ref-{caseId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;finance&lt;/td&gt;&lt;td&gt;A refund requested and not moved&lt;/td&gt;&lt;td&gt;&amp;quot;{case no.} · refund to move&amp;quot; / &amp;quot;₹{amount} · asked {n}d ago&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/refunds&lt;/code&gt; — no such route exists; it redirects home (not in the model yet — to build)&lt;/td&gt;&lt;td&gt;warn if &amp;gt; 2 d else info · 620&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;grn&lt;/code&gt;&lt;/td&gt;&lt;td&gt;finance&lt;/td&gt;&lt;td&gt;GRNs without &lt;code&gt;financeSeenOn&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&amp;quot;{n} goods-received note(s) to pick up&amp;quot; / &amp;quot;each one with its PO attached, for GST filing and reconciliation&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/grn&lt;/code&gt;&lt;/td&gt;&lt;td&gt;info · 380&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;sto-{transferId}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warehouse&lt;/td&gt;&lt;td&gt;STO shipped &amp;gt; 7 days ago, not closed (first 8)&lt;/td&gt;&lt;td&gt;&amp;quot;{STO no.} · open {n}d&amp;quot; / &amp;quot;{qty} pcs shipped and never counted in — this is the gap ghost stock lives in&amp;quot;&lt;/td&gt;&lt;td&gt;&lt;code&gt;#/warehouse&lt;/code&gt;&lt;/td&gt;&lt;td&gt;warn · 560&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Post-processing: any design or planning line whose href starts with &lt;code&gt;#/concepts&lt;/code&gt;, &lt;code&gt;#/requirements&lt;/code&gt; or &lt;code&gt;#/requests&lt;/code&gt; is rewritten to &lt;code&gt;#/design?open=&lt;/code&gt;. The &amp;quot;Messages&amp;quot; pane is &lt;code&gt;mentionsFor&lt;/code&gt; — every comment that @mentions the person or their role, newest first, with a resolved flag per person.&lt;/p&gt;
&lt;p&gt;Rules the earlier text listed that the model does not compute (to build): &amp;quot;new ask · find a vendor&amp;quot; on day 0 (the model waits 3 days), reminders at 5 and 2 days before a hold lapses (the model shows one line whose level changes), &amp;quot;send the PO to the mill&amp;quot; after Push PO, &amp;quot;cloth coming&amp;quot; for the warehouse, &amp;quot;cloth in&amp;quot; for design, &amp;quot;swatches on the way&amp;quot; for the store, &amp;quot;designs to name and price&amp;quot;, &amp;quot;PP go-ahead overdue&amp;quot; (3 days), &amp;quot;materials failed check&amp;quot;, &amp;quot;milestone slipped&amp;quot;, &amp;quot;piece missed the vehicle / turned back&amp;quot; for the merchandiser, &amp;quot;put it in a drop&amp;quot;, &amp;quot;display pieces to allocate / confirm display received&amp;quot;, &amp;quot;reorder point crossed · international&amp;quot; (the fabric master shows it as a pill and button instead), &amp;quot;mill says out · still on sale&amp;quot; (a Note on the fabric record), &amp;quot;book short of plan&amp;quot; (a tile on Swatch books), URGENT REPLENISH / SIZE FILL / REINTRODUCE (the Stock health intent filter), &amp;quot;case waiting on you&amp;quot; for production / warehouse / finance, &amp;quot;STO arrived, not counted in&amp;quot; for the store at 24 h, &amp;quot;extra fabric to approve / to send&amp;quot;, &amp;quot;sheet changed · read it / tell the factory&amp;quot; (the Changed sheets tab and My factory&amp;#39;s Changes tab carry these as counts), grouping by rule above 20 lines, per-line age (the pane shows it).&lt;/p&gt;
&lt;p&gt;Sources: &lt;code&gt;src/domain/engines.ts&lt;/code&gt; (&lt;code&gt;alertsFor&lt;/code&gt;, &lt;code&gt;mentionsFor&lt;/code&gt;, &lt;code&gt;demandFromStores&lt;/code&gt;, &lt;code&gt;returnStatusOf&lt;/code&gt;, &lt;code&gt;storeInboundOf&lt;/code&gt;); &lt;code&gt;src/screens/Mentions.tsx&lt;/code&gt; (&lt;code&gt;MentionBar&lt;/code&gt;: &lt;code&gt;todo = alertsFor(db, myRole, { storeId, all: false })&lt;/code&gt;, panes &amp;quot;To act on&amp;quot; and &amp;quot;Messages&amp;quot;); &lt;code&gt;src/App.tsx&lt;/code&gt; (no &lt;code&gt;/refunds&lt;/code&gt; route).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;integrations&quot;&gt;&lt;summary&gt;Integrations&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Enigma is read, and written only where the API is confirmed; everything else is recorded on the record and printed from it. The working model has no live integration at all: it runs on a seeded database in the browser (&lt;code&gt;realdata.ts&lt;/code&gt; generated from the data files, &lt;code&gt;seed.ts&lt;/code&gt; for the rest), files in IndexedDB, exports to &lt;code&gt;.xlsx&lt;/code&gt;, and &lt;code&gt;window.print&lt;/code&gt;. Each row below says what the model stands in with today.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;System&lt;/th&gt;&lt;th&gt;Read&lt;/th&gt;&lt;th&gt;Write&lt;/th&gt;&lt;th&gt;Only recorded (a person does it there)&lt;/th&gt;&lt;th&gt;Model today / notes&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Enigma — Fabric master (&lt;code&gt;/fabric/v2/…&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Code, name, category, inventoryType, vendor, vendorCode, isOnHold, isAutoPo, attributes (Swatch Book, Composition family, Big-Checked, Mill Country, Minimum order quantity, Cost per Unit, Consumed_In, Panna, Thread Count, Weave, Pattern …)&lt;/td&gt;&lt;td&gt;&lt;code&gt;isOnHold&lt;/code&gt; on pause / resume / supplier switch-off, if granted&lt;/td&gt;&lt;td&gt;Datasheet creation, attribute edits (&lt;code&gt;enigma.configuredOn&lt;/code&gt;, &lt;code&gt;ConceptDesign.enigmaOn&lt;/code&gt; are recorded, not replicated)&lt;/td&gt;&lt;td&gt;&lt;code&gt;Fabric&lt;/code&gt; rows seeded; a new cloth gets a stand-in code (&lt;code&gt;NO…-16nn&lt;/code&gt;) until Enigma mints one. Full read is one 3.2 MB call; only &lt;code&gt;CREATED_ON&lt;/code&gt; is filterable; no &lt;code&gt;updatedAfter&lt;/code&gt;; poll nightly plus on demand (not in the model yet — to build)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Enigma — Fabric Inventory&lt;/td&gt;&lt;td&gt;physical, accounting (reserved), threshold, stored saleable per warehouse&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Threshold edits&lt;/td&gt;&lt;td&gt;&lt;code&gt;stockMetres / reservedMetres / thresholdMetres&lt;/code&gt;; the tool recomputes saleable and uses Enigma&amp;#39;s as a cross-check (it drifts)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Enigma — Ledger (&lt;code&gt;/inventory/deductionReport&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Every movement with &lt;code&gt;stockBalance&lt;/code&gt;, &lt;code&gt;orderProductId&lt;/code&gt;, &lt;code&gt;quantity&lt;/code&gt;, &lt;code&gt;purposeType&lt;/code&gt;, reason&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;code&gt;weeklySalesShirts&lt;/code&gt; (12 weeks), &lt;code&gt;consumptionM&lt;/code&gt;; the source of ROS and consumption. Needs a &lt;code&gt;sku&lt;/code&gt; per call — the date/id range is Phase 0 ask N10&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Enigma — Fabric PO (&lt;code&gt;/purchase_order/v2&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Number, status (DRAFT / Open / Cancelled / Close), vendor, metres, &lt;code&gt;createdAt&lt;/code&gt;, &lt;code&gt;overseerId&lt;/code&gt; (&amp;quot;1&amp;quot; = auto batch)&lt;/td&gt;&lt;td&gt;Create as DRAFT then Open, if granted&lt;/td&gt;&lt;td&gt;Raising the PO in Enigma; the tool records the number&lt;/td&gt;&lt;td&gt;&lt;code&gt;FabricPo&lt;/code&gt; with `source: &amp;#39;auto&amp;#39;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Enigma — Orders and order sheet (&lt;code&gt;/order-module/…&lt;/code&gt;, E1 Ordersheet)&lt;/td&gt;&lt;td&gt;Order lines, 59 states, &lt;code&gt;statusHistory&lt;/code&gt;, sheet fields, ship-by, &lt;code&gt;qrCodeUrl&lt;/code&gt;, sizing fields&lt;/td&gt;&lt;td&gt;Order-sheet corrections via the Alterations module, if granted&lt;/td&gt;&lt;td&gt;Punching the order (Shopify + Enigma)&lt;/td&gt;&lt;td&gt;&lt;code&gt;CustomerOrder&lt;/code&gt; mirrors the sheet (&lt;code&gt;spec&lt;/code&gt;, &lt;code&gt;measurements&lt;/code&gt;, &lt;code&gt;pattern&lt;/code&gt;) and logs &lt;code&gt;revisions&lt;/code&gt;; stages map to Enigma&amp;#39;s scans (&lt;code&gt;MTM_STAGES[].scan&lt;/code&gt;); bill number is the tool&amp;#39;s&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Enigma — Vendors, Warehouses, Sizing&lt;/td&gt;&lt;td&gt;Vendor list (no lead time / MOQ / terms), store and warehouse ids, size sets (&lt;code&gt;/sizing/v4/…&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Vendor creation&lt;/td&gt;&lt;td&gt;&lt;code&gt;Vendor&lt;/code&gt; seeded with &lt;code&gt;leadDays&lt;/code&gt;, &lt;code&gt;moq&lt;/code&gt;, &lt;code&gt;blockWindowDays&lt;/code&gt; typed; &lt;code&gt;SIZE_SETS&lt;/code&gt; per category (to confirm against Sizing)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Enigma — GRN (PO fulfillments), STO (&lt;code&gt;/stock-transfer/*&lt;/code&gt;, 403 today)&lt;/td&gt;&lt;td&gt;GRNs (no number, no invoice), STO status&lt;/td&gt;&lt;td&gt;GRN and STO creation, if granted&lt;/td&gt;&lt;td&gt;Else keyed in Enigma; the tool records the number&lt;/td&gt;&lt;td&gt;&lt;code&gt;Grn&lt;/code&gt; minted per inward (&lt;code&gt;GRN-26-nnnn&lt;/code&gt;); &lt;code&gt;StockTransfer&lt;/code&gt; seeded from the tracker; STO read-back blocked on RBAC&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Enigma — RTW variants (&lt;code&gt;/design/list-variants-with-inventory&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Variant stock per warehouse (&lt;code&gt;variantSkuCode&lt;/code&gt; BOM-SHI-RE-6797-OLIVE-36)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;code&gt;RtwOption.stockBySize&lt;/code&gt; is the total; per-store split is &lt;code&gt;storeStockOf&lt;/code&gt; (a stable hash) until this is read (to build)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Shopify&lt;/td&gt;&lt;td&gt;Sales by product code (what is selling), customer profile by name&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Listing, price, the manual stock-push button&lt;/td&gt;&lt;td&gt;Insights runs on seeded weekly sales (&lt;code&gt;realanalytics.ts&lt;/code&gt;); &lt;code&gt;ConceptDesign.code&lt;/code&gt; is the join; metafield mapping to confirm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ShipHero&lt;/td&gt;&lt;td&gt;Finished-piece stock by location (15 of 50 stores)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Picks&lt;/td&gt;&lt;td&gt;Replaces &lt;code&gt;storeStockOf&lt;/code&gt; where mapped (to build)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Mill stock lists (email / WhatsApp)&lt;/td&gt;&lt;td&gt;Article · metres · price&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;code&gt;importMillSheet&lt;/code&gt; (paste, one line per fabric), &lt;code&gt;saveMillStock&lt;/code&gt;, &lt;code&gt;reportMillStock&lt;/code&gt; — the &amp;quot;five emails a morning&amp;quot; typed once&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Email&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Optional: the PO to the mill, the FOB nomination, the launch PDF, the approval, from the record with the date stamped&lt;/td&gt;&lt;td&gt;Today recorded as &amp;quot;emailed on&amp;quot; (&lt;code&gt;fobNomination.emailedOn&lt;/code&gt;, &lt;code&gt;coreBlock.via&lt;/code&gt;, &lt;code&gt;Block.via&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Decide per flow (to build)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Slack / WhatsApp&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Optional: post the bell line to a channel&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Never the record of truth; the model replaces the threads with &lt;code&gt;Thread&lt;/code&gt; + @mentions&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Print&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Sticker page (one box per design), outbound cut sheet, the factory&amp;#39;s day&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;code&gt;window.print()&lt;/code&gt;; job card, style sheet, BOM, GRN, round-trip slip on screen only (print styles to build)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Export&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;code&gt;.xlsx&lt;/code&gt; of any visible list (&lt;code&gt;downloadXlsx&lt;/code&gt;): fabric-sourcing, rtw-production-tracker, hemming-bench, rtw-stock-health, otif-by-factory, otif-by-order, products-on-sale, dsr, stylist-kpi&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Built&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sheets (import once)&lt;/td&gt;&lt;td&gt;Fabric ordering, Merchandise Master, REVISED NAME, STO &amp;amp; Swatches Tracker, Monthly Drops, Option Count, ROS &amp;amp; Health / RTW_Shirts_Concise, Replenishment, Trims Working, COGS, Product Weekly Report&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;code&gt;realdata.ts&lt;/code&gt; is the generated seed from these files; one-time import of open items at go-live; sheets kept in parallel one month&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Enigma technical notes for the integration. OAuth2 bearer via &lt;code&gt;/oauth/token&lt;/code&gt; with refresh; versioned paths (&lt;code&gt;/fabric/v2/…&lt;/code&gt;, &lt;code&gt;/purchase_order/v2&lt;/code&gt;, &lt;code&gt;/sizing/v3|v4/…&lt;/code&gt;); three timestamp formats in one API (ISO+0000; epoch ms including &lt;code&gt;createdAtIstTime&lt;/code&gt;, which is not IST; naive local ISO with microseconds on fulfillments); numeric attributes typed STRING; money carries float artefacts (₹16043.499999999998); soft delete via &lt;code&gt;active&lt;/code&gt;, &lt;code&gt;isOnHold&lt;/code&gt;, &lt;code&gt;isDeleted&lt;/code&gt;, fulfillment &lt;code&gt;status&lt;/code&gt;; audit uneven (fabric master returns none; &lt;code&gt;purchaseOrderHistoryList&lt;/code&gt; empty); RBAC gates every module (36 of 115 on the discovery account; 403 on stock transfers, bin master, store master, ShipHero orders, allocation engine, location history, notification logs); a &lt;code&gt;webhook&lt;/code&gt; module exists with CRUD but no screen; no sandbox; DRAFT PO status exists but 0 of the last 1,000 used it.&lt;/p&gt;
&lt;p&gt;Phase 0 checkpoints. A dedicated read-only service account with the seven blocked modules; &lt;code&gt;updatedAfter&lt;/code&gt; on fabric / order / inventory lists (N9); date or id range on the ledger (N10); write scope per module; the five human answers (auto-PO quantity rule and whether 08:00 / 15:00 are one job; why 430 of 541 core fabrics have auto-PO off and what the run does with 1,762 vendor-less fabrics; what releases a reservation on cancel / QC-fail; which of the 59 states are final per factory; whether trims exist in Enigma and whether a non-production environment exists).&lt;/p&gt;
&lt;p&gt;Sources: &lt;code&gt;docs/Enigma Answers — Read From Live System (26 Aug 2026).md&lt;/code&gt;; &lt;code&gt;docs/Enigma Questions — Answered, house format (26 Aug 2026).md&lt;/code&gt;; &lt;code&gt;docs/Enigma Questions — for the Enigma team (25 Aug 2026).md&lt;/code&gt;; &lt;code&gt;src/domain/engines.ts&lt;/code&gt; (&lt;code&gt;storeStockOf&lt;/code&gt;, &lt;code&gt;importMillSheet&lt;/code&gt; parsing in &lt;code&gt;src/store.ts&lt;/code&gt;); &lt;code&gt;src/domain/files.ts&lt;/code&gt; (IndexedDB); &lt;code&gt;src/ui.tsx&lt;/code&gt; (&lt;code&gt;downloadXlsx&lt;/code&gt;, &lt;code&gt;ExportButton&lt;/code&gt;); &lt;code&gt;src/domain/realdata.ts&lt;/code&gt;, &lt;code&gt;realanalytics.ts&lt;/code&gt; (generated seeds).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;traceability-current-step-to-target-step&quot;&gt;&lt;summary&gt;Traceability: current step to target step&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Every current step lands somewhere in the target; reviewers should confirm nothing real has been dropped. The third column names the model action or screen that carries it.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Current step&lt;/th&gt;&lt;th&gt;Target step&lt;/th&gt;&lt;th&gt;What changes (model action / screen)&lt;/th&gt;&lt;th&gt;What stays&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A1.1 idea spoken in the design meeting&lt;/td&gt;&lt;td&gt;B5.1 raise requirement&lt;/td&gt;&lt;td&gt;&lt;code&gt;+ New requirement&lt;/code&gt; → &lt;code&gt;addConcept&lt;/code&gt; / &lt;code&gt;createRequirement&lt;/code&gt; / &lt;code&gt;createOptionRequest&lt;/code&gt;, with a why and a wanted-by&lt;/td&gt;&lt;td&gt;The design meeting decides&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.2 mill options by WhatsApp&lt;/td&gt;&lt;td&gt;B5.4 one vendor, terms and hold&lt;/td&gt;&lt;td&gt;&lt;code&gt;conceptAddFabricOption&lt;/code&gt; / &lt;code&gt;addFabricQuote&lt;/code&gt; / &lt;code&gt;addRequestOffer&lt;/code&gt;; a second add replaces the first; &lt;code&gt;holdUntil&lt;/code&gt; is a field with a countdown&lt;/td&gt;&lt;td&gt;Sourcing chooses whom to ask&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.3 block by email, three sheets&lt;/td&gt;&lt;td&gt;B5.4 the hold on the offer; &lt;code&gt;Block&lt;/code&gt; on the concept path&lt;/td&gt;&lt;td&gt;&lt;code&gt;conceptBlockFabric&lt;/code&gt; (&lt;code&gt;Vendor has blocked it&lt;/code&gt;) with &lt;code&gt;via&lt;/code&gt; and an expiry from the vendor&amp;#39;s window; the sheets retired&lt;/td&gt;&lt;td&gt;The email or WhatsApp to the mill&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.4 sample and PAT by email&lt;/td&gt;&lt;td&gt;B5.2 sampling rounds&lt;/td&gt;&lt;td&gt;&lt;code&gt;conceptSendPat&lt;/code&gt;, &lt;code&gt;conceptSubmitSample&lt;/code&gt;, &lt;code&gt;conceptReviewSample&lt;/code&gt;; PAT / CAD / sample photo / green slip as files on the concept&lt;/td&gt;&lt;td&gt;Production makes it&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.5 datasheet in Enigma&lt;/td&gt;&lt;td&gt;Recorded: &lt;code&gt;conceptConfigureEnigma&lt;/code&gt;, &lt;code&gt;conceptSetEnigmaFlags&lt;/code&gt;, &lt;code&gt;conceptDesignFlag(&amp;#39;enigma&amp;#39;)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Template, base + buffer consumption, options, large check, composition family recorded — not duplicated&lt;/td&gt;&lt;td&gt;Design / the tech team type it in Enigma&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.6 vendor in Enigma&lt;/td&gt;&lt;td&gt;B15 vendors read&lt;/td&gt;&lt;td&gt;Read from Enigma (seeded today)&lt;/td&gt;&lt;td&gt;Sourcing creates it there&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.7 PO in Enigma + fabric ordering sheet row&lt;/td&gt;&lt;td&gt;B5.5 Push PO&lt;/td&gt;&lt;td&gt;&lt;code&gt;conceptAcceptAndRaisePo&lt;/code&gt; / &lt;code&gt;acceptQuoteAndRaisePo&lt;/code&gt; / &lt;code&gt;acceptOfferAndRaisePo&lt;/code&gt;: fabric row on the master, &lt;code&gt;FabricPo&lt;/code&gt;, incoming metres — the sheet row goes&lt;/td&gt;&lt;td&gt;The PO in Enigma (phase 5: written)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.8 GRN in Enigma&lt;/td&gt;&lt;td&gt;B12.2 fabric GRN&lt;/td&gt;&lt;td&gt;&lt;code&gt;receiveFabricPo&lt;/code&gt; → GRN &lt;code&gt;fabric&lt;/code&gt;, metres from incoming to stock; the design step &amp;quot;Fabric in&amp;quot; reads the GRN&lt;/td&gt;&lt;td&gt;Warehouse does it&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.9 designs typed in the weekly stock Excel&lt;/td&gt;&lt;td&gt;B7.8 designs on the fabric&lt;/td&gt;&lt;td&gt;&lt;code&gt;conceptAddDesign&lt;/code&gt; mints the product code; &lt;code&gt;conceptSetName&lt;/code&gt; renames the first design&lt;/td&gt;&lt;td&gt;Sourcing writes them; marketing renames&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.10 swatches tracker (119 columns), hand-made sticker&lt;/td&gt;&lt;td&gt;B7.1–B7.6 swatch desk, sticker page&lt;/td&gt;&lt;td&gt;&lt;code&gt;conceptSwatch&lt;/code&gt; seven dated steps; &lt;code&gt;conceptSwatchPriority&lt;/code&gt;; the sticker page prints one box per design; one &lt;code&gt;SwatchDispatch&lt;/code&gt; per store&lt;/td&gt;&lt;td&gt;The same steps&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.11 Tuesday Excel, Slack&lt;/td&gt;&lt;td&gt;B7.11 stores told; B7.7 store confirms&lt;/td&gt;&lt;td&gt;&lt;code&gt;conceptSwatch(&amp;#39;storesTold&amp;#39;)&lt;/code&gt;; &lt;code&gt;confirmSwatch&lt;/code&gt; / &lt;code&gt;storeInward(&amp;#39;swatch&amp;#39;)&lt;/code&gt;; &amp;quot;MTM fabrics · live today&amp;quot; tab in My store&lt;/td&gt;&lt;td&gt;Weekly cadence if design wants&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.12 switch on in Enigma&lt;/td&gt;&lt;td&gt;B7.12 go live&lt;/td&gt;&lt;td&gt;&lt;code&gt;conceptGoLive&lt;/code&gt; (dated, clears &lt;code&gt;onHold&lt;/code&gt;); &lt;code&gt;conceptOnline(&amp;#39;live&amp;#39;)&lt;/code&gt; for the website&lt;/td&gt;&lt;td&gt;Any time; Enigma on-hold written when granted&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A1.13 run-out noticed late; design marks inactive after the fact&lt;/td&gt;&lt;td&gt;B11.1, B11.4&lt;/td&gt;&lt;td&gt;&lt;code&gt;coverageOf&lt;/code&gt; ROP on every read; &lt;code&gt;reviewCoreStock&lt;/code&gt;, &lt;code&gt;setFabricHold&lt;/code&gt;, &lt;code&gt;pauseFabric&lt;/code&gt;; mill sheets pasted with &lt;code&gt;importMillSheet&lt;/code&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A2.1–A2.5 options in a meeting, &amp;quot;ten for winter&amp;quot;&lt;/td&gt;&lt;td&gt;B6&lt;/td&gt;&lt;td&gt;&lt;code&gt;createOptionRequest&lt;/code&gt; with n slots; per slot send / push / reject / extend / close; the request&amp;#39;s stage reads 3 when every live slot has its PO&lt;/td&gt;&lt;td&gt;Design decides per option&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.1 option count in Excel&lt;/td&gt;&lt;td&gt;B11-ii plan cells&lt;/td&gt;&lt;td&gt;Stock health → &amp;quot;Option count vs the plan&amp;quot; (&lt;code&gt;RTW_SUBCATS&lt;/code&gt; ideal vs healthy)&lt;/td&gt;&lt;td&gt;Planning owns the number&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.2 style and brief by email&lt;/td&gt;&lt;td&gt;B5.1 RTW&lt;/td&gt;&lt;td&gt;One form (style, category, qty, at HO by, target cost, the cloth, fabric brief, size curve)&lt;/td&gt;&lt;td&gt;Design writes it&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.3–A3.4 terms and PO&lt;/td&gt;&lt;td&gt;B5.4–B5.5&lt;/td&gt;&lt;td&gt;As MTM: &lt;code&gt;addFabricQuote&lt;/code&gt; → &lt;code&gt;submitToDesign&lt;/code&gt; → &lt;code&gt;Push PO&lt;/code&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.5 size ratio and factory by email&lt;/td&gt;&lt;td&gt;B8.1–B8.2&lt;/td&gt;&lt;td&gt;&lt;code&gt;sizeBreakup&lt;/code&gt; on the requirement; &lt;code&gt;allocateFactory&lt;/code&gt; from the capacity board (&lt;code&gt;factoryOptions&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Planning decides&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.6 job card by hand&lt;/td&gt;&lt;td&gt;B8.3 print off the record&lt;/td&gt;&lt;td&gt;Tracker: Style details, BOM, Execution (job card no.) — print style to build&lt;/td&gt;&lt;td&gt;Same paper&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.7–A3.8 samples and RQC by WhatsApp&lt;/td&gt;&lt;td&gt;B8.4&lt;/td&gt;&lt;td&gt;&lt;code&gt;submitSample&lt;/code&gt;, &lt;code&gt;reviewSample&lt;/code&gt; with green-slip comments; lands PPS Submission / PPS Approval&lt;/td&gt;&lt;td&gt;RQC decides&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.9 materials to the factory&lt;/td&gt;&lt;td&gt;B8.5&lt;/td&gt;&lt;td&gt;&lt;code&gt;receiveMaterial&lt;/code&gt;, &lt;code&gt;issueMaterials&lt;/code&gt; (trims drawn from the unit&amp;#39;s bulk stock)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.10 tracker re-dated by hand&lt;/td&gt;&lt;td&gt;B8.6 milestones&lt;/td&gt;&lt;td&gt;&lt;code&gt;setMilestone&lt;/code&gt; plan / revised (reason) / actual with downstream push; &lt;code&gt;riskOf&lt;/code&gt;; sheet view kept&lt;/td&gt;&lt;td&gt;Sheet view kept&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.11 goods received&lt;/td&gt;&lt;td&gt;B12.3 lots&lt;/td&gt;&lt;td&gt;&lt;code&gt;receiveLot&lt;/code&gt; (partial, balance expected, close short) → GRN &lt;code&gt;rtw-po&lt;/code&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.12 Monthly Drops, Display &amp;amp; Fit allocation&lt;/td&gt;&lt;td&gt;B8.9–B8.11&lt;/td&gt;&lt;td&gt;&lt;code&gt;createLaunch&lt;/code&gt; (from the style&amp;#39;s Go live step or &lt;code&gt;+ Add to a drop&lt;/code&gt;), &lt;code&gt;allocateLaunch(&amp;#39;default&amp;#39;)&lt;/code&gt;, &lt;code&gt;dispatchLaunch&lt;/code&gt;, &lt;code&gt;receiveLaunch&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Drop months&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.13 launch PDF a week out&lt;/td&gt;&lt;td&gt;B8.12&lt;/td&gt;&lt;td&gt;&lt;code&gt;updateLaunch&lt;/code&gt; marketing name, brief, date, launched; &lt;code&gt;MARKETING_LEAD_DAYS&lt;/code&gt; 10&lt;/td&gt;&lt;td&gt;Marketing names it&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A4.2 FOB supplier email&lt;/td&gt;&lt;td&gt;B9.2 nomination&lt;/td&gt;&lt;td&gt;&lt;code&gt;setSourcingMode(&amp;#39;fob-nominated&amp;#39;)&lt;/code&gt;, &lt;code&gt;markFobEmailed&lt;/code&gt;&lt;/td&gt;&lt;td&gt;The email&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A4.4 trims charged via BOM&lt;/td&gt;&lt;td&gt;B9 BOM lines&lt;/td&gt;&lt;td&gt;&lt;code&gt;updateBom&lt;/code&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A5 swatches to stores&lt;/td&gt;&lt;td&gt;B7&lt;/td&gt;&lt;td&gt;As above&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.4 order typed twice (Shopify + Enigma)&lt;/td&gt;&lt;td&gt;B10.1 punch a bill&lt;/td&gt;&lt;td&gt;&lt;code&gt;punchBill&lt;/code&gt; / &lt;code&gt;punchOrder&lt;/code&gt;: one bill, several pieces, the sheet mirrored, metres reserved&lt;/td&gt;&lt;td&gt;Enigma reserves&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.5 customer rings to change the collar&lt;/td&gt;&lt;td&gt;B10 sheet correction&lt;/td&gt;&lt;td&gt;&lt;code&gt;editOrderSheet&lt;/code&gt; by rule (&lt;code&gt;sheetEditMode&lt;/code&gt;); &lt;code&gt;markChangeSeen&lt;/code&gt;, &lt;code&gt;markFactoryTold&lt;/code&gt;, &lt;code&gt;markFactoryRead&lt;/code&gt;, &lt;code&gt;reissueSheet&lt;/code&gt;, &lt;code&gt;unplanOrders&lt;/code&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.7–A6.11 returns on Slack&lt;/td&gt;&lt;td&gt;B10.2–B10.6&lt;/td&gt;&lt;td&gt;&lt;code&gt;raiseReturn&lt;/code&gt;, &lt;code&gt;startResolution&lt;/code&gt; (ladder, two alteration routes), &lt;code&gt;decideResolution&lt;/code&gt;, factory leg scans, &lt;code&gt;hemLegStep&lt;/code&gt;, &lt;code&gt;redeemCredit&lt;/code&gt;; &lt;code&gt;creditLedger&lt;/code&gt;&lt;/td&gt;&lt;td&gt;The ladder&amp;#39;s order&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6-iv STOs open, ghost stock, damaged pieces&lt;/td&gt;&lt;td&gt;B12.9, B10-iv&lt;/td&gt;&lt;td&gt;&lt;code&gt;storeInward(&amp;#39;sto&amp;#39;)&lt;/code&gt; / &lt;code&gt;closeTransfer&lt;/code&gt;; &lt;code&gt;writeOffStock&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Waves&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7-i auto-PO silent&lt;/td&gt;&lt;td&gt;B11.2&lt;/td&gt;&lt;td&gt;&lt;code&gt;raiseFabricPo&lt;/code&gt; mirrored with &lt;code&gt;source: &amp;#39;auto&amp;#39;&lt;/code&gt;; &lt;code&gt;confirmFabricPo&lt;/code&gt; / &lt;code&gt;remarkFabricPo&lt;/code&gt; name what the mill said&lt;/td&gt;&lt;td&gt;Enigma raises it&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.1–A7.3 international Excel&lt;/td&gt;&lt;td&gt;B11.1, B11.3&lt;/td&gt;&lt;td&gt;&lt;code&gt;coverageOf&lt;/code&gt; per fabric; &lt;code&gt;Raise PO · n m&lt;/code&gt; button for international core&lt;/td&gt;&lt;td&gt;A person decides&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.4–A7.6 health by eye&lt;/td&gt;&lt;td&gt;B11-ii verbs&lt;/td&gt;&lt;td&gt;&lt;code&gt;healthOf&lt;/code&gt; on every read; &lt;code&gt;decideOption&lt;/code&gt; logged&lt;/td&gt;&lt;td&gt;Planning decides&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.7 store replenishment sheet&lt;/td&gt;&lt;td&gt;B12.9 STO waves (later)&lt;/td&gt;&lt;td&gt;&lt;code&gt;replenishmentOf&lt;/code&gt; computes the sheet; STO creation out of phase 1–4&lt;/td&gt;&lt;td&gt;Sheet stays&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.1 vehicle tally on paper&lt;/td&gt;&lt;td&gt;B12.1 round&lt;/td&gt;&lt;td&gt;&lt;code&gt;receiveRound&lt;/code&gt; per-piece fates, one &lt;code&gt;mtm-round&lt;/code&gt; GRN per factory&lt;/td&gt;&lt;td&gt;RTS scan&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.2 bundles cut and sent&lt;/td&gt;&lt;td&gt;B12 outbound&lt;/td&gt;&lt;td&gt;&lt;code&gt;prepQueue&lt;/code&gt; cut list per plan; scan out&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.4 EXTRA FABRIC email&lt;/td&gt;&lt;td&gt;B8.7&lt;/td&gt;&lt;td&gt;&lt;code&gt;raiseExtraFabric&lt;/code&gt; (merchandiser), &lt;code&gt;decideExtraFabric&lt;/code&gt; (approve deducts; picked &amp;amp; sent)&lt;/td&gt;&lt;td&gt;Daily&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.6 factory&amp;#39;s WhatsApp shipping report&lt;/td&gt;&lt;td&gt;B12b output&lt;/td&gt;&lt;td&gt;&lt;code&gt;logFactoryOutput&lt;/code&gt; beside the scans; &lt;code&gt;Vendor.dailyOut&lt;/code&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.8 five emails a morning&lt;/td&gt;&lt;td&gt;B12.4 mill stock paste&lt;/td&gt;&lt;td&gt;&lt;code&gt;importMillSheet&lt;/code&gt;, &lt;code&gt;saveMillStock&lt;/code&gt;, &lt;code&gt;callBespokeFabric&lt;/code&gt;, &lt;code&gt;inwardBespoke&lt;/code&gt; with the minted parcel code&lt;/td&gt;&lt;td&gt;Mills email&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.9 swatch books and fit sets by courier&lt;/td&gt;&lt;td&gt;B12 books&lt;/td&gt;&lt;td&gt;&lt;code&gt;dispatchSwatchBook&lt;/code&gt;, &lt;code&gt;receiveSwatchBook&lt;/code&gt;, &lt;code&gt;dispatchFitSample&lt;/code&gt;, &lt;code&gt;markFitSample&lt;/code&gt;; &lt;code&gt;swatchMatrix&lt;/code&gt;, &lt;code&gt;fitMatrix&lt;/code&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10 Swati&amp;#39;s plan in her head; Vishnu&amp;#39;s pivot; Vishal&amp;#39;s table&lt;/td&gt;&lt;td&gt;B12a&lt;/td&gt;&lt;td&gt;&lt;code&gt;ppQueue&lt;/code&gt;, &lt;code&gt;proposeAllocation&lt;/code&gt;, &lt;code&gt;submitPlan&lt;/code&gt; (force on the record), &lt;code&gt;agingReport&lt;/code&gt;, &lt;code&gt;shippingTable&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Swati edits the draft&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A12 the workbooks (weekly report, DSR, stylist KPI)&lt;/td&gt;&lt;td&gt;B12c&lt;/td&gt;&lt;td&gt;What is selling screen with &amp;quot;How these numbers are made&amp;quot;&lt;/td&gt;&lt;td&gt;Planning reads them&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Sources: &lt;code&gt;src/store.ts&lt;/code&gt; (action names); &lt;code&gt;src/domain/engines.ts&lt;/code&gt; (derived functions); &lt;code&gt;src/screens/*.tsx&lt;/code&gt;; &lt;code&gt;docs/Discovery Record — What We Know v1.0 (18 Aug 2026).md&lt;/code&gt; (the A-steps as described); &lt;code&gt;docs/Invisit meeting contexts.md&lt;/code&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;non-functional-requirements&quot;&gt;&lt;summary&gt;Non-functional requirements&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Requirement (what the model does today, and what is to build)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Audit&lt;/td&gt;&lt;td&gt;Every write on a &lt;code&gt;ProductionOrder&lt;/code&gt; appends to its &lt;code&gt;activity[]&lt;/code&gt; &lt;code&gt;{ at, who, what }&lt;/code&gt;; order sheets keep &lt;code&gt;revisions[]&lt;/code&gt; with &lt;code&gt;{ field, from, to }&lt;/code&gt;, &lt;code&gt;reprint&lt;/code&gt; and the role; concepts and options keep who chose, rejected or withdrew and why; fabrics keep &lt;code&gt;nameHistory&lt;/code&gt;; supply reviews, blocks, plans (&lt;code&gt;forcedBy&lt;/code&gt;) and GRNs carry &lt;code&gt;by&lt;/code&gt;. Nothing is hard-deleted except a fabric quote or a design (to build: an event for those). A generic per-record activity log for every collection is to build.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Undo&lt;/td&gt;&lt;td&gt;The last 10 writes are on an undo stack (&lt;code&gt;touch()&lt;/code&gt; snapshots the whole database); a toast with Undo shows for 7 seconds and may only revert its own change (&amp;quot;Something else changed since — undo from the record instead.&amp;quot;). After that a compensating action with a note.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Identity&lt;/td&gt;&lt;td&gt;One login per team in the prototype (&lt;code&gt;PEOPLE&lt;/code&gt;, one person per role; no finance person). Target: one login per person, one role, and for store and factory roles one scope; an administrator role sees everything (walkthrough mode today).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Persistence and concurrency&lt;/td&gt;&lt;td&gt;The prototype persists one JSON document in &lt;code&gt;localStorage&lt;/code&gt; (&lt;code&gt;bsc-plm-v1&lt;/code&gt;, version 96; a version bump reseeds). Target: server-side records with optimistic versioning; a stale write is refused with the current state shown; Enigma&amp;#39;s reservation is the arbiter when two stores punch the last metres.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Clock&lt;/td&gt;&lt;td&gt;The prototype&amp;#39;s clock is fixed at 12 Sep 2026 09:00 IST (&lt;code&gt;TODAY&lt;/code&gt;); writes advance from there in real time. Target: real time, IST.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Printing&lt;/td&gt;&lt;td&gt;&lt;code&gt;window.print()&lt;/code&gt; on the sticker page, the outbound cut sheet and the factory&amp;#39;s day; print styles for the job card, style sheet, BOM, GRN and the round-trip slip are to build (A4; sticker label stock size to confirm).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Files&lt;/td&gt;&lt;td&gt;Attachments per record with a label from &lt;code&gt;FILE_LABELS&lt;/code&gt; per kind and an optional step; bytes in IndexedDB in the prototype (&lt;code&gt;files.ts&lt;/code&gt;), &lt;code&gt;stored: false&lt;/code&gt; on seeded rows; target: object storage, 25 MB per file, images previewed inline.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Search&lt;/td&gt;&lt;td&gt;⌘K palette over bulk POs, MTM and RTW orders, fabrics, RTW options, mills, factories, concepts, returns, launches, customers, stores; results grouped by kind; opens the record.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Lists&lt;/td&gt;&lt;td&gt;Paged at 20 (&lt;code&gt;usePager&lt;/code&gt;); worked-example strips outside quiet mode; every list exports &lt;code&gt;.xlsx&lt;/code&gt;; filters and the open record live in the URL; saved views in the sidebar. Target: the fabric master (~8,600 rows) and orders (~40 a day) filtered server-side.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Bell&lt;/td&gt;&lt;td&gt;&lt;code&gt;alertsFor&lt;/code&gt; runs on every render over the whole database; target: under a second on a server, recomputed on every write to the record (a nightly job is only needed for the rules marked to build in B14).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Availability&lt;/td&gt;&lt;td&gt;Stores and the warehouse work 10:00–22:00 IST seven days; maintenance windows outside those hours.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Devices&lt;/td&gt;&lt;td&gt;Desktop layout (sidebar 264 px + main up to 1280 px). A narrow layout for the warehouse receiving screens, the swatch desk, the store&amp;#39;s returns bench and the hemming hops, with large buttons and a scan field, is to build.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Offline&lt;/td&gt;&lt;td&gt;None; the store&amp;#39;s punch form should warn and block when offline (to build).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Data migration&lt;/td&gt;&lt;td&gt;&lt;code&gt;realdata.ts&lt;/code&gt; is generated from the data files and judged column by column; at go-live a one-time import of open items from the sheets in the Data sources inventory, idempotent, logging every skipped row with a reason; closed history stays in the sheets; Enigma is read, not migrated.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Environments&lt;/td&gt;&lt;td&gt;Development, staging (Enigma read-only against production data), production; Enigma has no sandbox, so writes are enabled per module per environment behind flags.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Backups&lt;/td&gt;&lt;td&gt;Daily, retained 90 days; a record&amp;#39;s full history exportable as JSON (&lt;code&gt;Reset demo data&lt;/code&gt; reseeds the prototype).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Localisation&lt;/td&gt;&lt;td&gt;English; dates as &lt;code&gt;12 Sep 26&lt;/code&gt; (&lt;code&gt;en-IN&lt;/code&gt;, &lt;code&gt;fmtDate&lt;/code&gt;); rupees with Indian grouping (&lt;code&gt;fmtMoney&lt;/code&gt;); inches for measurements; metres (or kg for knits) for cloth; relative times &amp;quot;14 minutes ago&amp;quot; on the bell.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Accessibility&lt;/td&gt;&lt;td&gt;Keyboard-operable lists and forms; focus states; contrast AA; the sidebar groups are buttons with &lt;code&gt;aria-expanded&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Observability&lt;/td&gt;&lt;td&gt;Every refused action and every integration call logged with correlation ids; a daily digest of failed Enigma calls to the administrator (to build).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Modes&lt;/td&gt;&lt;td&gt;Walkthrough mode (super admin for demos) and Quiet mode (no ledes, no ⓘ, no example strips) are prototype settings; keep Quiet as the pilot default.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Sources: &lt;code&gt;src/store.ts&lt;/code&gt; (&lt;code&gt;touch&lt;/code&gt;, &lt;code&gt;undoStack&lt;/code&gt;, &lt;code&gt;undoTo&lt;/code&gt;, &lt;code&gt;persist&lt;/code&gt; options, &lt;code&gt;BOOT&lt;/code&gt;/&lt;code&gt;now&lt;/code&gt;); &lt;code&gt;src/domain/engines.ts&lt;/code&gt; (&lt;code&gt;TODAY&lt;/code&gt;, &lt;code&gt;fmtDate&lt;/code&gt;, &lt;code&gt;fmtMoney&lt;/code&gt;, &lt;code&gt;fmtAgo&lt;/code&gt;); &lt;code&gt;src/domain/files.ts&lt;/code&gt;; &lt;code&gt;src/ui.tsx&lt;/code&gt; (&lt;code&gt;usePager&lt;/code&gt;, &lt;code&gt;downloadXlsx&lt;/code&gt;, &lt;code&gt;useExamples&lt;/code&gt;); &lt;code&gt;src/layout/Shell.tsx&lt;/code&gt; (layout, views, modes); &lt;code&gt;src/screens/Search.tsx&lt;/code&gt;; &lt;code&gt;docs/Enigma Answers — Read From Live System (26 Aug 2026).md&lt;/code&gt; (no sandbox).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;implementation-plan-phased-by-team-built-on-enigma&quot;&gt;&lt;summary&gt;Implementation plan — phased by team, built on Enigma&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;This is the order to build in, not the order the process runs in. Enigma stays the system of record throughout — every phase below reads from it, and only moves to writing into it where BSC and the Enigma team have agreed access. The plan is deliberately high-level: which team gets a working screen, roughly what it lets them do, and why that team goes when it does. The exact fields, click paths and edge cases are for the technical discovery that follows this document, working from the detail already laid out flow by flow above.&lt;/p&gt;
&lt;p&gt;Before phase 1: a short foundations step — connect read-only to Enigma, set up one login per team and per store or factory, and build the shared page shell (the record view, the notification bell, search, printing) that every later phase reuses. Nothing user-facing ships from this step on its own.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Phase 1 — MTM production and the factory merchandiser, built together.&lt;/strong&gt; This is the first team-facing release, because it is where the floor&amp;#39;s day is most painfully manual today: a planner working from memory and a WhatsApp thread per factory, and no way for a factory to ask for more cloth without a phone call. Bespoke orders ride the same plan: a customer&amp;#39;s bespoke shirt waits outside the plan until its cut length has arrived from the mill, then runs like any other made-to-measure order.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;For the production planner: the daily allocation screen. It proposes which factory each punched order should go to, based on each factory&amp;#39;s spare capacity for the day, and lets the planner accept the proposal, override it, or send a batch to a chosen factory. This is the piece the planner uses every morning.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;For the factory merchandiser, at the same time: their own screen to see what has been sent to their factory, to log the day&amp;#39;s output, and to ask for extra cloth when a piece is spoiled — replacing the daily WhatsApp and email.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;On the production side, alongside the merchandiser&amp;#39;s screen: approving an extra-cloth request, which deducts the metres from stock automatically the moment it is approved, instead of someone adjusting Enigma by hand later.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Also in this phase: the vehicle round (what came back from each factory today, matched against what was declared) and the running view of how many days a piece has sat in a factory.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Done when a planner and every MTM factory&amp;#39;s merchandiser are working from these screens for real orders, and the WhatsApp thread for allocation and extra cloth is no longer the record of what happened.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Phase 2 — Store manager.&lt;/strong&gt; Bills with more than one piece, a case raised on a delivered piece with the six-rung ladder (alter it here, swap from the shelf, send it to the factory or the hemming unit, refit, remake, or give the money back), store credit, and the store&amp;#39;s own view of parcels coming in, stock asks to other stores, and damaged stock write-offs. A bespoke fabric can be picked only while the mill&amp;#39;s last report says it is available. This is store-facing and customer-facing, so it goes after the MTM floor has proven the pattern.&lt;/p&gt;
&lt;p&gt;Done when a handful of pilot stores are running returns and alterations through this instead of Slack, and store credit has one ledger instead of living in someone&amp;#39;s memory.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Phase 3 — Warehouse.&lt;/strong&gt; Every receipt — fabric rolls, ready-to-wear bulk, bespoke parcels, the vehicle round from MTM factories — writes one numbered goods-received note, always against the purchase order or parcel it belongs to. This phase also covers stock transfers to stores, swatch books and fit samples, and the round trip through the hemming unit. Bespoke lives here too: the mill&amp;#39;s daily list typed or pasted in (a fabric reported out goes on hold everywhere at once), the call to the mill with BSC&amp;#39;s parcel codes, and the parcel inwarded against its order. It goes after the store phase because by then both sides of most warehouse hand-offs (the factory feeding it, the store receiving from it) are already live.&lt;/p&gt;
&lt;p&gt;Done when a fabric receipt updates saleable stock everywhere within the day, and a stock transfer that has sat unclosed for a week shows up as a problem on the warehouse&amp;#39;s own list, not as ghost stock nobody notices.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Phase 4 — Design and sourcing.&lt;/strong&gt; One list for every kind of ask — a new MTM fabric, several fabric options at once, a ready-to-wear style — moving through the same stages: raised, one vendor found and its terms agreed, the purchase order pushed, then downstream. A ready-to-wear style carries its bill of materials and tech pack before it goes to sourcing, with the fabric line as one cloth or a shortlist sourcing picks from; a made-to-measure fabric&amp;#39;s sample and department approval are optional, skipped with a reason. This also covers the swatch desk (the six steps from cloth arriving to stores being told) and settling several options from one request. It comes after the three phases above because design and sourcing can keep working over email and Enigma directly in the meantime, whereas the floor teams in phases 1–3 have no such fallback.&lt;/p&gt;
&lt;p&gt;Done when ten fabrics run from raised to stores told without the swatch tracker sheet or a hand-made sticker.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Phase 5 — Replenishment and the sales review.&lt;/strong&gt; The reorder rule for MTM core fabrics (so nobody has to remember to check a mill), the nine-word action list for every ready-to-wear style (reorder it, pull it back, leave it, and so on), and the weekly sales review, daily sales report and stylist scorecard read from one page instead of rebuilt by hand each week. Bespoke has no reorder point — the mill&amp;#39;s list is its only availability — so this phase only reads it (the bespoke tab of the weekly review).&lt;/p&gt;
&lt;p&gt;Done when the international-fabric spreadsheet and the weekly stock-health scan are retired.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Phase 6 — RTW production.&lt;/strong&gt; The equivalent for ready-to-wear: one record per style in four sections, as Nitin&amp;#39;s team runs it. The request from design. Factory finalisation, where Nitin proposes a factory, cost and date, and design accepts or rejects with a comment and raises the factory PO with the job card, trim card, BOM and tech pack. Fabric finalisation, which is sourcing&amp;#39;s one-vendor loop: the fabric PO mints the Enigma code and fills the tracker&amp;#39;s fabric details, the cloth goes to the factory, and a short delivery gets a modified ratio or a cut short. Then the milestones and final steps, kept by Nitin and the factory merchandiser from the merchandiser&amp;#39;s own portal. A style shows on the tracker from the request, marked &amp;quot;no PO yet&amp;quot;. This covers the prototype on a stand-in fabric before any cloth is sourced, the sample rounds, the other BOM items checked against stock and signed off by sourcing after the fabric PO, materials issued to the factory, the day-by-day milestones (cutting, stitching, finishing, dispatch), quality checks before a lot ships, and receiving goods in lots against the order. It comes after design, sourcing and replenishment because half of every tracker row is written by planning, design and sourcing before production touches it, and every row is born from a requirement and carries its fields through; planning and category set the requirement, design the style and fabric specification, sourcing the vendor and the fabric PO, Nitin the factory proposal, the factory merchandiser the receipt of cloth and trims, the production unit and station merchandiser the revised and actual dates and escalations, and the warehouse&amp;#39;s receipt closes the row. Production and the warehouse work from this together. It is the tracker sheet as the team reads it today — PO, style, vendor, merchant, quantity, where it is, its date calendar — with every step below hanging off a row on it, and each row born from design&amp;#39;s requirement. The workbook&amp;#39;s Config and Auto Plan Logic tabs become the tracker&amp;#39;s settings (days from PO per milestone per category, risk thresholds, in-full tolerance; saving re-plots open POs&amp;#39; planned dates), and its other four tabs — OTIF dashboard, daily monitor, escalation log, merchandiser alerts — become one analytics screen for the RTW planner, read off the tracker.&lt;/p&gt;
&lt;p&gt;Done when one month&amp;#39;s cohort of ready-to-wear styles is tracked end to end on the tracker, and the old production spreadsheet is retired for that cohort.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Phase 7 — Writing into Enigma, and the remaining edges.&lt;/strong&gt; Wherever Enigma access has been agreed by then: purchase orders, fabric on-hold flags, goods-received notes and stock transfers get written back into Enigma instead of only being read from and recorded alongside it. This phase also picks up whatever was deliberately left for later in the phases above — smaller screens sized for a phone, bulk actions, and the handful of rules and alerts flagged &amp;quot;later&amp;quot; throughout this document.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Running two systems side by side.&lt;/strong&gt; For every phase, the spreadsheet or habit it replaces stays available, read-only, for one month after go-live. Each week, someone compares the new tool against the old sheet with the team that owns it, before that sheet is finally switched off.&lt;/p&gt;
&lt;p&gt;Sources: this document&amp;#39;s flow-by-flow sections (B5–B12c) for what each phase builds; PRD — First Pivot Plan &amp;amp; Dates v3.0 (19 Aug 2026) and the MTM First Cut thinking document (MTM first, one phase closing before the next opens); Discovery Close-Out — 4-Day Field Plan (07 Sep 2026).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;open-questions-and-assumptions&quot;&gt;&lt;summary&gt;Open questions and assumptions&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Assumptions the build stands on until the Bombay follow-ups and the Enigma API review say otherwise. Each changes a field, a source or an owner above. Constants in the model that are placed rather than sourced are flagged in &lt;code&gt;reference.ts&lt;/code&gt; comments and repeated here.&lt;/p&gt;
&lt;p&gt;Assumed, to confirm.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;Product-code format and who mints it (&lt;code&gt;BOM-SHI-FM/CS-nnnn&lt;/code&gt;, sequence from 4200, minted when a design is added; the model lets design, sourcing and the warehouse add designs).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The MTM assortment target of about 30 active options (&lt;code&gt;MTM_ACTIVE_TARGET&lt;/code&gt;), the same for every book; the per-family &lt;code&gt;RANGES&lt;/code&gt; targets (Poplin 20, Twill 18, Oxford 12, Dobby 8, Linen 14, Stripes 30, Checks 24, Print 10) are placed, not from a sheet.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The warehouse, not the factory, inwards bulk cloth for swatches; the swatch desk&amp;#39;s six warehouse steps may be pressed in any order.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The sticker is a page of boxes, one per design; label stock size.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;One live vendor per ask at a time (a second add replaces the first, kept as &amp;quot;replaced by sourcing&amp;quot;).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Go live for stores is design&amp;#39;s decision at any moment, not gated on the swatch desk; online follows about two weeks later and is not gated on stores in the model.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The factory is proposed by Nitin and accepted by design (no capacity allocation by planning); RQC sits inside the production unit; who exactly is RQC.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Store credit has no ceiling; the amount defaults to the piece&amp;#39;s MRP (fallback ₹2,990); refunds always go to finance; where store credit lives today (Shopify gift card, Enigma, nowhere).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The hemming unit can ship straight to a customer; which stores have a tailor who hems; the return SLA of 10 days.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Enigma&amp;#39;s per-warehouse threshold (7/3/2) is the store floor and the &amp;quot;Minimum order quantity&amp;quot; attribute is the vendor MOQ; the ROP is &lt;code&gt;max(lead-time demand, MOQ)&lt;/code&gt; with no growth uplift for MTM core (the 50% uplift applies to RTW only); 2.15 m per shirt (&lt;code&gt;METRES_PER_SHIRT&lt;/code&gt;) and whether pattern uplift is inside it (two screens implied 1.35 m).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;International is derivable from Mill Country; promotion to core sets a 40 m threshold floor when under 20.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Picario: what is sent there and why it is a destination column on the swatch tracker.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;MTM planning constants: 2-hour freeze, 7-day horizon, 12 pieces per tailor per day, 5-day aging, Mahendra as the corporate factory and Richman as the urgent reserve, &lt;code&gt;dailyTarget&lt;/code&gt; 300 / 60 / 60 / 90 / 40 (from the walk, to confirm).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;RTW constants: MOQ 150 per style, 90-day reorder trigger, 45 / 105 days target cover, WOF 30 / 55, mid sizes 40 / 41 / 42 / 32 / 34 / M / L, ±3% in-full tolerance, 7 / 10-day risk buffers, 35 days fabric-before-inhouse.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Costing defaults (trims &amp;amp; packaging ₹44.35, transport 10, hemming 9, shipping 132, overheads 103.6, multiple 3.5) and the per-item trim costs in &lt;code&gt;TRIM_MASTER&lt;/code&gt; (placed so a shirt lands on ₹44.35).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The fit-sample set: Slim / Standard / Heavy × 38–44 (sizes placed); the three MTM fits sold (Tailored / Classic / Slim / Saved fit).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The three placeholder shirt presets (Weekend, Resort, Evening) and the order-sheet pick lists beyond what the BSC-1002370 screenshot showed.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Which of the 22 sheets can be retired on day one of the pilot and which run in parallel for a month.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Name clashes to settle: Nitin (factory merchandiser at Mahendra in the model; warehouse dispatch in Monthly Drops); &amp;quot;Ramesh&amp;quot; (a driver placeholder in the model; not in any discovery note).&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Unknown, blocks a phase.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;Enigma write access (PO, on-hold, GRN, STO, order sheet) — blocks phase 5 and decides how much stays &amp;quot;recorded&amp;quot;.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;An &lt;code&gt;updatedAfter&lt;/code&gt; filter or a change feed — decides polling cost (the full fabric read is 3.2 MB).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;A date or id range on the ledger — decides whether ROS and consumption can be read at all without 8,585 calls.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Whether Shopify sales can be read per product code daily — decides B11&amp;#39;s ROS and the What is selling screen.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The size-set source (Enigma Sizing module vs &lt;code&gt;SIZE_SETS&lt;/code&gt; per category).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;RTW per-store stock: Enigma variants per warehouse or ShipHero (15 of 50 stores) — until read, &lt;code&gt;storeStockOf&lt;/code&gt; is a hash split.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The five human answers on the auto-PO (quantity rule; one job or two; why 430 of 541 core fabrics are off; the 1,762 vendor-less fabrics; what releases a reservation on cancel or QC-fail).&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Gaps in the model found while verifying this document (to build or decide).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;Finance has no person, no home screen and no route for &amp;quot;refund to move&amp;quot; (&lt;code&gt;#/refunds&lt;/code&gt;); &lt;code&gt;moveRefund&lt;/code&gt; has no button.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;code&gt;Block.status = &amp;#39;expired&amp;#39;&lt;/code&gt;, &lt;code&gt;advanceReturn&lt;/code&gt;, &lt;code&gt;advanceOrder&lt;/code&gt;, &lt;code&gt;updateEscalation&lt;/code&gt;, &lt;code&gt;receiveFabricGrn&lt;/code&gt;, &lt;code&gt;conceptChooseFabric&lt;/code&gt; / &lt;code&gt;conceptChooseFabricOption&lt;/code&gt; exist in the store with no screen or job that calls them.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;A lapsed hold, an open major sample comment, a missing reason, over-capacity allocation, a second case on a piece, a launch without a name, a size breakup that does not sum: none of these block today (B13 marks each).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Only &lt;code&gt;ProductionOrder&lt;/code&gt; has an &lt;code&gt;activity[]&lt;/code&gt;; the other records rely on their typed history.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Deliberately out of scope. Costing, margin, working capital, ageing and inventory value (the COGS section on a PO stays); customer marketing (Superfone); store checklists (OPSR); the visualiser for MTM styling; store-level replenishment allocation (A7.7) until phase 5; escalations as a workflow.&lt;/p&gt;
&lt;p&gt;Sources: &lt;code&gt;src/domain/reference.ts&lt;/code&gt; (every constant marked &amp;quot;placed&amp;quot; or &amp;quot;confirm&amp;quot; in its comment: &lt;code&gt;RANGES&lt;/code&gt;, &lt;code&gt;TRIM_MASTER&lt;/code&gt;, &lt;code&gt;FIT_SAMPLE_SIZES&lt;/code&gt;, &lt;code&gt;SHIRT_PRESETS&lt;/code&gt;, &lt;code&gt;SHEET_OPTIONS&lt;/code&gt;, &lt;code&gt;METRES_PER_SHIRT&lt;/code&gt;, &lt;code&gt;GROWTH_UPLIFT&lt;/code&gt;, &lt;code&gt;TARGET_COVER_DAYS&lt;/code&gt;, &lt;code&gt;RTW_MOQ&lt;/code&gt;, &lt;code&gt;PP_FREEZE_HOURS&lt;/code&gt;, &lt;code&gt;PIECES_PER_TAILOR_DAY&lt;/code&gt;, &lt;code&gt;CORPORATE_FACTORY&lt;/code&gt;, &lt;code&gt;URGENT_FACTORY&lt;/code&gt;); &lt;code&gt;src/store.ts&lt;/code&gt; (actions with no caller); &lt;code&gt;src/App.tsx&lt;/code&gt; (routes); &lt;code&gt;docs/Enigma Answers — Read From Live System (26 Aug 2026).md&lt;/code&gt; (the five human answers, N9, N10); &lt;code&gt;docs/Discovery Close-Out — 4-Day Field Plan (07 Sep 2026).md&lt;/code&gt; (nine definitions, the contradictions); &lt;code&gt;docs/Discovery Record — What We Know v1.0 (18 Aug 2026).md&lt;/code&gt; §05; memory note &amp;quot;Enigma auto-PO rule&amp;quot;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
