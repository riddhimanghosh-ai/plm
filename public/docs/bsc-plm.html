&lt;p&gt;Rules. The freeze window is a setting, 2 hours by default, not a habit. A plan is submitted once. Going over capacity is recorded with the name of who forced it. Pulling an order back to PP is logged as a revision. Each factory&amp;#39;s capacity is its daily target, edited on the Daily output tab. The standard capacity is tailors × 12 pieces a day. From out of the factory on, a sheet is closed to changes: any change then is an alteration or a remake, handled as a return. The factory sees a reprint flag and the changed fields outlined, never a WhatsApp. Fabric on the sheet is the base (1.6 m, or 1.85 m for linen) plus a 0.10 m buffer. It is reserved when the order is punched and deducted when it is scanned out. The 16 Sep alignment asked for: select 30, 40 or 50; filters for urgent, VIP, corporate and normal; a capacity-versus-output refresh about every 10 minutes; statuses &amp;quot;Order Modified&amp;quot; and &amp;quot;Order Modified: Pending&amp;quot;; and changes locked at PP2. The VIP tag, the 10-minute refresh and the &amp;quot;Order Modified&amp;quot; status names are still to come (later: add them as agreed on 16 Sep).&lt;/p&gt;
&lt;p&gt;Cases.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;What differs&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Urgent tag&lt;/td&gt;&lt;td&gt;First in the queue, with a ship-by date of punch + 2 days. Proposed to the urgent-reserve factory, or the nearest with room. Still held for the freeze window unless someone changes the setting&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Corporate order (many pieces, one customer)&lt;/td&gt;&lt;td&gt;Always proposed to the corporate factory. One bill, with each piece as its own order, and one plan&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Bespoke fabric&lt;/td&gt;&lt;td&gt;Kept out of the queue until the customer&amp;#39;s parcel of cloth is received. Receiving it books a bespoke-parcel GRN and moves the order to PP. The Allocate table shows &amp;quot;bespoke &amp;lt;code&amp;gt;&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric short at cutting&lt;/td&gt;&lt;td&gt;There is no status for this, and the unit raises nothing. Later: pull the order back to PP with a reason&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sheet change before planning&lt;/td&gt;&lt;td&gt;The store and unit change it freely. It sits on production&amp;#39;s &amp;quot;pending with me&amp;quot; list until they click &amp;quot;Read — plan on this&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sheet change after the bundle has left&lt;/td&gt;&lt;td&gt;The unit amends it with a reprint flag while the piece is in transit or in the factory. The store can only add a remark. It sits on the factory&amp;#39;s &amp;quot;Changed since it arrived&amp;quot; list until they click &amp;quot;Read&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Turned back at the unit&lt;/td&gt;&lt;td&gt;Goes back to &amp;quot;in the factory&amp;quot; with the reason and is counted again in the factory&amp;#39;s ready list. The row shows &amp;quot;turned back ×N&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piece missed the vehicle&lt;/td&gt;&lt;td&gt;Marked &amp;quot;Not on vehicle&amp;quot;, shown as &amp;quot;missed the last vehicle&amp;quot;, and stays out of the factory for the next round&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Customer cancels&lt;/td&gt;&lt;td&gt;The reserved metres are given back if the cloth has not been cut. After the scan-out nothing is put back (&amp;quot;releasing it again would invent metres&amp;quot;)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW bottoms with inseam&lt;/td&gt;&lt;td&gt;Not MTM. RTW orders go from punched to ready to hemming to delivered, and never through a factory plan&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Time targets. Punch to plan: the next planning run after the freeze window. Plan to factory scan-in: 1 day. In the factory: 3 days (5 days counts as aging). Out of the factory to ready to ship: the same day&amp;#39;s vehicle. Ship-by on the record: punch + 7 days, or + 2 days for urgent. Earlier notes gave 14 days from punch to delivery, but no record backs this. To be confirmed with BSC.&lt;/p&gt;
&lt;p&gt;Sources: Granola notes &amp;quot;BSC Production MTM - Alignment&amp;quot; (16 Sep 2026); BSC MTM factory list (Mahendra, Richman, Harsh).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;10-rtw-production-milestones-and-final-steps&quot;&gt;&lt;summary&gt;10. RTW production, milestones and final steps&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 10. Section 4 of the RTW record, kept by Nitin and the factory merchandiser.&lt;/p&gt;&lt;p&gt;This is section 4 of the RTW record: the time-and-action milestones and final steps. Nitin and the factory merchandiser keep it up to date, and the merchandiser does it in real time from their portal. The tracker lists open POs, closed POs and RTW customer orders, filtered by Needs attention, Delayed, Critical, Watch, On track and &amp;quot;Before the PO&amp;quot;. A separate RTW production analytics screen, for the RTW planner, carries delivery performance, the daily monitor, escalations and alerts.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B12b.1&lt;/td&gt;&lt;td&gt;Milestone template&lt;/td&gt;&lt;td&gt;System&lt;/td&gt;&lt;td&gt;When design raises the factory PO, the category&amp;#39;s day counts become plan dates from the PO date. The day counts, risk thresholds and on-time tolerance live in the tracker&amp;#39;s settings, which replace the workbook&amp;#39;s Config and Auto Plan Logic sheets. RTW CMT shirts: PPS submission 7, PPS approval 9, cutting 13–17, stitching 19–26, finishing 28–30, final inspection 32, dispatch 33, in-house 34. Bottoms, knitwear and jackets add size-set submission 21 and approval 23, in-house 63. Jeans in-house 77.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Every milestone gets an owner. Changing the settings re-plans every open PO and says how many moved.&lt;/td&gt;&lt;td&gt;At the factory PO&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12b.2&lt;/td&gt;&lt;td&gt;Fabric and trims at the factory&lt;/td&gt;&lt;td&gt;Factory merchandiser&lt;/td&gt;&lt;td&gt;Confirms the cloth and trims received (B8.9).&lt;/td&gt;&lt;td&gt;Metres usable and damaged, trims received&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;The fabric and trims milestones get their actual dates. Short cloth goes to B8.10.&lt;/td&gt;&lt;td&gt;On arrival&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12b.3&lt;/td&gt;&lt;td&gt;Samples and PP go-ahead&lt;/td&gt;&lt;td&gt;Factory, then production&lt;/td&gt;&lt;td&gt;Logs each sample round; production writes comments by area, marks each major or minor, and gives the PP go-ahead or sends it back.&lt;/td&gt;&lt;td&gt;Round, comments, decision&lt;/td&gt;&lt;td&gt;Approval is blocked while a major comment is open.&lt;/td&gt;&lt;td&gt;The first round sets the actual PPS submission date; the go-ahead sets the approval date.&lt;/td&gt;&lt;td&gt;7 and 9 days from the PO (CMT shirts)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12b.4&lt;/td&gt;&lt;td&gt;Actuals and revisions&lt;/td&gt;&lt;td&gt;Factory merchandiser, Nitin&lt;/td&gt;&lt;td&gt;Enters the actual date, or a revised date with why it moved.&lt;/td&gt;&lt;td&gt;Date, reason&lt;/td&gt;&lt;td&gt;A revision offers the eight standard reasons.&lt;/td&gt;&lt;td&gt;A late actual pushes every later open step by the same slip. Risk is re-worked: delayed when the target has passed, critical at 7 buffer days or fewer, at risk at 10 or fewer, watch when a step is past plan with nothing recorded.&lt;/td&gt;&lt;td&gt;Daily&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12b.5&lt;/td&gt;&lt;td&gt;Escalation&lt;/td&gt;&lt;td&gt;Nitin, planning&lt;/td&gt;&lt;td&gt;Raises an escalation with an agreed recovery action.&lt;/td&gt;&lt;td&gt;Action, note, status&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Open, Acknowledged, then Resolved or Accepted delay. Planning is told when an accepted delay moves the drop.&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12b.6&lt;/td&gt;&lt;td&gt;QC audit&lt;/td&gt;&lt;td&gt;BSC QC&lt;/td&gt;&lt;td&gt;Records pieces checked, passed and issues, then releases or holds the lot.&lt;/td&gt;&lt;td&gt;Counts, issues&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Release sets the final inspection date.&lt;/td&gt;&lt;td&gt;Before dispatch&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12b.7&lt;/td&gt;&lt;td&gt;Split dispatch&lt;/td&gt;&lt;td&gt;Production&lt;/td&gt;&lt;td&gt;Records the pieces shipping now and when the balance follows.&lt;/td&gt;&lt;td&gt;Quantity, dates, reason&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Risk follows the balance, not the first lot.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12b.8&lt;/td&gt;&lt;td&gt;Receipt and close&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Records each lot received (B12.3).&lt;/td&gt;&lt;td&gt;Counts&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;The PO closes on the last lot or when closed short.&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12b.9&lt;/td&gt;&lt;td&gt;Delivery performance&lt;/td&gt;&lt;td&gt;System&lt;/td&gt;&lt;td&gt;Shows on time in full by factory and by order on the analytics screen.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;The figures are shown beside each factory when Nitin proposes one.&lt;/td&gt;&lt;td&gt;Live&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;Rules.&lt;/strong&gt; Plan dates are never overwritten: a revision sits beside the plan date and an actual replaces the revision. On time in full is judged on the whole order, within the tolerance set in the tracker&amp;#39;s settings.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Cases.&lt;/strong&gt; Repeat style: the sample section can be skipped. Factory change mid-run: a new proposal and a new factory PO redraw the plan. A milestone late with no revision reads watch until someone enters the actual or the reason. A lot held by QC is shown and blocks nothing yet. A partial delivery keeps the PO open with its balance.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Sources:&lt;/strong&gt; call with Nitin, 3 Oct 2026; Production Tracker Final V2.xlsx (milestones, Config, Auto Plan Logic, risk thresholds, OTIF tolerance, delay reasons, OTIF Dashboard); Transcript of call (Parag, 33:59–35:49).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;11-analytics-what-replaces-the-workbooks&quot;&gt;&lt;summary&gt;11. Analytics — what replaces the workbooks&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 11.&lt;/p&gt;&lt;p&gt;Three workbooks become one sales review page: the weekly business review, the daily sales report (DSR) and the stylist KPI sheet. The page has tabs for the weekly review, stores and DSR, and stylists and KPI. It reads from the same rows that day-to-day operations run on. For every figure, a &amp;quot;How these numbers are made&amp;quot; table on the page names the source workbook and column.&lt;/p&gt;
&lt;p&gt;For now, the figures are the reports&amp;#39; own. They are lifted from the workbook files for the week ending Sunday 30 Aug 2026, and the page shows them as the reports state them without recalculating. Finance workbooks stay with finance. The ROS and health report has its own page (stock health, B11).&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Today&amp;#39;s workbook&lt;/th&gt;&lt;th&gt;Target&lt;/th&gt;&lt;th&gt;Where&lt;/th&gt;&lt;th&gt;How the number is made&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Product Weekly Report · Summary tab&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Weekly review, &amp;quot;The week in one table&amp;quot;.&lt;/strong&gt; For each segment: last week&amp;#39;s quantity and revenue, the week before&amp;#39;s quantity and revenue, the change in each, and the four-week average quantity and revenue. Share rows show as percentages, and a move of more than 2% either way is coloured.&lt;/td&gt;&lt;td&gt;Sales review, used by planning; design and leadership can read it&lt;/td&gt;&lt;td&gt;Last week, the week before, and the change (last week minus the week before, divided by the week before), as the summary block states them. A blank segment stays blank, never zero. It replaces the sheet&amp;#39;s columns for last week and the week before (quantity, revenue and % change) and the four-week average.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Product Weekly Report · last-four-weeks tab&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Weekly review, &amp;quot;Category × sub-category&amp;quot;.&lt;/strong&gt; Columns: share, average weekly sales over 12 weeks and over the last 4, warehouse stock, each of the last four weeks, the best week (its value and which week it was), and last week against the four-week average. Warehouse stock turns amber when it would last more than 30 weeks at the four-week rate; hovering shows the weeks. A switch shows units or revenue.&lt;/td&gt;&lt;td&gt;Same&lt;/td&gt;&lt;td&gt;Share, 12-week average weekly sales, 4-week average weekly sales and warehouse stock are taken from the sheet&amp;#39;s own columns, not recalculated. The four weeks are shown in the sheet&amp;#39;s order, each with units and value. The best week is the largest of the four weeks on the row. Last week against the average is last week minus the mean of the non-blank weeks, divided by that mean. Over-stock means warehouse stock divided by the 4-week average weekly sales is above 30. Weeks with a broken size set are not removed from the average; the sheet&amp;#39;s figure is shown as it stands.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Product Weekly Report · MTM shirt range tab and ready-to-wear sub-category tabs&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Weekly review, &amp;quot;By range&amp;quot;.&lt;/strong&gt; Ready-to-wear shirts by sub-category (9 ranges plus a grand total), or made-to-measure by fabric range (57 ranges). Columns: 12-week average quantity, each of the last four weeks, the best week, quantity against the week before, and quantity against the 12-week average. Ranges with no sales in four weeks are hidden. Sorted by last week.&lt;/td&gt;&lt;td&gt;Same&lt;/td&gt;&lt;td&gt;The 12-week average and the two growth columns are the sheet&amp;#39;s own whole percentages. To be fixed: the range tables currently show revenue where units are expected. The range sheets list revenue first and quantity second for each week, but the page reads the first as units, so the units view shows revenue and the sort follows revenue. Check: 100% linen, four weeks back, is ₹507,072 and 80 pieces on the 9 Aug sheet.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Product Weekly Report · MTM bespoke and non-bespoke tab&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Weekly review, &amp;quot;MTM price bands&amp;quot;.&lt;/strong&gt; Bespoke and non-bespoke by ticket band (0–3K up to above 7.5K), each of the last four weeks, and the change against the week before.&lt;/td&gt;&lt;td&gt;Same&lt;/td&gt;&lt;td&gt;Units per band and kind, with growth as the sheet states it.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Product Weekly Report · ready-to-wear dress pants and chinos, jackets, Elevate chinos and kurta tabs&lt;/td&gt;&lt;td&gt;Not on the page yet. Later: split store and online sales by style, which needs the Shopify sales channel on each order line.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Shopify orders by channel, matched on the Shiphero style name.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Product On Sale (hidden tab)&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Weekly review, &amp;quot;On sale&amp;quot;.&lt;/strong&gt; Style (with category), price (MRP struck through, sale price and % off), date moved to sale, stock before, rate of sale before, rate of sale after (green when higher), and the ten weeks, newest first. Filters: every style, discount moved it, discount did nothing. An export. A footer reads &amp;quot;n of m markdowns lifted the rate of sale; the rest have a stock problem, not a price problem&amp;quot;.&lt;/td&gt;&lt;td&gt;Same&lt;/td&gt;&lt;td&gt;Taken from the sheet&amp;#39;s columns: original MRP, new discounted price, date moving to sale, stock before going to sale, pre-sale rate of sale, post-sale four-week rate of sale, and the first ten weekly columns (15–21 June back to 13–19 April). &amp;quot;Moved it&amp;quot; means the rate after the sale is higher than before, both as the sheet worked them out.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DSR&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Stores and DSR.&lt;/strong&gt; For each store: city and region (marked &amp;quot;new store&amp;quot; if it is not like-for-like), the month&amp;#39;s target, month-to-date sales against the pro-rated target (green at 100% or more, amber at 85% or more, red below), the projected month (and its % of target), growth on last month and on last year, average order value, new against returning (a share bar with bill counts), and new customers against target. Filters: region, every store, like-for-like stores or new stores, and a search. A totals row and an export.&lt;/td&gt;&lt;td&gt;Retail operations. Later: store managers see only their own store.&lt;/td&gt;&lt;td&gt;Month-to-date sales and target, achievement %, projected month, growth on last month and last year, month-to-date average order value, new and returning sales, bills and customers, and the new-customer target and achievement, all as the sheet states them. Only the 35 rows that have a region and are not totals count as stores. The store and online split, region and grand-total rows are left out. New share is new sales divided by new plus returning sales. The totals row adds up the filtered stores and works out the % of pro-rated target again.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Stylist KPI&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Stylists and KPI.&lt;/strong&gt; Every stylist (281, with store totals left out), or store totals. Columns: target (&amp;quot;no target&amp;quot; when zero), revenue and achievement (green at 100% or more, amber at 80% or more), bills and pieces, average selling price, average order value, units per order, new and returning with their average order values, and NPS (&amp;quot;—&amp;quot; where it was not captured). A store filter and an export.&lt;/td&gt;&lt;td&gt;Retail operations&lt;/td&gt;&lt;td&gt;Each row as the workbook states it. Rows marked &amp;quot;Store Total&amp;quot; are kept out of the people list. Achievement shows only when there is a target. Conversion, call target, calls done and NPS are empty on every row in the file we have.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ROS &amp;amp; Health, Concise&lt;/td&gt;&lt;td&gt;The planning decisions on stock health (B11-ii), the plan cells, and the history of actions on every style&amp;#39;s record.&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Worked out each night from Enigma stock and Shopify sales (B11).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Option Count Summary&lt;/td&gt;&lt;td&gt;Plan cells on stock health: number of styles per sub-category against the ideal (overall and for core). New, in production and in planning are counted from requirements and launches.&lt;/td&gt;&lt;td&gt;Planning, design&lt;/td&gt;&lt;td&gt;Counted from where each requirement stands and from launches, not typed in.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ageing&lt;/td&gt;&lt;td&gt;Stock health: age buckets per style, worked out from receipt dates, and a list of styles to consider for liquidation.&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;From the receipt dates on goods-received notes, and from stock. The buckets follow the sheet: 0–90, 90–120, 120–180, 180–270 and over 270 days. This is to be confirmed with BSC, because the July sample has no 90–120 bucket.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fit &amp;amp; Display Projection; Display &amp;amp; Fit Sample Allocation&lt;/td&gt;&lt;td&gt;Launches: pieces per store. The store confirms receipt (B10-iv), and cost lines are hidden from the store.&lt;/td&gt;&lt;td&gt;Planning, warehouse&lt;/td&gt;&lt;td&gt;From the launch record.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Replenishment sample&lt;/td&gt;&lt;td&gt;Phase 5: proposed stock transfers per store, based on each store&amp;#39;s rate of sale and weeks of cover.&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Outside phases 1 to 4.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Margin working, Category penetration, Inventory value, Working capital&lt;/td&gt;&lt;td&gt;These stay in finance&amp;#39;s sheets. The tool exports the rows they need: sales by product code, stock by style, and receipts.&lt;/td&gt;&lt;td&gt;Finance&lt;/td&gt;&lt;td&gt;Out of scope.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Rules.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Every number explains itself.&lt;/strong&gt; Each figure has a &amp;quot;how this is made&amp;quot; note. The note gives the source workbook and column, the calculation, the period, the scope, and what happens with missing or incomplete data. Later: each figure links to the rows behind it.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Reports are pages, not attachments.&lt;/strong&gt; The Monday mail carries a link.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Figures freeze at the week&amp;#39;s end.&lt;/strong&gt; Every figure is frozen at the end of Sunday, the day the reports are dated, so the review and the records agree. Saturday midnight does not match the files.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Blank is blank, never zero.&lt;/strong&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;The page says what the workbooks cannot answer yet.&lt;/strong&gt; They carry four weeks of detail plus a 12-week average. So &amp;quot;best week out of twelve&amp;quot; and &amp;quot;last six weeks against the six before&amp;quot; cannot be worked out from them. Either the extract keeps twelve weekly columns, or the review reads order lines by style code and store code.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Definitions are signed before any recalculation.&lt;/strong&gt; BSC must sign off rate of sale, sell-through, like-for-like growth, repeat customer and the other close-out definitions. Until then, figures are shown as the workbooks state them, not worked out again.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Time target. The Monday workbook effort goes to zero; today it takes one person about half a day, to be confirmed with BSC. The review is read live. The DSR morning call reads month-to-date sales against the pro-rated target straight from the page.&lt;/p&gt;
&lt;p&gt;Sources: Product Weekly Report 090826 2.xlsx (column order of the MTM shirt range and Product On Sale tabs); Ageing 01.07.2026 AMAN AGEING Sample Done.xlsx (bucket names); the DSR and Stylist KPI workbooks in data-files; Discovery Close-Out — 4-Day Field Plan (07 Sep 2026), section 3.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;12-bespoke-mill-to-customer&quot;&gt;&lt;summary&gt;12. Bespoke, mill to customer&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 12. The third made-to-measure bucket, with the stock at the mill: the daily list, the gate at the store, the parcel code, then ordinary MTM production.&lt;/p&gt;&lt;p&gt;Bespoke cloth is never on BSC&amp;#39;s shelf. The mill holds it, reports what it has, and cuts a length against each customer order. So the flow has one daily job (the mill&amp;#39;s list), one gate (a fabric the mill no longer has cannot be sold), and one handshake (the parcel carries a code BSC minted, so it matches its order by itself). Everything after the cloth lands is ordinary made-to-measure production (section 10).&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B12d.1&lt;/td&gt;&lt;td&gt;The mill&amp;#39;s list, every day&lt;/td&gt;&lt;td&gt;Warehouse (today: whoever retypes the five emails)&lt;/td&gt;&lt;td&gt;Opens bespoke, picks a mill, types the metres the mill reported against each fabric and clicks &amp;quot;Save&amp;quot; — or pastes the mill&amp;#39;s own list and clicks &amp;quot;Apply&amp;quot;. A fabric the mill says is gone gets &amp;quot;Out&amp;quot;.&lt;/td&gt;&lt;td&gt;Metres per fabric. In a pasted list: the fabric&amp;#39;s code or name and a number, or &amp;quot;out&amp;quot;, &amp;quot;OOS&amp;quot;, &amp;quot;nil&amp;quot;.&lt;/td&gt;&lt;td&gt;A fabric reported at zero or out goes on hold the same second — off the website and out of every store&amp;#39;s pick list. A fabric reported back in stock comes off hold. Rows the mill did not mention are marked reported today, unchanged.&lt;/td&gt;&lt;td&gt;The mill&amp;#39;s metres, availability and report date sit on the fabric. Stores see today&amp;#39;s stock. A mill not reported today shows as due on the warehouse&amp;#39;s list and on their Today.&lt;/td&gt;&lt;td&gt;Every mill before 10:00; a list older than a day reads &amp;quot;due&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12d.2&lt;/td&gt;&lt;td&gt;The customer orders&lt;/td&gt;&lt;td&gt;Store associate&lt;/td&gt;&lt;td&gt;Punches the bill as for any made-to-measure shirt; the fabric picker offers bespoke fabrics from the books.&lt;/td&gt;&lt;td&gt;Customer, fabric, fit, measurements, promised date.&lt;/td&gt;&lt;td&gt;A bespoke fabric can be picked only if it is live: not paused, not on hold, and the mill&amp;#39;s last report said available. The store cannot sell what the mill does not have.&lt;/td&gt;&lt;td&gt;The order is minted a parcel code (the mill&amp;#39;s prefix plus a short code). It waits for cloth: planning does not see it until the parcel is in. Today Enigma raises a per-order PO in a silent batch; here the call to the mill (B12d.3) is that PO.&lt;/td&gt;&lt;td&gt;At punch; promised date to confirm with BSC (longer than the 14-day made-to-measure default)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12d.3&lt;/td&gt;&lt;td&gt;Call the cloth&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Opens &amp;quot;Call from the mills&amp;quot;, which groups the day&amp;#39;s new bespoke orders by mill with their codes and metres, and clicks &amp;quot;Send request&amp;quot; per mill.&lt;/td&gt;&lt;td&gt;Nothing beyond the click; the request carries the codes and metres.&lt;/td&gt;&lt;td&gt;One request per mill per day; an order punched later joins the next day&amp;#39;s.&lt;/td&gt;&lt;td&gt;The request date goes on each order; they move to &amp;quot;awaited&amp;quot;. The mill sticks BSC&amp;#39;s code on the parcel. An order awaited more than 10 days turns red on the list and on the warehouse&amp;#39;s Today.&lt;/td&gt;&lt;td&gt;Same day as the order&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12d.4&lt;/td&gt;&lt;td&gt;The parcel arrives&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Scans or types the parcel&amp;#39;s code and clicks &amp;quot;Inward&amp;quot;.&lt;/td&gt;&lt;td&gt;The code.&lt;/td&gt;&lt;td&gt;The code must match an open bespoke order not yet received; otherwise &amp;quot;No open bespoke order carries code …&amp;quot; and nothing moves. Later: a holding list for unmatched parcels.&lt;/td&gt;&lt;td&gt;A bespoke-parcel goods-received note is written for the order&amp;#39;s metres (no invoice expected). The order moves to pre-production and planning sees it for the first time. The customer&amp;#39;s promised date is checked against the day it arrived.&lt;/td&gt;&lt;td&gt;On arrival&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12d.5&lt;/td&gt;&lt;td&gt;Make the shirt&lt;/td&gt;&lt;td&gt;Production planner, factory, warehouse&lt;/td&gt;&lt;td&gt;As section 10: planned on capacity, cut and bundled, stitched, back on the vehicle round, shipped.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;A bespoke order never enters a plan before its parcel is in. The allocate table marks it &amp;quot;bespoke&amp;quot;.&lt;/td&gt;&lt;td&gt;As section 10.&lt;/td&gt;&lt;td&gt;As section 10&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12d.6&lt;/td&gt;&lt;td&gt;The books in stores&lt;/td&gt;&lt;td&gt;Warehouse and store&lt;/td&gt;&lt;td&gt;On the swatch-books grid, the bespoke book is the mill&amp;#39;s own; the warehouse marks &amp;quot;Mill has sent&amp;quot;, the store confirms it arrived. A fabric the mill has dropped is switched off here, and the store is told to sticker the swatch.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;A book unconfirmed after 7 days shows on both lists.&lt;/td&gt;&lt;td&gt;Every store&amp;#39;s bespoke book is counted, which it is not today.&lt;/td&gt;&lt;td&gt;Confirmed within 7 days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12d.7&lt;/td&gt;&lt;td&gt;Reading it&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;The weekly review&amp;#39;s bespoke tab reads off the same orders: bespoke against core and non-core by ticket band, each of the last four weeks (section 12).&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Monday&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;Rules.&lt;/strong&gt; Bespoke has no reorder point and never fires a stock purchase order: the only thing that makes a bespoke fabric sellable is the mill&amp;#39;s last report. Sold out puts it on hold at once, everywhere, with no second person remembering to do it. The parcel&amp;#39;s code is minted by BSC when the order is punched, never typed in from the mill&amp;#39;s paperwork, so the match is exact. A bespoke order waits outside the plan until its cloth is in. The goods-received note is for the order&amp;#39;s metres only; the fabric never joins BSC&amp;#39;s shelf stock. Who owns bespoke at BSC is still to be confirmed — the flow above gives the daily list and the parcels to the warehouse and the books to the warehouse and stores, and leaves the mill relationship with sourcing.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Cases.&lt;/strong&gt;&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;What happens&lt;/th&gt;&lt;th&gt;Why&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;The mill reports only available or unavailable (Thomas Mason, Albini)&lt;/td&gt;&lt;td&gt;Metres stay blank; availability alone switches the fabric on or off&lt;/td&gt;&lt;td&gt;These mills give no quantity; the gate still holds&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The mill sells out after the order was punched&lt;/td&gt;&lt;td&gt;The fabric goes on hold; the order stays awaited and turns red at 10 days; the store is told and the customer chooses another cloth or a refund through the store&amp;#39;s case ladder (section 6)&lt;/td&gt;&lt;td&gt;To build: today nobody measures how often this happens&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A parcel arrives with a code no open order carries&lt;/td&gt;&lt;td&gt;Refused at inward with the message; the parcel waits&lt;/td&gt;&lt;td&gt;Later: a holding list&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The mill&amp;#39;s list did not come today&lt;/td&gt;&lt;td&gt;The fabric shows &amp;quot;due&amp;quot;; yesterday&amp;#39;s metres stand and the fabric stays sellable&lt;/td&gt;&lt;td&gt;A missing report is not a sell-out&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A bespoke article sells so well that BSC wants to stock it&lt;/td&gt;&lt;td&gt;Design promotes it to core from the fabric master, which gives it a reorder point and asks sourcing for a supply block (section 1 and 7)&lt;/td&gt;&lt;td&gt;Open question Q81: has this ever happened&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A customer orders a bespoke fabric online&lt;/td&gt;&lt;td&gt;Same flow; the parcel code and the wait are the same; the promised date shown online must come from the mill&amp;#39;s lead time&lt;/td&gt;&lt;td&gt;To confirm with BSC&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;Time targets.&lt;/strong&gt; Mill list before 10:00 every day; the call to the mill the same day the order is punched; the parcel inside the mill&amp;#39;s lead time (to confirm per mill: a week or so domestic, about three weeks from Italy); inward the day it lands; a bespoke book confirmed within 7 days of dispatch.&lt;/p&gt;
&lt;p&gt;Sources: current-process section A13 and its sources; the MTM production and warehouse flows (B12.4 bespoke parcels, B12.10 swatch books, B12a bespoke gate, B11 &amp;quot;never below the point&amp;quot;); Enigma Answers finding 2 (per-order bespoke PO, batch times, missing vendor codes); Question Bank block F; Thinking Doc — MTM First Cut, Phase 2 (&amp;quot;bespoke availability ingested instead of re-keyed&amp;quot;).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;group&quot;&gt;Build reference for the implementation team&lt;/div&gt;
&lt;details id=&quot;screen-specifications&quot;&gt;&lt;summary&gt;Screen specifications&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Eighteen navigation entries (seventeen screens; the two vendor pages share one component), the bell (&lt;code&gt;MentionBar&lt;/code&gt;, at the top of every screen) and the search palette (⌘K). Every list screen puts its tab and filters in the URL (&lt;code&gt;?tab=&lt;/code&gt;, &lt;code&gt;?open=&lt;/code&gt;, &lt;code&gt;?kind=&lt;/code&gt;, &lt;code&gt;?factory=&lt;/code&gt;, &lt;code&gt;?vendor=&lt;/code&gt;, &lt;code&gt;?slot=&lt;/code&gt;), so a saved view is a URL. Lists page at 20 rows (&lt;code&gt;usePager&lt;/code&gt; default), most carry an &lt;code&gt;Export&lt;/code&gt; button that writes &lt;code&gt;.xlsx&lt;/code&gt; of the visible rows, and rows open the record in a right-hand drawer (&lt;code&gt;Drawer&lt;/code&gt;) with sections that fold. Outside quiet mode a list shows a worked-example strip (&lt;code&gt;useExamples&lt;/code&gt;) with a few rows first. Tab ids are the exact &lt;code&gt;?tab=&lt;/code&gt; values; labels are the exact strings on screen.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Screen (path · &lt;code&gt;&amp;lt;Page title&amp;gt;&lt;/code&gt;)&lt;/th&gt;&lt;th&gt;Purpose&lt;/th&gt;&lt;th&gt;Tabs (id → label) and filters&lt;/th&gt;&lt;th&gt;Actions on the screen (button labels)&lt;/th&gt;&lt;th&gt;Record panel sections, in order&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Requirements (&lt;code&gt;/design&lt;/code&gt; · &amp;quot;Design requirements&amp;quot;)&lt;/td&gt;&lt;td&gt;Design&amp;#39;s one list of every ask at its stage&lt;/td&gt;&lt;td&gt;Seg &amp;quot;kind&amp;quot;: all → Every kind · MTM → MTM fabric · RTW → RTW style · Options → Several options. Seg &amp;quot;Stage&amp;quot;: all → All · 1 → 1 · Requirement · 2 → 2 · Sourcing · 3 → 3 · Finalised &amp;amp; ordered · 4 → 4 · Downstream · 5 → Live. Search &amp;quot;Search requirement, fabric, style…&amp;quot;. Columns: Requirement · Kind · Stage · Sourcing state · Next (action + owning team); rows sorted by stage, then mine first&lt;/td&gt;&lt;td&gt;&lt;code&gt;+ New requirement&lt;/code&gt; (asks the kind, then one of three forms: MTM concept; Options; RTW/FOB style)&lt;/td&gt;&lt;td&gt;MTM concept (from Concepts.tsx): From the design meeting · 1 · Request · 2 · Sampling (Sample &amp;amp; PAT file; Approval to every department) · 3 · Vendors · 4 · Purchase order · 5 · Fabric in · 6 · Go live · stores, then online (Designs on this fabric · n; Configured in Enigma; Enigma flags that drive the flow; Name &amp;amp; price; Story &amp;amp; live in stores; Swatch desk; Live online) · Other steps / All steps (folded) · Files · conversation · activity. RTW/FOB style (from Requirements.tsx): The call · the live step titled &amp;quot;n · Request / Vendors / Purchase order / Fabric in / Sampling / Go live&amp;quot; · Other steps (folded) · Style sheet · job card · tail; the Request step holds What · How many, by when, at what cost · What fabric — the brief sourcing shops against (or &amp;quot;— what the vendor must buy&amp;quot;) · Size curve (auto, editable later) · BOM. Option request (from OptionRequests.tsx): 1 · The ask · 2 · The options · n (one card per slot with the vendor form and the three answers) · Bill of materials — the trims and packaging, one per line · tail&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Swatch desk (&lt;code&gt;/swatches&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Where every new MTM fabric is on its way to the stores&lt;/td&gt;&lt;td&gt;all → All · cut → To cut &amp;amp; sticker · dispatch → To dispatch · tell → To tell stores · live → Live in stores; one row per concept with the seven dated steps as chips (Bulk received · To swatches · Cut · Sticker · Dispatched · Photos · Stores told), priority first&lt;/td&gt;&lt;td&gt;Per row the next step&amp;#39;s button (warehouse) or &lt;code&gt;Stores told to display it&lt;/code&gt; / &lt;code&gt;Go live&lt;/code&gt; (design); priority toggle&lt;/td&gt;&lt;td&gt;Designs on this fabric · n · The sticker page (one box per design; print) · The desk · where it is · Stores · n confirmed of m · Fabric&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM fabric master (&lt;code&gt;/fabrics&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;What sells and what to buy&lt;/td&gt;&lt;td&gt;Two levels. sell → What sells: books → Swatch books (book tiles: All + the four MTM books; state filter all → Every fabric · active → On the shelf · coming → Cloth coming · hold → On hold · paused → Paused; search &amp;quot;Search fabric, code, design, product code…&amp;quot;) · noncore → Ranges · non-core gaps. buy → What to buy: core → Core · reorder points · bespoke → Bespoke · mill availability · blocks → Vendor blocks · countdown. orders → Cloth on order: pos → Fabric POs · confirm with mills (filter all → All open · chase → Unconfirmed · chase · confirmed → Confirmed · design → Raised by design; search &amp;quot;Search PO, fabric, code, mill, remark…&amp;quot;) · trims → Trims &amp;amp; packaging. Design and planning land on What sells; sourcing on What to buy&lt;/td&gt;&lt;td&gt;&lt;code&gt;Raise it now · n m&lt;/code&gt; (core below ROP), &lt;code&gt;Raise PO · n m to {mill}&lt;/code&gt; (international), &lt;code&gt;Asked the mill…&lt;/code&gt; then &lt;code&gt;Save · in stock&lt;/code&gt; / &lt;code&gt;Save · escalate to design&lt;/code&gt;, &lt;code&gt;Switch off · supplier&lt;/code&gt;, &lt;code&gt;Switch back on&lt;/code&gt;, &lt;code&gt;Switch off on Shopify &amp;amp; stores&lt;/code&gt;, &lt;code&gt;Switch back on — in stock&lt;/code&gt;, &lt;code&gt;Restore to sale&lt;/code&gt;, &lt;code&gt;Resume selling&lt;/code&gt;, &lt;code&gt;Convert to PO&lt;/code&gt;, &lt;code&gt;Release&lt;/code&gt;, &lt;code&gt;Received&lt;/code&gt; (trims), &lt;code&gt;Mill confirmed…&lt;/code&gt; / &lt;code&gt;Update date / remark&lt;/code&gt;, &lt;code&gt;Promote to core →&lt;/code&gt;, &lt;code&gt;Demote to non-core →&lt;/code&gt;, &lt;code&gt;End block&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Where it stands · Stock &amp;amp; coverage · Auto-PO threshold · Enigma · Mill availability (bespoke) · Sales · last 12 weeks · Blocks at {mill} · In stores · n · Lifecycle (pause / resume, rename, bucket, core block) · tail&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric sourcing (&lt;code&gt;/sourcing&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Sourcing&amp;#39;s asks to answer&lt;/td&gt;&lt;td&gt;Seg &amp;quot;Whose turn&amp;quot;: all → All · vendors → Sourcing to add vendors · choose → Design to push PO · extend → Extension asked · po-raised → PO raised · get the cloth in. Search &amp;quot;style, brief, or vendor&amp;quot;. Export &lt;code&gt;fabric-sourcing&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Vendor form (&lt;code&gt;Save vendor&lt;/code&gt; / &lt;code&gt;Save changes&lt;/code&gt;, &lt;code&gt;Edit&lt;/code&gt;, fields Mill · ₹ / m · MOQ · m · Width · cm · Lead · days · Holds until · Composition · Note · Fabric cost), &lt;code&gt;Send to design →&lt;/code&gt;, &lt;code&gt;Extend&lt;/code&gt;, &lt;code&gt;Send back to design&lt;/code&gt;, &lt;code&gt;Push PO&lt;/code&gt;, &lt;code&gt;Unchoose&lt;/code&gt;, &lt;code&gt;Allocate&lt;/code&gt; (only inside Requirements)&lt;/td&gt;&lt;td&gt;Fabric · What design asked for · Vendor &amp;amp; terms · BOM (read-only) · Costing · COGS · Factory (Allocate a factory · on capacity) · tail&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric vendors · mills (&lt;code&gt;/mills&lt;/code&gt; · &amp;quot;Fabric vendors&amp;quot;)&lt;/td&gt;&lt;td&gt;Lead times and block windows, by mill; find a cloth&lt;/td&gt;&lt;td&gt;fabrics → Find a fabric (filter all → Everything · buyable → Can be bought today · below-rop → Below reorder point · blocked → Already blocked for us · stopped → Stopped; search &amp;quot;linen, 2-ply poplin, ART-4471, Albini…&amp;quot;; export &lt;code&gt;fabric-sourcing&lt;/code&gt;) · mills → The mills (editable lead days, MOQ, block window)&lt;/td&gt;&lt;td&gt;Inline edits (sourcing)&lt;/td&gt;&lt;td&gt;Vendor drawer (&lt;code&gt;?vendor=&lt;/code&gt;): Master · Performance · Open POs · n · Closed POs · n · Fabrics · n · Blocks · Escalations · tail&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Factories &amp;amp; capacity (&lt;code&gt;/vendors&lt;/code&gt; · &amp;quot;Factories&amp;quot;)&lt;/td&gt;&lt;td&gt;Who makes what, how much a day, how late&lt;/td&gt;&lt;td&gt;factories → Capacity &amp;amp; planning inputs · performance → On-time performance&lt;/td&gt;&lt;td&gt;Inline edits of tailors, distance, daily target, corporate, urgent reserve, lead days, MOQ&lt;/td&gt;&lt;td&gt;Vendor drawer: MTM floor · today · Master · Performance · Open POs · Closed POs · Fabrics · Blocks · Escalations · tail&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW stock health (&lt;code&gt;/health&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Every option: rate of sale, size gaps, action&lt;/td&gt;&lt;td&gt;options → Every option · what to do · plan → Option count vs the plan · replen → Replenish &amp;amp; pull back · this week. Seg intent: all → All · buy → Get stock in · back → Bring back · clear → Clear it out · fine → Leave it · asked → Stores asked for it. Book filter; search &amp;quot;Search style, sub-category, SKU…&amp;quot;; export &lt;code&gt;rtw-stock-health&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;Promote to core&lt;/code&gt;, &lt;code&gt;Liquidate, pull displays &amp;amp; take off the shelf&lt;/code&gt;, &lt;code&gt;Take off the shelf&lt;/code&gt;, &lt;code&gt;Make active only&lt;/code&gt; / reorder (reintroduce with qty), each with a note&lt;/td&gt;&lt;td&gt;The call (verb, why, &lt;code&gt;Why&lt;/code&gt; rule) · Sizes, sales and the reorder maths · Supply and sell-through · In stores · tail&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What is selling (&lt;code&gt;/insights&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;The weekly report, the DSR and the stylist KPI&lt;/td&gt;&lt;td&gt;weekly → Weekly review (sub-tabs summary → The week in one table · category → Category × sub-category · range → By range · bands → MTM price bands · sale → On sale; Seg &amp;quot;Look at&amp;quot; qty → Units / rev → Revenue; Seg &amp;quot;Show&amp;quot; rtw → RTW shirts · by sub-category / mtm → MTM shirts · by fabric range; sale filter all → Every style on sale · worked → Discount moved it · flat → Discount did nothing; export &lt;code&gt;products-on-sale&lt;/code&gt;) · dsr → Stores · DSR (Seg &amp;quot;Region&amp;quot; all → Every store · SSSG → Same-store (SSSG) · Non SSSG → New stores; search &amp;quot;store or city&amp;quot;; export &lt;code&gt;dsr&lt;/code&gt;) · stylists → Stylists · KPI (people → Every stylist · stores → Store totals; export &lt;code&gt;stylist-kpi&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;None (read-only)&lt;/td&gt;&lt;td&gt;How these numbers are made&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW launches (&lt;code&gt;/launches&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;New options on their way to the stores&lt;/td&gt;&lt;td&gt;One tab per drop month (e.g. &lt;code&gt;Oct 26&lt;/code&gt;) plus all → All; filter all → All · attention → Needs attention · ready → Ready to launch · laun
