 also by email&lt;/td&gt;&lt;td&gt;~45 days for CMT shirts once cloth and go-ahead are in (design, 22 Sep); the Config template says PO → Inhouse 34 days for CMT shirts, 47 FOB shirts, 63 bottoms, 77 jeans&lt;/td&gt;&lt;td&gt;Planning reads &amp;quot;In Production&amp;quot; and &amp;quot;Expected Date&amp;quot; off it for A3.1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.11&lt;/td&gt;&lt;td&gt;Finished goods received (&amp;quot;inverted&amp;quot;)&lt;/td&gt;&lt;td&gt;Warehouse (Shravani&amp;#39;s team)&lt;/td&gt;&lt;td&gt;Vehicle arrives&lt;/td&gt;&lt;td&gt;Enigma GRN closes the design PO; Enigma holds finished-piece stock per variant per warehouse (&lt;code&gt;/design/list-variants-with-inventory&lt;/code&gt;, &lt;code&gt;variantSkuCode BOM-SHI-RE-6797-OLIVE-36&lt;/code&gt;); ShipHero mapped on 15 of 50 stores (the record said ~28 locations); bottoms go through the hemming unit, which no system sees&lt;/td&gt;&lt;td&gt;Qty, lot, bin; rejected pieces&lt;/td&gt;&lt;td&gt;Enigma + ShipHero&lt;/td&gt;&lt;td&gt;Same day; &amp;quot;only after inverting the stock can I see it in the system and do an allocation&amp;quot; (Charanjeet). For an urgent launch the merchandiser gives a manual dispatch quantity and allocation is drafted before inward&lt;/td&gt;&lt;td&gt;Invoice &amp;quot;should go to finance for GST and to the merchandiser for reconciliation — often lost or delayed&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.12&lt;/td&gt;&lt;td&gt;Put in a drop and allocated to stores&lt;/td&gt;&lt;td&gt;Planning / Warehouse (Nitin / Prince dispatch)&lt;/td&gt;&lt;td&gt;Goods in&lt;/td&gt;&lt;td&gt;Monthly Drops (Status · SR. NO. · CATEGORY · MODEL · venndor code · OLD NAME · NEW STYLE NAME · PRICE · FACTORY · Expected Date - 23rd Jul · Display allocation · Dispatch Status (Nitin/Prince) · LAUNCH · Remarks · Production Status · Swatch Status · HERO PRODUCTS · KEY POINTERS · Prince / Swatches to send · remarks); Display &amp;amp; Fit Sample Allocation (tabs Fit · Display · Bulk; Date · SKU · Shiphero Style Name · Store Name · Qty · Value · FOB · CMP · Trims + Packaging · Fabric · Total COGS/PC · Hemming · Top/Bottom · Category · Sub-Category 1 · Sub-Category 2 · Core/Non-Core · Size · Remarks FIT/DISPLAY/Off the Rack); Fit &amp;amp; Display Projection (Vendor · Region · PO No. · PO status · Style/Color · Shiphero Style Name · Launch status · Order Qty · month · Display · FOB · CMT · Trims · Fabric · Total · Value · Status); STO &amp;amp; Swatches Tracker → STO (STO Series No. &amp;quot;1931-1965&amp;quot; · STO Type Display / Off the rack · STO Date · Mail subject · Category · Product Referance Name · Hemming type &amp;quot;Closed hem/finished bottom hem&amp;quot; / &amp;quot;Bottom Open/ Unhemmed.&amp;quot; / NA · Qty · Priority · Stock received date · Stock Inward Date · Expected Shipping Date · Revised Expected Shipping Date · STO Status · Dipatched status · Comments/Remarks)&lt;/td&gt;&lt;td&gt;Drop month, expected at HO, one display piece per store (size M / 32), a fit set, &amp;quot;bulk&amp;quot; of 1-1-1 per size to the ~7 stores that hold RTW shirt stock; each STO typed into Enigma and uploaded; the swatch goes with the display piece&lt;/td&gt;&lt;td&gt;Excel → Enigma STO → ShipHero pick&lt;/td&gt;&lt;td&gt;1–2 weeks before launch; display pieces are issued at COGS (Fit sheet: ₹911.30 for a fit-sample shirt, ₹646.56 jeans)&lt;/td&gt;&lt;td&gt;Stores told by PDF and Slack about a week before; &amp;quot;no confirmation that stores received stock&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A3.13&lt;/td&gt;&lt;td&gt;Launched&lt;/td&gt;&lt;td&gt;Planning / Marketing / Design&lt;/td&gt;&lt;td&gt;Launch date&lt;/td&gt;&lt;td&gt;Enigma design must exist before Shopify can list it; the Shopify stock push is a per-warehouse button (&amp;quot;Sync Inventory For FOB Design&amp;quot;, Sync Status blank on all 46); marketing gets name and description 10–15 days before launch; final name (REVISED NAME / FINAL PRODUCT NAME) flows to Shopify, Enigma and the website&lt;/td&gt;&lt;td&gt;Marketing name, PDP copy, KEY POINTERS (&amp;quot;100% Cotton, soft &amp;amp; breathable, contrast white banker collar&amp;quot;)&lt;/td&gt;&lt;td&gt;Shopify + Enigma&lt;/td&gt;&lt;td&gt;Launch day; RTW keeps POS and online launches close together (unlike MTM, where online is ~2 weeks later)&lt;/td&gt;&lt;td&gt;Stores confirm display received in Slack, sometimes&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Where it breaks. A3.1 plans from an ideal count, not from velocity or cover: 1,100 units a week × 12 weeks at 80% sell-through needs ~16,500 units, but 136 options × 150 MOQ = 20,400 (× 200 = 27,200), so ~3,900 surplus units are built in before a shirt is designed; only 59 of 134 options were healthy on 12 Aug (79 of 642 SKUs on 02 Aug), and &amp;quot;nowhere is the quantity being addressed&amp;quot; (Charanjeet). The ideal counts themselves are a guess — &amp;quot;whether 25 or 26 options in core is the right number, I don&amp;#39;t know&amp;quot; — and two of three option-count rows have a blank ideal. A3.2 is hostage to vendor stock. A3.3&amp;#39;s block lives in three sheets with no countdown. A3.4 has no owner everyone agrees on. A3.5 allocates by email with no record, and the size history is already polluted by weeks when sizes were broken. A3.6 is hand-made per style, and trim cards still travel as paper. A3.7–A3.8 keep no version, date or decision; &amp;quot;sample approvals live in email and in people&amp;#39;s memory&amp;quot;. A3.10 is re-dated by phone. A3.11&amp;#39;s invoice goes missing and the hemming unit is invisible. A3.12&amp;#39;s display pieces are never confirmed received, and STOs stay open after the goods arrive. A3.13 depends on a manual sync button nobody logs.&lt;/p&gt;
&lt;p&gt;Sources: Discovery Record v1.2 §01, §03, §05; Tranbscript of granola recording (Meetings 1, 3); RTW shirts inventory call + transcript (12 Aug 2026); Sourcing call summary + transcript (6 Aug 2026); Transcript of call (Charanjeet, Parag, 26:24–35:49); Discovery 3rd visit; Discovery 4th sitting; Invisit meeting contexts §5–§7; Enigma Answers (26 Aug 2026); memory bsc-design-discovery-2026-09-22 (RTW, FOB, go-live); data-files: Option Count Summary Sample.xlsx, RTW_Shirts_Concise_Updated 10.xlsx (ROS &amp;amp; Health Summary, Line-Item Detail), BSC_ Merchandise Master Bottoms_Jackets.xlsx, Monthly Drops Products Sample.xlsx, Display Fit Sample Allocation Sample.xlsx, Fit Display Projection Jun26 Sample.xlsx, STO Swatches Tracker.xlsx (STO), Trims Working Sample.xlsx, Fabric Trims Deduction Tracker Sample.xlsx; bsc-plm-original/src/domain/reference.ts (OFFSETS, MERCHANDISERS, cited from Production Tracker Final V2.xlsx).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;4-swatches-to-stores&quot;&gt;&lt;summary&gt;4. Swatches to stores&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Every new MTM fabric becomes 25×25 cm swatches, one set per destination, tracked in a 119-column tab (34 destination column groups) and a Slack channel; the sticker on each swatch is made by hand in Canva / Illustrator, and no store confirms receipt (&amp;quot;nobody knows which swatches reached which store&amp;quot; — Discovery Record §2d).&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Who the warehouse is (design team walkthrough, 7 Oct 2026).&lt;/strong&gt; Two people for now. Shravani receives the cloth, hands it over, ships, and keeps the tracker. Yusuf runs the swatch desk: he gets the design codes and the sticker file once design has created the designs, cuts the 25 × 25 swatches for every store, and sends the photos of what went. The swatches then go to shipping, and shipping updates the tracker.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Trigger&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields (MTM_Swatches tab)&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Hand-off&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A5.1&lt;/td&gt;&lt;td&gt;Bulk cloth received and logged&lt;/td&gt;&lt;td&gt;&amp;quot;Fabric received at factory, logged with inward date by one person&amp;quot; (22 Sep Granola notes); the 22 Sep memory says warehouse, the 24 Sep note says factory — to confirm who&lt;/td&gt;&lt;td&gt;GRN done (A1.8)&lt;/td&gt;&lt;td&gt;STO &amp;amp; Swatches Tracker → &lt;code&gt;MTM_Swatches&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;Date · Production Type(MTM,RTW,Kurta &amp;amp; Bot…) · Vendor Name · Fabric Dispatched date · Fabric Bulk Received date · Fabric code · Fabric Name · Category&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Sheet row typed by hand; the copy we hold has one row (01 Aug 2026, MTM, Jeans, Priority-1, Picario)&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;td&gt;Row exists; design sees it if they open the sheet&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A5.2&lt;/td&gt;&lt;td&gt;Handed to the swatch cutter&lt;/td&gt;&lt;td&gt;Swatch team&lt;/td&gt;&lt;td&gt;A5.1&lt;/td&gt;&lt;td&gt;Same tab&lt;/td&gt;&lt;td&gt;&lt;code&gt;Fabric Team handover date for swatches · Priority&lt;/code&gt; (&amp;quot;Priority-1&amp;quot;, highlighted) · &lt;code&gt;Remark (Reqd / Not Reqd)&lt;/code&gt; · &lt;code&gt;Types of Swatches&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Sheet&lt;/td&gt;&lt;td&gt;1–3 days (to confirm)&lt;/td&gt;&lt;td&gt;Yusuf cuts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A5.3&lt;/td&gt;&lt;td&gt;Swatches cut&lt;/td&gt;&lt;td&gt;Yusuf (one person)&lt;/td&gt;&lt;td&gt;A5.2&lt;/td&gt;&lt;td&gt;Not recorded as a date; images posted in the Slack channel&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Physical; Slack photos&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;td&gt;To the sticker&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A5.4&lt;/td&gt;&lt;td&gt;Sticker made&lt;/td&gt;&lt;td&gt;Design / merchandising (&amp;quot;I make stickers manually&amp;quot; — Janak, 30 Jul)&lt;/td&gt;&lt;td&gt;A5.3&lt;/td&gt;&lt;td&gt;Canva / Illustrator file, one per fabric; the tracker&amp;#39;s &lt;code&gt;Sticker Link&lt;/code&gt; column is empty&lt;/td&gt;&lt;td&gt;Two descriptions on record: (a) 22 Sep memory — a label sheet, three across, five lines: fabric code · name – mill article · book (e.g. SOKTAS BESPOKE) · MRP · &amp;quot;Incl. of all taxes&amp;quot;, repeated per swatch going out; (b) 22 Sep Granola notes — &amp;quot;fabric name + MRP… one style per page so store staff can print and stick&amp;quot;. Both say it is fully manual and BSC asked for it to be generated from the system&lt;/td&gt;&lt;td&gt;Canva / Illustrator → printed on label stock (at HO or at the store — to confirm)&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;td&gt;Stuck on each swatch; no barcode, so stores type fabric names to punch&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A5.5&lt;/td&gt;&lt;td&gt;Dispatched per destination&lt;/td&gt;&lt;td&gt;Shipping team&lt;/td&gt;&lt;td&gt;A5.4&lt;/td&gt;&lt;td&gt;Same tab: 34 destination groups in header order — Picario · Head Office · Ahmedabad · Lavelle Rd · Indiranagar · Jayanagar · Chennai · KHAN MARKET · South Ex. · Gurugram · Noida · Hyderabad · Jaipur · Pune · Pali Hill · Kala Ghoda · Kemps Corner · Andheri · Borivali · SKY CITY BORIVALI · Juhu · Oberoi Mall · Select City Walk · Seawoods · Kochi · KOLKATA · SARATH CITY · KURLA STORE · Banglore (Whitefiled) · EXPRESS AVENUE (CHENNAI) · Picario (again) · New York · Inorbit Mall · Lakeshore Mall&lt;/td&gt;&lt;td&gt;Per destination &lt;code&gt;Tracking no. · Dispatch Date · Receiving Date&lt;/code&gt; (the first Picario group has no Receiving Date); &lt;code&gt;Expected sending Date · Revised Expected Shipping Date · Status · Remarks&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Sheet + courier slips&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;td&gt;Photos of the dispatch posted in the swatch Slack channel&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A5.6&lt;/td&gt;&lt;td&gt;Store receives&lt;/td&gt;&lt;td&gt;Store&lt;/td&gt;&lt;td&gt;Parcel arrives&lt;/td&gt;&lt;td&gt;Slack, sometimes; &lt;code&gt;Receiving Date&lt;/code&gt; rarely filled&lt;/td&gt;&lt;td&gt;Receiving date, if anyone writes it&lt;/td&gt;&lt;td&gt;Slack message&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;No store confirms reliably&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A5.7&lt;/td&gt;&lt;td&gt;Stores told to display&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;A5.5&lt;/td&gt;&lt;td&gt;Slack post; the Tuesday Excel&amp;#39;s &lt;code&gt;Swatches to Stores&lt;/code&gt; column (&amp;quot;Live on 3/4/25&amp;quot;, &amp;quot;New Fabric / Display Swat…&amp;quot;)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Slack; Excel&lt;/td&gt;&lt;td&gt;Weekly&lt;/td&gt;&lt;td&gt;Store adds the swatch to the book by hand; a sold-out swatch gets an on-hold sticker &amp;quot;and does anyone check it was done?&amp;quot; (Store Visit Questions Q12)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A5.8&lt;/td&gt;&lt;td&gt;Fabric switched on for stores; online later&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Whenever design decides&lt;/td&gt;&lt;td&gt;Enigma &lt;code&gt;isOnHold&lt;/code&gt;; Shopify after the swatch shoot and video, ~2 weeks later&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Enigma, Shopify&lt;/td&gt;&lt;td&gt;Any time&lt;/td&gt;&lt;td&gt;A1.12&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Where it breaks. A5.4 is manual per fabric and the two accounts of its format disagree. A5.5–A5.6: 34 groups of tracking numbers and no receipt confirmation. &lt;code&gt;Status&lt;/code&gt; is free text; &lt;code&gt;Priority&lt;/code&gt; is a highlight, not a field; &lt;code&gt;Sticker Link&lt;/code&gt; is empty. The &lt;code&gt;FOB_Swatches&lt;/code&gt; tab duplicates the whole 119-column structure for RTW swatches, and the &lt;code&gt;STO&lt;/code&gt; tab (&lt;code&gt;STO Series No. · STO Type · STO Date · Mail subject · Category · Product Referance Name · Hemming type · Qty · Priority · Stock received date · Stock Inward Date · Expected Shipping Date · Revised Expected Shipping Date · STO Status · Dipatched status · Comments/Remarks&lt;/code&gt;) tracks display and off-the-rack waves in the same file. Bespoke books reach stores from the mills directly and are counted nowhere.&lt;/p&gt;
&lt;p&gt;Sources: STO &amp;amp; Swatches Tracker.xlsx (MTM_Swatches, FOB_Swatches, STO tabs); Granola notes &amp;quot;BSC - Design/Planning&amp;quot; (22 Sep 2026) and memory bsc-design-discovery-2026-09-22; Tranbscript of granola recording (30 Jul); Discovery Record v1.2 §2d; Store Visit Questions (13 Aug) and store visit summaries; Copy NEW Swatch Books Weekly Stock Update.xlsx.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;5-store-day-returns-and-alterations&quot;&gt;&lt;summary&gt;5. Store day, returns and alterations&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;A store manager, a master tailor (&amp;quot;the master&amp;quot;) and a sales/styling associate run each store across four tools that do not talk to each other: Shopify (billing, customer profile, order entry), Enigma — called Anima on the floor (measurements, styling inputs, production; the name &amp;quot;Anima&amp;quot; does not appear anywhere in the Enigma build read on 26 Aug 2026, so it is a floor name for the same system, to confirm), the OPSR app (daily checklists, morning and end-of-day routines, centrally monitored), and Slack (returns, refunds, escalations, stock asks). There is no CRM; Superfone is being brought in to replace MCU for customer communication. The only view of MTM fabric stock is a shared Excel that merchandising refreshes once a week, usually Tuesday, which stores can read but not edit.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Store manager call, 13 Oct 2026 (recording, AI transcript; timestamps for re-listening).&lt;/strong&gt; What the floor added to the picture above:&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Topic&lt;/th&gt;&lt;th&gt;What the store does today&lt;/th&gt;&lt;th&gt;Where&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Taking an MTM order&lt;/td&gt;&lt;td&gt;A regular customer with measurements on file orders straight away, promise 10–12 days. A new customer gets a trial shirt first: 10–12 days for the trial, then 10–12 days for the order, about 25 days in all. There is no express service; an urgent order is tagged and made in 7–8 days for a ₹600 charge (other custom brands charge 20–30%).&lt;/td&gt;&lt;td&gt;13:01–15:27&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ship-by date&lt;/td&gt;&lt;td&gt;Enigma sets it on punch; when the factory is late the store revises it by hand. Shipping reads 2 days but is 3–4 in practice; a Mumbai factory to a Mumbai store is a day.&lt;/td&gt;&lt;td&gt;12:12–12:52, 01:16:01&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Customer profile&lt;/td&gt;&lt;td&gt;One profile holds one fit and one size. A customer who wants a structured formal and a relaxed casual, or is M in one garment and L in another, cannot be held: the order is split and the second piece waits until the first is in pre-production. The store re-measures only when the customer says their body has changed.&lt;/td&gt;&lt;td&gt;21:52–24:34, 37:06&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Who measured&lt;/td&gt;&lt;td&gt;The master takes the measurement, the stylist writes it. Enigma has no field for either, so a wrong shirt cannot be traced; the store keeps its own notebook of who measured whom.&lt;/td&gt;&lt;td&gt;34:11–34:26&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Comments&lt;/td&gt;&lt;td&gt;Styling comments typed on the order do not reach the factory, who retype them. A second kind, the logistic comment for the shipping team (&amp;quot;suit, sold together, match the trouser&amp;quot;), has no field either.&lt;/td&gt;&lt;td&gt;51:12–55:41&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric stock on the floor&lt;/td&gt;&lt;td&gt;Three buckets: international, core (always available), non-core (limited). The swatch tracker is updated weekly with metres; non-core or bespoke down to 2–3 m is discontinued. After a punch the store sees physical versus saleable (a 31.5 m fabric showed 11.45 m saleable; the rest is the reserve for remakes and alterations). Metres are deducted by hand, so a fabric with a few metres left can be oversold; no notification comes when a fabric is closed.&lt;/td&gt;&lt;td&gt;04:08–06:21, 11:43–12:07, 01:05:55–01:08:04&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW on the floor&lt;/td&gt;&lt;td&gt;Display pieces in a few colours and sizes; fit samples for some. A customer may order two sizes to try, then only one is processed. Sizes per piece are punched separately for a semi-made suit. The store cannot see other stores&amp;#39; stock; a transfer is begged for in a pan-India WhatsApp group. A display piece sold once has no stock behind it.&lt;/td&gt;&lt;td&gt;19:46–21:15, 30:08, 53:37, 01:10:28–01:12:56&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Billing&lt;/td&gt;&lt;td&gt;Shopify first, then Enigma. A mixed bill is split so an offer applies to the right lines. Price changes come as a sheet, once a year per category; every sticker on every swatch is changed by hand. Barcodes on display pieces are wanted for audits.&lt;/td&gt;&lt;td&gt;18:15, 43:47, 01:17:27–01:23:04&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Daily closing&lt;/td&gt;&lt;td&gt;A report for leadership (orders, quantities, value, discount, by shirt and trouser) matched by hand from Shopify, about 45 minutes a day.&lt;/td&gt;&lt;td&gt;43:47–44:50&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Returns and alterations&lt;/td&gt;&lt;td&gt;30 days: alteration free (in store if the master can, else at the factory); a return gets a credit note, valid a year like a gift card, sitting on the customer&amp;#39;s profile. A full refund to the bank needs HO approval and goes to the same account.&lt;/td&gt;&lt;td&gt;01:20:40–01:26:41&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Deliveries&lt;/td&gt;&lt;td&gt;Several customers&amp;#39; orders arrive in one box; the store scans each in and messages the customer on WhatsApp. International orders carry shipping and duty for the customer.&lt;/td&gt;&lt;td&gt;56:04–01:02:44&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Launches&lt;/td&gt;&lt;td&gt;Swatches should reach the store before a launch. Fabric composition and a description must be there when it goes live; a bamboo launch went out with the percentages missing. Swatch-book errors (stripe direction) are corrected by hand. The store asks for a short video or screenshots whenever something new goes live.&lt;/td&gt;&lt;td&gt;01:27:11–01:33:46&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;What the store asked for:&lt;/strong&gt; more than one fit profile per customer and a size per product; a &amp;quot;who measured&amp;quot; field; order and logistic comments that reach the factory and shipping; a notification when a fabric is closed; a live view of every store&amp;#39;s stock; stickers and price tags printed from the system; measurements that update every open order when they change; a compulsory fabric description at launch; swatches before launch; a WhatsApp link on the website; training in short videos.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Also from the recording (second pass, 14 Oct 2026).&lt;/strong&gt; Enigma sets the ship-by date once, usually seven days out; when a factory is delayed or shut nothing moves it, so the store cannot tell the customer a new date (12:30). One bill often carries pieces in different sizes, and each piece needs its own size, inseam and fit rather than one size for the cart (19:46, 24:34). Shipping takes a day within Mumbai and two to four days outside Maharashtra (01:16). When a box is scanned in at the store the customer gets a WhatsApp with the website link; several customers&amp;#39; pieces travel in one box to save shipping (01:00). Bills are sometimes split so offers apply across garments, and international shipping is collected through a gift card (18:15, 56:04). The swatch book must be corrected when a fabric changes direction, such as a vertical stripe cut horizontal (01:32). Training for the new system is wanted as short videos (01:33).&lt;/p&gt;
&lt;p&gt;How many stores there are depends on who is asked: &amp;quot;around 30&amp;quot; on the floor (store visit, 13–14 Aug 2026); 35 physical stores plus Online, Virtual Stylist and Corporate Orders on the DSR (week ending 30 Aug 2026); 50 store records in Enigma, 45 of them STORE warehouses, ShipHero wired on 15 (live read, 26 Aug); about 7 stores hold RTW shirt stock and about 11 hold bottoms &amp;quot;in 1-1-2-2 pieces&amp;quot; (RTW KT, 12 Aug). The Close-Out plan (7 Sep) lists this as a number to settle because SSSG depends on it.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;A6-i. Selling an MTM shirt&lt;/strong&gt;&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A6.1&lt;/td&gt;&lt;td&gt;Customer picks a fabric from the swatch book and lookbook&lt;/td&gt;&lt;td&gt;Associate&lt;/td&gt;&lt;td&gt;Physical books (Formal Vol.1, Formal Vol.2, Casual Vol.1, Linen, Leggiuno Bespoke); the Tuesday Excel for stock. Store rule of thumb: below 15 m = low stock ≈ 30–34 shirts; staff mark low/sold-out and new additions in their own notes&lt;/td&gt;&lt;td&gt;Fabric name — typed later, no barcode; the swatch carries a code and an MRP sticker, and an &amp;quot;on hold&amp;quot; sticker when a bespoke fabric is withdrawn&lt;/td&gt;&lt;td&gt;Physical&lt;/td&gt;&lt;td&gt;Not measured; floor question 3 (&amp;quot;how long does one order take&amp;quot;) was asked, no answer recorded — to confirm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.2&lt;/td&gt;&lt;td&gt;Styling chosen, fit sample tried&lt;/td&gt;&lt;td&gt;Associate&lt;/td&gt;&lt;td&gt;Fit samples on the rail: 3 fits — slim/&amp;quot;Atlantic&amp;quot;, standard, heavy — across sizes 36 to 50 (store visit). The customer cannot see the finished combination (fabric + collar + buttons); the sale runs on trust&lt;/td&gt;&lt;td&gt;Collar, cuff, placket, pocket, buttons, piping, fit&lt;/td&gt;&lt;td&gt;Verbal&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.3&lt;/td&gt;&lt;td&gt;Measurements taken&lt;/td&gt;&lt;td&gt;Master tailor&lt;/td&gt;&lt;td&gt;Fit Smart: 5 questions (body shape, height, fit preference…) auto-calculate consumption in Enigma&amp;#39;s backend; the master adjusts ±1–2 inches. Whether the adjustment is written anywhere: asked (floor Q37), not answered&lt;/td&gt;&lt;td&gt;Enigma order sheet as read live for BSC-1002370: 20 measurements in inches (collar, chest, waist, hips, shoulder, shoulder yoke, shirt length, sleeve length, bicep, left/right cuff, forearm, front/back across, short-sleeve length/bicep/opening, arm hole, button count, button placement), 4 pattern flags (shirt margin, low neck, sloping shoulders, back down), 22 construction tiles (collar style/stiffness/contrast/piping/top button, sleeves, cuff style/stiffness/contrast, placket/contrast/stay, buttons, button thread, stitching thread, back, bottom cut, pocket, elbow patch, gusset, shirt length, monogram)&lt;/td&gt;&lt;td&gt;Enigma order sheet&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.4&lt;/td&gt;&lt;td&gt;Order entered twice&lt;/td&gt;&lt;td&gt;Associate&lt;/td&gt;&lt;td&gt;Shopify first (bill, customer profile — A-30 confirmed), then Enigma (order sheet). Enigma stores the Shopify &lt;code&gt;remoteId&lt;/code&gt;/&lt;code&gt;remoteOrderNumber&lt;/code&gt; on the order line and keeps standing &amp;quot;Unsynced Orders&amp;quot; and &amp;quot;Unsynced Customers&amp;quot; queues; 318 orders sat unreserved on 26 Aug&lt;/td&gt;&lt;td&gt;Customer name and phone typed in both; fabric picked by name (no barcode — the real gap is no per-roll fabric barcode; garment QR exists on order lines); same-name fabrics have been punched wrong (Discovery, 2nd sitting)&lt;/td&gt;&lt;td&gt;Two systems&lt;/td&gt;&lt;td&gt;to confirm (the current figure of 10–15 min is not in any source)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.5&lt;/td&gt;&lt;td&gt;Enigma reserves and production starts&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;td&gt;&lt;code&gt;isReserved&lt;/code&gt; on punch; &lt;code&gt;saleable = physical − accounting(&amp;quot;reserved&amp;quot; in the UI) − threshold&lt;/code&gt;, stored not computed, drifts; consumption exists only as the ledger row (&lt;code&gt;/inventory/deductionReport&lt;/code&gt;, &lt;code&gt;quantity&lt;/code&gt; with &lt;code&gt;orderProductId&lt;/code&gt;, running &lt;code&gt;stockBalance&lt;/code&gt;) — the order line has no quantity field&lt;/td&gt;&lt;td&gt;isReserved, isDeducted, deductedFromBin&lt;/td&gt;&lt;td&gt;Automatic&lt;/td&gt;&lt;td&gt;Instant&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.6&lt;/td&gt;&lt;td&gt;Shirt made and delivered&lt;/td&gt;&lt;td&gt;Factory → store / courier&lt;/td&gt;&lt;td&gt;Enigma carries the order through production, QC, alteration and ship on its own; 59 order states, transitions scoped per factory (BOM / COF / KOR); domestic fabric is made &amp;quot;in about 2 days&amp;quot; (Discovery Record §02); the promise the store gives the customer is not in any source — to confirm (the model uses 14 days)&lt;/td&gt;&lt;td&gt;Order state&lt;/td&gt;&lt;td&gt;Phone / Enigma&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;A6-ii. Selling an RTW piece.&lt;/strong&gt; One display piece per style, ordered in the size that hangs well (M for shirts, 32 for bottoms — RTW KT); the customer tries the display or a fit sample and asks for a size and colour. Size is checked in Enigma (variant-level stock per warehouse, &lt;code&gt;variantSkuCode&lt;/code&gt; such as BOM-SHI-RE-6797-OLIVE-36) and, in the 15 ShipHero stores, in ShipHero. If the size is not on the shelf, the store asks another store on Slack or waits for a pull from the hub; inter-store transfer is discretionary — a manager may refuse to release the display piece, judged on customer profile and product value. Core RTW is restocked from the factory; non-core is seasonal and does not come back. Bottoms are sold semi-stitched/unhemmed (Enigma fabric-master &lt;code&gt;productType&lt;/code&gt; HEMMING on 539 rows, SEMI_STITCHED on 595) and finished to the customer&amp;#39;s inseam — in store if the master can, otherwise at the hemming unit, a stage no system tracks. The sale is punched in Shopify; Enigma&amp;#39;s &amp;quot;POS Orders&amp;quot; module (= &amp;quot;All Preconfirmed Orders&amp;quot;) holds the store order.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;A6-iii. A customer comes back&lt;/strong&gt;&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A6.7&lt;/td&gt;&lt;td&gt;The complaint is heard and the ladder is tried: alteration / refit → remake → store credit → cash refund&lt;/td&gt;&lt;td&gt;Store manager&lt;/td&gt;&lt;td&gt;No record the store can check: a post in a Slack channel. Enigma does hold an Alterations module, a Trial module and &lt;code&gt;/exchnage/*&lt;/code&gt; [sic] endpoints with &lt;code&gt;refundType, refundReason, refundCreatedOn, isReversePickupRequired, restockStatus, restockStoreId, isRestockDeducted&lt;/code&gt;, and 16 of the 59 states cover the flow — so the statuses exist in the system but not on the floor; whether stores use them is to confirm. Two statements on MTM: &amp;quot;no MTM returns; alterations offered first where margins allow&amp;quot; (30–31 Jul) and &amp;quot;MTM returns go back to the factory for restocking or adjustment&amp;quot; (13–14 Aug)&lt;/td&gt;&lt;td&gt;Free text&lt;/td&gt;&lt;td&gt;Slack&lt;/td&gt;&lt;td&gt;Minutes to post; days to close — no measure&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.8&lt;/td&gt;&lt;td&gt;In-store alteration or hemming&lt;/td&gt;&lt;td&gt;Master tailor&lt;/td&gt;&lt;td&gt;Not recorded anywhere (floor Q39 asked, unanswered)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Physical&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.9&lt;/td&gt;&lt;td&gt;Piece sent to the factory for rework or remake&lt;/td&gt;&lt;td&gt;Store → Production&lt;/td&gt;&lt;td&gt;Slack + the vehicle; the store cannot tell whether the factory received it&lt;/td&gt;&lt;td&gt;Which piece, why&lt;/td&gt;&lt;td&gt;Slack + physical&lt;/td&gt;&lt;td&gt;to confirm — no source gives a round-trip time&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.10&lt;/td&gt;&lt;td&gt;Store credit given&lt;/td&gt;&lt;td&gt;Store manager&lt;/td&gt;&lt;td&gt;Mechanism not stated in any source (gift card, note, memory) — to confirm&lt;/td&gt;&lt;td&gt;Amount&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A6.11&lt;/td&gt;&lt;td&gt;Refund&lt;/td&gt;&lt;td&gt;Finance&lt;/td&gt;&lt;td&gt;Slack ask; the store cannot see whether the refund moved; larger-format stores report 6–7% refunds; repeat customers ≈ 60%&lt;/td&gt;&lt;td&gt;Amount&lt;/td&gt;&lt;td&gt;Slack + bank&lt;/td&gt;&lt;td&gt;Days; store finds out by asking&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;A6-iv. Stock in and out.&lt;/strong&gt; Planning reviews ~300 styles across ~10 stock-holding stores every two weeks in a sheet, builds a file and uploads it to create STOs in Enigma; the inventory team opens the STO and ships (RTW KT). Each STO is one line per piece — &amp;quot;1-1-1-1 dalo, then STO create karo&amp;quot; — and the tracker carries an STO type (Display / Off the rack / Replenishment) and a hemming type (Closed hem/finished bottom, Bottom Open/Unhemmed, NA). At the store, goods physically arrive but the STO stays &amp;quot;open&amp;quot; in Enigma; the store cannot bulk-receive or scan a box, so system stock and shelf stock diverge and negative billing follows. Damaged pieces are removed from the floor or sent back informally and never taken out of the system — ghost inventory (Enigma has manual adjustment reasons for it: &amp;quot;Moving to non sellable bin for Display&amp;quot; (19), &amp;quot;…for inventory pull back&amp;quot; (21), but the stock-transfer endpoints were 403 to us, so nothing on STO state has been verified from data — A-25). Pull-back sheets arrive by email when merchandising wants stock back for redistribution, restock or online. Launch information comes as PDFs, specs, colours, sometimes samples and swatches, about a week before go-live, unevenly across stores; display and fit pieces arrive with the drop and are confirmed on Slack, sometimes. Swatch and display dispatch is tracked in a sheet with 34 store columns; no store confirms receipt. NPS is read weekly but the floor calls it unreliable: low response counts, unhappy customers over-represented, stores judged on policy complaints.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Where it breaks.&lt;/strong&gt; Two stores can sell the last metres at once — whoever finishes Shopify + Enigma first gets the cloth (A6.1, A6.4). Every fabric is typed by name; no fabric-roll barcode. Measurement adjustments by the master are not written down. Returns have no status a store can check even though Enigma carries one (A6.7–A6.11). Store credit lives outside any ledger. The hemming unit is invisible. Receiving is the weakest link: open STOs, no bulk or box-level receiving, ghost stock, pull-backs by email, display pieces nobody pulls when the fabric sells out.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Rules (as practised today).&lt;/strong&gt; Below 15 m is low; sold-out fabrics are struck off the store&amp;#39;s own list; a fabric on hold gets an on-hold sticker in the book; a display piece is not for sale; the first rung is always alteration or refit; only refunds go to finance; a store may keep its display piece rather than transfer it.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Cases (edge cases seen).&lt;/strong&gt; Fabric shown in the book but unavailable at the mill (bespoke stock reported only as available/unavailable by Thomas Mason and Albini); a customer&amp;#39;s measurements exist from another store; an online customer&amp;#39;s alteration (destination is the customer, not a store); a non-core style with broken sizes still on display and still on sale online; an STO physically received twice because the first was never closed; a damaged display piece.&lt;/p&gt;
&lt;p&gt;&lt;span style=&quot;white-space:pre-wrap&quot;&gt;Sources: Bombay shirt company store visit summary.md; store visist detailed summaruy.md; Transcript of the store visit.md (13–14 Aug 2026); Store Visit Questions — Floor Level (13 Aug 2026); Discovery Record — What We Know v1.0 (18 Aug 2026) §01, §2d, §3d; Invisit meeting contexts.md (30–31 Jul 2026) Part 1 and §1–2, §5; Discovery 2nd sitting in visit.md; Discovery 3rd visist.md; RTW shirts inventory call.md and transcript (12 Aug 2026); Enigma Answers — Read From Live System (26 Aug 2026); Discovery Close-Out — 4-Day Field Plan (07 Sep 2026) §4; Summary of First call happeneed with them.md; data-files/STO  Swatches Tracker.xlsx (STO Type, Hemming type columns as carried in reference.ts); bsc-plm-original/src/domain/reference.ts (order-sheet fields read from cms.bombayshirts.com for BSC-1002370); realanalytics.ts DSR store list.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;6-replenishment-and-stock-health&quot;&gt;&lt;summary&gt;6. Replenishment and stock health&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Three different replenishment routines run in parallel: Enigma&amp;#39;s silent auto-PO for domestic core fabrics (and, per order, for bespoke), a weekly Excel for international core fabrics, and a person scanning every RTW SKU-size by eye. None of them shares a definition of rate of sale.&lt;/p&gt;
&lt;p&gt;A7-i. MTM core, domestic. Every core fabric carries a threshold in Enigma &amp;quot;based on two factors — the lead time in transit and the MOQ of the vendor&amp;quot; (Neha, 30 Jul: 100 shirts a week, three days transit → hold 200 m, and &amp;quot;the minute we fall below 200 m an auto PO says dispatch 200 m&amp;quot;). Read live on 26 Aug 2026: &lt;code&gt;isAutoPo&lt;/code&gt; is true on 2,311 of 8,585 fabrics — BESPOKE 1,742, BESPOKE_NON_CORE 457, CORE only 111 of 541, FOB 1, NON_CORE 0; 845 of the last 1,000 fabric POs were created by &lt;code&gt;overseerId &amp;quot;1&amp;quot;&lt;/code&gt;, shown as &amp;quot;Created By: Customer&amp;quot;, at 08:00 IST (586), 15:00 IST (199), 02:30 (31) — at least two scheduled runs a day, silent, no approval, no notification; 1,762 of the flagged fabrics have &lt;code&gt;vendorCode: null&lt;/code&gt;, so no PO can be raised against them. Two fields are confused in every conversation: the per-fabric per-warehouse &lt;strong&gt;Threshold&lt;/strong&gt; on the inventory row (7 m domestic, 3–5 m for expensive international cloth — &amp;quot;just the manual decision we did a long time back&amp;quot;, revisited &amp;quot;once a year&amp;quot;, owned by Yulette, &amp;quot;now nobody&amp;#39;s really owning it&amp;quot;) is the floor below which the fabric is not sold (&lt;code&gt;saleable = physical − accounting − threshold&lt;/code&gt;, verified live); the &lt;strong&gt;reorder point&lt;/strong&gt; is a different number that &amp;quot;should move with the season — October, November, December and March, April — but it doesn&amp;#39;t, because everything is manual&amp;quot; (Kunal, 27 Aug). Sourcing (Sreekanth) checks every core supplier&amp;#39;s stock weekly by phone and tells design when a mill has run out; design then marks the fabric inactive (&lt;code&gt;isOnHold&lt;/code&gt;, true on 3,042 fabrics) — after the stock-out, not before.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Trigger&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Hand-off&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A7.1&lt;/td&gt;&lt;td&gt;Enigma raises the PO&lt;/td&gt;&lt;td&gt;Enigma batch job (&amp;quot;Customer&amp;quot;)&lt;/td&gt;&lt;td&gt;Saleable falls under the fabric&amp;#39;s threshold&lt;/td&gt;&lt;td&gt;Enigma Fabric Inventory · Fabric PO&lt;/td&gt;&lt;td&gt;PO for a fixed quantity (the MOQ, e.g. 60 m on PO 16044 for CORE &lt;code&gt;CONVPLC000-02&lt;/code&gt;); &lt;code&gt;estimatedArrivalDate&lt;/code&gt; null&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;td&gt;08:00 and 15:00 IST&lt;/td&gt;&lt;td&gt;Nobody is told; sourcing sees it when the mill asks&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.2&lt;/td&gt;&lt;td&gt;Weekly supplier stock check&lt;/td&gt;&lt;td&gt;Sourcing (Sreekanth)&lt;/td&gt;&lt;td&gt;Monday&lt;/td&gt;&lt;td&gt;Phone / WhatsApp to each tied-up mill (&amp;quot;those suppliers are sending us their status once a week&amp;quot;)&lt;/td&gt;&lt;td&gt;In stock, delayed (&amp;quot;it will take another 15 days or 20 days, 1 month&amp;quot;), out&lt;/td&gt;&lt;td&gt;Messages; a note to Neha and design&lt;/td&gt;&lt;td&gt;Weekly&lt;/td&gt;&lt;td&gt;Design switches the fabric off; &amp;quot;once the fabric is back in stock, again you have to activate it&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.3&lt;/td&gt;&lt;td&gt;Bespoke PO per customer order&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;td&gt;Order punched&lt;/td&gt;&lt;td&gt;Order lines carry &lt;code&gt;purchaseOrderStatus: PO_PENDING&lt;/code&gt;; PO lines carry &lt;code&gt;orderId&lt;/code&gt;&lt;/td&gt;&lt;td&gt;One PO per order, released &amp;quot;next day in the morning, 8 o&amp;#39;clock&amp;quot; (Sreekanth)&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;td&gt;Daily&lt;/td&gt;&lt;td&gt;Mill dispatches the cut length with its own sticker code (A8.7)&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;A7-ii. MTM core, international (~30 fabrics). Kunal&amp;#39;s own Excel, walked through on 27 Aug 2026.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Trigger&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Hand-off&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A7.4&lt;/td&gt;&lt;td&gt;Pull saleable stock from Enigma into the sheet&lt;/td&gt;&lt;td&gt;Design (Kunal&amp;#39;s team)&lt;/td&gt;&lt;td&gt;Weekly (&amp;quot;we don&amp;#39;t do it every morning&amp;quot;)&lt;/td&gt;&lt;td&gt;Enigma Fabric Inventory saleable, typed&lt;/td&gt;&lt;td&gt;Stock on hand per fabric&lt;/td&gt;&lt;td&gt;Manual copy&lt;/td&gt;&lt;td&gt;Weekly, ~1 hour&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.5&lt;/td&gt;&lt;td&gt;Compute cover&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;A7.4&lt;/td&gt;&lt;td&gt;The international Excel: AWS (average weekly sale in pieces — &amp;quot;we&amp;#39;ve just taken what we had earlier, it&amp;#39;s not dynamic&amp;quot;: 60 pcs/week on the white) · AWS metres (60 pcs → 111 m) · stock on hand · vendor stock (0 — &amp;quot;NOS fabric with the vendor, always there, but the vendor is sitting in China&amp;quot;) · weeks of cover (7 as of 24 Aug) · in transit (600 m) · expected date (7 Sep)&lt;/td&gt;&lt;td&gt;Cover in weeks&lt;/td&gt;&lt;td&gt;Excel formulas&lt;/td&gt;&lt;td&gt;Weekly&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.6&lt;/td&gt;&lt;td&gt;Decide and raise the PO&lt;/td&gt;&lt;td&gt;Kunal approves (&amp;quot;I don&amp;#39;t send the email, but I do the approval&amp;quot;); who sends the PO to the mill is to confirm (Sourcing summary: design creates and releases fabric POs)&lt;/td&gt;&lt;td&gt;Cover below the buy horizon: &amp;quot;for international we buy for 12 to 16 weeks; for domestic, enough to cover the rate of sale plus the lead time&amp;quot;&lt;/td&gt;&lt;td&gt;Enigma Fabric PO&lt;/td&gt;&lt;td&gt;Metres, vendor&lt;/td&gt;&lt;td&gt;Enigma + email&lt;/td&gt;&lt;td&gt;When triggered; international transit &amp;quot;China — two months&amp;quot; (Neha); the exact per-mill lead is not held anywhere (vendor master has no lead time)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;There is no column that says a fabric is international: &amp;quot;we just remember it … tomorrow if someone new joins they will have no clue&amp;quot; (Kunal). Growth is not in the sheet either: &amp;quot;we know that in October we&amp;#39;re going to do 30% more business, we add that&amp;quot; by hand; it &amp;quot;should be calculated on the contribution towards the business&amp;quot;, not option by option.&lt;/p&gt;
&lt;p&gt;A7-iii. RTW, every SKU-size. Planning (Charanjeet, with Aman; Omkar updates the cumulative sale file weekly; Parag&amp;#39;s WIP tracker supplies &amp;quot;in production&amp;quot;).&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Trigger&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Hand-off&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A7.7&lt;/td&gt;&lt;td&gt;Pull the stock report&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Daily&lt;/td&gt;&lt;td&gt;Enigma → Excel (&amp;quot;stock report daily by getting it from Enigma&amp;quot;); store stock &amp;quot;is Enigma data, but not in this form — we have to put it in a format we can read&amp;quot;&lt;/td&gt;&lt;td&gt;Stock by style × size × location&lt;/td&gt;&lt;td&gt;Daily export&lt;/td&gt;&lt;td&gt;30 min&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.8&lt;/td&gt;&lt;td&gt;Read velocity&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Weekly&lt;/td&gt;&lt;td&gt;ROS &amp;amp; Health Report (Remarks · Top/Bottom · Category · Sub-Category 1 · Sub-Category 2 · Shiphero Style Name · sizes 28–50 and XS–4XL · Grand Total · Product Launch Date · Total Sale · WOF · ROS · Sell Thru · LW · LW-1 · LW-2 · LW-3 · Count · Low stock Size Count · Stock Health % · Healthy Or Not · EOSS Sale · Top 6 Weeks ROS); the Concise workbook&amp;#39;s Line-Item Detail (Sub-Cat 1 · Sub-Cat 2 · Style Name · Stock · Total Sales · ROS · Top 6W ROS · WOF · LW…LW-3 · Health · Sz OOS · EOSS · Velocity · Gap / Issue · Action · attributes (pattern, colour, weave, usp/feature, Fabric Composition, Occasion, Fabric Mills, Stretch, Shine, Wrinkle Resistance, Bespoke, Weight (Oz), Shirt Range) · 12 weekly columns Wk 12-Apr…Wk 28-Jun · 12W Trend sparkline · PO Status · Vendor(s) · Total Order Qty · Total Recd Qty · Incoming Qty · Latest Expected/Status · 45-Day Sales · 45-Day ROS · 60-Day Sales · 60-Day ROS · Stock-Constrained?)&lt;/td&gt;&lt;td&gt;Last sale; last-4-week rate (&amp;quot;average of last two weeks&amp;quot; in the walkthrough); WOF here is weeks on floor; Top 6 Weeks ROS as the demand ceiling (not corrected for stock at the time or competing options — &amp;quot;one style&amp;#39;s top 6 weeks could be Diwali&amp;quot;); open orders; next lead time. The workbook&amp;#39;s own ROS formula is lifetime: total units sold ÷ (days since launch ÷ 7), with a &amp;quot;demand-censoring fix (09-Jul-26)&amp;quot; for zero-stock SKUs&lt;/td&gt;&lt;td&gt;Excel; &amp;quot;all manually made and not 100% reliable&amp;quot; (Charanjeet)&lt;/td&gt;&lt;td&gt;Weekly, half a day&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.9&lt;/td&gt;&lt;td&gt;Decide per style&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Weekly at best; &amp;quot;if I miss ordering something, it will keep selling and stock out&amp;quot;&lt;/td&gt;&lt;td&gt;The Concise workbook&amp;#39;s nine verbs (Action &amp;amp; Gap Parameters, in priority order): 1 REINTRODUCE — Stock = 0 and Top 6W ROS ≥ 2; 1 REVIEW — Stock = 0, no strong demand; 2 SIZE FILL — Sz OOS ≥ 2, still selling; 3 URGENT REPLENISH — Healthy and WOF ≤ 3 weeks; 4 LIQUIDATE — Velocity E (ROS = 0), Stock &amp;gt; 0; 5 EXIT — WOF ≥ 55 weeks; 6 CLEAR / DISCOUNT — 30 ≤ WOF &amp;lt; 55; 7 MAINTAIN — Healthy, WOF normal; 8 MONITOR — everything else. Velocity Parameters: A ROS ≥ 10 · B 5–10 · C 2–5 · D 0.1–2 · E 0. Stability rule (09-Jul-26): tiers INVEST · WATCH · DIVEST, a SKU cannot jump INVEST ↔ DIVEST in one week. Action History tab: Style Name · Sub-Cat 1 · 28-Jun-26 Action · Tier · 05-Jul-26 Action · Tier · Status · 02-Aug-26 Action · Tier · Status (Confirmed)&lt;/td&gt;&lt;td&gt;Verb, tier, status; the 02 Aug refresh: 642 SKUs, 79 Healthy, 563 Unhealthy, 8,048 units in stock, 1,015 sold last week, avg ROS 2.5, peak 6W 43.3, 281 zero-stock SKUs, 420 on EOSS; 271 SIZE FILL; 37 REINTRODUCE forwarded to design (&amp;quot;dependent on whether the similar fabric is available&amp;quot;)&lt;/td&gt;&lt;td&gt;Excel, built through Claude by Yulette from three manually updated files (&amp;quot;60, 70, 80% confident, not 100%&amp;quot;)&lt;/td&gt;&lt;td&gt;Weekly&lt;/td&gt;&lt;td&gt;Design checks fabric availability; EOSS decided style by style (&amp;quot;greater than 180 days old, definitely I have to do something&amp;quot;; &amp;quot;we have kind of stopped [markdowns] — pressure on margin&amp;quot;)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.10&lt;/td&gt;&lt;td&gt;Store replenishment and pull-back&lt;/td&gt;&lt;td&gt;Planning (Charanjeet&amp;#39;s team) → Warehouse&lt;/td&gt;&lt;td&gt;Fortnightly (&amp;quot;I would like to do it every week, but as of now once in two weeks&amp;quot;)&lt;/td&gt;&lt;td&gt;Replenishment sample: sku_code (&lt;code&gt;BOM-SHI-RE-1132-ECRU-46&lt;/code&gt;) · Style description · Size2 · Sub-Category 1 · Sub-Category 2 · Factory (pieces at the unit) · Allocate · Balance · then per store Stock · Allocation · Pullback (Sarath City, Inorbit Mall Hyd, Vasant Kunj, Pali Hill, Whitefield in the sample; ~24 store columns in the live file)&lt;/td&gt;&lt;td&gt;&amp;quot;Pali Hill has none, nothing in transit, 20 in the warehouse → allocate two&amp;quot;; an STO per piece typed into Enigma (&amp;quot;1-1-1-1 dalo, then STO create karo&amp;quot;); a pull-back sheet emailed to the store&lt;/td&gt;&lt;td&gt;Excel → Enigma STO&lt;/td&gt;&lt;td&gt;~300 styles × 10 stores; a day; 7 stores hold RTW shirt stock, 11 hold bottoms&lt;/td&gt;&lt;td&gt;Enigma &lt;code&gt;isAutoReplenishment&lt;/code&gt; is false on all 50 stores; &lt;code&gt;allocationRuleId&lt;/code&gt; exists but is 403 to us&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A7.11&lt;/td&gt;&lt;td&gt;Monthly option planning&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Monthly&lt;/td&gt;&lt;td&gt;Option Count Summary (see A3.1); Targets &amp;amp; Gap Analysis (Sep-26 to Feb-27 targets 6,148–7,394 units a month against a 4,193 run-rate; 19,082 units in open WIP across 104 POs)&lt;/td&gt;&lt;td&gt;Ideal · Healthy · In Production · In Planning (blank, &amp;quot;not tracked&amp;quot;) · +3 buffer&lt;/td&gt;&lt;td&gt;Excel&lt;/td&gt;&lt;td&gt;Monthly&lt;/td&gt;&lt;td&gt;Feeds A3.1&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Where it breaks. A7-i is silent, half-configured (430 of 541 core fabrics have auto-PO off; 1,762 flagged fabrics have no vendor) and static; the threshold and the reorder point are two numbers that the same sentence calls &amp;quot;threshold&amp;quot;. A7.5&amp;#39;s AWS is a typed constant, and the international flag is in people&amp;#39;s heads. A7.8&amp;#39;s rate of sale falls when sizes break, so &amp;quot;a style that was actually working quietly dies&amp;quot; — the fix everyone asked for is to freeze the ROS measured while the option was whole; the 45/60-day columns in the workbook are flagged as a known limitation. A7.9 has no trigger — a missed row is a stock-out nobody was warned about; the verbs come out of a spreadsheet built by prompting an AI on three hand-updated files, and no reason is captured when a person overrides them. Sell-through cannot be computed because the ordered quantity is not against the option (&amp;quot;we placed 100 pieces and we entered it in the system only … it&amp;#39;s not coming easy to us&amp;quot;); the Enigma ledger row (&lt;code&gt;quantity&lt;/code&gt; on the &lt;code&gt;orderProductId&lt;/code&gt;) is the only place consumption exists. A7.10 is a day of typing per fortnight and never looks at store-level velocity. Making a style inactive after a stock-out, or bringing it back, is decided by eye whenever someone has time.&lt;/p&gt;
&lt;p&gt;Sources: Tranbscript of granola recording (Meeting 1 on auto-PO; Meeting 3 on the 90-day trigger, top 6 weeks, sell-through); Enigma Answers (findings 2, 3, 4, 6; stores block); C1a MTM call transcript and Call c1 a call summary (27 Aug 2026 — Kunal on AWS, 12–16 weeks, thresholds 3–5/7 m, approval, no international column); Sourcing call transcript (weekly supplier check, bespoke PO 08:00); Discovery Record §2a, §3a–§3c; RTW shirts inventory call + transcript (healthy definition, 300 × 10, 180 days, 37 options, sources of the AI file); Replishment part by production on inventory.md; Discovery 3rd visit; Discovery Close-Out §4; memory enigma-auto-po-rule; data-files: RTW_Shirts_Concise_Updated 10.xlsx (all eight tabs), ROS Health Report 020826.xlsx, Replenishment Sample.xlsx, Option Count Summary Sample.xlsx.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;7-warehouse-and-unit&quot;&gt;&lt;summary&gt;7. Warehouse and unit&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Shravani&amp;#39;s team (she reports to Sreekanth; the &amp;quot;inventory team&amp;quot; Vaishnav leads was named separately on 30 Jul — whether these are one team is to confirm) receives everything (cloth against fabric POs, RTW bulk against design POs, bespoke cut-lengths from mills, finished MTM pieces off the factory vehicle), sends everything (cut bundles to factories, STOs, swatch books, display and fit pieces) and records it in Enigma (46 warehouses: 45 STORE + 1 FACTORY), ShipHero (15 of 50 stores mapped) and one tracker workbook (STO &amp;amp; Swatches Tracker: STO · MTM_Swatches · FOB_Swatches).&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Trigger&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Hand-off&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A8.1&lt;/td&gt;&lt;td&gt;Vehicle round from the MTM factories&lt;/td&gt;&lt;td&gt;Warehouse / production unit&lt;/td&gt;&lt;td&gt;The vehicle arrives (daily)&lt;/td&gt;&lt;td&gt;Enigma&amp;#39;s scan stages (permissions &lt;code&gt;factoryAssemblyScan&lt;/code&gt;, &lt;code&gt;finishingScan&lt;/code&gt;, &lt;code&gt;scanAtStore&lt;/code&gt;; order lines carry a &lt;code&gt;qrCodeUrl&lt;/code&gt;); the factory merchandiser&amp;#39;s out-of-factory scan earlier that day; MTM production walk of 12 Sep 2026 (RTS = &amp;quot;return to source&amp;quot; scan at the unit)&lt;/td&gt;&lt;td&gt;Piece scanned by order number; what the factory declared ready against what came off the vehicle, tallied by hand; a piece that fails is sent back&lt;/td&gt;&lt;td&gt;Scanner + paper tally&lt;/td&gt;&lt;td&gt;1–2 hours&lt;/td&gt;&lt;td&gt;Shipping team dispatches to the customer or store; the gap is found days later&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.2&lt;/td&gt;&lt;td&gt;GRN for cloth and RTW bulk&lt;/td&gt;&lt;td&gt;Warehouse (Shravani: &amp;quot;once the fabric comes into the warehouse, she enters that inward — she does the GRN&amp;quot;)&lt;/td&gt;&lt;td&gt;Parcel or truck arrives&lt;/td&gt;&lt;td&gt;Enigma GRN = PO fulfillment row (&lt;code&gt;id, amount, overseerId, purchaseProductId, createdAt, status&lt;/code&gt;), which closes the PO; no GRN number, no invoice reference, no dye lot; Enigma unit per fabric (Meter or Kilogram); invoice into the Fabric &amp;amp; Trims Deduction Tracker&lt;/td&gt;&lt;td&gt;PO, qty, unit, rejected, bin (&lt;code&gt;warehouseName, binName&lt;/code&gt; on the ledger); invoice no., GST&lt;/td&gt;&lt;td&gt;Enigma + Excel&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;td&gt;PO closes; &amp;quot;invoices often get lost or delayed — no formal tracking&amp;quot;; &lt;code&gt;purchaseOrderHistoryList&lt;/code&gt; is empty even on closed POs&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.3&lt;/td&gt;&lt;td&gt;Bundles cut and sent to MTM factories&lt;/td&gt;&lt;td&gt;Warehouse / production unit&lt;/td&gt;&lt;td&gt;The day&amp;#39;s plan&lt;/td&gt;&lt;td&gt;Enigma plan and job card; Enigma deducts the order&amp;#39;s metres at the in-production scan (&lt;code&gt;isDeducted&lt;/code&gt;, &lt;code&gt;deductedFromBin&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Order numbers per bundle, metres per order (Enigma consumption; Fit Smart base)&lt;/td&gt;&lt;td&gt;Paper bundle sheet + QR&lt;/td&gt;&lt;td&gt;Daily&lt;/td&gt;&lt;td&gt;Factory scans in&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.4&lt;/td&gt;&lt;td&gt;Extra fabric for a spoiled panel&lt;/td&gt;&lt;td&gt;Factory merchandiser → Production unit → Warehouse&lt;/td&gt;&lt;td&gt;The daily &amp;quot;EXTRA FABRIC&amp;quot; email (80 cm single / 90 cm full width, per the email&amp;#39;s own wording)&lt;/td&gt;&lt;td&gt;Email&lt;/td&gt;&lt;td&gt;Order no, fabric, panel (front, both fronts, sleeve, collar, cuff), metres, whose error (factory / PP)&lt;/td&gt;&lt;td&gt;Email&lt;/td&gt;&lt;td&gt;Daily&lt;/td&gt;&lt;td&gt;Approved by reply; cut and sent with the next vehicle; the deduction is a manual adjustment in Enigma&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.5&lt;/td&gt;&lt;td&gt;STO waves to stores&lt;/td&gt;&lt;td&gt;Warehouse (Nitin / Prince) with Planning&lt;/td&gt;&lt;td&gt;A launch (Display / Off the rack) or a replenishment file&lt;/td&gt;&lt;td&gt;STO &amp;amp; Swatches Tracker → STO: STO Series No. (1931-1965 = one wave, one STO per store) · STO Type · STO Date · Mail subject (&amp;quot;Display sample Allocation of RTW CHINOS AUG DROP&amp;quot;) · Category · Product Referance Name · Hemming type · Qty (360 display pieces; 550 off the rack) · Priority · Stock received date · Stock Inward Date · Expected Shipping Date · Revised Expected Shipping Date · STO Status · Dipatched status · Comments/Remarks; Enigma STO (&lt;code&gt;/stock-transfer/*&lt;/code&gt;, 403 to us) and ShipHero pick&lt;/td&gt;&lt;td&gt;Series, type, hemming state (&amp;quot;Bottom Open/ Unhemmed.&amp;quot; goes through the hemming unit or the store&amp;#39;s tailor), qty, dates&lt;/td&gt;&lt;td&gt;Sheet + Enigma + ShipHero&lt;/td&gt;&lt;td&gt;1–3 days per wave&lt;/td&gt;&lt;td&gt;Stores receive; &amp;quot;many STOs remain open — goods physically arrive but the inward is not properly closed&amp;quot; (store visit); this is where ghost stock is born&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.6&lt;/td&gt;&lt;td&gt;Swatch books, loose swatches and fit samples to stores&lt;/td&gt;&lt;td&gt;Warehouse (one person cuts 25 × 25 swatches; shipping dispatches; photos posted in Slack)&lt;/td&gt;&lt;td&gt;A new fabric bulk received; a new book edition; a new store&lt;/td&gt;&lt;td&gt;MTM_Swatches / FOB_Swatches tabs: Sr No. · Date · Production Type (MTM, RTW, Kurta &amp;amp; Bottom) · Vendor Name · Fabric Dispatched date · Fabric Bulk Received date · Fabric Team handover date for swatches · Fabric code · Fabric Name · Category · Priority · Sticker Link (empty) · Types of Swatches · Status · Remarks · Expected sending Date · Revised Expected Shipping Date · Remark (Reqd / Not Reqd) · then per store Tracking no. · Dispatch Date · Receiving Date across 34 columns (Picario, Head Office, Ahmedabad, Lavelle Rd, Indiranagar, Jayanagar, Chennai, Khan Market, South Ex., Gurugram, Noida, Hyderabad, Jaipur, Pune, Pali Hill, Kala Ghoda, Kemps Corner, Andheri, Borivali, Sky City Borivali, Juhu, Oberoi Mall, Select City Walk, Seawoods, Kochi, Kolkata, Sarath City, Kurla, Whitefield, Express Avenue Chennai, New York, Inorbit Mall, Lakeshore Mall); Display &amp;amp; Fit Sample Allocation for fit sets (3 fits, sizes 36–50)&lt;/td&gt;&lt;td&gt;Store, kind, copies, dispatched on, tracking no., receiving date (rarely filled)&lt;/td&gt;&lt;td&gt;Sheet&lt;/td&gt;&lt;td&gt;Per edition / per fabric&lt;/td&gt;&lt;td&gt;&amp;quot;No store ever confirms receipt, so nobody knows which swatches reached which store&amp;quot;; sticker sheets (fabric code · name – mill article · book · MRP · &amp;quot;Incl. of all taxes&amp;quot;) are made by hand&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.7&lt;/td&gt;&lt;td&gt;Bespoke parcels from mills&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;A mill dispatches against a customer order&amp;#39;s PO (A7.3)&lt;/td&gt;&lt;td&gt;Mill&amp;#39;s dispatch note; Enigma order (&lt;code&gt;FABRIC_RECEIVED_DATE&lt;/code&gt; is a filterable order-line date)&lt;/td&gt;&lt;td&gt;Parcel reference, order, inward date&lt;/td&gt;&lt;td&gt;Physical + Enigma&lt;/td&gt;&lt;td&gt;3–7 days after the PO (to confirm per mill)&lt;/td&gt;&lt;td&gt;Order can be planned; how the parcel is matched to the order today (sticker, note, memory) is to confirm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A8.8&lt;/td&gt;&lt;td&gt;Mill stock lists typed in&lt;/td&gt;&lt;td&gt;Warehouse / Sourcing / Janak&lt;/td&gt;&lt;td&gt;&amp;quot;Five emails a morning&amp;quot; — 5+ mills, daily or alternate days&lt;/td&gt;&lt;td&gt;Each mill&amp;#39;s attachment; VLOOKUP from the mill&amp;#39;s article to BSC&amp;#39;s fabric code; Italian mills (Thomas Mason, Albini) report only available / unavailable&lt;/td&gt;&lt;td&gt;Article, metres or availability; on-hold flag; a physical on-hold sticker on the swatch&lt;/td&gt;&lt;td&gt;Email → sheet → Enigma &lt;code&gt;isOnHold&lt;/code&gt;&lt;/td&gt;&lt;td&gt;30–60 min daily&lt;/td&gt;&lt;td&gt;A sold-out fabric is switched off when someone remembers; nobody measures the gap between &amp;quot;mill sold out&amp;quot; and &amp;quot;customer can no longer pick it&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Where it breaks. A8.1&amp;#39;s reconciliation is by hand and the gap is discovered days later. A8.2 has no GRN number, so the invoice and the receipt cannot be matched; finance&amp;#39;s three-way match does not exist. A8.5&amp;#39;s status is free text and STOs stay open after arrival (&amp;quot;system stock and physical stock stop matching … negative billing risk&amp;quot;). A8.6 has no receipt. A8.7 is invisible between the mill&amp;#39;s email and the GRN. A8.8 is the &amp;quot;five emails a morning&amp;quot; routine. Damaged pieces are &amp;quot;physically sent back or removed, but not cleanly removed from the system&amp;quot;; the hemming unit&amp;#39;s in and out are tracked by no system at all.&lt;/p&gt;
&lt;p&gt;Sources: Sourcing call transcript 46:22–47:18 (Shravani, GRN); Discovery 2nd sitting (Vaishnav&amp;#39;s team); Enigma Answers (warehouses, GRN shape, scan permissions, adjustment reasons, ShipHero, 403 list, FABRIC_RECEIVED_DATE); Discovery Record §01, §2c, §2d, §3d; Invisit meeting contexts §2 (bespoke), §5; Bombay shirt company store visit summary and Transcript of the store visit (§8, §9); memory bsc-design-discovery-2026-09-22 (swatch desk, sticker); bsc-plm-original/src/domain/reference.ts (MTM_STAGES cited to the 12 Sep 2026 production walk; PANEL_METRES cited to the extra-fabric email); data-files: STO Swatches Tracker.xlsx (STO, MTM_Swatches, FOB_Swatches), Display Fit Sample Allocation Sample.xlsx, Fabric Trims Deduction Tracker Sample.xlsx.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;8-timings-volumes-and-pain-points&quot;&gt;&lt;summary&gt;8. Timings, volumes and pain points&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;The numbers are the teams&amp;#39; own statements from discovery, rounded, with the file they can be read from where one exists; anything nobody said is marked to confirm rather than estimated. They are the baseline the targets in Section 19 are measured against.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;How often&lt;/th&gt;&lt;th&gt;Elapsed today&lt;/th&gt;&lt;th&gt;People typing&lt;/th&gt;&lt;th&gt;Where it breaks&lt;/th&gt;&lt;th&gt;Volume&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Idea to fabric PO (MTM)&lt;/td&gt;&lt;td&gt;Weekly Monday review of non-core; options blocked after selection&lt;/td&gt;&lt;td&gt;Design, tech pack and costing take 20–30 days after a fabric is chosen, so blocks exist to hold the cloth; block windows modelled at 45–120 days from anecdote (Question Bank Q41)&lt;/td&gt;&lt;td&gt;3 sheets per block (fabric ordering sheet, merchandise master, block sheet in 3 copies)&lt;/td&gt;&lt;td&gt;No record of the ask; blocks lapse from memory; sample rounds by email/WhatsApp&lt;/td&gt;&lt;td&gt;~5 options blocked per selection; new fabrics a year: to confirm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Options request settled&lt;/td&gt;&lt;td&gt;Per family slot count (e.g. &amp;quot;Houndstooth (6)&amp;quot;)&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;No count of settled slots; the plan hides in swatch-book labels&lt;/td&gt;&lt;td&gt;Slots per family as labelled; about 30 active MTM options planned (model MTM_ACTIVE_TARGET)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric PO to swatches in stores&lt;/td&gt;&lt;td&gt;Per fabric&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Sticker by hand (MRP reprinted on every price change); 34 store columns in the dispatch tracker; no receipt from any store&lt;/td&gt;&lt;td&gt;34 store sets per fabric; 0.08 m per store swatch, ₹25 sticker, ₹1,200 book slot per store per year (Question Bank)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Store go-live to online go-live&lt;/td&gt;&lt;td&gt;Per fabric&lt;/td&gt;&lt;td&gt;Marketing gets name and description 10–15 days before launch; stores get PDFs about a week before&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Photos and video not tracked; launch email is the record&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW plan to launch&lt;/td&gt;&lt;td&gt;Monthly drops plus replenishment&lt;/td&gt;&lt;td&gt;90–120 days plan to shelf; mill turnaround 75–90 days; custom-mill fabric 3–4 months ahead, ready fabric 2 months&lt;/td&gt;&lt;td&gt;6+&lt;/td&gt;&lt;td&gt;Allocation by email; no TNA per PO (&lt;code&gt;estimatedArrivalDate&lt;/code&gt; null everywhere); sample approvals in email with no version&lt;/td&gt;&lt;td&gt;136 ideal options in RTW shirts; 150-unit MOQ; 16,500 units needed for 12 weeks vs 20,400 planned&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Size ratio&lt;/td&gt;&lt;td&gt;Per order&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Last 3–6 months of sales by size, then gut tweaks not recorded; history includes broken-size periods&lt;/td&gt;&lt;td&gt;up to 12 sizes per style (28–50, XS–4XL)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vehicle round reconciliation&lt;/td&gt;&lt;td&gt;Daily&lt;/td&gt;&lt;td&gt;1–2 hours (A8.1)&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Declared vs received by hand&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;STO wave&lt;/td&gt;&lt;td&gt;Every two weeks&lt;/td&gt;&lt;td&gt;1–3 days (A8.5)&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;One STO line per piece; status free text; STOs stay open at the store&lt;/td&gt;&lt;td&gt;~300 styles × ~10 stock-holding stores reviewed&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;International core reorder&lt;/td&gt;&lt;td&gt;Weekly&lt;/td&gt;&lt;td&gt;~1 hour, to confirm&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Excel rebuilt by hand; no auto-PO — and in Enigma only 111 of 541 core fabrics have &lt;code&gt;isAutoPo&lt;/code&gt; on&lt;/td&gt;&lt;td&gt;~30 international core fabrics&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW stock-health pass&lt;/td&gt;&lt;td&gt;Weekly at best; &amp;quot;should be weekly but bandwidth-limited&amp;quot;&lt;/td&gt;&lt;td&gt;Half a day, to confirm&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Stock report pulled from Enigma daily by hand; broken sizes read as weak demand; no trigger&lt;/td&gt;&lt;td&gt;642 RTW shirt SKUs on the Concise sheet (79 healthy, 563 unhealthy, 281 at zero stock); 59 of 134 options healthy (12 Aug)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Bespoke mill stock&lt;/td&gt;&lt;td&gt;Daily or alternate days&lt;/td&gt;&lt;td&gt;&amp;quot;Five emails a morning&amp;quot;, re-typed by hand&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Switch-off on the site and the book after the fact; nobody measures the gap&lt;/td&gt;&lt;td&gt;~1,500 fabrics, 5+ mills; 1,742 BESPOKE + 457 BESPOKE_NON_CORE fabrics flagged auto-PO&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Return or alteration&lt;/td&gt;&lt;td&gt;Continuous&lt;/td&gt;&lt;td&gt;Days on Slack — no source gives a number&lt;/td&gt;&lt;td&gt;3 (store, production, finance)&lt;/td&gt;&lt;td&gt;Slack only; no status; store credit outside any ledger&lt;/td&gt;&lt;td&gt;Open cases at a time: to confirm; larger-format stores report 6–7% refunds&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Punching an MTM order&lt;/td&gt;&lt;td&gt;Per sale&lt;/td&gt;&lt;td&gt;to confirm&lt;/td&gt;&lt;td&gt;1 typing into two systems&lt;/td&gt;&lt;td&gt;Fabric by name; same customer in Shopify and Enigma; 318 orders unreserved on 26 Aug&lt;/td&gt;&lt;td&gt;MTM shirts: 3,196 units in the week to 9 Aug 2026 (L4W avg 3,110); 2,813 in the week to 30 Aug — roughly 400–460 shirts a day across all channels, not &amp;quot;40 a day&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;Weekly volumes readable from the Product Weekly Report&lt;/strong&gt; (week to Sun 9 Aug 2026): overall 6,839 units / ₹3.25 Cr (LW-1 6,260 / ₹2.88 Cr; L4W avg 6,318); shirts 4,419 of which MTM 3,196 and RTW 1,223; non-shirts 2,420 (35% of units); RTW shirts warehouse stock 11,317. Week to 30 Aug: overall 6,417 units / ₹2.88 Cr, MTM 2,813, RTW shirts 1,161. Bespoke is ~26% of MTM units (827 of 3,196), core 44%, non-core 19%, with the rest unclassified &amp;quot;-&amp;quot;. Month to date on the DSR (30 Aug): offline ₹5.19 Cr against a pro-rated ₹7.13 Cr across 35 stores; online ₹0.91 Cr. Enigma row counts: 8,585 fabrics, 15,826 POs, 195 vendors, 50 stores, 46 warehouses.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;The five pains the teams named unprompted.&lt;/strong&gt; Typing the same product three to five times (fabric sheet, merchandise master, Enigma, Shopify, marketing sheet). Not knowing where a piece, a swatch or a trouser at the hemming unit is without asking. Blocks lapsing from memory. Rate of sale lying when sizes break. Returns living in Slack. Behind all five: Janak is the single point of failure for every sheet — &amp;quot;Is this sheet updated?&amp;quot; — and &amp;quot;40% of Janak&amp;#39;s work&amp;quot; is maintaining reports.&lt;/p&gt;
&lt;p&gt;Sources: Discovery Record — What We Know v1.0 (18 Aug 2026); Invisit meeting contexts.md §4, §7, Part 1 (Marketing 10–15 days); Question Bank — MTM Spine v1.0 (Q41, swatch economics); RTW shirts inventory call.md and transcript (12 Aug 2026); Tranbscript of granola recording.md (Janak 40%); Discovery 2nd sitting in visit.md; Discovery 1 visit.md; Enigma Answers — Read From Live System (26 Aug 2026); Discovery Close-Out (07 Sep 2026); data-files/Product Weekly Report 090826 2.xlsx (Summery, L4W, MTM-Bespoke_Non Bespoke tabs); data-files/RTW_Shirts_Concise_Updated 10.xlsx (ROS &amp;amp; Health Summary); bsc-plm-original/src/domain/realanalytics.ts (week ending 30 Aug 2026, DSR totals); Bombay shirt company store visit summary.md (6–7% refunds); this document&amp;#39;s A8.1 and A8.5 for the warehouse timings.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;9-mtm-daily-production&quot;&gt;&lt;summary&gt;9. MTM daily production&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Every punched shirt goes through the production unit&amp;#39;s day: a plan seven days ahead, bundles to the MTM factories (6–7 in scope per the 16 Sep alignment; the working model seeds three — Mahendra, Richman, Harsh), a QR scan at each hop, and a vehicle round back. Enigma already carries the QR (&lt;code&gt;qrCodeUrl&lt;/code&gt; on the order line; permissions &lt;code&gt;factoryAssemblyScan&lt;/code&gt;, &lt;code&gt;finishingScan&lt;/code&gt;, &lt;code&gt;scanAtStore&lt;/code&gt;) and 59 order states whose transitions are scoped per factory (BOM / COF / KOR). Most of the numbers below come from the 12 Sep 2026 production walk with Swati, which has no transcript in the docs folder — they are encoded in &lt;code&gt;reference.ts&lt;/code&gt; and marked &amp;quot;to confirm&amp;quot;; the &amp;quot;about 40 pieces a day&amp;quot; figure in earlier drafts contradicts the 16 Sep note (capacity example 600/day) and the seeded factory outputs (~500/day) and is not used here.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-mermaid&quot;&gt;flowchart LR
  A[Punched&amp;lt;br/&amp;gt;Enigma reserves metres on punch] --&amp;gt; B[PP&amp;lt;br/&amp;gt;~2-hour freeze for store changes]
  B --&amp;gt; C[Planned&amp;lt;br/&amp;gt;FIFO, urgent first, seven days ahead, by hand]
  C --&amp;gt; D[Cut and bundled&amp;lt;br/&amp;gt;QR out of the unit · metres deducted]
  D --&amp;gt; E[In factory&amp;lt;br/&amp;gt;QR in]
  E --&amp;gt; F[Out factory&amp;lt;br/&amp;gt;QR ready, QC at the factory]
  F --&amp;gt; G[RTS&amp;lt;br/&amp;gt;vehicle round, QR back]
  G --&amp;gt; H[Fitting / shipping&amp;lt;br/&amp;gt;to the customer]&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Trigger&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Hand-off&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A10.1&lt;/td&gt;&lt;td&gt;Order lands in the queue&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;td&gt;Punched in a store (Shopify bill + Enigma order sheet) or online&lt;/td&gt;&lt;td&gt;Enigma order: states PRE_CONFIRMED → NEW → PRE_PRODUCTION among the 59; the order sheet (cms.bombayshirts.com/order-sheet) carries a 20-field measurement block, four pattern flags (shirt margin, low neck, sloping shoulders, back down) and one tile per option (collar style/stiffness/contrast/piping/top button, sleeves, cuff style/stiffness/contrast, placket/contrast/stay, buttons, button thread, stitching thread, back, bottom cut, pocket, elbow patch, gusset, shirt length, monogram); Fit Smart computes consumption from 5 questions, master tailor adjusts ±1–2&amp;quot;&lt;/td&gt;&lt;td&gt;Fabric, design/product code, fit, measurements, tiles; tag normal / urgent / corporate (16 Sep filters: Urgent, VIP, Corporate, Normal)&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;td&gt;Immediate; Enigma reserves the metres against the order id&lt;/td&gt;&lt;td&gt;Sits until the freeze passes&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.2&lt;/td&gt;&lt;td&gt;Freeze&lt;/td&gt;&lt;td&gt;Production planner (Swati)&lt;/td&gt;&lt;td&gt;~2 hours after punch (12 Sep walk; 16 Sep: &amp;quot;time window such as the last 2 hours&amp;quot;; &amp;quot;changes lock at PP2&amp;quot;)&lt;/td&gt;&lt;td&gt;Enigma order list&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Rule of thumb, not enforced&lt;/td&gt;&lt;td&gt;2 h&lt;/td&gt;&lt;td&gt;Stores still change sheets in this window; changes reach production &amp;quot;through an email loop&amp;quot; (16 Sep)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.3&lt;/td&gt;&lt;td&gt;Bespoke orders wait for the mill&lt;/td&gt;&lt;td&gt;Warehouse / Sourcing&lt;/td&gt;&lt;td&gt;A bespoke fabric&lt;/td&gt;&lt;td&gt;Enigma fires the per-order PO to the mill (order line &lt;code&gt;purchaseOrderStatus: PO_PENDING&lt;/code&gt;; batch runs at 08:00 and 15:00 IST — &amp;quot;next day in the morning, 8 o&amp;#39;clock, it&amp;#39;s PO release&amp;quot;, Sreekanth); the parcel arrives with the mill&amp;#39;s sticker&lt;/td&gt;&lt;td&gt;PO id, parcel, inward date&lt;/td&gt;&lt;td&gt;Enigma + physical&lt;/td&gt;&lt;td&gt;3–7 days (to confirm)&lt;/td&gt;&lt;td&gt;Order can be planned&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.4&lt;/td&gt;&lt;td&gt;The plan&lt;/td&gt;&lt;td&gt;Swati&lt;/td&gt;&lt;td&gt;Every morning&lt;/td&gt;&lt;td&gt;Enigma&amp;#39;s production-plan page (bulk select 30–60 orders, e.g. &amp;quot;In Progress Production Plan #41274&amp;quot;); factory capacity in the planner&amp;#39;s head — learned feeds such as &amp;quot;Mahendra 300, Harsh 60&amp;quot; a day; urgent orders to the factory kept with breathing space (Richman), corporate orders always to one factory (Mahendra)&lt;/td&gt;&lt;td&gt;Which factory gets which orders, FIFO, urgent first, seven days ahead&lt;/td&gt;&lt;td&gt;Enigma plan + WhatsApp to each factory&lt;/td&gt;&lt;td&gt;1–2 h daily (to confirm)&lt;/td&gt;&lt;td&gt;Job cards printed at the unit, order sheets on coloured paper sent with the fabric&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.5&lt;/td&gt;&lt;td&gt;Cut and bundle&lt;/td&gt;&lt;td&gt;Unit&lt;/td&gt;&lt;td&gt;The plan&lt;/td&gt;&lt;td&gt;Enigma consumption on the order sheet (base per fabric + 0.10 m buffer; big checks add matching); paper cut list&lt;/td&gt;&lt;td&gt;Metres per order; bundle per factory&lt;/td&gt;&lt;td&gt;Paper&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;td&gt;QR scan out → In production; Enigma deducts the metres (&lt;code&gt;isDeducted&lt;/code&gt;, &lt;code&gt;deductedFromBin&lt;/code&gt;; the quantity exists only on the ledger row)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.6&lt;/td&gt;&lt;td&gt;Factory scans in&lt;/td&gt;&lt;td&gt;Factory merchandiser (e.g. Nitin Singh at Mahendra; also Abhin M, Bhupendra)&lt;/td&gt;&lt;td&gt;Vehicle arrives&lt;/td&gt;&lt;td&gt;Enigma scan&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Scanner / phone&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;td&gt;Manufacturing starts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.7&lt;/td&gt;&lt;td&gt;Sheet changes after planning&lt;/td&gt;&lt;td&gt;Store → Production → Factory&lt;/td&gt;&lt;td&gt;A customer changes their mind (&amp;quot;four or five times a day&amp;quot; — collar, cuff, monogram, letter, button, thread, add-ons per 16 Sep)&lt;/td&gt;&lt;td&gt;Enigma order sheet edited; the factory told by email/WhatsApp; a new job card printed if the bundle has gone&lt;/td&gt;&lt;td&gt;Field, old, new; &amp;quot;reprint&amp;quot;&lt;/td&gt;&lt;td&gt;Enigma + email + WhatsApp + paper&lt;/td&gt;&lt;td&gt;Hours to days; often missed&lt;/td&gt;&lt;td&gt;Factory works to the latest sheet, if told&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.8&lt;/td&gt;&lt;td&gt;Extra fabric for a spoiled panel&lt;/td&gt;&lt;td&gt;Factory → Production → Warehouse&lt;/td&gt;&lt;td&gt;A cutting or stitching fault&lt;/td&gt;&lt;td&gt;The daily &amp;quot;EXTRA FABRIC&amp;quot; email: order, fabric, panel (single front, both fronts/patta, sleeve, collar, cuff), metres (80 cm single / 90 cm full width), reason (factory error vs PP error)&lt;/td&gt;&lt;td&gt;Email; example 0.8 m (16 Sep)&lt;/td&gt;&lt;td&gt;Daily&lt;/td&gt;&lt;td&gt;Approved by reply; cut and sent with the next vehicle&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.9&lt;/td&gt;&lt;td&gt;Out-factory scan, QC at the factory&lt;/td&gt;&lt;td&gt;Factory merchandiser&lt;/td&gt;&lt;td&gt;Piece finished&lt;/td&gt;&lt;td&gt;Enigma scan&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Scanner&lt;/td&gt;&lt;td&gt;Day 3–5 in factory (to confirm)&lt;/td&gt;&lt;td&gt;Ready for the vehicle; the factory&amp;#39;s daily output count goes to production on WhatsApp&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.10&lt;/td&gt;&lt;td&gt;Vehicle round and RTS&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Daily vehicle&lt;/td&gt;&lt;td&gt;RTS scan; declared vs received tallied by hand&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Scanner + paper&lt;/td&gt;&lt;td&gt;1–2 h (to confirm)&lt;/td&gt;&lt;td&gt;Shipping&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.11&lt;/td&gt;&lt;td&gt;Fitting, shipping, delivery&lt;/td&gt;&lt;td&gt;Shipping team (Vishal&amp;#39;s table) / Store&lt;/td&gt;&lt;td&gt;RTS&lt;/td&gt;&lt;td&gt;Enigma shipping states (&lt;code&gt;SHIPPING_INITIATED_ON&lt;/code&gt;, &lt;code&gt;SHIPPED_ON&lt;/code&gt;, &lt;code&gt;READY_FOR_SHIPHERO&lt;/code&gt;); courier&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;td&gt;1–3 days&lt;/td&gt;&lt;td&gt;Customer told by phone&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A10.12&lt;/td&gt;&lt;td&gt;Aging and the daily pivot&lt;/td&gt;&lt;td&gt;Production (Vishnu&amp;#39;s pivot)&lt;/td&gt;&lt;td&gt;Every morning&lt;/td&gt;&lt;td&gt;An Excel pivot from the Enigma export: open orders by stage × factory, days in factory, overdue against &lt;code&gt;SHIP_BY&lt;/code&gt;, due today&lt;/td&gt;&lt;td&gt;Stage counts; &amp;gt; 5 days in factory is &amp;quot;aging&amp;quot;&lt;/td&gt;&lt;td&gt;Excel&lt;/td&gt;&lt;td&gt;30 min daily (to confirm)&lt;/td&gt;&lt;td&gt;Factories chased on WhatsApp&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
