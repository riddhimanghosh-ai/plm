&lt;p&gt;Where it breaks. A10.4 is a person&amp;#39;s head and an Enigma list; capacity per factory is not written anywhere. A10.7 is the biggest leak: a sheet change after the bundle has left is an email or WhatsApp and a reprint that may or may not happen. A10.8 is an email whose approval nobody ties to inventory. A10.10 reconciles by hand. A10.12 is rebuilt every morning from an export. The 16 Sep and 25 Sep notes disagree on where this should live — &amp;quot;keep the functionality within Enigma&amp;quot; (16 Sep) vs &amp;quot;a separate clean build, not inside Enigma&amp;quot; (25 Sep).&lt;/p&gt;
&lt;p&gt;Sources: reference.ts (MTM production walk 12 Sep 2026 — no transcript on file), Granola notes &amp;quot;BSC Production MTM - Alignment&amp;quot; (16 Sep) and &amp;quot;PLM - BSC Discussion&amp;quot; (25 Sep); Enigma Answers — Read From Live System (26 Aug); Sourcing call transcript (6 Aug); Invisit meeting contexts §1, §6; Tranbscript of granola recording (Meeting 2); types.ts / seed.ts (factory names, MERCHANDISERS, Vishnu, Vishal).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;10-rtw-production-at-the-factory&quot;&gt;&lt;summary&gt;10. RTW production at the factory&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Once a bulk PO is placed, Parag Mathkari&amp;#39;s production team and the factory merchandisers (Nitin Singh, Abhin M, Bhupendra — the tracker&amp;#39;s Merchant column; Nitin and Prince also appear on Monthly Drops as dispatch owners) run the order on a WhatsApp thread and one workbook, Production Tracker Final V2.xlsx: 128 columns in six groups (Style Details, Order Qty Break-Up by 20 sizes, Vendor Finalization, Fabric Details, Production Milestones with planned / revised / actual for 22 steps, Final Steps), plus Daily Monitor, Alert Dashboard and OTIF Dashboard tabs and a Config sheet with seven day-offset templates (RTW CMT shirts, RTW FOB shirts, Bottoms / Knitwear / Jackets, Flat Knits T-shirts, Flat Knits Shirts, Jeans, Kurta) and two risk thresholds (critical ≤ 7 buffer days, at-risk ≤ 10). The workbook itself was not in the shared data set; what is known of it is what the prototype&amp;#39;s reference file copied from it, and Yulette&amp;#39;s &amp;quot;Parag maintains this — his WIP tracker&amp;quot;. The 22 milestone columns: Yarn PO · Fabric PO · Yarn ETA · Fabric ETA · Trims ETA · PPS Submission · PPS Approval · Size Set Sub · Size Set Appvl · Knitting Start / End · Interlock Start / End · Cutting Start / End · Stitching Start / End · Finishing Start / End · FI · Dispatch · Inhouse ETA. Parag&amp;#39;s own list of what is missing (26 Jul): capacity committed per vendor per category, orders booked versus capacity left per month, a micro-level TNA per PO, sampling and bulk timelines with actuals, and the invoice-to-accounting flow.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Trigger&lt;/th&gt;&lt;th&gt;Data source today&lt;/th&gt;&lt;th&gt;Fields&lt;/th&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Hand-off&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A11.1&lt;/td&gt;&lt;td&gt;Job card, tech pack and BOM reach the factory&lt;/td&gt;&lt;td&gt;Production; design supplies the tech pack and BOM&lt;/td&gt;&lt;td&gt;Allocation (A3.5–A3.6)&lt;/td&gt;&lt;td&gt;Paper job card (the tracker&amp;#39;s &amp;quot;BOM / job card&amp;quot; column); PDF style sheet; physical trim card&lt;/td&gt;&lt;td&gt;Construction details, BOM lines, size breakup, fabric to issue&lt;/td&gt;&lt;td&gt;Paper + PDF + courier&lt;/td&gt;&lt;td&gt;With the cloth&lt;/td&gt;&lt;td&gt;Factory plans its line; &amp;quot;Style handover date&amp;quot; starts the tracker&amp;#39;s lead-time clock&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A11.2&lt;/td&gt;&lt;td&gt;Cloth and trims arrive at the factory&lt;/td&gt;&lt;td&gt;Factory&lt;/td&gt;&lt;td&gt;Vehicle / courier (BSC-bought cloth from the unit; FOB cloth from the nominated supplier; trims pre-sourced by the factory or sent by BSC)&lt;/td&gt;&lt;td&gt;Nothing structured — the factory confirms on WhatsApp; &amp;quot;no tracking of fabric reaching vendor&amp;quot; (3rd sitting); the tracker&amp;#39;s Fabric ready / Trims ready Yes/No columns&lt;/td&gt;&lt;td&gt;Fabric ETA, Trims ETA actuals&lt;/td&gt;&lt;td&gt;Message → cell&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Cutting can start&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A11.3&lt;/td&gt;&lt;td&gt;Photo sample, PP sample (and size set where the template has it)&lt;/td&gt;&lt;td&gt;Factory merchandiser → Production → RQC&lt;/td&gt;&lt;td&gt;Job card&lt;/td&gt;&lt;td&gt;WhatsApp photos; PPS Submission / PPS Approval dates on the tracker (CMT shirts template: day 7 and day 9 from PO; Bottoms: PPS 7/14, Size Set 21/23; Jeans: PPS 10/17, Size Set 24/26)&lt;/td&gt;&lt;td&gt;Round, comments (construction, fit, wash, hand-feel), decision&lt;/td&gt;&lt;td&gt;Photos + a cell&lt;/td&gt;&lt;td&gt;7–14 days a round (to confirm)&lt;/td&gt;&lt;td&gt;PP go-ahead by message (A3.8)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A11.4&lt;/td&gt;&lt;td&gt;Bulk milestones&lt;/td&gt;&lt;td&gt;Factory merchandiser → Production&lt;/td&gt;&lt;td&gt;PP go-ahead&lt;/td&gt;&lt;td&gt;The tracker: per PO, plan / revised / actual for Cutting Start · Cutting End · Stitching Start · Stitching End · Finishing Start · Finishing End · FI · Dispatch · Inhouse ETA (Flat Knits run Knitting and Interlock instead of Cutting); plan dates come from the Config offsets (CMT shirts: cutting 13–17, stitching 19–26, finishing 28–30, FI 32, Dispatch 33, Inhouse 34; FOB shirts Inhouse 47; Bottoms 63; Jeans 77; Flat Knit tees 45); re-dated every week by phone&lt;/td&gt;&lt;td&gt;Dates; delay causes named in the walkthrough: fabric not received from mill, trims short-supplied, PPS approval pending, factory capacity taken by another order, quality rework after inline check, fabric quality rejected at inspection, labour shortage, awaiting size-set approval&lt;/td&gt;&lt;td&gt;Excel, one Expected Date per week&lt;/td&gt;&lt;td&gt;~45 days (design, 22 Sep)&lt;/td&gt;&lt;td&gt;Planning reads &amp;quot;Latest Expected/Status&amp;quot; into the Concise workbook and Monthly Drops&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A11.5&lt;/td&gt;&lt;td&gt;Escalation&lt;/td&gt;&lt;td&gt;Production (Parag) with Planning (Neha)&lt;/td&gt;&lt;td&gt;A PO past its buffer; a rejected shipment&lt;/td&gt;&lt;td&gt;WhatsApp; the Option Count Summary&amp;#39;s Remarks column is the only written trace (&amp;quot;Shipment rejected at Dazzle, getting an interim shipment mid May&amp;quot;; &amp;quot;Quality Issue - Dazzle&amp;quot;)&lt;/td&gt;&lt;td&gt;Recovery action agreed verbally (second line, air-freight trims, split, accept the delay and move the drop)&lt;/td&gt;&lt;td&gt;Message&lt;/td&gt;&lt;td&gt;Days&lt;/td&gt;&lt;td&gt;Factory adds a line, or the drop moves&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A11.6&lt;/td&gt;&lt;td&gt;QC audit&lt;/td&gt;&lt;td&gt;BSC&amp;#39;s merchandiser and QC at the factory&lt;/td&gt;&lt;td&gt;Before dispatch (&amp;quot;quality checks on the fabric as well as the finished goods, plus an inline inspection&amp;quot; — Neha)&lt;/td&gt;&lt;td&gt;Paper checklist; the FI (final inspection) cell; result on WhatsApp&lt;/td&gt;&lt;td&gt;Checked, passed, issues, released or held&lt;/td&gt;&lt;td&gt;Paper + message&lt;/td&gt;&lt;td&gt;1 day&lt;/td&gt;&lt;td&gt;Dispatch or hold; a rejected lot (Dazzle) is handled as an escalation&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A11.7&lt;/td&gt;&lt;td&gt;Split dispatch&lt;/td&gt;&lt;td&gt;Factory / Production&lt;/td&gt;&lt;td&gt;Part of the lot ready; an urgent launch (&amp;quot;we are running behind schedule from production, which is general&amp;quot; — Charanjeet)&lt;/td&gt;&lt;td&gt;Agreed on WhatsApp; two lots on the tracker; the merchandiser gives planning a manual dispatch quantity so allocation can start before inward&lt;/td&gt;&lt;td&gt;First lot qty and date; balance&lt;/td&gt;&lt;td&gt;Message + sheet&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Warehouse receives lot by lot (A8.2); the Concise workbook&amp;#39;s Total Order Qty · Total Recd Qty · Incoming Qty shows the residue (202 ordered / 172 received / 0 incoming, &amp;quot;Delivered&amp;quot;)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A11.8&lt;/td&gt;&lt;td&gt;Delivery performance&lt;/td&gt;&lt;td&gt;Planning / Production&lt;/td&gt;&lt;td&gt;Monthly&lt;/td&gt;&lt;td&gt;The OTIF Dashboard tab (On Time = Dispatch Actual ≤ Target Inhouse; In Full = Delivered within ±3% of Cut / Order Qty) and the tracker&amp;#39;s Planned lead / Actual lead columns; the Fit &amp;amp; Display Projection&amp;#39;s PO status&lt;/td&gt;&lt;td&gt;On time, in full, by factory; Cut qty, Delivered qty, Risk factor&lt;/td&gt;&lt;td&gt;Excel&lt;/td&gt;&lt;td&gt;Monthly&lt;/td&gt;&lt;td&gt;Never fed back to allocation; vendor judgement &amp;quot;lived in one person&amp;#39;s memory&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Where it breaks. A11.1 is paper, so a ratio change means a re-issued job card nobody versions. A11.2 has no arrival record, so a late fabric and a slow factory look the same. A11.3–A11.4 are re-dated by phone; once revised, the original plan date is overwritten and the buffer is computed off a plan that may never have reached the target. A11.5 has no record of what was agreed or who accepted the delay. A11.6&amp;#39;s result lives in a message and does not stop a dispatch. A11.7 leaves the PO&amp;#39;s ordered quantity and the received quantity in two different sheets. A11.8 is compiled by hand after the fact and does not reach the next allocation.&lt;/p&gt;
&lt;p&gt;Sources: Transcript of call (Parag, 33:59–35:49; Neha on inspections); RTW shirts inventory transcript (Parag&amp;#39;s WIP tracker 14:36–15:00; urgent launch 57:51–58:34); Discovery 3rd visit; Discovery 4th sitting (sampling); memory bsc-design-discovery-2026-09-22 (~45 days, RQC); data-files: Option Count Summary Sample.xlsx (Remarks), RTW_Shirts_Concise_Updated 10.xlsx (PO Status … Latest Expected/Status columns), Fit Display Projection Jun26 Sample.xlsx, Monthly Drops Products Sample.xlsx; bsc-plm-original/src/domain/reference.ts (MILESTONES, OFFSETS, RISK, OTIF_TOLERANCE, DELAY_REASONS, MERCHANDISERS — each cited there to Production Tracker Final V2.xlsx) and src/screens/Tracker.tsx (SheetColumns, the six groups).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;11-the-analytics-the-teams-run-today&quot;&gt;&lt;summary&gt;11. The analytics the teams run today&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Every report is a pivot on an Enigma stock export or a Shopify sales export, typed together by one person and mailed as an attachment. Who builds each one is only partly known: the ageing file carries &amp;quot;AMAN&amp;quot; in its name and Aman is on the C1b RTW call list; Charanjeet (CJ) and Yulette own RTW planning and the &amp;quot;AI file&amp;quot;; Janak owns the MTM merchandise sheets; a &amp;quot;Category Finance&amp;quot; hire under Neha M is listed in the weekly report&amp;#39;s own Sheet1. The Product Weekly Report is dated the Sunday its week ends (02/08/26, 09/08/26, 30/08/26); weeks run Monday to Sunday (&amp;quot;15/06-21/06&amp;quot;). The DSR and Stylist KPI workbooks were not in the files shared; their columns below are read from the generated &lt;code&gt;realanalytics.ts&lt;/code&gt; (week ending 30 Aug 2026), not from a source file — to confirm against the originals.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Workbook&lt;/th&gt;&lt;th&gt;Cadence&lt;/th&gt;&lt;th&gt;Built from&lt;/th&gt;&lt;th&gt;What it shows (tabs and columns)&lt;/th&gt;&lt;th&gt;Who reads it&lt;/th&gt;&lt;th&gt;Decision it feeds&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Product Weekly Report (&lt;code&gt;Product Weekly Report 020826.xlsx&lt;/code&gt;, &lt;code&gt;…090826 2.xlsx&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Weekly, dated Sunday; mailed Monday (to confirm)&lt;/td&gt;&lt;td&gt;Shopify sales export by product code; Enigma/ShipHero stock for WH Stock (&amp;quot;Ship Hero Style name&amp;quot; is the key)&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Summary&lt;/strong&gt; / &amp;quot;Summery&amp;quot;: rows Overall BSC Sales, Non shirts, Non shirts Contribution, Shirts, MTM-Shirts, RTW Shirts, RTW Shirts Contribution To Shirts, Bottoms, Knitwear, Jackets, KURTA × columns LW Qty/Revenue, LW-1 Qty/Revenue, % Change Qty/Revenue, L4W Avg Qty/Revenue. &lt;strong&gt;L4W&lt;/strong&gt;: Sr.No., Category, Sub Category, Contribution %, AWS (12 W), AWS (L4W), WH Stock, then Units/Value for LW, LW-1, LW-2, LW-3; ~30 sub-category rows with totals, plus a second block Sr.No., Sub-Category, Products, AWS (Total). &lt;strong&gt;MTM Shirt Range&lt;/strong&gt;: Product Range × L12W Avg Quantity, then Revenue/Quantity for LW…LW-3, %Growth v/s LW-1, %Growth v/s L12W (57 ranges: 100% LINEN, 2-PLY, 4-WAY, ALBINI BESPOKE…). &lt;strong&gt;MTM-Bespoke_Non Bespoke&lt;/strong&gt;: Bespoke/Non Bespoke (BESPOKE, CORE, NON CORE, &amp;quot;-&amp;quot;) × Range (0-3K, 3K-4K, 4K-5K, 5K-7.5K, &amp;gt;7.5K) × LW…LW-3, %Growth v/s LW-1. &lt;strong&gt;RTW DP&lt;/strong&gt; (02/08) / &lt;strong&gt;RTW DP &amp;amp; Chinos&lt;/strong&gt; (09/08): Ship Hero Style name × Offline and Online LW…LW-3 QTY and Rev. &lt;strong&gt;Elevate Chinos &amp;amp; Kurta&lt;/strong&gt; (09/08 only): style × Offline/Online Qty/Rev. &lt;strong&gt;Jackets&lt;/strong&gt; (09/08 only): Sub-Category 1 × Offline LW…LW-3 QTY and Rev. &lt;strong&gt;Product On Sale&lt;/strong&gt; (hidden tab, 462 rows, 09/08): Category2, Sub-Category 1, Sub-Category 2, Shiphero Style Name, Original MRP, New Discounted price, Date Moving to Sale, Stock Before Going To Sale, Pre-Sale ROS, Post Sale L4W ROS, then one column per week from 15/06-21/06 back to 26/01-01/02, Stock As 22 Jun. &lt;strong&gt;Sheet1&lt;/strong&gt; (09/08): a hiring list (Position, HOD, Why Hiring) left in the workbook&lt;/td&gt;&lt;td&gt;Leadership, design, planning&lt;/td&gt;&lt;td&gt;What is selling; which ranges grow; whether a markdown moved stock&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DSR (daily sales report)&lt;/td&gt;&lt;td&gt;Daily, month to date&lt;/td&gt;&lt;td&gt;Shopify by store (to confirm)&lt;/td&gt;&lt;td&gt;One row per store (35) plus Online, Virtual Stylist, Corporate Orders, and Offline/Online/North/South/West/Grand Total rows: Region, SSSG/NON SSSG, City, Store, LY total, LTD, Month target, MTD target, Sales MTD, MTD ach %, Projected LE, GOLM %, GOLY %, Proj GOLY, AOV avg, AOV MTD, Customers, Bills, Qty, New sales, Returning sales, New bills, Returning bills, New AOV, Returning AOV, New customers, Returning customers, New-customer target, New-customer ach %, Repeat-customer ach %, New FF, New conversion&lt;/td&gt;&lt;td&gt;Retail ops, the three area managers, store managers&lt;/td&gt;&lt;td&gt;Store month against a pro-rated target; new vs returning&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Stylist KPI output&lt;/td&gt;&lt;td&gt;Monthly to date (period to confirm)&lt;/td&gt;&lt;td&gt;POS by associate&lt;/td&gt;&lt;td&gt;281 rows: Store, Staff (incl. a &amp;quot;Store Total&amp;quot; row per store), Target, Revenue, Ach %, Bills, Qty, ASP, AOV, UPO, New UPO, Repeat UPO, New/Returning customers, New/Returning revenue, New/Returning AOV, Conversion, Call target, Calls done, NPS — the last four are empty on every row in the file we have&lt;/td&gt;&lt;td&gt;Retail ops&lt;/td&gt;&lt;td&gt;Floor performance; the NPS column the floor says is unreliable&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span style=&quot;white-space:pre-wrap&quot;&gt;ROS &amp;amp; Health Report (&lt;code&gt;ROS  Health Report 020826.xlsx&lt;/code&gt;)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Weekly&lt;/td&gt;&lt;td&gt;Enigma stock export + Shopify sales&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Working&lt;/strong&gt;: Remarks, Top/Bottom, Category, Sub-Category 1/2, Shiphero Style Name, sizes 28–50 and XS–4XL, Grand Total, Product Launch Date, Total Sale, WOF, ROS, Sell Thru, LW…LW-3, Count, Low stock Size Count, Stock Health, Healthy Or Not, EOSS Sale, Top 6 Weeks ROS. &lt;strong&gt;Performance Pants&lt;/strong&gt;: same shape&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Reorder, liquidate, reintroduce (A7.5–A7.6)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW_Shirts_Concise (&lt;code&gt;RTW_Shirts_Concise_Updated 10.xlsx&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Weekly action pass (28-Jun, 05-Jul, 02-Aug columns)&lt;/td&gt;&lt;td&gt;The Working sheet above plus PO status&lt;/td&gt;&lt;td&gt;&lt;strong&gt;ROS &amp;amp; Health Summary&lt;/strong&gt; (Total SKUs 642, Healthy 79, Unhealthy 563, Units in Stock 8,048, Last Week Sales 1,015, Avg ROS 2.5, Peak 6W ROS 43.3, Zero Stock SKUs 281, On EOSS Sale 420; sub-category summary); &lt;strong&gt;Line-Item Detail&lt;/strong&gt; (55 columns: Sub-Cat 1/2, Style Name, Stock, Total Sales, ROS, Top 6W ROS, WOF, LW…LW-3, Health, Sz OOS, EOSS, Velocity, Gap / Issue, Action, attributes pattern…Shirt Range, Wk 12-Apr…Wk 28-Jun, 12W Trend, PO Status, Vendor(s), Total Order/Recd/Incoming Qty, Latest Expected/Status, 45-/60-Day Sales and ROS, Stock-Constrained?) with the nine verbs URGENT REPLENISH · SIZE FILL · REINTRODUCE · CLEAR / DISCOUNT · LIQUIDATE · EXIT · MAINTAIN · REVIEW · MONITOR; &lt;strong&gt;Targets &amp;amp; Gap Analysis&lt;/strong&gt; (Month Sep-26…Feb-27, Target Revenue); &lt;strong&gt;Action History&lt;/strong&gt; (Style Name, Sub-Cat 1, per-date Action/Tier/Status — &amp;quot;a SKU cannot jump directly…&amp;quot;); &lt;strong&gt;12W Trend Charts&lt;/strong&gt;; &lt;strong&gt;Velocity Parameters&lt;/strong&gt;; &lt;strong&gt;Action &amp;amp; Gap Parameters&lt;/strong&gt;; &lt;strong&gt;External Benchmarking&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Planning (CJ, Yulette)&lt;/td&gt;&lt;td&gt;The weekly verb per option&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Option Count Summary (&lt;code&gt;Option Count Summary Sample.xlsx&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Monthly, dated 07/07, 21/07, 28/07/26&lt;/td&gt;&lt;td&gt;The merchandise master + the tracker&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Sheet1&lt;/strong&gt;: Sr.No., Category, Type, Product Details, Ideal Option Count, Healthy Option Count (two dated columns), % Availability, New Options added for Jun, In Production, Expected Date, In Planning, Remarks; categories RTW Shirts, Kurta, Jackets, Knitwear, Formal Pant… Ideal Option Count is blank on most rows in the sample (hence #DIV/0! in % Availability)&lt;/td&gt;&lt;td&gt;Planning, design&lt;/td&gt;&lt;td&gt;How many options to plan (A3.1)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ageing (&lt;code&gt;Ageing 01.07.2026 AMAN AGEING Sample Done.xlsx&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Monthly (1 Jul 2026)&lt;/td&gt;&lt;td&gt;Enigma stock by style × size + launch date + cost lines&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Ageing Pivot&lt;/strong&gt;: Category- PC, Sub-Category 1 PC, Core/Non-Core PC × buckets 0-90 days, 120-180 days, 180-270 days, &amp;gt;270 days, Grand Total (the 90–120 bucket does not appear in this sample). &lt;strong&gt;July-26 Rev1&lt;/strong&gt; (76 columns): Top/Bottom, Category2, Sub-Category 1/2, Core/Non-Core, Style description, sizes 28–50 and XS–4XL, NA, Total Stock, Remarks, Display status, STORE, Store Stock, Warehouse Stock, Sale/Non-Sale, Launch Date, Age of Days, Ageing, LW…LW-3, ROS, Top 6 Week, L4W ROS, Original/Discounted MRP, Price Bucket, Net MRP, Discounted Net MRP, % Margin, New Net Margin%, New % Discount, FOB, CMP, Trims + Packaging, Fabric, Per Pc Cost, Finance Cost, Transport, Shipping, Alteration, Overheads, Total Cost/PC, Total Holding Cost, Total Inventory Cost, TTL O.MRP, TTL O.Net MRP, TTL Dis MRP, TTL Dis Net MRP&lt;/td&gt;&lt;td&gt;Planning, finance&lt;/td&gt;&lt;td&gt;Liquidation candidates (&amp;gt;180 days is the stated benchmark)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span style=&quot;white-space:pre-wrap&quot;&gt;Margin working (&lt;code&gt;AUG26 MARGIN WORKING 30072026 Final Rev2  Done.xlsx&lt;/code&gt;)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Monthly (30 Jul for August)&lt;/td&gt;&lt;td&gt;Stock by style × size (same 70-column layout as Ageing) + L4W ROS + cost per piece&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Summary&lt;/strong&gt;: LY Units/Gross, GwthVs LY, % contri, Category, Sub-Category, Units, Gross Revenue, Net Revenue, Total Cogs, Projected Margin New, Ref. Margin July 1-26th, Remarks, ASP, AWS, then Gross/Deduction/Tax/Net/GM; Bplan Tgt and Gap rows. &lt;strong&gt;Master Pivot&lt;/strong&gt;: Category2, Sub-Category 1/2, Count of Style description, Sum of Total Stock, averages of Original/Net/Discounted MRP, Total Cost/PC, L4W ROS. &lt;strong&gt;Casual Pants&lt;/strong&gt;: the pivot plus SOH, Projected ROS, Proj. Unit, AWS, Expected Monthly Sellthru%, Proj. Gross/Net (org. and Final), Cost, Intake Margin%. &lt;strong&gt;Aug-26&lt;/strong&gt;: the style × size stock sheet&lt;/td&gt;&lt;td&gt;Finance, leadership&lt;/td&gt;&lt;td&gt;Pricing and markdown depth (out of scope)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Category penetration MOM (&lt;code&gt;category Penetration MOM 1.xlsx&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Monthly&lt;/td&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Sheet1&lt;/strong&gt;: Month (Jan–Jun 2026) × &amp;quot;Category Penetration Number&amp;quot; (1.31 → 1.34) — categories per bill, not a share&lt;/td&gt;&lt;td&gt;Leadership&lt;/td&gt;&lt;td&gt;Cross-category attach&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span style=&quot;white-space:pre-wrap&quot;&gt;Working capital (&lt;code&gt;Working Capital  Sample.xlsx&lt;/code&gt;)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Monthly (as on 22/07/26)&lt;/td&gt;&lt;td&gt;Open POs&lt;/td&gt;&lt;td&gt;&lt;strong&gt;New Summary&lt;/strong&gt;: Sr. No., Sub Category, Category, No of Options, Vendor, Fabric/FOB/CMP, Cost, Quantity, Total, PO No., PO/Details Sent Date, Payment Terms, Shipped / Not Shipped, ETD, Payment Terms in Days, Payment Due Date, Month, Advance, Invoice, Balance, Credit Note, PDC Amount, PDC Due Date. &lt;strong&gt;Summary&lt;/strong&gt;: PDC issued and due per month, additional PDCs to issue, import fabric (MTM) payment, fabric payment, total due, available limit, Total WCDL Limit&lt;/td&gt;&lt;td&gt;Finance&lt;/td&gt;&lt;td&gt;Out of scope&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Inventory value (&lt;code&gt;Inventory Value Sample.xlsb&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Monthly&lt;/td&gt;&lt;td&gt;Stock × cost&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Stock Report&lt;/strong&gt; (opened with pyxlsb): product_name, product_type, category, sku_code, size, Factory Warehouse, Store, Grand Total, FOB, CMP, Trims + Packaging, Fabric, Total COGS/PC, Total Value, Top/Bottom, Category2, Sub-Category 1/2, Core/Non-Core, Writeoff&lt;/td&gt;&lt;td&gt;Finance&lt;/td&gt;&lt;td&gt;Out of scope&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span style=&quot;white-space:pre-wrap&quot;&gt;Fit &amp;amp; Display Projection (&lt;code&gt;Fit  Display Projection Jun26  Sample.xlsx&lt;/code&gt;)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Per launch month&lt;/td&gt;&lt;td&gt;Tracker + Display allocation&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Sheet2&lt;/strong&gt;: Vendor, Region, PO No., PO status, Style/Color, Shiphero Style Name, Launch status, Order Qty, a month column (01/06/26), Display, FOB, CMT, Trims, Fabric, Total, Value, Status. &lt;strong&gt;Sheet4&lt;/strong&gt;: Month, Category (Fit Sample Jeans, Fit Sample KG Store, Display Sample (New arrivals)), Value&lt;/td&gt;&lt;td&gt;Planning, warehouse&lt;/td&gt;&lt;td&gt;Display and fit allocation (A3.12)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span style=&quot;white-space:pre-wrap&quot;&gt;Display &amp;amp; Fit Sample Allocation (&lt;code&gt;Display  Fit Sample Allocation Sample.xlsx&lt;/code&gt;)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Per dispatch&lt;/td&gt;&lt;td&gt;The allocation&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Fit&lt;/strong&gt;, &lt;strong&gt;Display&lt;/strong&gt;, &lt;strong&gt;Bulk&lt;/strong&gt;: Date, SKU, Shiphero Style Name, Store Name, Qty, Value, FOB, CMP, Trims + Packaging, Fabric, Total COGS/PC, Hemming, Top/Bottom, Category, Sub-Category 1/2, Core/Non-Core, Size, Shiphero Style Name, Remarks (FIT / DISPLAY)&lt;/td&gt;&lt;td&gt;Planning, warehouse&lt;/td&gt;&lt;td&gt;Which store got which piece&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Replenishment sample (&lt;code&gt;Replenishment Sample.xlsx&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Every two weeks&lt;/td&gt;&lt;td&gt;Enigma stock by store, re-laid by hand&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Sheet8&lt;/strong&gt;: sku_code, Style description, Size2, Sub-Category 1/2, Factory, Allocate, Balance, then per store (Sarath City, Inorbit Mall Hyd, Vasant Kunj, Pali Hill, Whitefield…) Stock / Allocation / Pullback, Allocate&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;STO waves (A7.7)&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;Where it breaks.&lt;/strong&gt; Every number is a pivot on an export, rebuilt by hand. Rate of sale is computed at least four ways — AWS (12 W) and AWS (L4W) on the weekly report, ROS / L4W ROS / Top 6 Weeks ROS on the health sheets, Pre-Sale ROS on the on-sale tab, and the international-reorder Excel — and none excludes weeks a size was out of stock (the Concise sheet has started a &amp;quot;Stock-Constrained?&amp;quot; column by hand). Nine definitions in these reports mean different things to different readers (rate of sale, sell-through, saleable, lead time, option, repeat customer, SSSG comparable, fulfilment, dummy→sellable — Close-Out §3). Reports are attachments, so a store manager reads last Monday&amp;#39;s number; tab names drift week to week (&amp;quot;Summary&amp;quot; → &amp;quot;Summery&amp;quot;, &amp;quot;RTW DP&amp;quot; → &amp;quot;RTW DP &amp;amp; Chinos&amp;quot;); a hiring list sits inside the sales workbook; the on-sale analysis is on a hidden tab. Nobody can trace a figure back to the rows that made it.&lt;/p&gt;
&lt;p&gt;&lt;span style=&quot;white-space:pre-wrap&quot;&gt;Sources: data-files/Product Weekly Report 020826.xlsx and Product Weekly Report 090826 2.xlsx (all tabs read with openpyxl); Ageing 01.07.2026 AMAN AGEING Sample Done.xlsx; AUG26 MARGIN WORKING 30072026 Final Rev2  Done.xlsx; category Penetration MOM 1.xlsx; Working Capital  Sample.xlsx; Inventory Value Sample.xlsb (pyxlsb); Option Count Summary Sample.xlsx; Fit  Display Projection Jun26  Sample.xlsx; ROS  Health Report 020826.xlsx; RTW_Shirts_Concise_Updated 10.xlsx; Replenishment Sample.xlsx; Display  Fit Sample Allocation Sample.xlsx; bsc-plm-original/src/domain/realanalytics.ts (DSR and Stylist KPI columns, week ending 30 Aug 2026); RTW shirts inventory call.md and transcript (12 Aug 2026: &amp;quot;AI file&amp;quot;, replenishment file, ageing &amp;gt;180 days, Aman); C1 Split Pre-Reads and Final Call Docs (26 Aug 2026: CJ, Aman); Discovery 2nd sitting (Janak); Tranbscript of granola recording.md (working capital); Invisit meeting contexts.md §8, §10; Discovery Close-Out (07 Sep 2026) §3.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;12-bespoke-mill-to-customer&quot;&gt;&lt;summary&gt;12. Bespoke, mill to customer&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Bespoke is the third made-to-measure bucket: about 1,500 premium options across 5+ mills that BSC does not stock. The mill holds the cloth and cuts a length for each customer order, so whether a fabric can be sold depends entirely on what the mill reported that day. It is about 26% of MTM units (827 of 3,196) and 30–40% of MTM revenue (the two discovery notes disagree on the split).&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Where&lt;/th&gt;&lt;th&gt;What happens today&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Mill stock report&lt;/td&gt;&lt;td&gt;Each bespoke mill (Leggiuno, Thomas Mason, Albini, Soktas Reid &amp;amp; Taylor, Manhattan Fabriano, Lanificio Cucinello, Lombardo, Alumo, Baruche, V&amp;amp;P)&lt;/td&gt;&lt;td&gt;Email or WhatsApp attachment&lt;/td&gt;&lt;td&gt;Sent daily or every other day. Thomas Mason and Albini report only available or unavailable, no metres.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Re-keying&lt;/td&gt;&lt;td&gt;A person in merchandising or sourcing (owner to confirm)&lt;/td&gt;&lt;td&gt;Working sheet, then Enigma&lt;/td&gt;&lt;td&gt;The &amp;quot;five emails a morning&amp;quot; routine: every report is retyped by hand, and the mill&amp;#39;s article number is matched to BSC&amp;#39;s by VLOOKUP.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Switching off a sold-out fabric&lt;/td&gt;&lt;td&gt;The same person&lt;/td&gt;&lt;td&gt;Master sheet, Enigma, website&lt;/td&gt;&lt;td&gt;The fabric is marked sold out or on hold, which hides it on the website and in stores; the physical swatch gets an &amp;quot;on hold&amp;quot; sticker. Nobody confirms the sticker went on, and nobody measures the gap between the mill selling out and the customer being unable to pick it.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Customer order&lt;/td&gt;&lt;td&gt;Store associate&lt;/td&gt;&lt;td&gt;Shopify and Enigma&amp;#39;s store orders&lt;/td&gt;&lt;td&gt;The customer picks from a bespoke book (e.g. Leggiuno Bespoke) and the shirt is punched like any made-to-measure order. Bespoke rows in the fabric ordering sheet carry no BSC fabric code.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Purchase order to the mill&lt;/td&gt;&lt;td&gt;Enigma, automatically&lt;/td&gt;&lt;td&gt;Enigma&lt;/td&gt;&lt;td&gt;Every bespoke customer order raises its own PO to the mill (the order line shows &amp;quot;PO pending&amp;quot;); the POs go out in silent batches around 08:00 and 15:00. 1,762 of Enigma&amp;#39;s auto-PO fabrics have no vendor code to raise a PO against.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Cut length arrives&lt;/td&gt;&lt;td&gt;Warehouse (Shravani&amp;#39;s team)&lt;/td&gt;&lt;td&gt;Unit&lt;/td&gt;&lt;td&gt;Received with the other inbound goods and matched to the customer&amp;#39;s order by hand.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;Production&lt;/td&gt;&lt;td&gt;Production planner, factory&lt;/td&gt;&lt;td&gt;As section 10&lt;/td&gt;&lt;td&gt;Planned and made like any made-to-measure shirt once the cloth is in.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;8&lt;/td&gt;&lt;td&gt;Bespoke swatch books&lt;/td&gt;&lt;td&gt;The mills&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Books reach stores from the mills directly and are counted nowhere.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;Reporting&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Product Weekly Report, &amp;quot;MTM-Bespoke_Non Bespoke&amp;quot; tab&lt;/td&gt;&lt;td&gt;Bespoke against core and non-core by ticket band, for each of the last four weeks.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;Where it breaks.&lt;/strong&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;A customer can order a fabric the mill no longer has, because the sold-out report and the switch-off are two manual steps by one person.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The same reports are retyped every morning across 5+ mills.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Nobody owns bespoke: sourcing says &amp;quot;there is nothing of sourcing concept for the bespoke&amp;quot;.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The parcel is matched to the order by hand, and the rate of orders that fail after the customer has paid is not known.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;Open questions.&lt;/strong&gt; Who owns bespoke at BSC; whether the mills would post their own availability; each mill&amp;#39;s report format and arrival time; the cut-length commercial terms (per-cut fee, deposit, minimum cut); how often a bespoke order fails after payment and what the customer is told.&lt;/p&gt;
&lt;p&gt;Sources: Discovery Record — What We Know v1.0 §2c; Invisit meeting contexts §2 and the pain-point list; Discovery 1 call; Sourcing call transcript 13:22–15:51 (Sreekanth); Transcript of call (Charanjeet, 1,500 options); Enigma Answers — Read From Live System, finding 2; Question Bank — MTM Spine v1.0, block F (Q72–83); Discovery Questions — Sourcing &amp;amp; Procurement, block 5; the bespoke mill tabs in the data sources inventory; section 9 for the unit split.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h1&gt;BSC — Optimized Process (Target)&lt;/h1&gt;&lt;p class=&quot;by&quot;&gt;14 Oct 2026 · Riddhiman Ghosh · DevX Labs · Field lists are a first cut and will be corrected after further discovery.&lt;/p&gt;&lt;p class=&quot;lead&quot;&gt;The process BSC should run, section for section against the current-process page: the same twelve flows, each as it will work with its cases, followed by the build reference for the implementation team.&lt;/p&gt;
&lt;div class=&quot;tools&quot;&gt;&lt;button id=&quot;openAll&quot;&gt;Expand all&lt;/button&gt;&lt;button id=&quot;closeAll&quot;&gt;Collapse all&lt;/button&gt;&lt;input id=&quot;q&quot; placeholder=&quot;Search within this document…&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;group&quot;&gt;Context&lt;/div&gt;
&lt;details id=&quot;purpose-and-how-to-read&quot;&gt;&lt;summary&gt;Purpose and how to read&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;This is the handover to the implementation team for Bombay Shirt Company&amp;#39;s product lifecycle tool. Part A describes the process as BSC runs it today, step by step, so the team can check that what it builds aligns with how work actually happens. Part B specifies the target process: every record, screen, step, rule, alert and integration, in enough detail to build from without a further brief.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Audience.&lt;/strong&gt; The engineers, the product owner and the QA lead building the tool; BSC&amp;#39;s functional owners (design, sourcing, planning, production, warehouse, stores) for sign-off on Part A and on the open questions.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Where it comes from.&lt;/strong&gt; Four discovery sittings, two days on site (27–31 Jul 2026), the sourcing call (6 Aug), the RTW inventory knowledge transfer (12 Aug), the store visit (13–14 Aug), a live read-only session in Enigma (26 Aug), the design discovery call (22 Sep), 22 working files shared by the teams, and the interactive process model reviewed with the sponsor through September. Nothing in Part A is invented; where a fact is unknown the step says so.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;How to read.&lt;/strong&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;Part A flows are numbered tables: step · who · trigger · data source · fields · format · time · hand-off. &lt;em&gt;Format&lt;/em&gt; names the physical thing (a sheet tab, an Enigma screen, an email, a Slack channel, paper). &lt;em&gt;Time&lt;/em&gt; is elapsed time as the team estimates it.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Part B flows are numbered tables: step · actor · screen and control · inputs · validations · writes · tells · target time. Section 13 consolidates the rules; Section 10 gives the state machines the rules protect.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Section 16 maps every current step to its target step so a reviewer can see what changes and what stays.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Field names in Part A are quoted as they appear in the sheet header. Field names in Part B are the target record&amp;#39;s field names.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;On data types, sources and fields.&lt;/strong&gt; The columns, cadences and enumerations in Part A are what we saw in Aug–Sep 2026. The field lists in Part B are the first cut, mapped to those columns and to Enigma&amp;#39;s live schema as read on 26 Aug. Both will be corrected on the Bombay visit and as Enigma API access widens; Section 20 lists what is still open. Build to the record shapes and the state machines; expect field names and enumerations to move.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Out of scope.&lt;/strong&gt; Costing, margin, working capital, ageing and inventory valuation stay in their sheets. Customer marketing (Superfone), store checklists (OPSR) and any garment visualiser are not part of this build.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;glossary-and-status-vocabularies&quot;&gt;&lt;summary&gt;Glossary and status vocabularies&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;The words below are BSC&amp;#39;s own; the tool uses them unchanged in lists, on records and in alerts. Every closed set in the second table is the literal TypeScript union or constant list in &lt;code&gt;src/domain/types.ts&lt;/code&gt; / &lt;code&gt;src/domain/reference.ts&lt;/code&gt;; the build must not paraphrase them.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Term&lt;/th&gt;&lt;th&gt;Meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;MTM&lt;/td&gt;&lt;td&gt;Made to measure: the customer buys first, the shirt is made after (about 14 days; ~2 days for domestic fabric). Stock is fabric in metres, held in three buckets: CORE, NON_CORE, BESPOKE. The fabric is the SKU.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW&lt;/td&gt;&lt;td&gt;Ready to wear: made 3–4 months ahead to a forecast; stock is finished pieces by size. The garment (style-colour, per size) is the SKU.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FOB&lt;/td&gt;&lt;td&gt;A garment bought finished from a vendor who buys the cloth and makes it. In the model this is &lt;code&gt;sourcingMode = &amp;#39;fob-nominated&amp;#39;&lt;/code&gt; (BSC names the supplier by email) or &lt;code&gt;&amp;#39;vendor-sources&amp;#39;&lt;/code&gt; (the vendor chooses its own cloth). &lt;code&gt;&amp;#39;bsc-buys&amp;#39;&lt;/code&gt; is the third mode: BSC buys the cloth and a CMT factory makes it.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Requirement&lt;/td&gt;&lt;td&gt;Anything design asks for. On the Requirements screen a row is one of three kinds: MTM fabric (a &lt;code&gt;Concept&lt;/code&gt;), RTW style (a &lt;code&gt;ProductionOrder&lt;/code&gt;), or Several options (an &lt;code&gt;OptionRequest&lt;/code&gt;).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Concept&lt;/td&gt;&lt;td&gt;The record of one MTM fabric (&lt;code&gt;kind: &amp;#39;new-fabric&amp;#39;&lt;/code&gt;) or construction (&lt;code&gt;kind: &amp;#39;construction&amp;#39;&lt;/code&gt;), from idea to live. Eleven derived gates; six design steps.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Design (on a fabric)&lt;/td&gt;&lt;td&gt;One sellable shirt configuration on a fabric (&lt;code&gt;ConceptDesign&lt;/code&gt;): product code, working name, final name, style, category Formal/Casual, MRP, cost, PDP copy. One fabric has several.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Product code&lt;/td&gt;&lt;td&gt;BSC&amp;#39;s Shopify identifier for a design. The model mints &lt;code&gt;BOM-SHI-FM-nnnn&lt;/code&gt; (Formal) or &lt;code&gt;BOM-SHI-CS-nnnn&lt;/code&gt; (Casual) from a running sequence starting at 4200. Not the fabric code.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric code&lt;/td&gt;&lt;td&gt;Enigma&amp;#39;s identifier for a fabric (e.g. &lt;code&gt;NOMSOXSOLI-1849&lt;/code&gt;), minted when design creates the datasheet. The model mints a stand-in (&lt;code&gt;NO&lt;/code&gt; + 2 letters of the mill + 6 letters of the name + &lt;code&gt;-16nn&lt;/code&gt;) only until Enigma&amp;#39;s code is known.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Enigma code&lt;/td&gt;&lt;td&gt;On an RTW order, &lt;code&gt;enigmaCode&lt;/code&gt; is BSC&amp;#39;s fabric code in Enigma for the bulk cloth (e.g. &lt;code&gt;FORPDOSOPI-81&lt;/code&gt;).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vendor fabric code / article&lt;/td&gt;&lt;td&gt;The mill&amp;#39;s own article number (&lt;code&gt;vendorFabricCode&lt;/code&gt; on an order, &lt;code&gt;vendorCode&lt;/code&gt; on a fabric or offer), e.g. &lt;code&gt;Verdi SOK#24594&lt;/code&gt;. What goes on the PO.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Swatch book&lt;/td&gt;&lt;td&gt;A physical book of 25×25 cm fabric squares in every store; the MTM shopfront. Each MTM fabric belongs to one book: &lt;code&gt;FORMAL SHIRTS - VOL.1&lt;/code&gt;, &lt;code&gt;FORMAL SHIRTS - VOL.2&lt;/code&gt;, &lt;code&gt;CASUAL SHIRTS VOL.1&lt;/code&gt;, &lt;code&gt;LINEN SHIRTS&lt;/code&gt;; bespoke books: &lt;code&gt;Leggiuno Bespoke&lt;/code&gt;. Store books come in three kinds (MTM, RTW, BESPOKE), edition &lt;code&gt;AW26&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Block / hold&lt;/td&gt;&lt;td&gt;A mill agrees by email, WhatsApp or call to hold cloth for a period with no money paid. Two shapes in the model: a &lt;code&gt;Block&lt;/code&gt; record (metres, agreedOn, expiresOn from the vendor&amp;#39;s &lt;code&gt;blockWindowDays&lt;/code&gt;) and a per-offer &lt;code&gt;holdUntil&lt;/code&gt; / &lt;code&gt;blockValidUntil&lt;/code&gt; date on a quote.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Extension&lt;/td&gt;&lt;td&gt;Design (or planning) asks sourcing to get a hold extended before deciding; sourcing extends the date and sends the options back.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Option (request)&lt;/td&gt;&lt;td&gt;One numbered slot on an option request (&amp;quot;Option 1 … Option N&amp;quot;). Sourcing puts ONE live vendor against a slot; design settles each slot on its own.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Offer / quote&lt;/td&gt;&lt;td&gt;A mill&amp;#39;s terms against one ask: ₹/m, MOQ, width, lead days, hold-until, composition, note. &lt;code&gt;FabricQuote&lt;/code&gt; on an RTW order; &lt;code&gt;ConceptFabricOption&lt;/code&gt; on a concept or a request slot.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;PO&lt;/td&gt;&lt;td&gt;Purchase order. Fabric PO to a mill in metres (&lt;code&gt;FabricPo&lt;/code&gt;, numbered &lt;code&gt;FPO-71nn&lt;/code&gt;; on an RTW order also &lt;code&gt;FPO #24nn&lt;/code&gt;); production PO to a factory in pieces (&lt;code&gt;ProductionOrder.poNo&lt;/code&gt;, &lt;code&gt;PO #155nn&lt;/code&gt;). Raising is not receiving.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Auto-PO&lt;/td&gt;&lt;td&gt;Enigma&amp;#39;s threshold top-up: when a core fabric&amp;#39;s on-hand plus incoming falls to the reorder point, a PO for the MOQ (or the multiples needed) goes to the mill. Domestic core: Enigma fires it (&lt;code&gt;source: &amp;#39;auto&amp;#39;&lt;/code&gt;); international: a person raises it (&lt;code&gt;source: &amp;#39;manual&amp;#39;&lt;/code&gt;).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Reorder point (ROP)&lt;/td&gt;&lt;td&gt;&lt;code&gt;max(lead-time demand, vendor MOQ)&lt;/code&gt;, where lead-time demand = last-8-week shirts/week × 2.15 m × lead days ÷ 7. The suggested PO is &lt;code&gt;max(MOQ, ceil(shortfall ÷ MOQ) × MOQ)&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Saleable&lt;/td&gt;&lt;td&gt;&lt;code&gt;stockMetres − reservedMetres − thresholdMetres&lt;/code&gt;; Enigma&amp;#39;s own formula (physical − accounting − threshold), recomputed by the tool. Store rule of thumb: under 15 m is &amp;quot;Low Stock&amp;quot;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRN&lt;/td&gt;&lt;td&gt;Goods received note. Every inward in the model raises one (&lt;code&gt;GRN-26-nnnn&lt;/code&gt;), of one of six kinds: fabric, rtw-po, bespoke-parcel, mtm-round, trims, store-inward.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;STO&lt;/td&gt;&lt;td&gt;Stock transfer order from the hub to one store, sent in waves (&amp;quot;STO Series No.&amp;quot;), with a type and a hemming type.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vehicle round&lt;/td&gt;&lt;td&gt;The daily vehicle that brings finished MTM pieces from the factories to the unit; each piece is received (RTS scan), short (not on the vehicle) or rejected (turned back with a reason).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTS&lt;/td&gt;&lt;td&gt;&amp;quot;Return to source&amp;quot;: the unit&amp;#39;s scan that a finished piece is back at the production unit and can be shipped.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;PP sample&lt;/td&gt;&lt;td&gt;Pre-production sample; &lt;code&gt;decision: &amp;#39;approved&amp;#39;&lt;/code&gt; is the PP go-ahead that lets bulk start. &lt;code&gt;resubmit&lt;/code&gt; means major comments.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Shipment sample&lt;/td&gt;&lt;td&gt;A concept&amp;#39;s second gate after PP: the sample made at scale.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Green slip&lt;/td&gt;&lt;td&gt;The production unit&amp;#39;s comment sheet on a sample round (&lt;code&gt;comments[]&lt;/code&gt; with area and major flag).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Drop&lt;/td&gt;&lt;td&gt;A month&amp;#39;s RTW launch (&lt;code&gt;Launch.dropMonth&lt;/code&gt;, e.g. &lt;code&gt;Oct 26&lt;/code&gt;); one launch record per option with six gates.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Display &amp;amp; fit pieces&lt;/td&gt;&lt;td&gt;Pieces issued to every RTW-holding store at COGS, never sellable: one display piece (shirts size 40, bottoms 32) and a fit set (shirts 38/40/42, bottoms 30/32/34).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fit sample set (MTM)&lt;/td&gt;&lt;td&gt;The three fits (Slim, Standard, Heavy) × four sizes (38, 40, 42, 44) each store holds so the customer can try the fit before the shirt is made.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Bill&lt;/td&gt;&lt;td&gt;One customer visit with one or more pieces (&lt;code&gt;billNo&lt;/code&gt;, &lt;code&gt;BILL-xxxxx&lt;/code&gt;); each piece is its own &lt;code&gt;CustomerOrder&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Order sheet&lt;/td&gt;&lt;td&gt;Enigma&amp;#39;s MTM sheet: 22 option tiles (&lt;code&gt;SheetOptionKey&lt;/code&gt;), 20 measurements (&lt;code&gt;MeasureKey&lt;/code&gt;), 4 pattern flags. Every edit after punching is a numbered revision.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;PP (MTM stage)&lt;/td&gt;&lt;td&gt;&amp;quot;Lying with us&amp;quot;: punched, freeze window over, waiting for a factory plan.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Freeze window&lt;/td&gt;&lt;td&gt;Orders punched in the last 2 hours (&lt;code&gt;PP_FREEZE_HOURS&lt;/code&gt;, adjustable 0–24) are not planned because stores still change them.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Plan&lt;/td&gt;&lt;td&gt;An MTM production plan (&lt;code&gt;#413nn&lt;/code&gt;): one factory, one category, a set of order sheets sent with the fabric. Capacity is a cap; forcing over it is recorded with a name.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Headroom&lt;/td&gt;&lt;td&gt;What a factory can take today: &lt;code&gt;perDay − in transit − max(0, WIP − 2×perDay)&lt;/code&gt;, where perDay is the factory&amp;#39;s &lt;code&gt;dailyTarget&lt;/code&gt; or its 7-day average out.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Aging&lt;/td&gt;&lt;td&gt;An MTM piece in-factory for more than 5 days.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Extra fabric&lt;/td&gt;&lt;td&gt;The daily &amp;quot;EXTRA FABRIC&amp;quot; email as a record: metres, one of five reasons, one of six panels, against one piece of a bundle. Approval deducts the metres.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Case&lt;/td&gt;&lt;td&gt;A return or alteration raised on one delivered piece (&lt;code&gt;RET-41nn&lt;/code&gt;), with a resolution ladder and, for MTM, a factory leg or a hemming-unit leg.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ladder&lt;/td&gt;&lt;td&gt;The order of rungs a store tries: alteration → refit → remake → store-credit → refund; exchange (swap from the shelf, RTW) is a side door.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Hemming unit&lt;/td&gt;&lt;td&gt;The unit that hems bottoms and alters pieces, reached through the warehouse; seven scanned hops there and back.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Store credit&lt;/td&gt;&lt;td&gt;A &lt;code&gt;CreditEntry&lt;/code&gt; (+ given on a case, − spent on a bill); balance is the sum per customer name.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Write-off&lt;/td&gt;&lt;td&gt;A store removes a damaged or unsellable piece from system stock the moment it decides (reason, disposition).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Option (RTW)&lt;/td&gt;&lt;td&gt;One style in one colour; sizes are not options. &lt;code&gt;styleOfOption&lt;/code&gt; strips the colour after &amp;quot; - &amp;quot;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ideal option count&lt;/td&gt;&lt;td&gt;Planning&amp;#39;s per-sub-category target (e.g. Casual Solid 35 = 10 core + 25 non-core). A gap against it is what raises an option request. MTM plans around ~30 active options (&lt;code&gt;MTM_ACTIVE_TARGET&lt;/code&gt;).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ROS / AWS&lt;/td&gt;&lt;td&gt;Rate of sale: the model&amp;#39;s &amp;quot;true ROS&amp;quot; is the mean of the last 4 in-stock weeks; &amp;quot;top-6 ROS&amp;quot; is the mean of the best 6 in-stock weeks since launch; &amp;quot;naive&amp;quot; is the 12-week mean. The sheets call this AWS.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;WOF&lt;/td&gt;&lt;td&gt;Weeks of forward cover = stock ÷ true ROS.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Velocity grade&lt;/td&gt;&lt;td&gt;A ≥10/wk · B ≥5 · C ≥2 · D ≥0.1 · E not selling.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;OTIF&lt;/td&gt;&lt;td&gt;On time (Dispatch actual ≤ target in-house) and in full (delivered within ±3% of cut or order qty).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;TNA&lt;/td&gt;&lt;td&gt;Time and action: the per-PO milestone calendar generated from the category template (22 possible milestones, day offsets from PO date).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Buffer&lt;/td&gt;&lt;td&gt;Days between expected in-house and target in-house; ≤ 7 is critical, ≤ 10 at risk.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Mention&lt;/td&gt;&lt;td&gt;&lt;code&gt;@person&lt;/code&gt; or &lt;code&gt;@role&lt;/code&gt; in a comment; addressed to that side on that record until resolved.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Walkthrough mode&lt;/td&gt;&lt;td&gt;The prototype&amp;#39;s super-admin switch: every screen and button open whoever you are signed in as; each still says whose step it is.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Quiet mode&lt;/td&gt;&lt;td&gt;Guidance off: no explainers, no example strips, full lists.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Status vocabularies (closed sets, verbatim from the code).&lt;/p&gt;

 raise-po → &amp;quot;no fabric PO on record&amp;quot; (Open/Closed without a PO) or &amp;quot;design to push PO&amp;quot; (stage chosen) · extend → &amp;quot;extension asked&amp;quot; · choose → &amp;quot;design to push PO&amp;quot; · vendors → &amp;quot;sourcing to add vendors&amp;quot;&lt;/td&gt;&lt;td&gt;engines.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sourcing mode (&lt;code&gt;SourcingMode&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;bsc-buys · fob-nominated · vendor-sources (labels: &amp;quot;BSC buys it&amp;quot; · &amp;quot;FOB · supplier nominated&amp;quot; · &amp;quot;Vendor sources&amp;quot;)&lt;/td&gt;&lt;td&gt;types.ts, Requirements.tsx&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Option slot (&lt;code&gt;RequestOptionStatus&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;open (&amp;quot;sourcing to add vendors&amp;quot;) · with-design (&amp;quot;design to push PO&amp;quot;) · extension (&amp;quot;extension asked&amp;quot;) · po-raised (&amp;quot;PO raised&amp;quot;) · closed (&amp;quot;closed&amp;quot;)&lt;/td&gt;&lt;td&gt;types.ts, OptionRequests.tsx &lt;code&gt;STATUS&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Requirement stage (computed, Requirements screen)&lt;/td&gt;&lt;td&gt;1 · Requirement · 2 · Sourcing · 3 · Finalised &amp;amp; ordered · 4 · Downstream · Live&lt;/td&gt;&lt;td&gt;DesignHome.tsx &lt;code&gt;STAGE_LABEL&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Design steps (&lt;code&gt;DesignStepKey&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;request · sampling · vendors · po · fabric-in · live — labels Request · Sampling · Vendors · Purchase order · Fabric in · Go live; each step is done · now · later&lt;/td&gt;&lt;td&gt;engines &lt;code&gt;designFlowOf&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Concept stage (computed &lt;code&gt;ConceptStage&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Idea · Sampling · Shipment sample · Approved · Fabric · Blocked · PO raised · Configured · Named · Ready · Live&lt;/td&gt;&lt;td&gt;engines.ts&lt;/td&gt;&lt;/tr&gt;&lt;tr& &lt;p&gt;Sources: &lt;code&gt;bsc-plm-original/src/domain/types.ts&lt;/code&gt; (every union type and interface); &lt;code&gt;src/domain/reference.ts&lt;/code&gt; (&lt;code&gt;ROLE_LABEL&lt;/code&gt;, &lt;code&gt;GARMENT_CATEGORIES&lt;/code&gt;, &lt;code&gt;MILESTONES&lt;/code&gt;, &lt;code&gt;DELAY_REASONS&lt;/code&gt;, &lt;code&gt;ORDER_STEPS&lt;/code&gt;, &lt;code&gt;VELOCITY&lt;/code&gt;, &lt;code&gt;MTM_STAGES&lt;/code&gt;, &lt;code&gt;SHEET_OPTIONS&lt;/code&gt;, &lt;code&gt;MEASUREMENTS&lt;/code&gt;, &lt;code&gt;PATTERN_FLAGS&lt;/code&gt;, &lt;code&gt;MTM_FITS&lt;/code&gt;, &lt;code&gt;FIT_SAMPLE_*&lt;/code&gt;, &lt;code&gt;STO_TYPES&lt;/code&gt;, &lt;code&gt;HEMMING_TYPES&lt;/code&gt;, &lt;code&gt;EXTRA_FABRIC_*&lt;/code&gt;, &lt;code&gt;PANEL_METRES&lt;/code&gt;, &lt;code&gt;MTM_SWATCH_BOOKS&lt;/code&gt;, &lt;code&gt;BESPOKE_BOOKS&lt;/code&gt;, &lt;code&gt;SHIRT_STYLES&lt;/code&gt;, &lt;code&gt;SHIRT_PRESETS&lt;/code&gt;, &lt;code&gt;COMPOSITION_FAMILIES&lt;/code&gt;, &lt;code&gt;FILE_LABELS&lt;/code&gt;, &lt;code&gt;RISK&lt;/code&gt;, &lt;code&gt;OTIF_TOLERANCE&lt;/code&gt;, &lt;code&gt;STORE_LOW_METRES&lt;/code&gt;, &lt;code&gt;METRES_PER_SHIRT&lt;/code&gt;, &lt;code&gt;PP_FREEZE_HOURS&lt;/code&gt;, &lt;code&gt;AGING_DAYS&lt;/code&gt;, &lt;code&gt;DISPLAY_PLAN&lt;/code&gt;, &lt;code&gt;MTM_ACTIVE_TARGET&lt;/code&gt;); &lt;code&gt;src/domain/engines.ts&lt;/code&gt; (&lt;code&gt;riskOf&lt;/code&gt;, &lt;code&gt;otifOf&lt;/code&gt;, &lt;code&gt;healthOf&lt;/code&gt;, &lt;code&gt;coverageOf&lt;/code&gt;, &lt;code&gt;liveStatusOf&lt;/code&gt;, &lt;code&gt;fabricPoStatus&lt;/code&gt;, &lt;code&gt;conceptOf&lt;/code&gt;, &lt;code&gt;launchOf&lt;/code&gt;, &lt;code&gt;designFlowOf&lt;/code&gt;, &lt;code&gt;sourcingStateOf&lt;/code&gt;, &lt;code&gt;sheetEditMode&lt;/code&gt;, &lt;code&gt;returnStatusOf&lt;/code&gt;, &lt;code&gt;swatchMatrix&lt;/code&gt;, &lt;code&gt;fitSetOf&lt;/code&gt;, &lt;code&gt;factoryLoadOf&lt;/code&gt;, &lt;code&gt;vendorStatsOf&lt;/code&gt;); &lt;code&gt;src/screens/DesignHome.tsx&lt;/code&gt; (&lt;code&gt;STAGE_LABEL&lt;/code&gt;), &lt;code&gt;OptionRequests.tsx&lt;/code&gt; (&lt;code&gt;STATUS&lt;/code&gt;), &lt;code&gt;Swatches.tsx&lt;/code&gt; (&lt;code&gt;STEPS&lt;/code&gt;), &lt;code&gt;Otif.tsx&lt;/code&gt;; &lt;code&gt;docs/Enigma Answers — Read From Live System (26 Aug 2026).md&lt;/code&gt; (verbatim Enigma enums).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;the-spine-and-the-principles&quot;&gt;&lt;summary&gt;The spine and the principles&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Everything design asks for is a requirement, and every requirement moves through the same four stages, whatever kind of thing it is. Stage 3 (finalised and ordered) is what sets everything downstream moving. After stage 3, design decides only three things: the name, the price, and when the piece goes live.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-mermaid&quot;&gt;flowchart LR
  A[1 Requirement&amp;lt;br/&amp;gt;design writes the ask] --&amp;gt; B[2 Sourcing finds and blocks&amp;lt;br/&amp;gt;one vendor per ask]
  B --&amp;gt; C[3 Finalised and ordered&amp;lt;br/&amp;gt;PO raised]
  C --&amp;gt; D[4 Downstream&amp;lt;br/&amp;gt;warehouse, production, planning, stores do the work]
  D --&amp;gt; E[Live&amp;lt;br/&amp;gt;stores first, then online]&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;&lt;strong&gt;Principles every flow follows.&lt;/strong&gt;&lt;/p&gt;
&lt;ol&gt;&lt;li&gt;&lt;p&gt;One record per thing, and one link opens it from anywhere. That covers a concept, a style, an options request, a customer&amp;#39;s piece, a return case, a fabric and a launch. A link that was shared once keeps working even if the page it sits on changes.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Every change of state is written on the record as a dated entry that says who made it. Nobody retypes a status. Where a thing stands, whether it is healthy and whether it is at risk are all worked out from those entries. Nobody edits them by hand.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;One team owns each step. The record names that team and tells it through one notification bell. Owner labels always name the team, never &amp;quot;yours&amp;quot;.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Enigma stays the master for fabric and design attributes and for the stock ledger. The tool notes that Enigma was set up, by whom and when. It never recreates what Enigma holds.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The store sells by piece. A bill can hold several pieces, and each piece becomes its own order for the factory.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The tool uses the same word for a state that people use (Section 1). Lists show only those words.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Every record is laid out the same way:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;the headline (where it stands and whose move it is)&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;the step that is open now&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;the other steps, folded away&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;the document that prints from the record&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;files, conversation and activity, when there are any&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Buttons say what they do. Forms ask only for what the step needs and keep the rest behind &amp;quot;more&amp;quot;. Help text is not part of the product.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Finance is out of scope. Costing, margins and working capital stay in finance&amp;#39;s sheets.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Email and Slack are never the record of truth. When a message goes out, it goes from the record and is noted on it.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;p&gt;&lt;strong&gt;On data types, sources and fields.&lt;/strong&gt; The field lists in Section 9 are a first cut. They are mapped to the sheet columns in Section 3 and to what Enigma holds today. The next two steps will correct each field&amp;#39;s type, where it comes from (read from Enigma, imported from a sheet, or typed in) and its list of allowed values:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;the Bombay visit&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;the review of Enigma&amp;#39;s connection&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Follow the record layouts and the stage sequences in Section 10, and expect some columns to move.&lt;/p&gt;
&lt;p&gt;Sources: Discovery Record — What We Know v1.0 (18 Aug 2026); Enigma Answers (26 Aug 2026); BSC design discovery call (22 Sep 2026); the sheets in data-files.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;teams-screens-and-permissions&quot;&gt;&lt;summary&gt;Teams, screens and permissions&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Nine roles, eighteen navigation entries under seven groups, one bell. A person sees only the screens their team works in (&lt;code&gt;NAV[].roles&lt;/code&gt;), and a few entries are hidden from a role that could technically reach them (&lt;code&gt;hideFor&lt;/code&gt;) so each team lands on its own list. The Owner sees everything; &amp;quot;Walkthrough mode&amp;quot; (&lt;code&gt;demoAll&lt;/code&gt;) makes any login act as owner for the prototype, while every step still says whose it is (&lt;code&gt;ScreenOwner&lt;/code&gt; strip: &amp;quot;{Team} work this screen.&amp;quot;). A screen a role does not work in is not reachable even by URL — it redirects to the role&amp;#39;s home (&lt;code&gt;homeFor&lt;/code&gt; = the first NAV entry that lists the role; the fallback is &lt;code&gt;/design&lt;/code&gt;).&lt;/p&gt;
&lt;p&gt;Navigation, exactly as &lt;code&gt;layout/Shell.tsx&lt;/code&gt; defines it (path · label · group · roles · hideFor):&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Group&lt;/th&gt;&lt;th&gt;Path&lt;/th&gt;&lt;th&gt;Label&lt;/th&gt;&lt;th&gt;Hint&lt;/th&gt;&lt;th&gt;Roles&lt;/th&gt;&lt;th&gt;Hidden from&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;&lt;code&gt;/design&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Requirements&lt;/td&gt;&lt;td&gt;every ask — MTM fabric, RTW style, several options — at its stage; open any row, raise any kind&lt;/td&gt;&lt;td&gt;owner, design, planning, sourcing&lt;/td&gt;&lt;td&gt;sourcing&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;&lt;code&gt;/swatches&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Swatch desk&lt;/td&gt;&lt;td&gt;cloth in → swatches cut → stores told → live; the sticker prints off the record&lt;/td&gt;&lt;td&gt;owner, design, production, warehouse&lt;/td&gt;&lt;td&gt;production&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;&lt;code&gt;/fabrics&lt;/code&gt;&lt;/td&gt;&lt;td&gt;MTM fabric master&lt;/td&gt;&lt;td&gt;core, non-core and bespoke: stock and blocks&lt;/td&gt;&lt;td&gt;owner, design, sourcing, production&lt;/td&gt;&lt;td&gt;production&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;&lt;code&gt;/health&lt;/code&gt;&lt;/td&gt;&lt;td&gt;RTW stock health&lt;/td&gt;&lt;td&gt;every option: rate of sale, size gaps, action&lt;/td&gt;&lt;td&gt;owner, planning, design&lt;/td&gt;&lt;td&gt;design&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;&lt;code&gt;/insights&lt;/code&gt;&lt;/td&gt;&lt;td&gt;What is selling&lt;/td&gt;&lt;td&gt;the weekly report, the DSR and the stylist KPI — as planning reads them&lt;/td&gt;&lt;td&gt;owner, design, planning&lt;/td&gt;&lt;td&gt;design&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;&lt;code&gt;/launches&lt;/code&gt;&lt;/td&gt;&lt;td&gt;RTW launches&lt;/td&gt;&lt;td&gt;new options on their way to the stores&lt;/td&gt;&lt;td&gt;owner, planning, warehouse&lt;/td&gt;&lt;td&gt;warehouse&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;&lt;code&gt;/sourcing&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Fabric sourcing&lt;/td&gt;&lt;td&gt;vendor quotes, then a factory with capacity&lt;/td&gt;&lt;td&gt;owner, sourcing&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;&lt;code&gt;/mills&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Fabric vendors · mills&lt;/td&gt;&lt;td&gt;lead times and block windows, by vendor&lt;/td&gt;&lt;td&gt;owner, sourcing&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Production&lt;/td&gt;&lt;td&gt;&lt;code&gt;/vendors&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Factories &amp;amp; capacity&lt;/td&gt;&lt;td&gt;who makes what, how much a day, how late&lt;/td&gt;&lt;td&gt;owner, production&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Production&lt;/td&gt;&lt;td&gt;&lt;code&gt;/mtm&lt;/code&gt;&lt;/td&gt;&lt;td&gt;MTM daily production&lt;/td&gt;&lt;td&gt;customer shirts: plan, factory, dispatch&lt;/td&gt;&lt;td&gt;owner, production, warehouse&lt;/td&gt;&lt;td&gt;warehouse&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Merchandiser&lt;/td&gt;&lt;td&gt;&lt;code&gt;/factory&lt;/code&gt;&lt;/td&gt;&lt;td&gt;My factory · merchandiser&lt;/td&gt;&lt;td&gt;the floor&amp;#39;s own day: output, pieces, cloth&lt;/td&gt;&lt;td&gt;owner, merchandiser, production&lt;/td&gt;&lt;td&gt;production&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Production&lt;/td&gt;&lt;td&gt;&lt;code&gt;/tracker&lt;/code&gt;&lt;/td&gt;&lt;td&gt;RTW production tracker&lt;/td&gt;&lt;td&gt;every bulk PO, date by date&lt;/td&gt;&lt;td&gt;owner, production, warehouse&lt;/td&gt;&lt;td&gt;warehouse&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Production&lt;/td&gt;&lt;td&gt;&lt;code&gt;/outbound&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Outbound to factories&lt;/td&gt;&lt;td&gt;bundles to cut, extra fabric, RTW materials&lt;/td&gt;&lt;td&gt;owner, production, warehouse&lt;/td&gt;&lt;td&gt;production, warehouse&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Production&lt;/td&gt;&lt;td&gt;&lt;code&gt;/otif&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Delivery performance&lt;/td&gt;&lt;td&gt;on time and in full, by factory&lt;/td&gt;&lt;td&gt;owner, production&lt;/td&gt;&lt;td&gt;production&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;&lt;code&gt;/warehouse&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Warehouse &amp;amp; unit&lt;/td&gt;&lt;td&gt;goods in, bundles out, STOs, swatch books&lt;/td&gt;&lt;td&gt;owner, warehouse, production&lt;/td&gt;&lt;td&gt;production&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;&lt;code&gt;/grn&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Goods received · GRN&lt;/td&gt;&lt;td&gt;every receipt with its PO, for GST and recon&lt;/td&gt;&lt;td&gt;owner, warehouse&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Store&lt;/td&gt;&lt;td&gt;&lt;code&gt;/stores&lt;/code&gt;&lt;/td&gt;&lt;td&gt;My store&lt;/td&gt;&lt;td&gt;orders, customers, stock, returns&lt;/td&gt;&lt;td&gt;owner, store&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Routes that redirect: &lt;code&gt;/concepts&lt;/code&gt; → &lt;code&gt;/design?kind=MTM&lt;/code&gt;, &lt;code&gt;/requests&lt;/code&gt; → &lt;code&gt;/design?kind=Options&lt;/code&gt;, &lt;code&gt;/requirements&lt;/code&gt; → &lt;code&gt;/design?kind=RTW&lt;/code&gt; (with &lt;code&gt;open=&lt;/code&gt; and &lt;code&gt;new=&lt;/code&gt; carried over); &lt;code&gt;/&lt;/code&gt; → the role&amp;#39;s home; any unknown path → &lt;code&gt;/&lt;/code&gt;.&lt;/p&gt;
&lt;p&gt;Home screen per role (&lt;code&gt;homeFor&lt;/code&gt;): owner → Requirements; design → Requirements; planning → Requirements; sourcing → Requirements (but hidden from the sidebar, so sourcing effectively works from Fabric sourcing); production → Swatch desk (hidden) → in practice Factories &amp;amp; capacity; warehouse → Swatch desk; merchandiser → My factory; store → My store; finance → no NAV entry lists finance, so &lt;code&gt;homeFor&lt;/code&gt; falls back to &lt;code&gt;/design&lt;/code&gt;, which finance is not allowed on (not in the model yet — to build: a Finance home; today finance only appears as a &amp;quot;Pick up · GST &amp;amp; recon&amp;quot; button on the GRN register, and no &lt;code&gt;finance&lt;/code&gt; person exists in &lt;code&gt;PEOPLE&lt;/code&gt;, so the role cannot be signed in as).&lt;/p&gt;
&lt;p&gt;Scope. A store user is scoped to one store (&lt;code&gt;storeId&lt;/code&gt;, chosen in the sidebar; &lt;code&gt;STORES&lt;/code&gt; has 34). A factory merchandiser is scoped to one MTM factory (&lt;code&gt;factoryId&lt;/code&gt;, the vendors with &lt;code&gt;mtm: true&lt;/code&gt; other than the hemming unit: Mahendra, Richman, Harsh, Ayaan, TopNotch). Everyone else is scoped to the whole company. Sidebar &amp;quot;My views&amp;quot; saves the current URL (tab and filters) by name.&lt;/p&gt;
&lt;p&gt;Team summary (what each role&amp;#39;s screens let it do):&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Team&lt;/th&gt;&lt;th&gt;Home&lt;/th&gt;&lt;th&gt;Screens&lt;/th&gt;&lt;th&gt;Acts on&lt;/th&gt;&lt;th&gt;Never does (in the model)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Requirements&lt;/td&gt;&lt;td&gt;Requirements · Swatch desk · MTM fabric master&lt;/td&gt;&lt;td&gt;Raise any requirement (MTM, RTW, FOB, Options); hand an RTW requirement to sourcing; push PO / reject / ask time / unchoose on a style, concept or option slot; close or reopen an option; review samples (concept) and sample rounds (RTW, via Requirements); post the approval; price a fabric (via sourcing gate — see matrix); block a fabric; configure Enigma flags, name &amp;amp; price, story; go live in stores; online steps; stores told; pause / resume / rename a fabric; promote / demote bucket; raise a core reorder PO; edit BOM; designs on a fabric; FOB mode and nomination; add to drop&lt;/td&gt;&lt;td&gt;Allocate a factory; scans; GRN; swatch desk dates before &amp;quot;stores told&amp;quot;; decide RTW option verbs (planning); vendor terms&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Requirements&lt;/td&gt;&lt;td&gt;Requirements · RTW stock health · What is selling · RTW launches&lt;/td&gt;&lt;td&gt;Everything design can do on Requirements and option requests (the code treats planning as design there); allocate a factory on capacity; add to drop; launch gates; option decisions (reorder, reintroduce, inactive, liquidate, promote); ask an extension&lt;/td&gt;&lt;td&gt;Fabric master actions (pause, bucket) — those are &lt;code&gt;role === &amp;#39;design&amp;#39;&lt;/code&gt;; sourcing&amp;#39;s vendor form&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;Fabric sourcing&lt;/td&gt;&lt;td&gt;Fabric sourcing · Fabric vendors · mills · MTM fabric master (no Requirements)&lt;/td&gt;&lt;td&gt;Put one vendor against an ask; edit or drop it; send to design; extend a t;code&gt;STEPS[].owner&lt;/code&gt;), &lt;code&gt;Health.tsx&lt;/code&gt;, &lt;code&gt;Launches.tsx&lt;/code&gt;, &lt;code&gt;Stores.tsx&lt;/code&gt; (&lt;code&gt;mine&lt;/code&gt;, &lt;code&gt;prod&lt;/code&gt;, &lt;code&gt;canStart&lt;/code&gt;, &lt;code&gt;canDecide&lt;/code&gt;), &lt;code&gt;HemTrip.tsx&lt;/code&gt; (&lt;code&gt;HOPS[].who&lt;/code&gt;, &lt;code&gt;can&lt;/code&gt;), &lt;code&gt;OrderSheet.tsx&lt;/code&gt; (&lt;code&gt;canEdit&lt;/code&gt;), &lt;code&gt;Insights.tsx&lt;/code&gt;, &lt;code&gt;Otif.tsx&lt;/code&gt;; &lt;code&gt;src/domain/reference.ts&lt;/code&gt; (&lt;code&gt;PEOPLE&lt;/code&gt;, &lt;code&gt;STORES&lt;/code&gt;).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;group&quot;&gt;Optimized process, flow by flow (same sections as the current-process page)&lt;/div&gt;
&lt;details id=&quot;1-mtm-fabric-idea-to-live&quot;&gt;&lt;summary&gt;1. MTM fabric, idea to live&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 1. The ask becomes one record; sourcing puts one vendor; design pushes the PO; the cloth runs on the swatch desk (section 4) while sourcing writes the designs; design goes live when it decides. The cases table at the end says which steps apply when, e.g. no sampling for a new shade of a proven construction.&lt;/p&gt;&lt;p&gt;Design raises every new need from one list of design requirements, using one button, &amp;quot;+ New requirement&amp;quot;. The first question is what kind of product it is: &amp;quot;An MTM fabric&amp;quot;, &amp;quot;Several fabric options at once&amp;quot; or &amp;quot;An RTW style&amp;quot;. Every requirement then moves through the same stages, and the list shows which one it is at: 1 Requirement, 2 Sourcing, 3 Finalised and ordered, 4 Downstream, then Live. The sourcing column always uses one of the same phrases: &amp;quot;sourcing to add vendors&amp;quot;, &amp;quot;design to push PO&amp;quot;, &amp;quot;extension asked&amp;quot; or &amp;quot;finalised&amp;quot;. The several-options kind is covered in B6.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-mermaid&quot;&gt;flowchart LR
  A[Design raises the need&amp;lt;br/&amp;gt;kind, name, why, wanted by] --&amp;gt; S[MTM only: production samples&amp;lt;br/&amp;gt;pattern file, PP round, shipment round]
  S --&amp;gt; P[Production posts the approval&amp;lt;br/&amp;gt;to planning, production, warehouse, stores]
  P --&amp;gt; B[Sourcing puts one vendor&amp;lt;br/&amp;gt;terms and hold-until date]
  A --&amp;gt;|RTW| B
  B --&amp;gt; C{Design answers}
  C --&amp;gt;|Push PO| D[PO raised, stage 3&amp;lt;br/&amp;gt;fabric added to the master, fabric PO number]
  C --&amp;gt;|Reject| B
  C --&amp;gt;|More time| E[Extension asked&amp;lt;br/&amp;gt;sourcing extends, sends back or drops the vendor]
  E --&amp;gt; B&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B5.1&lt;/td&gt;&lt;td&gt;Raise the requirement&lt;/td&gt;&lt;td&gt;Design (planning works on the same list)&lt;/td&gt;&lt;td&gt;Click &amp;quot;+ New requirement&amp;quot; and pick the product type. For an MTM fabric, fill in the form and click &amp;quot;Log it&amp;quot;. For an RTW style, fill in the form and click &amp;quot;Create requirement&amp;quot;. Files such as the sketch, pattern file, CAD, swatch image or tech pack can be attached before saving&lt;/td&gt;&lt;td&gt;MTM: kind (&amp;quot;Construction variant on an existing fabric&amp;quot; or &amp;quot;New fabric or shade&amp;quot;), working name and why. Under &amp;quot;more&amp;quot;: swatch book or range (Formal Shirts Vol. 1 or Vol. 2, Casual Shirts Vol. 1, Linen Shirts, Leggiuno Bespoke) and the month it is wanted on the floor (Oct 26 to Feb 27). A construction variant also needs the fabric it is sampled on, plus collar, placket and cuff. RTW: category (seven garment categories), sub-category, style or colour, order quantity (300 by default), target in-house date (60 days out by default), target cost per piece (Rs 450 by default) and the size ratio across 28–50 or XS–4XL. BSC buys the cloth for every bulk style. The fabric brief covers cloth or weave, composition, colour, a close MTM fabric BSC already carries, and notes for sourcing. The size curve is spread automatically, weighted to the middle sizes&lt;/td&gt;&lt;td&gt;MTM: name and why must be filled. The base fabric for a variant must be an inventory fabric with more than 20 m, not bespoke, and not paused or on hold. RTW: style and quantity must be filled. Minimum order and wanted-by date are not checked&lt;/td&gt;&lt;td&gt;The requirement is recorded with who raised it and when. RTW requirements start with a default bill of materials and costing. The activity log records &amp;quot;Requirement created&amp;quot;. An RTW requirement reaches sourcing only after design clicks &amp;quot;Send it to sourcing&amp;quot; — after the prototype is approved (B5.2R) and the BOM and tech pack are on it (B5.3R), carrying one fabric or a shortlist for sourcing to choose one from&lt;/td&gt;&lt;td&gt;5 min&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B5.2R&lt;/td&gt;&lt;td&gt;(RTW) Prototype on a stand-in fabric&lt;/td&gt;&lt;td&gt;Design, with the production unit&lt;/td&gt;&lt;td&gt;Before any cloth is sourced, design asks the unit for a prototype of the style on whatever shirt fabric is to hand. The unit logs the proto when it comes back; design reviews it and clicks &amp;quot;Approve&amp;quot; or &amp;quot;Redo&amp;quot; with comments. Only an approved proto goes on to the fabric requirement&lt;/td&gt;&lt;td&gt;Style, the stand-in fabric used, the sketch or reference, and for each review comment the area and whether it is major&lt;/td&gt;&lt;td&gt;A new style cannot be sent to sourcing until a proto round is approved, or design marks &amp;quot;no proto needed&amp;quot; with a reason (a repeat, or a minor variant of a live style)&lt;/td&gt;&lt;td&gt;The proto rounds (dates, reviewer, comments, decision) sit on the requirement. Design is reminded when a proto has waited on them 5 days&lt;/td&gt;&lt;td&gt;7 to 10 days per round (to confirm with BSC)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B5.3R&lt;/td&gt;&lt;td&gt;(RTW) Bill of materials and tech pack&lt;/td&gt;&lt;td&gt;Design&lt;/td&gt;&lt;td&gt;Once the proto is approved, fill in the bill of materials, attach the tech pack, then click &amp;quot;Send it to sourcing&amp;quot;&lt;/td&gt;&lt;td&gt;Fabric line(s): one fabric, or a shortlist of candidates for sourcing to choose one from, each with cloth or weave, composition, colour, a close MTM fabric BSC already carries, and notes. Trim lines: buttons, labels, thread, interlining, packaging, each with spec, quantity per piece and unit. The tech pack file&lt;/td&gt;&lt;td&gt;&amp;quot;Send it to sourcing&amp;quot; is refused without a tech pack attached and at least one fabric line. The BOM is what the job card, the costing and the materials check are cut from&lt;/td&gt;&lt;td&gt;The requirement moves to &amp;quot;sourcing to finalise the cloth&amp;quot;. Sourcing sees it on Today with the shortlist; the trim lines are what B5.5R checks against stock&lt;/td&gt;&lt;td&gt;Same day as the proto approval&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B5.2&lt;/td&gt;&lt;td&gt;(MTM · optional) Sample and pattern file&lt;/td&gt;&lt;td&gt;Production unit, then design&lt;/td&gt;&lt;td&gt;Production picks the factory and clicks &amp;quot;Sample &amp;amp; PAT handed over&amp;quot;. When the PP sample comes back, they click &amp;quot;Log PP sample · round N received from&amp;quot; the factory. Design reviews each round, adds comments with &amp;quot;+ add&amp;quot;, then clicks &amp;quot;Approve&amp;quot;, &amp;quot;Approve with comments&amp;quot; or &amp;quot;Send back — new round&amp;quot;. The shipment sample (the harder gate) then goes through the same steps&lt;/td&gt;&lt;td&gt;Factory (the MTM factories are Mahendra, Richman and Harsh). For each review comment: the area (stitching, fit, pattern, construction, fabric handling, trims/labels/buttons, other), the comment, and a tick if it is major&lt;/td&gt;&lt;td&gt;This step is optional. Design can click &amp;quot;Skip sampling&amp;quot; with a reason (a new shade of a fabric already in the book, a re-source of a known fabric, sourcing already holds an approved swatch) and go straight to the vendor and PO; the record keeps who skipped it and why. When sampling is run: the handover is refused unless a pattern file or CAD is attached, because the handoff is the file. &amp;quot;Approve&amp;quot; is blocked while a major
