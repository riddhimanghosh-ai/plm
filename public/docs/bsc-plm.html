f the shelf only): one button per other size on this shelf with its count, or &amp;quot;No other size… ask another store&amp;quot;.&amp;lt;br&amp;gt;&lt;strong&gt;Send it out for the work:&lt;/strong&gt; &amp;quot;To the hemming unit&amp;quot; and, for made to measure, &amp;quot;Back to the factory&amp;quot;.&amp;lt;br&amp;gt;&lt;strong&gt;Refit&lt;/strong&gt; (made to measure): &amp;quot;Re-measure&amp;quot;.&amp;lt;br&amp;gt;&lt;strong&gt;Remake&lt;/strong&gt; (made to measure; highlighted once an alteration has failed): &amp;quot;Remake at the factory · ~14 days&amp;quot;.&amp;lt;br&amp;gt;&lt;strong&gt;Give the money back:&lt;/strong&gt; &amp;quot;Store credit · close&amp;quot; and &amp;quot;Refund&amp;quot;.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;The screen says &amp;quot;Skipping a rung is your call and stays on the record.&amp;quot;&lt;/td&gt;&lt;td&gt;One line on what was agreed with the customer. For a swap, the size. For an alteration, where it happens: in the store, at the factory or at the hemming unit.&lt;/td&gt;&lt;td&gt;Only untried options are offered.&lt;/td&gt;&lt;td&gt;Each choice is recorded as an attempt with its date, who made it and the note.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&lt;strong&gt;Swap:&lt;/strong&gt; the case closes at once and the new size leaves the shelf count. The returned piece goes back on the shelf only when the reason was fit, changed mind or wrong size sent.&amp;lt;br&amp;gt;&lt;strong&gt;Store credit:&lt;/strong&gt; the case closes. The customer is credited the fabric&amp;#39;s or style&amp;#39;s MRP, and the credit shows on their profile.&amp;lt;br&amp;gt;&lt;strong&gt;Refund:&lt;/strong&gt; goes to finance&amp;#39;s list for today, and the case waits.&amp;lt;br&amp;gt;&lt;strong&gt;Factory alteration or remake:&lt;/strong&gt; a trip to the factory opens, and production is told.&amp;lt;br&amp;gt;&lt;strong&gt;Hemming-unit alteration:&lt;/strong&gt; a trip to the unit opens, and it appears on the warehouse&amp;#39;s alterations list.&lt;/td&gt;&lt;td&gt;First decision in the same visit&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B10.4&lt;/td&gt;&lt;td&gt;Hemming-unit round trip&lt;/td&gt;&lt;td&gt;Store, then warehouse, then production unit, then warehouse, then store&lt;/td&gt;&lt;td&gt;Follows &amp;quot;The piece&amp;#39;s round trip · store → warehouse → hemming unit → warehouse → store&amp;quot;. There are seven hand-offs, each with a dot and the team that owns it:&amp;lt;br&amp;gt;1. handed to the vehicle by the store&amp;lt;br&amp;gt;2. received at the warehouse&amp;lt;br&amp;gt;3. scanned in at the hemming unit&amp;lt;br&amp;gt;4. hemmed and scanned out&amp;lt;br&amp;gt;5. back at the warehouse&amp;lt;br&amp;gt;6. sent to the store or straight to the customer&amp;lt;br&amp;gt;7. received at the store, or delivered and confirmed by the store&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Whoever holds the piece presses the one button for their hand-off. Everyone else sees which team acts next.&lt;/td&gt;&lt;td&gt;When handing it over, the store picks where it comes back to: the store (the customer collects) or straight to the customer.&lt;/td&gt;&lt;td&gt;Each hand-off can be pressed only after the one before it.&lt;/td&gt;&lt;td&gt;Each hand-off is dated. The case shows a plain status such as &amp;quot;at the hemming unit&amp;quot; or &amp;quot;on its way to the customer&amp;quot;, and which team it is waiting on. The next team is told at each hand-off. The warehouse and the unit see every piece in flight with the days since it left the store.&lt;/td&gt;&lt;td&gt;5 working days, store to store&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B10.5&lt;/td&gt;&lt;td&gt;Factory round trip (made to measure)&lt;/td&gt;&lt;td&gt;Store, then production&lt;/td&gt;&lt;td&gt;Follows &amp;quot;The piece&amp;#39;s round trip · store → factory → store&amp;quot;. The factory that made the piece is already chosen. The piece goes through four hand-offs:&amp;lt;br&amp;gt;1. handed to the vehicle by the store&amp;lt;br&amp;gt;2. scanned in at the factory (production)&amp;lt;br&amp;gt;3. altered or remade, and on its way back (production)&amp;lt;br&amp;gt;4. back at the store and counted in (store, from the list of parcels received from the unit)&lt;/td&gt;&lt;td&gt;Which factory, if it is not the one that made it.&lt;/td&gt;&lt;td&gt;Each hand-off only after the one before it.&lt;/td&gt;&lt;td&gt;Each hand-off is dated on the case. Production is told first. Then the piece appears on the store&amp;#39;s list of parcels coming in.&lt;/td&gt;&lt;td&gt;12 working days, store to store&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B10.6&lt;/td&gt;&lt;td&gt;Close&lt;/td&gt;&lt;td&gt;Store manager&lt;/td&gt;&lt;td&gt;Answers &amp;quot;Did the (step) work?&amp;quot; with &amp;quot;Close · happy&amp;quot; or &amp;quot;Not enough&amp;quot;.&lt;/td&gt;&lt;td&gt;A note.&lt;/td&gt;&lt;td&gt;Offered only when the last attempt is still open, no refund is waiting, and the piece is not out on a trip.&lt;/td&gt;&lt;td&gt;&amp;quot;Close · happy&amp;quot; closes the case. &amp;quot;Not enough&amp;quot; brings back the cards for the options not yet tried. The next suggested option is the first untried one in this order: alteration, refit, remake, store credit, refund. A swap is a side door, not a rung.&lt;/td&gt;&lt;td&gt;Inside the 10-day promise&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;B10-iii. Store credit. Each customer has a credit ledger. A case that gives credit adds to it, and a bill that spends credit takes from it. Each entry records the store, the case or order, who made it and when. The balance shows in several places:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;as a &amp;quot;Store credit&amp;quot; column on the customer list&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;on the customer&amp;#39;s profile, with the last three entries&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;as a note on the bill form and on the raise-a-case form&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;on the &amp;quot;Give the money back&amp;quot; card (&amp;quot;they already hold ₹x&amp;quot;)&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;The system never lets a bill spend more than the balance. It applies whichever is smaller, the amount asked or the balance, and records nothing if that is zero. The amount credited is the fabric&amp;#39;s or style&amp;#39;s MRP, because the bill value lives in Shopify.&lt;/p&gt;
&lt;p&gt;B10-iv. Stock in and out.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Received from the unit.&lt;/strong&gt; One row for each parcel on its way. A parcel can be:&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Fewer pieces than the box said.&lt;/strong&gt; On a stock transfer the store can count in fewer than were sent: it enters how many arrived and what was missing, and counts those in. The STO closes at the counted figure, the goods-received note says &amp;quot;short, 3 of 5&amp;quot;, and the warehouse gets the gap on its own list and in its alerts. The warehouse closes it one of two ways: send the balance, which appears at the store under Received from the unit like any parcel, or write it off with a reason that stays on the STO. The store never has to call to say a size was missing.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Asking for swatch books.&lt;/strong&gt; From Swatches, books &amp;amp; fit samples the store asks the unit for books: which book, how many copies, and why (a second stylist, a worn book, a corporate visit). The ask sits on the warehouse&amp;#39;s book list with the reason. The warehouse dispatches the copies, which then run like any book dispatch and the store confirms when they land, or declines with a note the store sees. The store can see every ask it has made and where each one is.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;a stock transfer, marked &amp;quot;arrived, not counted in&amp;quot; or &amp;quot;in transit&amp;quot;, with its transfer type and hemming type&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;a customer&amp;#39;s made-to-measure shirt, or a customer&amp;#39;s off-the-shelf order&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;launch display and fit pieces&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;a swatch book or a loose swatch&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;stock from another store&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;a made-to-measure fit sample&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;a returned piece back from the factory&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Each row shows the date sent (in red after 5 days), what it is, where it came from and the quantity. It has one button: &amp;quot;Counted in · close STO&amp;quot;, &amp;quot;Received · ready for customer&amp;quot; or &amp;quot;Received&amp;quot;. Counting in does four things:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;closes the transfer with its arrival date&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;marks a customer order as delivered&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;marks a launch piece, book, swatch, fit sample or returned piece as received&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;writes a numbered store goods-received note that the unit sees&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;Damaged and unsellable.&lt;/strong&gt; The manager fills in:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;style, and size (showing how many the system holds)&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;quantity&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;why: damaged, soiled, display worn, lost, or wrong item received&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;what happens to it: sent back to the unit, or destroyed&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Then they press &amp;quot;Write off · stock drops now&amp;quot;. The shelf count drops at once. The write-off stays open so the unit can stamp the day it gets the piece back.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Stock asks.&lt;/strong&gt; &amp;quot;Someone has it&amp;quot; lists only the sizes this store is out of and another store holds. The ask goes to one named store (&amp;quot;Ask Pali Hill for 1&amp;quot;). The warehouse row says it &amp;quot;replenishes on the STO cycle&amp;quot;. The other store answers &amp;quot;Accept &amp;amp; ship&amp;quot; or &amp;quot;Decline&amp;quot;, and then &amp;quot;Shipped&amp;quot;. The asking store presses &amp;quot;Received&amp;quot;. The statuses run requested, accepted, shipped, then received or declined.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Launches.&lt;/strong&gt; Display and fit pieces per launch, with &amp;quot;Received — displays up&amp;quot;. These pieces are to show, not to sell. They are issued at cost and are not in the shelf count.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Swatches, books and fit samples.&lt;/strong&gt; The made-to-measure fit set is a grid of 3 fits (slim, standard, heavy) by sizes 38, 40, 42 and 44. Each cell reads on the floor, worn out, gone, never arrived, or on its way. The store marks &amp;quot;worn&amp;quot;, &amp;quot;gone&amp;quot; or &amp;quot;it&amp;#39;s fine&amp;quot;. The production unit sees the gaps and sends replacements. The sizes are a placeholder: the store floor mentioned 36 to 50, so the set stores carry is to be confirmed with BSC. Swatch books are confirmed with &amp;quot;Received — on the floor&amp;quot;, and loose swatches with &amp;quot;Confirm it arrived&amp;quot;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Pull back.&lt;/strong&gt; Every style that planning has marked liquidate or exit, which &amp;quot;comes off the display and goes back to the warehouse&amp;quot;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Made-to-measure fabrics live today.&lt;/strong&gt; Saleable metres and a status:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;active&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;low stock, below 15 m, with &amp;quot;roughly n shirts left across all stores&amp;quot; at 2.15 m a shirt&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;sold out&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;on hold&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;paused&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Each status comes with a line on what to tell the customer.&lt;/p&gt;
&lt;p&gt;Rules.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;A case is always on a piece delivered from this store. A piece sold elsewhere is raised at that store.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The ladder is recorded in order. Skipping a rung is allowed, and the skip is recorded.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;A swap closes on the spot. It moves stock both ways only when the piece itself is fine.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Store credit is the store&amp;#39;s decision and closes the case. Only a refund waits on finance, and the store sees the moment finance moves it.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;An alteration the store does itself never leaves the store&amp;#39;s page.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;A piece out on a trip cannot be closed until it is back.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;The store changes an order sheet only until a factory is allocated.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;A write-off drops stock the same minute.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;A stock ask goes to one named store, never to &amp;quot;someone&amp;quot;.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;An off-the-shelf order is a stock sale, like the website: it can be punched only for a size in stock at this store or the unit, it never goes to a factory, and what this store does not hold the warehouse sends (B12.12).&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Cases.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;What differs on the case&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Made to measure · fit&lt;/td&gt;&lt;td&gt;Order of options: fix it here (store tailor), then the hemming unit or factory, then refit, then remake, then money. No swap card; swapping is only for off-the-shelf pieces.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Made to measure · fabric defect or stitching&lt;/td&gt;&lt;td&gt;&amp;quot;Fix it here&amp;quot; is still offered, but the factory route is the natural one. Remake becomes the main option once an alteration has failed.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Off the shelf · wrong size sent or fit&lt;/td&gt;&lt;td&gt;Swap from the shelf first. The returned piece goes back on the shelf, because the reason is fit, changed mind or wrong size sent. Alteration comes second.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Off the shelf · bottoms length&lt;/td&gt;&lt;td&gt;Fix it here if the store has a tailor, otherwise the hemming unit. The inseam on the order is the reference. Later: record the corrected inseam on the order.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Changed mind, unworn&lt;/td&gt;&lt;td&gt;On a swap the piece goes back to stock. Otherwise it is store credit or refund. Later: hide the alteration cards for this reason.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Colour or shade&lt;/td&gt;&lt;td&gt;A swap or money. Later: hide the alteration cards for this reason; today the cards do not look at the reason.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Customer is not in the store (online order)&lt;/td&gt;&lt;td&gt;The hemming-unit trip can be sent straight to the customer. Later: the online team raises cases on online orders from their own page.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Second case on the same piece&lt;/td&gt;&lt;td&gt;Shown as &amp;quot;Cases on this piece&amp;quot; on the order. Later: refuse a second open case on the same piece.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Store has no tailor&lt;/td&gt;&lt;td&gt;&amp;quot;Fix it here&amp;quot; is always shown today. Later: a per-store setting to hide it.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Refund above a set limit&lt;/td&gt;&lt;td&gt;No limit is set; the limit is to be confirmed with BSC. Finance sees every refund on its list for today, with the amount and the days waiting.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Case past its promise&lt;/td&gt;&lt;td&gt;Every case carries a 10-day promise. When it is overdue, the store is alerted: &amp;quot;RET-x · n d open against a 10 d promise&amp;quot;.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Time targets.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Case raised to first decision:&lt;/strong&gt; in the same visit.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Hemming-unit round trip:&lt;/strong&gt; 5 working days, from the day the store hands it to the vehicle to the day it is delivered.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Factory round trip:&lt;/strong&gt; 12 working days, from the day it is sent to the day it is back at the store.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Refund moved by finance:&lt;/strong&gt; 2 days. Finance&amp;#39;s alert turns amber after 2.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Parcel counted in:&lt;/strong&gt; the day the box is opened. It turns red on the store&amp;#39;s list after 5 days.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Stock ask answered:&lt;/strong&gt; the same day. It stays on the other store&amp;#39;s list for today until answered.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Sources: store visit transcript (section 7, the ladder); Enigma Answers (26 Aug 2026) for the Enigma sheet fields; Discovery Record — What We Know v1.0 (18 Aug 2026).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;6-replenishment-and-stock-health&quot;&gt;&lt;summary&gt;6. Replenishment and stock health&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 6.&lt;/p&gt;&lt;p&gt;One rule for MTM core fabrics and one action word per RTW option, both worked out afresh every time someone opens the list (there is no overnight run yet; in the live system a scheduled recalculation does the same job) and shown as to-do queues with buttons, never as a sheet to scan.&lt;/p&gt;
&lt;p&gt;B11-i. MTM core — in the MTM fabric master, &amp;quot;What to buy&amp;quot; → &amp;quot;Core · reorder points&amp;quot;. The rule is Enigma&amp;#39;s own, as BSC described it, and each fabric&amp;#39;s page shows it factor by factor under &amp;quot;Auto-PO threshold · Enigma&amp;#39;s rule&amp;quot;:&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;sellable stock    = physical stock less metres reserved for orders, less the fabric&amp;#39;s floor
                    (the 3 m / 7 m floor keeps cloth back from sale; it is not the reorder point)
rate of sale      = the average shirts sold per week over the last 8 weeks
metres a week     = rate of sale × 2.15 m per shirt
lead-time demand  = metres a week × the mill&amp;#39;s lead time in days ÷ 7, rounded up
reorder point     = the larger of lead-time demand and the mill&amp;#39;s minimum order
                    (200 m when the mill has no minimum)
below the point   = sellable stock plus metres on order is at or under the reorder point
                    (never applies to bespoke fabrics)
auto-PO quantity  = the gap between the reorder point and (sellable + on order),
                    rounded up to whole minimum orders, and never less than one minimum order&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B11.1&lt;/td&gt;&lt;td&gt;Every core fabric is read against its reorder point&lt;/td&gt;&lt;td&gt;System, each time the list is opened&lt;/td&gt;&lt;td&gt;Shows &amp;quot;Core · reorder points&amp;quot; with filters: All · Raise the PO by hand · International · Under the point · Sold out, still sellable · Paused by design · Switched off · Mill check due. Each row says what actually happens to its reorder: &amp;quot;Enigma auto-PO handles this&amp;quot;, &amp;quot;no automation — international, a person raises it&amp;quot;, or &amp;quot;covered by the PO&amp;quot;.&lt;/td&gt;&lt;td&gt;— (reads fabric stock, reserved metres, floor, weekly sales, metres on order, the mill&amp;#39;s lead time and minimum order from the vendor master, and whether the fabric is international)&lt;/td&gt;&lt;td&gt;Later: weeks when the fabric was out of stock will be left out of the 8-week average, as the RTW side already does&lt;/td&gt;&lt;td&gt;Nothing is stored; the numbers are worked out each time. Sourcing sees how many fabrics are under the point, and &amp;quot;Mill check due&amp;quot; once 7 days have passed since the mill was last asked.&lt;/td&gt;&lt;td&gt;Live&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.2&lt;/td&gt;&lt;td&gt;Domestic: Enigma&amp;#39;s auto-PO is shown, not repeated&lt;/td&gt;&lt;td&gt;System / Sourcing&lt;/td&gt;&lt;td&gt;The fabric&amp;#39;s page shows &amp;quot;Auto-PO quantity · n m when it trips&amp;quot;. Under &amp;quot;Cloth on order → Fabric POs · confirm with mills&amp;quot; sourcing clicks to confirm the mill&amp;#39;s date (with a remark), or just adds a remark.&lt;/td&gt;&lt;td&gt;Mill&amp;#39;s promised date, remark&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;The fabric PO is listed with its number, marked as raised automatically, expected on the raised date plus the mill&amp;#39;s lead time, and its metres count as on order. Its status moves: awaiting confirmation → unconfirmed · chase after 2 days → confirmed → confirmed · overdue → received. Later: the PO number will be Enigma&amp;#39;s own, not a separate one.&lt;/td&gt;&lt;td&gt;Confirmed within 2 days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.3&lt;/td&gt;&lt;td&gt;International: a person raises the PO&lt;/td&gt;&lt;td&gt;Sourcing (BSC said Kunal approves; whether this sits with design or sourcing is to be confirmed with BSC)&lt;/td&gt;&lt;td&gt;On the fabric&amp;#39;s page click &amp;quot;Raise PO · n m to &amp;lt;mill&amp;gt;&amp;quot;, with the auto-PO quantity filled in; the fabric also appears under the &amp;quot;Raise the PO by hand&amp;quot; filter.&lt;/td&gt;&lt;td&gt;Metres&lt;/td&gt;&lt;td&gt;Only when the fabric is below its point and has no open PO&lt;/td&gt;&lt;td&gt;The PO is recorded as raised by hand and its metres are added to on order; the row reads &amp;quot;covered by the PO&amp;quot; until the rolls land. The warehouse sees it under &amp;quot;Fabric rolls · against fabric POs&amp;quot;.&lt;/td&gt;&lt;td&gt;Same day it falls below the point&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.4&lt;/td&gt;&lt;td&gt;Supply review&lt;/td&gt;&lt;td&gt;Sourcing&lt;/td&gt;&lt;td&gt;On &amp;quot;Core · reorder points&amp;quot; click &amp;quot;Asked the mill…&amp;quot; and record ok, delayed or out, with a note and the date it is back.&lt;/td&gt;&lt;td&gt;Status, note, back-on date&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;The mill&amp;#39;s answer, date, person and note are kept on the fabric; an alert &amp;quot;mill check due&amp;quot; appears when the mill has never been asked or was last asked 7 or more days ago. When the mill is out or delayed and the fabric is still live, the fabric&amp;#39;s page offers &amp;quot;Switch off on Shopify &amp;amp; stores&amp;quot;; when it is switched off and the mill says ok, it offers &amp;quot;Switch back on — in stock&amp;quot;. Planning sees both.&lt;/td&gt;&lt;td&gt;Weekly&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.5&lt;/td&gt;&lt;td&gt;Pause / resume, promote / demote, supply block&lt;/td&gt;&lt;td&gt;Design / Planning / Sourcing&lt;/td&gt;&lt;td&gt;On the fabric&amp;#39;s page: &amp;quot;Pause&amp;quot; (with a note) or &amp;quot;Resume&amp;quot;; &amp;quot;Promote to core&amp;quot; or back to non-core; under &amp;quot;Continuous supply · core&amp;quot;, &amp;quot;Agree a block with the mill&amp;quot;, &amp;quot;Renew&amp;quot; or &amp;quot;End&amp;quot;.&lt;/td&gt;&lt;td&gt;Note; core or non-core; block terms (until when, metres a month, agreed by email, WhatsApp or call)&lt;/td&gt;&lt;td&gt;Promoting to core lifts the fabric&amp;#39;s floor to 40 m if it was under 20 m&lt;/td&gt;&lt;td&gt;The pause, the core status and date, and the block terms are recorded. The fabric&amp;#39;s live status follows: Paused → On hold → Sold out (nothing sellable) → Low stock (under 15 m) → Active. Stores see a paused or on-hold fabric marked &amp;quot;cannot be ordered — offer the closest alternative&amp;quot; on their MTM fabrics list.&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;B11-ii-a. RTW planning review (8 Oct 2026). Planning only plans RTW, and does it in sheets fed from Shopify exports. The first build is one record per option that holds what those sheets hold, and a review the planner can inspect and override. Nothing in it is a forecast model; that comes later, once the record has trustworthy sales, availability, delivery and decision history to test against.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What the system shows or checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B11.P1&lt;/td&gt;&lt;td&gt;Open the option&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Picks the option from the RTW planning list, worst cover at arrival first.&lt;/td&gt;&lt;td&gt;Type: core (same option, a different quantity), non-core (replace or let it run out) or new (under eight weeks old). Usable stock by size; display and trial pieces beside it, never inside it; what is on the tracker with its expected date; the factory that last made it; the cloth; what the health rule suggests.&lt;/td&gt;&lt;td&gt;A review is started, which saves today&amp;#39;s figures.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.P2&lt;/td&gt;&lt;td&gt;Is the rate usable?&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Reads the observed rate (last four in-stock weeks ÷ 4) and enters a planning rate with a reason.&lt;/td&gt;&lt;td&gt;The observed rate stays beside the planner&amp;#39;s; who changed it and why is kept. A warning when a size was out in the window, and when the option is new.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.P3&lt;/td&gt;&lt;td&gt;Stock week by week&lt;/td&gt;&lt;td&gt;System&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Usable stock projected week by week at the planning rate, with each raised PO added in the week it is expected, not today. A request with no PO yet is shown but not counted. The week a new order placed today would land is marked, with the stock and cover left then.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.P4&lt;/td&gt;&lt;td&gt;Size by size&lt;/td&gt;&lt;td&gt;System&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;The same projection per size: usable now, incoming, rate, stock at arrival, and the first week each size runs out, flagged when that is before any receipt. Sizes reconcile to the option total.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.P5&lt;/td&gt;&lt;td&gt;Draft quantity&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Sets the cover wanted after arrival.&lt;/td&gt;&lt;td&gt;Target demand after receipt, less projected stock at arrival, gives the sellable requirement. Display pieces to add and the vendor MOQ show as question marks until confirmed.&lt;/td&gt;&lt;td&gt;The planner enters the approved quantity and why it differs from the working.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.P6&lt;/td&gt;&lt;td&gt;Size ratio&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Edits the ratio per size, or scales the draft to the approved quantity.&lt;/td&gt;&lt;td&gt;The draft spreads the gap on each size&amp;#39;s rate and adds back any size short at arrival; cover after arrival is shown per size. The draft and the approved ratio are both kept.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.P7&lt;/td&gt;&lt;td&gt;Approve, then to design&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Approves the plan, then sends it to design.&lt;/td&gt;&lt;td&gt;Approval needs the display and MOQ questions answered and a ratio that adds up. Sending creates the RTW requirement with the quantity and ratio filled in and the proto skipped as a repeat.&lt;/td&gt;&lt;td&gt;Design sends it on; it runs as any RTW style (B8) and shows on the tracker as &amp;quot;no PO yet&amp;quot;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B11.P8&lt;/td&gt;&lt;td&gt;Next sitting&lt;/td&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Opens the option again.&lt;/td&gt;&lt;td&gt;Every past review with its planned rate against actual sales since, the weeks every size was in stock, the size mix against sizes now out, and where the order is. Lost sales are not estimated; the weeks a size was unavailable are flagged.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;The non-core count tab shows live non-core options per category against the plan, how many are still on the shelf in eight weeks at the observed rate, and which will not survive the period with nothing landing in time. Whether to replace one or let the count fall short stays planning&amp;#39;s call. Store transfers carry a purpose: display, off the rack, or trial.&lt;/p&gt;
&lt;p&gt;Sources: planning-team call relayed 8 Oct 2026; worked example &amp;quot;one RTW option from planning to store availability&amp;quot;.&lt;/p&gt;
&lt;p&gt;B11-ii. RTW option book — the RTW stock health page, with three tabs: &amp;quot;Every option · what to do&amp;quot;, &amp;quot;Option count vs the plan&amp;quot;, and &amp;quot;Replenish &amp;amp; pull back · this week&amp;quot;. Every option gets one of the workbook&amp;#39;s nine action words, checked in the order below, using these measures: stock (all sizes added up); the true rate of sale, which is the average of the last 4 weeks out of 12 when the size set was whole (weeks with sizes broken are dropped); the plain 12-week average, shown beside it as &amp;quot;the number that made this look weak&amp;quot;; the top-6-week rate, the best 6 in-stock weeks divided by 6; weeks of cover, stock divided by the true rate of sale; how many sizes are at zero, and whether a middle size (40, 41, 42, 32, 34, M, L) is out; velocity A at 10 or more a week, B at 5 or more, C at 2 or more, D above zero (0.1 or more), E at zero. Healthy means stock above zero, at most one size out and under 30 weeks of cover; health is Unknown with under 4 weeks of sales; Inactive when taken off the shelf.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Verb&lt;/th&gt;&lt;th&gt;When (BSC PLM&amp;#39;s rule)&lt;/th&gt;&lt;th&gt;Workbook&amp;#39;s rule where it differs&lt;/th&gt;&lt;th&gt;Action offered on the option&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;REINTRODUCE&lt;/td&gt;&lt;td&gt;Inactive and top-6-week rate of 2 or more&lt;/td&gt;&lt;td&gt;Workbook: stock at zero and top-6-week rate of 2 or more (active options)&lt;/td&gt;&lt;td&gt;&amp;quot;Make active &amp;amp; order n pcs&amp;quot; · &amp;quot;Make active only&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;URGENT REPLENISH&lt;/td&gt;&lt;td&gt;Active, stock at zero and top-6-week rate of 2 or more; or Healthy with 3 weeks of cover or less&lt;/td&gt;&lt;td&gt;The workbook gives stock-at-zero to REINTRODUCE; here REINTRODUCE is kept for options already off the shelf&lt;/td&gt;&lt;td&gt;&amp;quot;Raise reorder · n pcs&amp;quot; (n is at least 150, or the suggested quantity if higher)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;REVIEW&lt;/td&gt;&lt;td&gt;Stock at zero, no sign of demand&lt;/td&gt;&lt;td&gt;same&lt;/td&gt;&lt;td&gt;&amp;quot;Take off the shelf&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SIZE FILL&lt;/td&gt;&lt;td&gt;Two or more sizes out and still selling (checked after the overstock rules)&lt;/td&gt;&lt;td&gt;Workbook priority 2, before URGENT REPLENISH&lt;/td&gt;&lt;td&gt;&amp;quot;Raise reorder · n pcs&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;LIQUIDATE&lt;/td&gt;&lt;td&gt;Velocity E with stock on hand&lt;/td&gt;&lt;td&gt;same&lt;/td&gt;&lt;td&gt;&amp;quot;Liquidate, pull displays &amp;amp; take off the shelf&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EXIT&lt;/td&gt;&lt;td&gt;55 or more weeks of cover&lt;/td&gt;&lt;td&gt;same&lt;/td&gt;&lt;td&gt;&amp;quot;Liquidate, pull displays &amp;amp; take off the shelf&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;CLEAR / DISCOUNT&lt;/td&gt;&lt;td&gt;30 to under 55 weeks of cover&lt;/td&gt;&lt;td&gt;same&lt;/td&gt;&lt;td&gt;&amp;quot;Liquidate, pull displays &amp;amp; take off the shelf&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MAINTAIN&lt;/td&gt;&lt;td&gt;Healthy&lt;/td&gt;&lt;td&gt;same&lt;/td&gt;&lt;td&gt;&amp;quot;nothing to decide&amp;quot;; &amp;quot;Promote to core&amp;quot; if non-core&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MONITOR&lt;/td&gt;&lt;td&gt;Everything else; inactive with no demand signal&lt;/td&gt;&lt;td&gt;same&lt;/td&gt;&lt;td&gt;&amp;quot;Take off the shelf&amp;quot;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;The reorder maths on the option&amp;#39;s page (&amp;quot;Sizes, sales and the reorder maths · 90-day trigger&amp;quot;): planned weekly demand is the lower of the true rate of sale × 1.5 and the top-6-week rate — the 1.5 growth bump is BSC&amp;#39;s figure for bottoms, and whether shirts take it too is to be confirmed with BSC. Cover is stock plus pieces on order divided by planned demand, in days; the trigger is under 90 days. The suggested reorder is planned demand × (lead time + 90 days) ÷ 7, less stock and pieces on order, rounded up to the minimum order of 150; lead time is the last PO&amp;#39;s factory lead, else 40 days. Sell-through is pieces sold ÷ pieces ordered, where ordered is the delivered (or ordered) pieces on POs matched by style name; with no matching PO it falls back to sold ÷ (sold + stock). What the buttons do: &amp;quot;Promote to core&amp;quot; marks the option core; &amp;quot;Raise reorder&amp;quot; adds n to the incoming quantity only; &amp;quot;Make active&amp;quot; puts the option back on the shelf (and adds to incoming when ordered); &amp;quot;Take off the shelf&amp;quot; and &amp;quot;Liquidate&amp;quot; mark it inactive with the date, the person and the note as the reason. The note is kept only as the reason for going inactive. Later: &amp;quot;Raise reorder&amp;quot; will start a new requirement (B5) instead of only adding to incoming, and every decision will leave a line in the option&amp;#39;s history. Inactive options keep their history, drop out of the plan counts and show under &amp;quot;Off the shelf&amp;quot;.&lt;/p&gt;
&lt;p&gt;The plan tab lists each sub-category&amp;#39;s ideal total (shirts 35 · 28 · 10 · not set · 10 · 8 · 8 · 10 · 25; bottoms 14 · 5 · 40 · 20), then core ideal, core listed, core healthy, core with a size out, core gap, non-core ideal, non-core listed, healthy and gap; every count opens the list behind it. The replenish tab follows the Replenishment sheet&amp;#39;s layout per style and size — At unit · Allocate · Balance · To stores at zero · Pull back — for options marked SIZE FILL, URGENT REPLENISH, CLEAR / DISCOUNT, LIQUIDATE or EXIT: one piece to each store that holds the style and is at zero, within a budget of what a month sells (weekly sales ÷ sizes × 4), and nothing to slow options; pull back from stores holding more than a month&amp;#39;s sales (and at least 6 pieces, or any stock of a slow option). The split by store is estimated from the option&amp;#39;s total for now; real store-by-store stock needs Enigma&amp;#39;s stock-transfer and store data, which BSC PLM cannot read yet. The store&amp;#39;s own &amp;quot;Pull back · slow stock&amp;quot; list shows the LIQUIDATE and EXIT options.&lt;/p&gt;
&lt;p&gt;Rules. The RTW rate of sale never counts a week when the size set was broken. The MTM reorder point uses the current 8-week rate of sale, not a typed-in weekly average. No PO is raised silently: auto-POs are listed with where they came from, manual ones are clicked by a person, and both need the mill&amp;#39;s confirmation before they count as real cover. Core is replenished size by size: a core option with a size out raises a planning alert.&lt;/p&gt;
&lt;p&gt;Cases.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;What differs&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;MTM core, domestic mill&lt;/td&gt;&lt;td&gt;Listed as an auto-PO; sourcing confirms with the mill; the goods-received note moves the metres from on order to the shelf&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM core, international mill&lt;/td&gt;&lt;td&gt;&amp;quot;Raise PO · n m&amp;quot; on the fabric&amp;#39;s page and the &amp;quot;Raise the PO by hand&amp;quot; filter; recorded as raised by hand; lead time from the mill&amp;#39;s record&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM non-core&lt;/td&gt;&lt;td&gt;Never reordered; it runs out; the &amp;quot;Ranges · non-core gaps&amp;quot; tab counts the family against its plan, and a gap raises an option request (B6)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MTM bespoke&lt;/td&gt;&lt;td&gt;Never below the point; availability comes from the mill&amp;#39;s list (&amp;quot;Bespoke · mill availability&amp;quot;); sold out puts it on hold&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Paused fabric&lt;/td&gt;&lt;td&gt;Left off the store&amp;#39;s list; still counted on the master, with the reason&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Core fabric with no vendor code&lt;/td&gt;&lt;td&gt;The row shows the vendor code beside the mill. Later: a &amp;quot;cannot auto-order&amp;quot; filter, since 1,762 flagged fabrics have no vendor code in Enigma.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW core option&lt;/td&gt;&lt;td&gt;The full set of action words; URGENT REPLENISH and SIZE FILL offer the reorder&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;RTW non-core option&lt;/td&gt;&lt;td&gt;The same action words (URGENT REPLENISH is not held back for non-core); &amp;quot;Promote to core&amp;quot; appears when Healthy&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;New option (under 4 weeks of sales)&lt;/td&gt;&lt;td&gt;Health reads Unknown; the action word is still worked out&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Inactive option&lt;/td&gt;&lt;td&gt;Shown under &amp;quot;Off the shelf&amp;quot;; REINTRODUCE when the top-6-week rate is 2 or more, else MONITOR&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A store asks another store for a size&lt;/td&gt;&lt;td&gt;Counted as store demand: a &amp;quot;Stores asked for it&amp;quot; filter, a planning alert at 2 or more asks, and the list of asks on the option&amp;#39;s page&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Time target. An action word on every option whenever the list is opened; a decision clicked within the week it appears (the weekly rhythm of the workbook&amp;#39;s Action History tab); a mill check on every core fabric every 7 days; an unconfirmed fabric PO chased after 2 days. To be confirmed with BSC: the target of 30 active fabrics per MTM book, each mill&amp;#39;s lead time and minimum order (the vendor master holds neither today), and whether the option-count plan stays monthly.&lt;/p&gt;
&lt;p&gt;Sources: Tranbscript of granola recording (Meeting 1 on auto-PO; Meeting 3 on the 90-day trigger, top 6 weeks, sell-through); Neha on the Enigma auto-PO rule (30 Jul 2026); C1a MTM call transcript and summary (27 Aug 2026); Sourcing call transcript (weekly supplier check); RTW shirts inventory call and transcript (12 Aug 2026); Enigma Answers (26 Aug 2026); data-files: RTW_Shirts_Concise_Updated 10.xlsx (Velocity Parameters, Action &amp;amp; Gap Parameters, Action History), ROS Health Report 020826.xlsx, Replenishment Sample.xlsx, Option Count Summary Sample.xlsx.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;7-warehouse-and-unit&quot;&gt;&lt;summary&gt;7. Warehouse and unit&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 7.&lt;/p&gt;&lt;p&gt;Everything that arrives is received piece by piece, or lot by lot, against what was declared. Every receipt writes one numbered goods-received note (GRN-26-nnnn), and that note reaches finance with its PO. The warehouse&amp;#39;s page has three groups:&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Two asks that come from the stores.&lt;/strong&gt; A short count on a stock transfer (the store counted in fewer than the STO said): the warehouse sends the balance or writes the gap off with a reason, and nothing stays open as ghost stock. A swatch-book ask (a store wants a particular book, or more copies): the warehouse dispatches or declines it from the swatch-book list, with the store&amp;#39;s reason in front of it.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Coming in.&lt;/strong&gt; Every receipt raises a goods-received note. It covers:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;the vehicle round (finished made-to-measure shirts coming back)&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;bespoke fabric (mill stock and parcels)&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;fabric rolls against fabric POs&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;ready-to-wear bulk goods against production POs&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;the register of goods-received notes&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Going out.&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;cut fabric and bundles to the factories&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;approved extra fabric, picked and sent&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;parcels to stores&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Stores.&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;stock transfers to stores&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;swatch books and fit samples for every store&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;alterations through the hemming unit&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Finance has its own view of the same register.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B12.1&lt;/td&gt;&lt;td&gt;Vehicle round from a made-to-measure factory&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Opens the vehicle round. For each factory it shows pieces ready (out of the factory), declared today, received today and the gap. Presses &amp;quot;Receive the round&amp;quot; and marks each piece &amp;quot;Received&amp;quot;, &amp;quot;Not on vehicle&amp;quot; or &amp;quot;Turned back&amp;quot;, or uses &amp;quot;All received&amp;quot; or &amp;quot;None came&amp;quot;. Ends with &amp;quot;Close the round&amp;quot;. A single ready piece can also be received on its own.&lt;/td&gt;&lt;td&gt;Vehicle and driver (these go on the note), a note for the round, and for any piece turned back, the reason: stitching fault, wrong fabric, measurement off the sheet, stain or damage, wrong customer tag, or missing trims.&lt;/td&gt;&lt;td&gt;A closed round is final. Corrections go on the next round.&lt;/td&gt;&lt;td&gt;Received pieces are scanned as ready to ship. One goods-received note is written per factory, for example &amp;quot;round · Mahendra, 12 finished MTM pieces&amp;quot;, with the vehicle and note in its remarks. A piece not on the vehicle is marked &amp;quot;missed the last vehicle&amp;quot; on the next round. A piece turned back goes back to &amp;quot;in the factory&amp;quot;, with the reason, date and who turned it back recorded and added to the note. The factory merchandiser sees the piece back on the floor. Shipping sees the ready pieces on its table.&lt;/td&gt;&lt;td&gt;Within the hour&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.2&lt;/td&gt;&lt;td&gt;Fabric rolls against a fabric PO&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Opens fabric rolls. Each row shows PO number, fabric, mill (domestic or international, and its lead time), metres, the mill&amp;#39;s date and remark, whether it is confirmed and whether it is on the shelf. Presses &amp;quot;Received · GRN n m&amp;quot;.&lt;/td&gt;&lt;td&gt;Nothing beyond the press.&lt;/td&gt;&lt;td&gt;Only POs not yet received are listed.&lt;/td&gt;&lt;td&gt;The PO is marked received. A fabric goods-received note is written, carrying the PO number. The metres move from incoming to the shelf. Saleable metres rise for design and for every store. For a new fabric, the swatch desk&amp;#39;s row reads &amp;quot;cloth in&amp;quot; from this note.&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.3&lt;/td&gt;&lt;td&gt;Ready-to-wear bulk against a production PO&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Opens ready-to-wear bulk goods. The list holds every open PO the vendor has marked dispatched, showing PO, style, vendor, dispatch date, target in-house date and cut quantity. Opens the PO and presses &amp;quot;Record lot&amp;quot;, &amp;quot;Record &amp;amp; close short&amp;quot; or &amp;quot;PO complete, close&amp;quot; (see B8.8).&lt;/td&gt;&lt;td&gt;Cut quantity, quantity received, quantity rejected, the date the balance is promised by, and a note.&lt;/td&gt;&lt;td&gt;The balance is worked out by the system.&lt;/td&gt;&lt;td&gt;The lot is added to the PO&amp;#39;s receipts, with delivered and rejected totals. A ready-to-wear goods-received note is written. The PO closes on the last lot or on a close-short, and the actual in-house date is recorded. Planning sees that the goods are in-house for the launch. The on-time-in-full measure reads the delivered total.&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.4&lt;/td&gt;&lt;td&gt;Bespoke parcels from mills&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Keeps mill stock up to date by pasting the mill&amp;#39;s list, or by editing the list and saving. Presses &amp;quot;Send request&amp;quot; to a mill for orders waiting on cloth. When a parcel arrives, presses &amp;quot;Inward&amp;quot; and enters the parcel&amp;#39;s code.&lt;/td&gt;&lt;td&gt;Mill list: one line per fabric, with the code or name and a number, or &amp;quot;out&amp;quot;, &amp;quot;OOS&amp;quot; or &amp;quot;nil&amp;quot;. On arrival, the parcel&amp;#39;s code.&lt;/td&gt;&lt;td&gt;The code must match an open bespoke order that has not been received yet. If not, the warehouse sees &amp;quot;No open bespoke order carries code …&amp;quot;. Later: a holding list for unmatched parcels.&lt;/td&gt;&lt;td&gt;The mill&amp;#39;s reported metres, availability and report date are saved. A fabric reported out goes on hold at once, and the stores see it. On &amp;quot;Send request&amp;quot;, the request date is recorded on the orders. On inward, the order is marked received and moves to planning. A bespoke-parcel goods-received note is written for the order&amp;#39;s metres. Planning can now plan the order.&lt;/td&gt;&lt;td&gt;Mill list daily; inward on arrival&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.5&lt;/td&gt;&lt;td&gt;Register of goods-received notes&lt;/td&gt;&lt;td&gt;Warehouse and finance&lt;/td&gt;&lt;td&gt;Reads the register, which finance also sees. Each note shows its number, date received, and what it is: fabric rolls, ready-to-wear bulk, bespoke parcel, made-to-measure pieces back, trims and packaging, or counted in at a store. It also shows the PO or code received against, from and to, quantity, rejected quantity, who counted, finance status and invoice. It can be filtered by kind. Finance presses &amp;quot;Pick up · GST &amp;amp; recon&amp;quot;.&lt;/td&gt;&lt;td&gt;The invoice number, typed by the warehouse or finance on fabric, ready-to-wear and trims notes.&lt;/td&gt;&lt;td&gt;No invoice is expected on made-to-measure rounds, bespoke parcels or store receipts. Finance picks up only notes that carry a PO.&lt;/td&gt;&lt;td&gt;The invoice number is saved. The note is marked as seen by finance, with the date. Finance&amp;#39;s alert counts the notes not yet picked up.&lt;/td&gt;&lt;td&gt;Picked up the same week&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.6&lt;/td&gt;&lt;td&gt;Bundles to factories&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Opens cut fabric and send bundles. It shows the day&amp;#39;s planned made-to-measure orders grouped by plan, with the cut list per fabric (metres and pieces). The warehouse prints the list, then scans the bundles out.&lt;/td&gt;&lt;td&gt;Nothing beyond the scan.&lt;/td&gt;&lt;td&gt;None.&lt;/td&gt;&lt;td&gt;The orders move to in transit. At the scan, the orders&amp;#39; metres come off the shelf and off the held-back total, just as Enigma deducts at its in-production scan. The factory merchandiser scans the bundles in.&lt;/td&gt;&lt;td&gt;Daily&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.7&lt;/td&gt;&lt;td&gt;Extra fabric&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Opens extra fabric. Each approved ask shows the panel, the metres and whose error it was. Presses &amp;quot;Picked &amp;amp; sent&amp;quot;.&lt;/td&gt;&lt;td&gt;Nothing beyond the press.&lt;/td&gt;&lt;td&gt;Only approved asks are listed. The production unit approves the ask, and approval is when the metres are deducted.&lt;/td&gt;&lt;td&gt;The ask is marked sent. The factory gets it on the next vehicle.&lt;/td&gt;&lt;td&gt;Next vehicle&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.8&lt;/td&gt;&lt;td&gt;Parcels to stores&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Opens parcels to stores. For each store it shows what is ready: stock transfers, made-to-measure shirts ready, ready-to-wear pieces, launch pieces and books. The warehouse marks them dispatched.&lt;/td&gt;&lt;td&gt;Nothing beyond the dispatch.&lt;/td&gt;&lt;td&gt;None.&lt;/td&gt;&lt;td&gt;Each item is marked dispatched. The store sees everything under &amp;quot;Received from the unit&amp;quot;, ready to count in.&lt;/td&gt;&lt;td&gt;Daily&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.9&lt;/td&gt;&lt;td&gt;Stock transfers&lt;/td&gt;&lt;td&gt;Warehouse and store&lt;/td&gt;&lt;td&gt;Opens stock transfers. Each row shows the transfer number, type (display, off the rack or replenishment), the store, style, quantity, hemming type, date shipped, date arrived and status: in transit, open n days after arrival, or closed. Presses &amp;quot;Close on receipt&amp;quot;. The store&amp;#39;s own &amp;quot;count in&amp;quot; also closes it.&lt;/td&gt;&lt;td&gt;Nothing beyond the press.&lt;/td&gt;&lt;td&gt;Transfers come from the tracker&amp;#39;s transfer numbers today. There is no way to create a new transfer here, and launch dispatches are not transfers. Later: issue one transfer per store per launch wave.&lt;/td&gt;&lt;td&gt;The warehouse&amp;#39;s close records the close date. The store&amp;#39;s count-in records the arrival and close dates and writes a store goods-received note. The warehouse is alerted to any transfer shipped more than 7 days ago and not counted in: &amp;quot;this is the gap ghost stock lives in&amp;quot;.&lt;/td&gt;&lt;td&gt;Counted in within 24 hours of arrival&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.10&lt;/td&gt;&lt;td&gt;Swatch books and fit samples&lt;/td&gt;&lt;td&gt;Warehouse and store&lt;/td&gt;&lt;td&gt;Opens swatch books and fit samples. A grid shows each store against the made-to-measure book, the ready-to-wear book and the bespoke book (which comes from the mill), marked never sent, sent, unconfirmed after 7 days, or received. Presses &amp;quot;Send 1&amp;quot;, or &amp;quot;Send 2&amp;quot; for the larger stores (Pali Hill, Select City Walk, Khan Market, Hyderabad, Whitefield, Vasant Kunj and Noida). Uses &amp;quot;Resend&amp;quot; and &amp;quot;Mill has sent&amp;quot; as needed. For the made-to-measure fit set (slim, standard and heavy, in sizes 38 to 44), the gaps are shown with &amp;quot;Send n&amp;quot;.&lt;/td&gt;&lt;td&gt;Nothing beyond the press.&lt;/td&gt;&lt;td&gt;None.&lt;/td&gt;&lt;td&gt;Each book is recorded with its kind, edition (AW26), number of copies, sender, dispatch date and tracking number. Each fit sample is recorded with its fit, size, dispatch date and condition (fine, worn or missing). The store confirms receipt from its own list.&lt;/td&gt;&lt;td&gt;Confirmed within 7 days&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.11&lt;/td&gt;&lt;td&gt;Alterations through the hemming unit&lt;/td&gt;&lt;td&gt;Warehouse, production unit and store&lt;/td&gt;&lt;td&gt;Opens alterations through the hemming unit. It lists every open case going through the unit, with the whole round trip:&amp;lt;br&amp;gt;1. handed to the vehicle by the store&amp;lt;br&amp;gt;2. received at the warehouse&amp;lt;br&amp;gt;3. scanned in at the hemming unit&amp;lt;br&amp;gt;4. hemmed and scanned out&amp;lt;br&amp;gt;5. back at the warehouse&amp;lt;br&amp;gt;6. sent to the store or straight to the customer&amp;lt;br&amp;gt;7. delivered or received&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Whoever holds the piece presses the one button for their hand-off.&lt;/td&gt;&lt;td&gt;Where it goes back to (the store or the customer), chosen by the store when it hands the piece over.&lt;/td&gt;&lt;td&gt;Each hand-off only after the one before it.&lt;/td&gt;&lt;td&gt;Each hand-off is dated on the case. When it is sent back, the case moves to &amp;quot;back at store&amp;quot;. The store sees where the trouser is without having to ask.&lt;/td&gt;&lt;td&gt;Round trip within the case&amp;#39;s promise&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12.12&lt;/td&gt;&lt;td&gt;Ready-to-wear customer orders from stock&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;Ready-to-wear sells like a web shop: if the size is in stock it can be sold, if not it cannot, and no factory is involved. Opens ready-to-wear orders. It lists every order the website or a store punched that is not being handed over from that store&amp;#39;s own shelf, with style, size, customer, where it goes (customer address or store), inseam if the piece needs hemming, and promised date. The warehouse picks the piece, sends it through the hemming bench if an inseam is set, packs it, and presses &amp;quot;Dispatched&amp;quot; with the courier and tracking number.&lt;/td&gt;&lt;td&gt;Courier and tracking number; a note if the piece was swapped for the same size from another shelf.&lt;/td&gt;&lt;td&gt;An order exists only for a style and size with stock at the unit or a store: the website and the store bill both refuse a size that is out, so there are no back orders. Stock leaves the shelf count at punch, not at dispatch. Dispatch only after hemming when an inseam is set.&lt;/td&gt;&lt;td&gt;The order moves punched (hemming) dispatched delivered. A store order shows &amp;quot;Handed to customer&amp;quot; once the parcel reaches the store; a website order is delivered by the courier. The style&amp;#39;s stock at the unit drops; when the last size at the unit goes, the replenishment rule (B11) is what brings more, never this order.&lt;/td&gt;&lt;td&gt;Dispatched same day; 3 days with hemming&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Rules.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;A goods-received note is written by the receipt, never typed by hand. Every kind except store receipts carries the PO or parcel code it was received against.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;A round is closed once. Corrections are new receipts.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Declared against received shows the moment the round closes.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;When a store writes off a piece, it leaves the shelf count the same minute. The reasons are damaged, soiled, display worn, lost, or wrong item received. The piece is either sent back to the unit or destroyed.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Ready-to-wear customer orders are the warehouse&amp;#39;s: pick from stock, hem if needed, dispatch. Out of stock means not for sale, not a factory order.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Cases.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;What happens&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A lot short of the PO&lt;/td&gt;&lt;td&gt;The balance and its promised date stay on the PO. Closing short is a recorded decision, and it counts as an in-full miss on the on-time-in-full measure.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Rejected metres or pieces&lt;/td&gt;&lt;td&gt;Recorded on the goods-received note and on the lot. Later: the fabric note carries a rejected quantity too.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A piece not on the vehicle for three rounds&lt;/td&gt;&lt;td&gt;It keeps &amp;quot;missed the last vehicle&amp;quot;. Later: raise it to production after three rounds.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A transfer that arrives at the wrong store&lt;/td&gt;&lt;td&gt;The receiving store cannot count in another store&amp;#39;s transfer. Later: re-route it with a new transfer.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A bespoke parcel with an unknown code&lt;/td&gt;&lt;td&gt;Refused with a message. Later: a list of unmatched parcels for sourcing.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A mill list with a new article&lt;/td&gt;&lt;td&gt;The line is ignored (&amp;quot;Nothing matched&amp;quot;). Later: create a bespoke fabric that waits for its Enigma code.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Time targets.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Vehicle round:&lt;/strong&gt; closed within one hour of arrival.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Fabric goods-received note:&lt;/strong&gt; the same day.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Ready-to-wear lot:&lt;/strong&gt; the same day.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Stock transfer:&lt;/strong&gt; counted in by the store within 24 hours. The alert fires at 7 days.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Swatch book:&lt;/strong&gt; confirmed within 7 days.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Goods-received note:&lt;/strong&gt; finance picks it up in the week it is written.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Sources: store visit transcript (stock transfers, ghost stock); Enigma Answers (26 Aug 2026) (deduction at the in-production scan); Discovery Record — What We Know v1.0 (18 Aug 2026); the STO tracker in data-files.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;8-timings-and-targets&quot;&gt;&lt;summary&gt;8. Timings and targets&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 8.&lt;/p&gt;&lt;p&gt;Every target is measured from two dates recorded on the record. Today&amp;#39;s figures come from A9. Where A9 says &amp;quot;to confirm&amp;quot;, the starting figure is measured first, from the same two dates, before anyone is held to a target.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Measure&lt;/th&gt;&lt;th&gt;Today&lt;/th&gt;&lt;th&gt;Target&lt;/th&gt;&lt;th&gt;Measured from → to&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Idea to fabric PO (made to measure, known mill)&lt;/td&gt;&lt;td&gt;20–30 days of design, tech pack and costing after selection; the ask itself is not recorded&lt;/td&gt;&lt;td&gt;10 working days&lt;/td&gt;&lt;td&gt;From the day design raises the ask to the day the fabric PO is raised&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Options request fully settled&lt;/td&gt;&lt;td&gt;To be confirmed with BSC&lt;/td&gt;&lt;td&gt;15 working days&lt;/td&gt;&lt;td&gt;From the day the options request is raised to the day the last option on it has its PO raised&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fabric PO to stores told (domestic)&lt;/td&gt;&lt;td&gt;To be confirmed with BSC (stores get a PDF about a week before launch)&lt;/td&gt;&lt;td&gt;12 working days after arrival&lt;/td&gt;&lt;td&gt;From the day the fabric is received at the warehouse to the day the stores are told&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sticker per fabric&lt;/td&gt;&lt;td&gt;Made by hand, and reprinted on every MRP change&lt;/td&gt;&lt;td&gt;1 minute, printed&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Swatch receipt confirmed by stores&lt;/td&gt;&lt;td&gt;Never; 34 store columns and no confirmation&lt;/td&gt;&lt;td&gt;90% within 3 days&lt;/td&gt;&lt;td&gt;From the day the swatch is sent to the day the store confirms it (for books, the day the store marks it received; a book is overdue after 7 days)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ready-to-wear PO to launch&lt;/td&gt;&lt;td&gt;90–120 days from plan to shelf&lt;/td&gt;&lt;td&gt;75 days&lt;/td&gt;&lt;td&gt;From the day the fabric PO is raised to the day the style launches&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Factory agreed and PO raised&lt;/td&gt;&lt;td&gt;By email, not recorded&lt;/td&gt;&lt;td&gt;3 days&lt;/td&gt;&lt;td&gt;From the day design sends the request to the day design raises the factory PO&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vehicle round reconciled&lt;/td&gt;&lt;td&gt;1–2 hours, by hand&lt;/td&gt;&lt;td&gt;Closed within 1 hour, with the gap on the page&lt;/td&gt;&lt;td&gt;From the vehicle&amp;#39;s arrival to the date on the round&amp;#39;s goods-received note&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Stock transfer counted in at the store&lt;/td&gt;&lt;td&gt;Left open for ever; the store never closes it&lt;/td&gt;&lt;td&gt;Same day the box is opened; all closed within 5 days (the store&amp;#39;s list turns red at 5)&lt;/td&gt;&lt;td&gt;From the day the transfer ships to the day the store counts it in&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;International core reorder&lt;/td&gt;&lt;td&gt;An hour a week, on a static average of weekly sales&lt;/td&gt;&lt;td&gt;Every night, with no typing&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ready-to-wear health decisions&lt;/td&gt;&lt;td&gt;Half a day a week&lt;/td&gt;&lt;td&gt;A queue of decisions, each taking minutes&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Case raised to first decision&lt;/td&gt;&lt;td&gt;Days on Slack; not measured&lt;/td&gt;&lt;td&gt;Same visit&lt;/td&gt;&lt;td&gt;From the day the case is raised to the day the first option is tried&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Case closed&lt;/td&gt;&lt;td&gt;Not measured; every case carries a 10-day promise&lt;/td&gt;&lt;td&gt;80% within 10 days&lt;/td&gt;&lt;td&gt;From the day the case is raised to the day it closes (overdue once it has been open longer than its promise)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Hemming-unit round trip&lt;/td&gt;&lt;td&gt;Unknown; the unit cannot be seen today&lt;/td&gt;&lt;td&gt;5 working days&lt;/td&gt;&lt;td&gt;From the day the store hands the piece to the vehicle to the day it is delivered&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Factory round trip (made-to-measure alteration or remake)&lt;/td&gt;&lt;td&gt;Unknown&lt;/td&gt;&lt;td&gt;12 working days (the remake card says about 14 days)&lt;/td&gt;&lt;td&gt;From the day the piece is sent to the factory to the day it is back at the store&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Refund moved by finance&lt;/td&gt;&lt;td&gt;Days; the store finds out by asking&lt;/td&gt;&lt;td&gt;2 working days (finance&amp;#39;s alert turns amber after 2)&lt;/td&gt;&lt;td&gt;From the day the refund is asked for to the day finance moves the money&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Stock ask answered by the other store&lt;/td&gt;&lt;td&gt;On WhatsApp; not measured&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;td&gt;From the day the ask is sent to the day the other store accepts, ships or declines&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Damaged piece out of the system&lt;/td&gt;&lt;td&gt;Never (ghost stock)&lt;/td&gt;&lt;td&gt;The day it is found&lt;/td&gt;&lt;td&gt;From the day the damage is found to the day the store writes it off (and the day the unit gets the piece back)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fit set complete per store&lt;/td&gt;&lt;td&gt;Unknown; the sizes stores carry are to be confirmed with BSC&lt;/td&gt;&lt;td&gt;3 fits in every size the store carries, on the floor&lt;/td&gt;&lt;td&gt;The day each fit sample is received, and whether it is still in good condition&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Times a product is typed&lt;/td&gt;&lt;td&gt;3–5&lt;/td&gt;&lt;td&gt;1 (plus Enigma&amp;#39;s datasheet)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Times a customer is typed per sale&lt;/td&gt;&lt;td&gt;2 (Shopify, then Enigma)&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sheets running&lt;/td&gt;&lt;td&gt;22 in data-files&lt;/td&gt;&lt;td&gt;6 finance sheets&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Weekly workbooks rebuilt by hand&lt;/td&gt;&lt;td&gt;Product Weekly Report, DSR, Stylist KPI, ROS &amp;amp; Health, Concise&lt;/td&gt;&lt;td&gt;None; read live and frozen at the week&amp;#39;s end&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Sources: this document&amp;#39;s A9, B10 and B12c; Discovery Record — What We Know v1.0 (18 Aug 2026) (20–30 days, 90–120 days, 34 store columns); store visit transcript (stock transfers left open, ghost stock, Slack).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details id=&quot;9-mtm-daily-production&quot;&gt;&lt;summary&gt;9. MTM daily production&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p class=&quot;lead&quot;&gt;Mirrors current section 9.&lt;/p&gt;&lt;p&gt;The production unit runs its day from one MTM daily production screen with seven tabs: Allocate, Plans, Factory floor, Changed sheets, Extra fabric, Daily output and Aging. The warehouse works from its own lists for cutting and sending bundles and for the vehicle round. Each factory&amp;#39;s merchandiser works from their own factory screen. Every move of a piece is a scan. The system proposes the plan from each factory&amp;#39;s spare capacity, and a person confirms it. If a sheet changes after the bundle has left, the factory gets an amended version flagged for reprint, not a WhatsApp message.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-mermaid&quot;&gt;flowchart LR
  A[Order punched&amp;lt;br/&amp;gt;metres reserved] --&amp;gt; B[Freeze window&amp;lt;br/&amp;gt;a setting, 2 hours by default]
  B --&amp;gt; C[Ready queue&amp;lt;br/&amp;gt;urgent first, then oldest punch first]
  C --&amp;gt; D[Proposal per factory&amp;lt;br/&amp;gt;from spare capacity]
  D --&amp;gt; E[Plan submitted&amp;lt;br/&amp;gt;plan number, job cards, cut list]
  E --&amp;gt; F[Scanned out: in production&amp;lt;br/&amp;gt;metres deducted] --&amp;gt; G[Scanned in at the factory]
  G --&amp;gt; H[Ready: out of the factory] --&amp;gt; I[Vehicle round: ready to ship and GRN]
  I --&amp;gt; J[Dispatch] --&amp;gt; K[Delivered]&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What they do&lt;/th&gt;&lt;th&gt;What they fill in&lt;/th&gt;&lt;th&gt;What the system checks&lt;/th&gt;&lt;th&gt;What happens next&lt;/th&gt;&lt;th&gt;Time target&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B12a.1&lt;/td&gt;&lt;td&gt;Queue&lt;/td&gt;&lt;td&gt;System&lt;/td&gt;&lt;td&gt;Nothing to click. The Allocate tab shows the ready queue: urgent orders first, then by punch time. Orders punched in the last 2 hours are folded away as held back (&amp;quot;stores still change them&amp;quot;), with the time each will join the plan. The planner can change the freeze window on the tab&lt;/td&gt;&lt;td&gt;Freeze window in hours (0 to 24, in half-hours)&lt;/td&gt;&lt;td&gt;An order joins the queue only once it is older than the freeze window. Bespoke orders stay out until their parcel of cloth has been received&lt;/td&gt;&lt;td&gt;Nothing is recorded yet&lt;/td&gt;&lt;td&gt;Continuous&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12a.2&lt;/td&gt;&lt;td&gt;Proposal&lt;/td&gt;&lt;td&gt;System&lt;/td&gt;&lt;td&gt;Nothing to click. The Allocate tab shows one card per MTM factory (Mahendra, Richman, Harsh). Each card shows daily feed, pieces in the factory and their age, pieces in transit, spare capacity today, load in days and how many orders are proposed. The queue shows each order&amp;#39;s proposed factory and the reason&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Corporate orders go to the corporate factory (Mahendra). Urgent orders go to the urgent-reserve factory (Richman) if it has room, otherwise the nearest factory with room. Normal orders go to the factory with the most spare capacity, oldest first. Spare capacity is the daily capacity, minus pieces in transit, minus any pieces in the factory beyond two days&amp;#39; work. Daily capacity is the factory&amp;#39;s daily target, or its average output over the last 7 days. An order that cannot be placed says &amp;quot;no factory has headroom today&amp;quot;&lt;/td&gt;&lt;td&gt;Nothing is recorded until the planner submits&lt;/td&gt;&lt;td&gt;Seconds&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12a.3&lt;/td&gt;&lt;td&gt;Planner confirms&lt;/td&gt;&lt;td&gt;Production planner&lt;/td&gt;&lt;td&gt;Pick the orders: all shown, the oldest 20, 30 or 50, a number by punch time, or a card&amp;#39;s proposed orders. Filter if needed, set the tag on any row and choose the factory. Click &amp;quot;Submit N → &amp;lt;factory&amp;gt;&amp;quot;, or &amp;quot;Submit plan&amp;quot; on a card&lt;/td&gt;&lt;td&gt;Filters: proposed factory, tag, store, fabric bucket, search. Tag per order. Factory. &amp;quot;Send anyway&amp;quot; to go over capacity&lt;/td&gt;&lt;td&gt;If the plan is over the factory&amp;#39;s spare capacity, it is refused (&amp;quot;room for N today. Send N, or force the rest through on the record&amp;quot;) unless &amp;quot;send anyway&amp;quot; is ticked&lt;/td&gt;&lt;td&gt;A plan number (#413nn) is issued for the factory, category shirts, with the orders listed. Any forcing over capacity is recorded with the name of who did it. Each order is marked planned and scanned as planned. Changing an order to urgent sets its ship-by date to punch + 2 days (normal is punch + 7). The plan appears on the warehouse&amp;#39;s cut-and-send list. The factory sees the orders as &amp;quot;On its way here&amp;quot; once they are scanned out&lt;/td&gt;&lt;td&gt;Daily, 15 min&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12a.4&lt;/td&gt;&lt;td&gt;Cut and bundle&lt;/td&gt;&lt;td&gt;Warehouse or unit&lt;/td&gt;&lt;td&gt;On the cut-and-send list, each plan shows a cut list by fabric (total metres and pieces) and the order sheets, with &amp;quot;changed · print rev N&amp;quot; where a sheet was amended. Click &amp;quot;Print sheets · scan out all N&amp;quot;, or &amp;quot;scan out&amp;quot; per sheet&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;The plan must have been submitted&lt;/td&gt;&lt;td&gt;Scanning out marks the order in production and deducts its metres from both fabric stock and reserved metres. The scan-out is both the in-production status and the stock deduction. The factory sees the pieces coming&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12a.5&lt;/td&gt;&lt;td&gt;Factory scans in and out&lt;/td&gt;&lt;td&gt;Factory merchandiser (or production, on the factory floor tab)&lt;/td&gt;&lt;td&gt;On the factory&amp;#39;s list of pieces allocated to them, click &amp;quot;Received&amp;quot; when pieces arrive and &amp;quot;Out of the factory&amp;quot; when they are done, one at a time or for a selection (that is the bundle). At day end, enter the pieces out and click &amp;quot;Log the day&amp;quot;&lt;/td&gt;&lt;td&gt;Pieces out today, note&lt;/td&gt;&lt;td&gt;Each piece must be at the previous stage&lt;/td&gt;&lt;td&gt;Every scan is recorded with who and when. The factory&amp;#39;s own count is kept beside the scanned count, shown in amber when they differ. The warehouse sees the pieces under &amp;quot;Ready · to collect&amp;quot; on the vehicle round&lt;/td&gt;&lt;td&gt;Day of&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12a.6&lt;/td&gt;&lt;td&gt;Sheet change after planning&lt;/td&gt;&lt;td&gt;Store, then production, then factory&lt;/td&gt;&lt;td&gt;From the order sheet (on the store, production and warehouse screens), click a field, fill in the correction and why, and click &amp;quot;Save correction&amp;quot; or &amp;quot;Amend — re-issue to factory&amp;quot;. Fabric, fit block, tag or remarks can be changed. Once a factory is allocated, the store can only use &amp;quot;Add a remark&amp;quot;. Production reads each change on the changed sheets tab and clicks &amp;quot;Read — plan on this&amp;quot; (not yet allocated) or &amp;quot;Told &amp;lt;factory&amp;gt;&amp;quot; (allocated). The factory reads the changes under &amp;quot;Changed after it reached us&amp;quot; and clicks &amp;quot;Read&amp;quot;. &amp;quot;Re-issue to factory&amp;quot; clears the reprint flag. A fabric, tag or quantity change after planning warns that the order &amp;quot;may belong at a different factory&amp;quot;. Production can then click &amp;quot;Pull back to PP&amp;quot;&lt;/td&gt;&lt;td&gt;The corrected value and why&lt;/td&gt;&lt;td&gt;Stores can change anything freely until a factory is allocated. After that, and until the piece leaves the factory, they can only add remarks. Production can change anything freely up to planning. While the piece is in transit or in the factory, changes become amendments flagged for reprint. From out of the factory on, the sheet is closed to changes. A fabric change moves the reserved metres to the new fabric, unless the cloth has already been cut&lt;/td&gt;&lt;td&gt;Each change is kept as a numbered revision: who, their role, when, the note, each field from and to, and whether it needs a reprint. The system records when production read it, when the factory was told and when the factory read it. Pulling an order back to PP clears its factory and plan and logs a revision (&amp;quot;planned → back in PP&amp;quot;). Production&amp;#39;s tab counts changes &amp;quot;pending with me&amp;quot; and &amp;quot;pending with the factory&amp;quot;. The factory&amp;#39;s tab counts unread changes, and the printed sheet marks the changed fields&lt;/td&gt;&lt;td&gt;Within the hour&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12a.7&lt;/td&gt;&lt;td&gt;Extra fabric&lt;/td&gt;&lt;td&gt;Factory, then production, then warehouse&lt;/td&gt;&lt;td&gt;The factory clicks &amp;quot;Ask for extra cloth&amp;quot;, fills in the request and clicks &amp;quot;Ask for N m&amp;quot;. Production clicks &amp;quot;Approve&amp;quot; or &amp;quot;Decline&amp;quot; on the extra fabric tab. The row shows the shelf stock before and after (&amp;quot;shelf N m → M m if approved&amp;quot;). The warehouse picks the cloth and clicks &amp;quot;Picked &amp;amp; sent&amp;quot;&lt;/td&gt;&lt;td&gt;Order number (grouped by customer, store and day). Which cloth, if the bill has several. Panel: single front 0.8 m, both fronts (patta) 0.9 m, single sleeve 0.8 m, both sleeves 0.9 m, collar 0.3 m, cuff 0.3 m. Metres (can be changed). Reason: damaged or yarn pull (factory error), stain (factory error), weaving defect (PP error), fabric short (PP error), shade mismatch (PP error). Note&lt;/td&gt;&lt;td&gt;The order must have a fabric and a factory. Metres are not capped per panel. Whether they should be capped at the panel allowance is to be confirmed with BSC&lt;/td&gt;&lt;td&gt;The request is recorded as requested, then approved or declined, then sent, with who raised it, when, and when it was decided. Approving deducts the metres from fabric stock at once, because approval is the stock event. Each team is told in turn. Factory errors are meant for the vendor&amp;#39;s record and PP errors for the consumption rule. Later: count these per vendor and feed them into the consumption rule&lt;/td&gt;&lt;td&gt;Same day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12a.8&lt;/td&gt;&lt;td&gt;Vehicle round&lt;/td&gt;&lt;td&gt;Warehouse&lt;/td&gt;&lt;td&gt;On the vehicle round list of finished MTM shirts coming back, each factory shows ready to collect, declared today, received today and the gap. Click &amp;quot;Receive the round&amp;quot;. Mark each piece &amp;quot;Received&amp;quot;, &amp;quot;Not on vehicle&amp;quot; or &amp;quot;Turned back&amp;quot; with a reason, then click &amp;quot;Close the round&amp;quot;. A single piece can also be marked ready to ship directly&lt;/td&gt;&lt;td&gt;Vehicle and driver, note. A turned-back reason: stitching fault, wrong fabric, measurement off the sheet, stain or damage, wrong customer tag, missing trims&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;Received pieces are marked ready to ship, and one GRN per factory is recorded for the round, with the vehicle and note. Pieces not on the vehicle are marked short. Turned-back pieces go back to &amp;quot;in the factory&amp;quot; with the reason, who and when, and a remark. The factory sees &amp;quot;missed the last vehicle&amp;quot; or &amp;quot;turned back ×N&amp;quot; on its rows. Shipping sees the ready pieces&lt;/td&gt;&lt;td&gt;Within the hour&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12a.9&lt;/td&gt;&lt;td&gt;Shipping and delivery&lt;/td&gt;&lt;td&gt;Production or shipping&lt;/td&gt;&lt;td&gt;On the Plans tab, click &amp;quot;Dispatch · N&amp;quot; to dispatch the ready pieces. Then click &amp;quot;Delivered&amp;quot; on the order sheet. Click &amp;quot;Close plan&amp;quot; once every piece is ready, dispatched or delivered&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;A plan can be closed only when every piece has reached ready to ship or beyond&lt;/td&gt;&lt;td&gt;Dispatch and delivery are scanned, and the plan&amp;#39;s close date is recorded. Cancelling an order gives its reserved metres back only if the cloth has not been cut. The store sees it on its outbound list&lt;/td&gt;&lt;td&gt;By the ship-by date&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B12a.10&lt;/td&gt;&lt;td&gt;Aging and output&lt;/td&gt;&lt;td&gt;System (production sets factory capacity)&lt;/td&gt;&lt;td&gt;The Aging tab shows pieces past ship-by, due today, or all open. It also shows factory by stage, days in the factory (0–2, 3–5, 6–8 and 9+ days, oldest per factory, over 5 days meaning &amp;quot;stuck, not slow&amp;quot;) and ship-by date by factory. The Daily output tab shows, per factory: tailors, capacity per day, average per day, out today (from scans), the factory&amp;#39;s own figure, in the factory, aging, in transit and load. Production edits the capacity per day here&lt;/td&gt;&lt;td&gt;Capacity per day, per factory&lt;/td&gt;&lt;td&gt;Nothing&lt;/td&gt;&lt;td&gt;The factory&amp;#39;s capacity is saved. Aging is shown on screen only. No one is told when a piece passes 5 days. Later: alert production when a piece passes 5 days in a factory&lt;/td&gt;&lt;td&gt;Live&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
